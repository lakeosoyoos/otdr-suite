    for (let k = first; k < last; k++) html.push(rowHtml(descs[k]));
    if (last < descs.length) html.push(spacerRow((descs.length - last) * FR_ROW_H));
    tb.innerHTML = html.join('');
  }
  scroller.addEventListener('scroll', () => {
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const f = Math.max(0, Math.floor((scroller.scrollTop - headH) / FR_ROW_H) - 4);
    if (f !== lastFirst) { lastFirst = f; paintRows(); }
  });
  paintRows();
  requestAnimationFrame(() => {
    const hrows = table.tHead ? [...table.tHead.rows] : [];
    let off = 0;
    for (const r of hrows) {
      for (const th of r.cells) th.style.top = off + 'px';
      off += r.offsetHeight;
    }
  });
  table.querySelectorAll('th.fr-evhdr').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', () => zoomToKm(+th.dataset.km, 2));
  });
  // A click on an event number on the trace: scroll that fibre's row for the
  // trace's direction into view and mark the cell (three rows per fibre).
  gGridGoTo = (t, e) => {
    const fi = have.findIndex(p => p.ta === t || p.tb === t);
    const k = shown.indexOf(fi);
    if (fi < 0 || k < 0) return;
    const off = t === have[fi].tb ? 1 : 0;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const rowTop = headH + (3 * k + off) * FR_ROW_H;
    const view = scroller.clientHeight - headH;
    const winTop = scroller.scrollTop + headH, winBot = winTop + view;
    if (rowTop < winTop || rowTop + FR_ROW_H > winBot) {
      scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
    }
    paintRows();
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = [...tb.querySelectorAll(sel)].find(row => row.querySelector(`td[data-km="${e.dist_km}"]`));
    const td = tr && tr.querySelector(`td[data-km="${e.dist_km}"]`);
    if (!td) return;
    table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
    const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
    const leadW = tr.cells[0].offsetWidth;
    const dxL = cr.left - (sr.left + leadW) - 8;
    const dxR = cr.right - sr.right + 8;
    if (dxL < 0) scroller.scrollLeft += dxL;
    else if (dxR > 0) scroller.scrollLeft += dxR;
    td.classList.add('fr-hit');
    setTimeout(() => td.classList.add('fading'), 1500);
    setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
  };
  // Right-click a direction's cell for the span menu, as in the other grid;
  // the Average row names no direction, so it has no menu.
  tb.addEventListener('contextmenu', (ev) => {
    const td = ev.target.closest('td[data-km]');
    const tr = td && td.closest('tr[data-dir]');
    if (!td || !tr) return;
    ev.preventDefault();
    showSpanMenu(ev.clientX, ev.clientY, tr.dataset.dir, +td.dataset.km,
                 tr.dataset.fiber, tr.dataset.src);
  });
}

// ─── Declaring the span ───────────────────────────────────────────────
function closeSpanMenu() {
  const m = document.getElementById('span-menu');
  if (m) m.remove();
}
// Both directions sit under one header column, so the ⋯ asks which one first.
function showDirChooser(x, y, picks) {
  closeSpanMenu();
  const m = document.createElement('div');
  m.id = 'span-menu';
  m.innerHTML = `<div class="span-menu-hd">Which Direction?</div>`
    + picks.map((p, k) =>
        `<button data-k="${k}">${p.dir === 'a' ? 'A→B' : 'B→A'} span and settings…</button>`).join('')
    + viewItems();
  document.body.appendChild(m);
  m.style.left = Math.min(x, window.innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - m.offsetHeight - 8) + 'px';
  m.querySelectorAll('button').forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      if (b.dataset.view) { closeSpanMenu(); toggleView(b.dataset.view); return; }
      const p = picks[+b.dataset.k];
      showSpanMenu(x, y, p.dir, p.km, p.fiber, p.src);
    };
  });
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}
// The view switches, under their own heading because they change what is
// PRINTED, not what a span or a trace setting is.  "Show only flagged rows"
// used to be a checkbox in the EVENTS header strip, where nobody found it:
// the boss, on being told it existed, asked for both switches to live here.
function viewItems() {
  return `<div class="span-menu-hd">View</div>`
    + `<button data-view="rows">${gFlaggedOnly ? '✓ ' : ''}Show only flagged rows</button>`
    + `<button data-view="cells">${gFailCellsOnly ? '✓ ' : ''}Show only failing cells</button>`;
}
function toggleView(which) {
  if (which === 'rows') gFlaggedOnly = !gFlaggedOnly;
  else gFailCellsOnly = !gFailCellsOnly;
  renderEventTable();
  const on = [];
  if (gFlaggedOnly) on.push('flagged rows only');
  if (gFailCellsOnly) on.push('failing cells only');
  setReadout(on.length ? `showing ${on.join(', ')}` : 'showing every row and every event');
}
function showSpanMenu(x, y, dir, km, fiber, src) {
  closeSpanMenu();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  // Only the two edges that reach the picture are offered as the headline
  // actions; the other two are stored for the engine but change nothing here,
  // so putting them in front of a tech would be inviting a pointless click.
  const useful = dir === 'a' ? 'start' : 'end';
  const items = [
    ['start', `Span START of ${arrow} here`],
    ['end',   `Span END of ${arrow} here`],
    ['clear', `Clear ${arrow} span`],
    ['edit',  `Edit trace settings (IOR, names)…`],
  ];
  const m = document.createElement('div');
  m.id = 'span-menu';
  // Named for what it does: this sets the whole DIRECTION's span, for every
  // fiber in the folder, not a property of the row that was clicked.  The row
  // only says which event was meant, and each fiber snaps to its own.
  m.innerHTML = `<div class="span-menu-hd">${arrow} Span: All Fibers in This Folder`
    + `<br><span class="span-menu-sub">picked on F${fiber} at ${km.toFixed(4)} km; `
    + `each fiber uses its own event there</span></div>`
    + items.map(([e, label]) =>
        `<button data-edge="${e}"${e === useful ? ' class="primary"' : ''}>${label}</button>`).join('')
    + viewItems();
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  m.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      closeSpanMenu();
      if (b.dataset.view) { toggleView(b.dataset.view); return; }
      if (b.dataset.edge === 'edit') showEditDialog(src || dir, fiber);
      else setSpanEdge(dir, b.dataset.edge, km);
    };
  });
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}
async function setSpanEdge(dir, edge, km) {
  try {
    const r = await fetch('/api/span', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir, edge, km }),
    });
    const j = await r.json();
    if (!r.ok || j.error) { setReadout(`could not save the span: ${j.error || r.status}`); return; }
    gSpanDecl = j.span_decl || { a: null, b: null };
  } catch (e) {
    setReadout(`could not save the span: ${(e && e.message) || e}`);
    return;
  }
  refreshMirrorFrame();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  setReadout(`${gTraces.length} traces loaded`);
}

// ─── Editing a trace's settings (the boss's "IOR is wrong, correct it in
// software, trace name, ...") ─────────────────────────────────────────
// The dialog pre-fills from the clicked fiber's file, then writes edited COPIES
// into a sibling folder.  Nothing here can touch an original: the server
// refuses the source folder and refuses to overwrite.  "All fibers" is the
// common case (a wrong IOR is wrong for the whole shoot); a fiber id is the
// one per-fiber field, so it is greyed out in that scope.
const EDIT_FIELDS = [
  ['cable_id',   'Cable ID'],   ['fiber_id',  'Fiber ID'],
  ['loc_a',      'Location A'], ['loc_b',     'Location B'],
  ['cable_code', 'Cable code'], ['job_id',    'Job ID'],
  ['customer',   'Customer'],   ['company',   'Company'],
  ['operator',   'Operator A'], ['operator_b','Operator B'],
  ['comment',    'Comment'],
];
// The span the tech declared for this direction (right-click, "Span START /
// END here") can go into the copies too, the way FR saves one: each fiber
// snaps to its own event at that km.  Offered only when one is declared.
function spanRow(dir) {
  const s = gSpanDecl && gSpanDecl[dir];
  if (!s || (s.start_km == null && s.end_km == null)) return '';
  const parts = [];
  if (s.start_km != null) parts.push(`start ${s.start_km.toFixed(4)} km`);
  if (s.end_km != null) parts.push(`end ${s.end_km.toFixed(4)} km`);
  return `<div class="row"><label>Declared span</label><label style="color:var(--text)">`
    + `<input type="checkbox" id="edit-span" checked> write it into the copies (${parts.join(', ')})</label></div>`;
}
function closeEditDialog() {
  for (const id of ['edit-dlg', 'edit-dlg-bg']) {
    const e = document.getElementById(id);
    if (e) e.remove();
  }
}
async function showEditDialog(dir, fiber) {
  closeEditDialog();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  let s;
  try {
    const r = await fetch(`/api/trace_settings?dir=${dir}&fiber=${fiber}`);
    s = await r.json();
    if (!r.ok || s.error) { setReadout(`could not read F${fiber}: ${s.error || r.status}`); return; }
  } catch (e) {
    setReadout(`could not read F${fiber}: ${(e && e.message) || e}`); return;
  }
  const bg = document.createElement('div'); bg.id = 'edit-dlg-bg';
  const d = document.createElement('div'); d.id = 'edit-dlg';
  const ids = s.identifiers || {};
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  d.innerHTML = `<h3>Edit Trace Settings: ${arrow}</h3>`
    + `<div class="sub">read from ${esc(s.filename)}${s.editable ? '' : ': <b>' + esc(s.why) + '</b>'}</div>`
    + `<div class="scope"><label><input type="radio" name="edit-scope" value="all" checked> all fibers in this folder</label>`
    + `<label><input type="radio" name="edit-scope" value="one"> only F${fiber}</label></div>`
    + `<div class="row"><label>IOR</label><input type="number" id="edit-ior" step="0.00001" min="1.40" max="1.55" value="${s.ior == null ? '' : s.ior.toFixed(5)}"></div>`
    + EDIT_FIELDS.map(([k, label]) =>
        `<div class="row"><label>${label}</label><input type="text" id="edit-${k}" data-key="${k}" value="${esc(ids[k])}"></div>`).join('')
    + spanRow(dir)
    + `<div class="note">Blank a field to leave it unchanged. The originals are never touched; edited copies go to the folder below. Browse to choose one, or type a full path (a bare name makes a folder of that name in Downloads).</div>`
    + `<div class="row"><label>Save copies to</label><input type="text" id="edit-dest" value="${esc(s.dest_full || s.dest_default)}">`
    + `<button type="button" id="edit-browse" title="choose the folder edited copies are saved to">Browse…</button></div>`
    + `<div class="err" id="edit-err"></div>`
    + `<div class="btns"><button id="edit-cancel">Cancel</button><button class="primary" id="edit-save"${s.editable ? '' : ' disabled'}>Save copies</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);
  // Remember what the file says, so an untouched field is NOT re-sent as a
  // change: the writer re-lays the proprietary stream for every field it is
  // handed, and "same text" is still a rewrite.
  const original = { ior: s.ior, ids };
  const fid = d.querySelector('#edit-fiber_id');
  const syncScope = () => {
    const all = d.querySelector('input[name=edit-scope]:checked').value === 'all';
    fid.disabled = all;
    fid.title = all ? 'a fiber id is per-fiber; pick "only F' + fiber + '" to change it' : '';
  };
  d.querySelectorAll('input[name=edit-scope]').forEach(r => r.onchange = syncScope);
  syncScope();
  bg.onclick = closeEditDialog;
  d.querySelector('#edit-cancel').onclick = closeEditDialog;
  d.querySelector('#edit-save').onclick = () => submitEdit(dir, fiber, original);
  // The OS folder picker opens on this machine (the server runs here), so the
  // tech gets a real path back, not a browser upload.
  d.querySelector('#edit-browse').onclick = async () => {
    const err = d.querySelector('#edit-err');
    err.textContent = 'choose a folder in the dialog that just opened…';
    try {
      const r = await fetch('/api/pick_folder', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Save edited copies to' }),
      });
      const j = await r.json();
      if (!r.ok || j.error) { err.textContent = j.error || ('server said ' + r.status); return; }
      if (!j.available) { err.textContent = 'no folder picker on this machine. Type the full path instead'; return; }
      if (j.path) d.querySelector('#edit-dest').value = j.path;
      err.textContent = '';
    } catch (e) {
      err.textContent = (e && e.message) || String(e);
    }
  };
}
async function submitEdit(dir, fiber, original) {
  const d = document.getElementById('edit-dlg');
  const err = d.querySelector('#edit-err');
  const all = d.querySelector('input[name=edit-scope]:checked').value === 'all';
  const iorTxt = d.querySelector('#edit-ior').value.trim();
  const ior = iorTxt === '' ? null : +iorTxt;
  const fields = {};
  for (const inp of d.querySelectorAll('input[data-key]')) {
    if (inp.disabled) continue;
    const v = inp.value;
    if (v.trim() === '' || v === String(original.ids[inp.dataset.key] == null ? '' : original.ids[inp.dataset.key])) continue;
    fields[inp.dataset.key] = v;
  }
  const iorChanged = ior != null && (original.ior == null || Math.abs(ior - original.ior) > 5e-7);
  const spanBox = d.querySelector('#edit-span');
  const span = (spanBox && spanBox.checked && gSpanDecl[dir])
    ? { start_km: gSpanDecl[dir].start_km ?? null, end_km: gSpanDecl[dir].end_km ?? null } : {};
  const spanOn = span.start_km != null || span.end_km != null;
  if (!iorChanged && !Object.keys(fields).length && !spanOn) { err.textContent = 'nothing changed'; return; }
  if (ior != null && !(ior >= 1.40 && ior <= 1.55)) { err.textContent = 'IOR must be between 1.40 and 1.55'; return; }
  err.textContent = '';
  d.querySelector('#edit-save').disabled = true;
  let j;
  try {
    const r = await fetch('/api/trace_edit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir, fibers: all ? 'all' : [+fiber], ior: iorChanged ? ior : null,
                             fields, span, dest_name: d.querySelector('#edit-dest').value }),
    });
    j = await r.json();
    if (!r.ok || j.error) { err.textContent = j.error || ('server said ' + r.status); d.querySelector('#edit-save').disabled = false; return; }
  } catch (e) {
    err.textContent = (e && e.message) || String(e); d.querySelector('#edit-save').disabled = false; return;
  }
  // Say what happened IN the dialog, and leave it open until the tech has
  // read it.  Closing at once and putting one line in the readout is how the
  // boss saved a file and then could not find it: the line named a folder he
  // was not looking in, and a second try was "skipped: already exists" in the
  // same small print.  The full path and every skip reason go here instead.
  const n = (j.written || []).length, k = (j.skipped || []).length;
  let msg = `wrote ${n} edited cop${n === 1 ? 'y' : 'ies'} to ${j.dest}`;
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const lines = [`<b>Wrote ${n} edited cop${n === 1 ? 'y' : 'ies'}</b> to:<br><code>${esc(j.dest)}</code>`];
  if (k) {
    const why = {};
    for (const s of j.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    const parts = Object.entries(why).map(([r, c]) => `${c} ${r}`);
    msg += `; skipped ${k}: ` + parts.join(', ');
    lines.push(`<b>Skipped ${k}:</b> ` + parts.map(esc).join('; ')
      + (Object.keys(why).some(r => r.startsWith('already exists'))
         ? '<br>A copy already in that folder is never overwritten. Pick a different folder, or remove the old copy first.' : ''));
  }
  if (!n && !k) lines.push('Nothing was written.');
  setReadout(msg);
  d.innerHTML = `<h3>Edited Copies Saved</h3><div class="note" style="font-size:12px;line-height:1.5">`
    + lines.map(l => `<div style="margin:6px 0">${l}</div>`).join('') + `</div>`
    + `<div class="btns"><button class="primary" id="edit-done">Done</button></div>`;
  d.querySelector('#edit-done').onclick = closeEditDialog;
}

// ─── Rename files (FILES panel > right-click > Rename files…) ──────────
//
// PowerRename's shape, which is what the boss asked for by name: a find and
// replace rule at the top, and under it a tick and a live "before → after"
// for every file in scope.  The ORIGINALS are renamed, in place.  Everything
// else the Viewer writes is a copy, because an edited .sor is a changed
// measurement record; a rename is not — the bytes never move, only the name
// does — so this acts on the folder itself instead of leaving a second copy
// of a 1152-fibre cable behind.  Undo puts the last batch back.
//
// The preview is the contract.  The names shown here are the names POSTed:
// the server never re-derives a name from the rule, because a Python regex
// is a second dialect and would be a second answer, and the tech would be
// told one thing and handed another.  The server's own refusals are mirrored
// in nameProblem() so a bad name is red HERE, before the click.

const gRenameUndo = [];        // [{n, batches:[{dir, pairs}]}] — newest last
let gRenameRows = [];          // the dialog's rows, refs kept for the preview

// trace_server.extract_fiber_num, mirrored.  The FILES list, every trace key
// in here and every report grid are keyed on the fiber number the FILENAME
// carries, so a rename that moves that number renames the fiber.  Sometimes
// that IS the intent (a cable numbered from the wrong end); sometimes it is
// a typo in a regex.  The preview says which, in amber, rather than asking
// the server one round trip per keystroke.  Pinned to the Python source by
// desktop/tests/test_viewer_rename.py.
const RN_WAVELENGTHS = /[\s_\-.](?:850|1300|1310|1383|1490|1550|1577|1625|1650)+$/;
function fiberNumOf(name) {
  const base = String(name || '').replace(/^.*[\/\\]/, '');
  if (base.startsWith('._')) return null;          // macOS AppleDouble sidecar
  const dot = base.lastIndexOf('.');
  let stem = dot > 0 ? base.slice(0, dot) : base;
  stem = stem.replace(/\s+$/, '').replace(RN_WAVELENGTHS, '');
  const runs = stem.match(/\d+/g);
  if (!runs) return null;
  const run = runs[runs.length - 1];
  const pad = run.match(/0\d{3}$/);                // tie-panel: ILA digit + 0NNN port
  if (pad && pad[0].length < run.length) return +pad[0];
  return +run;
}

// trace_server.rename_check, mirrored: Windows' file-name rules, applied on
// every platform because the techs are on Windows and a folder renamed on a
// Mac that Windows then cannot open is the worse failure.
const RN_RESERVED = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
function nameProblem(n) {
  if (!n) return 'the new name is empty';
  if (/[\/\\]/.test(n) || n === '.' || n === '..') return 'must be a plain file name, not a path';
  if (n.startsWith('.')) return 'a name starting with "." is hidden';
  if (/[\x00-\x1f]/.test(n)) return 'control characters in the name';
  const bad = [...new Set(n.split('').filter(c => '<>:"|?*'.includes(c)))].sort();
  if (bad.length) return 'not allowed in a file name: ' + bad.join(' ');
  if (n.endsWith(' ') || n.endsWith('.')) return 'a name cannot end in a space or a dot';
  if (n.length > 255) return 'name longer than 255 characters';
  const stem = n.split('.', 1)[0].trim();
  if (RN_RESERVED.test(stem)) return '"' + stem + '" is a reserved name on Windows';
  if (!/\.(sor|json|trc)$/i.test(n)) return 'the extension must stay .sor, .json or .trc';
  return null;
}

// The rows the FILES panel is showing for one direction, in its order.
function panelFiles(dir) {
  const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
  const files = (gInfo && gInfo['files_' + dir]) || [];
  const out = [];
  fibers.forEach((f, i) => {
    if (!files[i] || gRemovedFiles.has(`${dir}-${f}`)) return;
    out.push({ dir, fiber: f, name: files[i] });
  });
  return out;
}

function closeRenameDialog() {
  gRenameRows = [];
  for (const id of ['rn-dlg', 'rn-dlg-bg']) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

function showRenameDialog(dir, fiber, name) {
  closeRenameDialog();
  if (!name) { setReadout('that row has no file name to rename'); return; }
  const esc = v => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const marked = [...panelFiles('a'), ...panelFiles('b')]
    .filter(f => gSelectedFiles.has(`${f.dir}-${f.fiber}`));
  const nA = panelFiles('a').length, nB = panelFiles('b').length;
  // Scopes, widest last.  The default is the marked set when this row is one
  // of the marked — "select some, right-click, rename" is the flow the boss
  // described — and otherwise just the row that was right-clicked.
  const scopes = [['one', `only ${name}`]];
  if (marked.length > 1) scopes.push(['sel', `the ${marked.length} marked files`]);
  if (nA) scopes.push(['a', `all ${nA} files in ${gInfo.dir_a_name}`]);
  if (nB) scopes.push(['b', `all ${nB} files in ${gInfo.dir_b_name}`]);
  if (nA && nB) scopes.push(['both', `all ${nA + nB} files in both folders`]);
  const start = (marked.length > 1 && gSelectedFiles.has(`${dir}-${fiber}`)) ? 'sel' : 'one';

  const bg = document.createElement('div'); bg.id = 'rn-dlg-bg';
  const d = document.createElement('div'); d.id = 'rn-dlg';
  d.innerHTML = `<h3>Rename Files</h3>`
    + `<div class="sub">Find and replace across the file names. The files are renamed where they sit;`
    + ` nothing inside them is touched, and Undo puts this batch back.</div>`
    + `<div class="row"><label>Files</label><select id="rn-scope">`
    + scopes.map(([v, t]) => `<option value="${v}"${v === start ? ' selected' : ''}>${esc(t)}</option>`).join('')
    + `</select></div>`
    + `<div class="row"><label>Search for</label><input type="text" id="rn-find" autocomplete="off" spellcheck="false"></div>`
    + `<div class="row"><label>Replace with</label><input type="text" id="rn-rep" autocomplete="off" spellcheck="false"></div>`
    + `<div class="opts">`
    + `<label><input type="checkbox" id="rn-regex"> Regular expression</label>`
    + `<label><input type="checkbox" id="rn-case"> Match case</label>`
    + `<label><input type="checkbox" id="rn-all" checked> Replace every match</label>`
    + `</div>`
    + `<div class="opts"><span style="color:var(--text-sec)">Apply to</span>`
    + `<label><input type="radio" name="rn-part" value="whole" checked> whole file name</label>`
    + `<label><input type="radio" name="rn-part" value="name"> name, keep the extension</label>`
    + `<label><input type="radio" name="rn-part" value="ext"> extension only</label>`
    + `</div>`
    + `<div id="rn-list"></div>`
    + `<div class="count" id="rn-count"></div>`
    + `<div class="err" id="rn-err"></div>`
    + `<div class="btns">`
    + `<button type="button" class="link spacer" id="rn-tick">tick all / none</button>`
    + `<button id="rn-cancel">Cancel</button>`
    + `<button class="primary" id="rn-go" disabled>Rename</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);

  const build = () => { buildRenameRows(d.querySelector('#rn-scope').value, dir, fiber, name, marked); renamePreview(); };
  d.querySelector('#rn-scope').onchange = build;
  for (const id of ['#rn-find', '#rn-rep']) d.querySelector(id).oninput = renamePreview;
  for (const id of ['#rn-regex', '#rn-case', '#rn-all']) d.querySelector(id).onchange = renamePreview;
  d.querySelectorAll('input[name=rn-part]').forEach(r => r.onchange = renamePreview);
  d.querySelector('#rn-tick').onclick = () => {
    const anyOff = gRenameRows.some(r => !r.cb.checked);
    gRenameRows.forEach(r => { r.cb.checked = anyOff; });
    renamePreview();
  };
  d.querySelector('#rn-list').addEventListener('change', ev => {
    if (ev.target.type === 'checkbox') renamePreview();
  });
  bg.onclick = closeRenameDialog;
  d.querySelector('#rn-cancel').onclick = closeRenameDialog;
  d.querySelector('#rn-go').onclick = submitRename;
  build();
  d.querySelector('#rn-find').focus();
}

function buildRenameRows(scope, dir, fiber, name, marked) {
  let files;
  if (scope === 'one') files = [{ dir, fiber, name }];
  else if (scope === 'sel') files = marked;
  else if (scope === 'both') files = [...panelFiles('a'), ...panelFiles('b')];
  else files = panelFiles(scope);
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const list = document.getElementById('rn-list');
  list.innerHTML = `<div class="rn-row rn-hd"><span></span><span>File Name Now</span>`
    + `<span></span><span>After Renaming</span></div>`
    + files.map(f => `<div class="rn-row"><input type="checkbox" checked>`
        + `<span class="rn-old" title="${esc(f.name)}">${esc(f.name)}</span>`
        + `<span class="rn-arrow">→</span><span class="rn-new"></span></div>`).join('');
  const els = [...list.querySelectorAll('.rn-row')].slice(1);   // past the header
  gRenameRows = files.map((f, i) => ({
    dir: f.dir, fiber: f.fiber, name: f.name, el: els[i],
    cb: els[i].querySelector('input'), out: els[i].querySelector('.rn-new'),
    newName: f.name, problem: null,
  }));
}

// The rule as the inputs read it.  Throws on a regex the tech is still
// typing, which the caller turns into the red line under the list.
function renameRule() {
  const d = document.getElementById('rn-dlg');
  const find = d.querySelector('#rn-find').value;
  const rep = d.querySelector('#rn-rep').value;
  const useRe = d.querySelector('#rn-regex').checked;
  let flags = d.querySelector('#rn-all').checked ? 'g' : '';
  if (!d.querySelector('#rn-case').checked) flags += 'i';
  return {
    find,
    re: find ? new RegExp(useRe ? find : find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags) : null,
    // With the regex box off, "$" is the tech's own character, not a group
    // reference: String.replace would otherwise eat "$1" out of a literal.
    rep: useRe ? rep : rep.replace(/\$/g, '$$$$'),
    part: d.querySelector('input[name=rn-part]:checked').value,
  };
}

function renameNewName(name, rule) {
  if (!rule.re) return name;
  const dot = name.lastIndexOf('.');
  const hasExt = dot > 0;
  const stem = hasExt ? name.slice(0, dot) : name;
  const ext = hasExt ? name.slice(dot + 1) : '';
  if (rule.part === 'name') return stem.replace(rule.re, rule.rep) + (hasExt ? '.' + ext : '');
  if (rule.part === 'ext') return hasExt ? stem + '.' + ext.replace(rule.re, rule.rep) : name;
  return name.replace(rule.re, rule.rep);
}

// Recompute every row: the new name, then why it could not be used.
function renamePreview() {
  const d = document.getElementById('rn-dlg');
  if (!d) return;
  const err = d.querySelector('#rn-err');
  const go = d.querySelector('#rn-go');
  let rule;
  try {
    rule = renameRule();
  } catch (e) {
    // Half a regex, mid-keystroke.  The list below still shows the names the
    // LAST good rule produced, and those are not what would be written, so
    // it is greyed out until the rule parses again — the preview is the
    // contract, and a preview that is not live must not look live.
    err.textContent = 'that is not a valid regular expression yet: ' + ((e && e.message) || e);
    d.querySelector('#rn-list').classList.add('rn-stale');
    go.disabled = true;
    return;
  }
  d.querySelector('#rn-list').classList.remove('rn-stale');
  err.textContent = '';
  // Every name on disk in each direction, the removed ones included: a file
  // taken out of the FILES list is still sitting in the folder and its name
  // is still taken.  (Only the files list_fibers returns are known here; a
  // stray report or cache is invisible to the preview, and the server's own
  // collision check catches it and says so in the result.)
  const onDisk = {};
  for (const dir of ['a', 'b']) {
    onDisk[dir] = new Set(((gInfo && gInfo['files_' + dir]) || [])
      .map(n => String(n).toLowerCase()));
  }
  const moving = { a: new Set(), b: new Set() };
  for (const r of gRenameRows) {
    r.newName = renameNewName(r.name, rule);
    if (r.cb.checked && r.newName !== r.name) moving[r.dir].add(r.name.toLowerCase());
  }
  const claimed = { a: new Map(), b: new Map() };
  let nGo = 0, nBad = 0, nSame = 0, nRenum = 0;
  for (const r of gRenameRows) {
    r.el.classList.remove('rn-same', 'rn-bad', 'rn-warn');
    r.problem = null;
    let note = '';
    if (!r.cb.checked || r.newName === r.name) {
      r.el.classList.add('rn-same');
      r.out.textContent = r.cb.checked ? 'no change' : 'not ticked';
      r.out.title = '';
      nSame++;
      continue;
    }
    const key = r.newName.toLowerCase();
    r.problem = nameProblem(r.newName);
    if (!r.problem && claimed[r.dir].has(key)) {
      r.problem = 'two files would be named ' + r.newName;
    } else if (!r.problem && onDisk[r.dir].has(key) && !moving[r.dir].has(key)) {
      r.problem = r.newName + ' is already in that folder';
    }
    if (r.problem) {
      r.el.classList.add('rn-bad');
      nBad++;
    } else {
      claimed[r.dir].set(key, r);
      const was = fiberNumOf(r.name), now = fiberNumOf(r.newName);
      if (was !== now) {
        // The number the whole suite keys fibers on is moving.  Not refused
        // — renumbering a cable is a real job — but never silent.
        r.el.classList.add('rn-warn');
        note = now == null ? '  ⚠ no fiber number in this name'
                           : `  ⚠ fiber ${was == null ? '?' : was} → ${now}`;
        nRenum++;
      }
      nGo++;
    }
    r.out.textContent = r.newName + (r.problem ? '  ⚠ ' + r.problem : note);
    r.out.title = r.out.textContent;
  }
  const bits = [`${nGo} file${nGo === 1 ? '' : 's'} will be renamed`];
  if (nSame) bits.push(`${nSame} unchanged`);
  if (nRenum) bits.push(`${nRenum} change the fiber number`);
  if (nBad) bits.push(`${nBad} cannot be renamed and will be left alone`);
  d.querySelector('#rn-count').textContent = bits.join(' · ');
  go.textContent = nGo ? `Rename ${nGo} file${nGo === 1 ? '' : 's'}` : 'Rename';
  go.disabled = !nGo;
}

async function submitRename() {
  const d = document.getElementById('rn-dlg');
  const byDir = {};
  let renumbered = false;
  for (const r of gRenameRows) {
    if (!r.cb.checked || r.problem || r.newName === r.name) continue;
    (byDir[r.dir] = byDir[r.dir] || []).push({ from: r.name, to: r.newName });
    if (fiberNumOf(r.name) !== fiberNumOf(r.newName)) renumbered = true;
  }
  const batches = Object.keys(byDir).map(dir => ({ dir, pairs: byDir[dir] }));
  if (!batches.length) { d.querySelector('#rn-err').textContent = 'nothing to rename'; return; }
  d.querySelector('#rn-go').disabled = true;
  d.querySelector('#rn-cancel').disabled = true;
  const res = await applyRenameBatches(batches, renumbered);
  if (res.error) {
    d.querySelector('#rn-err').textContent = res.error;
    d.querySelector('#rn-go').disabled = false;
    d.querySelector('#rn-cancel').disabled = false;
    return;
  }
  if (res.undo.length) gRenameUndo.push({ n: res.renamed, batches: res.undo });
  showRenameResult(res);
}

// The one place that talks to /api/rename, for both the rename and its undo.
// `batches` is [{dir, pairs:[{from,to}]}]; the reply's `renamed` list is what
// actually moved, so the inverse of THAT is what Undo replays — never the
// inverse of what was asked for.
async function applyRenameBatches(batches, renumbered) {
  const out = { renamed: 0, skipped: [], folders: [], undo: [], dirs: [], error: null };
  for (const b of batches) {
    let j;
    try {
      const r = await fetch('/api/rename', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: b.dir, pairs: b.pairs }),
      });
      j = await r.json();
      if (!r.ok || j.error) { out.error = j.error || ('server said ' + r.status); break; }
    } catch (e) {
      out.error = (e && e.message) || String(e);
      break;
    }
    const done = j.renamed || [];
    out.renamed += done.length;
    out.skipped.push(...(j.skipped || []));
    if (j.folder) out.folders.push(j.folder);
    if (done.length) {
      out.dirs.push(b.dir);
      out.undo.push({ dir: b.dir, pairs: done.map(p => ({ from: p.to, to: p.from })) });
    }
  }
  if (out.renamed) await afterRename(out.dirs, renumbered);
  return out;
}

// The folder on disk has moved under the page: re-read the listing, and drop
// whatever in this session was keyed on a fiber number the rename changed.
// A rename that only touched the text around the number (a prefix, a
// wavelength suffix) leaves every fiber where it was, so the loaded traces
// still name the same glass and are kept.
async function afterRename(dirs, renumbered) {
  gSelectedFiles.clear();
  gFileAnchor = null;
  if (renumbered) {
    for (const dir of dirs) {
      for (const key of [...gRemovedFiles]) if (key.startsWith(dir + '-')) gRemovedFiles.delete(key);
      for (const key of Object.keys(gDirOverride)) if (key.startsWith(dir + '-')) delete gDirOverride[key];
      for (const key of Object.keys(gStoredDir)) if (key.startsWith(dir + '-')) delete gStoredDir[key];
      for (const t of gTraces.filter(t => t.src === dir)) COLORS_USED.delete(t.key);
      gTraces = gTraces.filter(t => t.src !== dir);
    }
  }
  await loadInfo();
  // Anything still loaded whose fiber has left the listing goes too.
  const live = new Set();
  for (const dir of ['a', 'b']) {
    for (const f of (gInfo && gInfo['fibers_' + dir]) || []) live.add(`${dir}-${f}`);
  }
  for (const t of gTraces.filter(t => !live.has(t.key))) COLORS_USED.delete(t.key);
  gTraces = gTraces.filter(t => live.has(t.key));
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
}

// Say what happened IN the dialog and leave it open, the same rule the edit
// dialog follows: a line in the readout naming a folder is how the boss lost
// a file once already.  Undo is right here, next to the count it undoes.
function showRenameResult(res) {
  const d = document.getElementById('rn-dlg');
  if (!d) return;
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const lines = [`<b>Renamed ${res.renamed} file${res.renamed === 1 ? '' : 's'}</b>`
    + (res.folders.length ? ` in:<br><code>${res.folders.map(esc).join('</code><br><code>')}</code>` : '')];
  if (res.skipped.length) {
    const why = {};
    for (const s of res.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    lines.push(`<b>Left alone ${res.skipped.length}:</b> `
      + Object.entries(why).map(([r, c]) => esc(c > 1 ? `${c} × ${r}` : r)).join('; '));
  }
  if (!res.renamed) lines.push('Nothing was renamed.');
  setReadout(`renamed ${res.renamed} file${res.renamed === 1 ? '' : 's'}`
    + (res.skipped.length ? `, left ${res.skipped.length} alone` : ''));
  d.innerHTML = `<h3>Rename Done</h3><div class="note" style="font-size:11px;line-height:1.5">`
    + lines.map(l => `<div style="margin:6px 0">${l}</div>`).join('') + `</div>`
    + `<div class="btns">`
    + (res.renamed ? `<button class="spacer" id="rn-undo">Undo this rename</button>` : '')
    + `<button class="primary" id="rn-done">Done</button></div>`;
  d.querySelector('#rn-done').onclick = closeRenameDialog;
  const u = d.querySelector('#rn-undo');
  if (u) u.onclick = () => { closeRenameDialog(); undoLastRename(); };
}

// Undo replays the last batch backwards.  It goes through the same route and
// the same rules, so a name that was taken again in the meantime is refused
// and said out loud rather than written over.
async function undoLastRename() {
  const last = gRenameUndo.pop();
  if (!last) { setReadout('nothing to undo'); return; }
  setReadout(`putting ${last.n} file name${last.n === 1 ? '' : 's'} back…`);
  const renumbered = last.batches.some(b =>
    b.pairs.some(p => fiberNumOf(p.from) !== fiberNumOf(p.to)));
  const res = await applyRenameBatches(last.batches, renumbered);
  if (res.error) {
    gRenameUndo.push(last);                 // it did not happen; keep the undo
    setReadout('could not undo the rename: ' + res.error);
    return;
  }
  if (res.skipped.length) {
    const why = {};
    for (const s of res.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    setReadout(`put ${res.renamed} name${res.renamed === 1 ? '' : 's'} back; `
      + `${res.skipped.length} could not go back: `
      + Object.entries(why).map(([r, c]) => c > 1 ? `${c} × ${r}` : r).join('; '));
  } else {
    setReadout(`put ${res.renamed} file name${res.renamed === 1 ? '' : 's'} back`);
  }
}

// Zoom the chart to ±half km around an A-frame km, refitting Y to the window.
function zoomToKm(aKm, half = 2) {
  if (!gView) return;
  const x0 = Math.max(0, aKm - half), x1 = aKm + half;
  let y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const xs = t.data.dist_km, ys = t.data.trace_db;
    for (let i = 0; i < xs.length; i += 2) {
      const dx = dispKm(t, xs[i]);
      if (dx < x0 || dx > x1) continue;
      const dy = dispDb(t, ys[i]);
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(y0)) { y0 = gView.y0; y1 = gView.y1; }
  const pad = Math.max(0.5, (y1 - y0) * 0.1);
  gView = { x0, x1, y0: y0 - pad, y1: y1 + pad };
  gAutoFit = false;
  draw();
}

// ─── Zoom / pan ───────────────────────────────────────────────────────
function zoomAt(px, factor) {
  if (!gView) return;
  const r = plotRect();
  const xData = pxToX(px, r);
  const span = gView.x1 - gView.x0;
  const newSpan = Math.max(0.001, span * factor);
  const t = (xData - gView.x0) / span;
  gView = {
    ...gView,
    x0: xData - t * newSpan,
    x1: xData + (1 - t) * newSpan,
  };
  gAutoFit = false;
  draw();
}

function zoomYAt(py, factor) {
  if (!gView) return;
  const r = plotRect();
  const yData = pxToY(py, r);
  const span = gView.y1 - gView.y0;
  const newSpan = Math.max(0.001, span * factor);
  const t = (yData - gView.y0) / span;
  gView = {
    ...gView,
    y0: yData - t * newSpan,
    y1: yData + (1 - t) * newSpan,
  };
  gAutoFit = false;
  draw();
}

canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const factor = Math.pow(1.15, ev.deltaY > 0 ? 1 : -1);
  if (ev.shiftKey) zoomYAt(ev.offsetY, factor);
  else zoomAt(ev.offsetX, factor);
}, { passive: false });

function markerHit(px, r) {
  // Return 'a'/'b' if px is within grab radius of a placed marker, else null.
  if (!gView) return null;   // no trace loaded yet → xToPx() reads gView.x0 on
                             // null and throws (error issue #5: mouse-move in
                             // marker mode after Clear All / before a load).
  for (const m of ['a', 'b']) {
    if (gMarkers[m] == null) continue;
    if (Math.abs(xToPx(gMarkers[m], r) - px) <= MARKER_HIT_PX) return m;
  }
  return null;
}

canvas.addEventListener('mousedown', (ev) => {
  if (!gView) return;
  const r = plotRect();
  if (ev.shiftKey) {
    gDragging = { kind: 'box', startPx: ev.offsetX, curPx: ev.offsetX };
    return;
  }
  // An event number is a link to its row in the table: pressing on one
  // does not start a pan.
  if (!gMarkerMode && gShowEvents) {
    const lh = labelHit(ev.offsetX, ev.offsetY);
    if (lh) { gLabelClick = { hit: lh, x: ev.offsetX, y: ev.offsetY }; return; }
  }
  if (gMarkerMode) {
    const hit = markerHit(ev.offsetX, r);
    if (hit) { gDragMarker = hit; return; }          // grab an existing marker
    const km = pxToX(ev.offsetX, r);
    if (gMarkers.a == null)      gMarkers.a = km;     // place A, then B
    else if (gMarkers.b == null) gMarkers.b = km;
    else {                                           // both set → move nearer one
      const nearer = Math.abs(km - gMarkers.a) <= Math.abs(km - gMarkers.b) ? 'a' : 'b';
      gMarkers[nearer] = km;
      gDragMarker = nearer;
    }
    draw();
    return;
  }
  gDragging = {
    kind: 'pan',
    startX: ev.offsetX, startY: ev.offsetY,
    vx0: gView.x0, vx1: gView.x1, vy0: gView.y0, vy1: gView.y1,
  };
});

canvas.addEventListener('mousemove', (ev) => {
  gMouse = { px: ev.offsetX, py: ev.offsetY };
  if (gDragMarker) {                                 // dragging a placed marker
    const r = plotRect();
    gMarkers[gDragMarker] = pxToX(ev.offsetX, r);
    draw();
    return;
  }
  // Cursor hint when hovering a grabbable marker
  if (gMarkerMode && !gDragging) {
    canvas.style.cursor = markerHit(ev.offsetX, plotRect()) ? 'ew-resize' : 'crosshair';
  } else if (!gDragging && !gLabelClick) {
    // Over an event number the crosshair becomes the arrow: "this is a link".
    canvas.style.cursor = (gShowEvents && labelHit(ev.offsetX, ev.offsetY)) ? 'default' : 'crosshair';
  }
  if (gDragging) {
    const r = plotRect();
    if (gDragging.kind === 'pan') {
      const dxData = (ev.offsetX - gDragging.startX) / r.w * (gDragging.vx1 - gDragging.vx0);
      const dyData = (ev.offsetY - gDragging.startY) / r.h * (gDragging.vy1 - gDragging.vy0);
      gView = {
        x0: gDragging.vx0 - dxData, x1: gDragging.vx1 - dxData,
        y0: gDragging.vy0 + dyData, y1: gDragging.vy1 + dyData,
      };
      gAutoFit = false;
    } else if (gDragging.kind === 'box') {
      gDragging.curPx = ev.offsetX;
    }
  }
  draw();
});

window.addEventListener('mouseup', (ev) => {
  if (gLabelClick) {
    const c = gLabelClick; gLabelClick = null;
    const still = ev.target === canvas
      && Math.abs(ev.offsetX - c.x) <= 3 && Math.abs(ev.offsetY - c.y) <= 3;
    if (still && gGridGoTo) gGridGoTo(c.hit.t, c.hit.e);
    return;
  }
  if (gDragMarker) { gDragMarker = null; draw(); return; }
  if (!gDragging) return;
  if (gDragging.kind === 'box') {
    const r = plotRect();
    const x0p = Math.min(gDragging.startPx, gDragging.curPx);
    const x1p = Math.max(gDragging.startPx, gDragging.curPx);
    if (x1p - x0p > 4) {
      gView = { ...gView, x0: pxToX(x0p, r), x1: pxToX(x1p, r) };
      gAutoFit = false;
    }
  }
  gDragging = null;
  draw();
});

canvas.addEventListener('dblclick', () => { if (!gMarkerMode) fit(); });
// Right-click an event number to make that event the span's start or end:
// the same menu a right-click on the grid cell opens, fed the same way (the
// trace names the direction, the event its own raw km).
canvas.addEventListener('contextmenu', (ev) => {
  if (!gShowEvents) return;
  const lh = labelHit(ev.offsetX, ev.offsetY);
  if (!lh) return;
  ev.preventDefault();
  gLabelClick = null;
  showSpanMenu(ev.clientX, ev.clientY, lh.t.dir, lh.e.dist_km, lh.t.fiber, lh.t.src || lh.t.dir);
});
canvas.addEventListener('mouseleave', () => { gMouse = null; draw(); });

// Keyboard: + / - to zoom, f fit, m toggle markers, Esc clear markers
window.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT') return;
  // A dialog is modal: the chart's keys, and Ctrl+A marking the FILES list
  // behind it, are not what the tech is aiming at while one is open.
  if (document.getElementById('rn-dlg') || document.getElementById('edit-dlg')) return;
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'a' || ev.key === 'A')) {
    ev.preventDefault();
    selectAllFiles();
    return;
  }
  const r = plotRect();
  const cx = r.x + r.w / 2;
  if (ev.key === '+' || ev.key === '=') zoomAt(cx, 0.8);
  else if (ev.key === '-' || ev.key === '_') zoomAt(cx, 1.25);
  else if (ev.key === 'f' || ev.key === 'F') fit();
  else if (ev.key === 'm' || ev.key === 'M') toggleMarkerMode();
  else if (ev.key === 'Escape') clearMarkers();
});

// ─── Marker controls ──────────────────────────────────────────────────
function toggleMarkerMode() {
  gMarkerMode = !gMarkerMode;
  document.getElementById('btn-markers').classList.toggle('toggled', gMarkerMode);
  canvas.style.cursor = gMarkerMode ? 'crosshair' : 'crosshair';
  draw();
}
function clearMarkers() {
  gMarkers = { a: null, b: null };
  gDragMarker = null;
  draw();
}

// ─── Toolbar wiring ───────────────────────────────────────────────────
document.getElementById('btn-add').onclick = addFibers;
document.getElementById('btn-clear').onclick = clearAll;
document.getElementById('btn-fit').onclick = fit;
document.getElementById('btn-fit-x').onclick = fitX;
document.getElementById('btn-fit-y').onclick = fitY;
document.getElementById('btn-zoom-in').onclick  = () => { const r = plotRect(); zoomAt(r.x + r.w/2, 0.8); };
document.getElementById('btn-zoom-out').onclick = () => { const r = plotRect(); zoomAt(r.x + r.w/2, 1.25); };
document.getElementById('btn-markers').onclick = toggleMarkerMode;
document.getElementById('btn-markers-clear').onclick = clearMarkers;
document.getElementById('cb-events').onchange = (e) => { gShowEvents = e.target.checked; draw(); };
document.getElementById('cb-colors').checked = gFiberColors;
document.getElementById('cb-colors').onchange = (e) => setFiberColors(e.target.checked);
document.getElementById('set-sections').checked = gShowSections;
document.getElementById('set-sections').onchange = (e) => {
  gShowSections = e.target.checked;
  try { localStorage.setItem('otdr_viewer_sections', gShowSections ? '1' : '0'); } catch (e2) {}
  renderEventTable();
};
document.getElementById('cb-stack').onchange = (e) => {
  gStacked = e.target.checked;
  syncYSpacingEnabled();
  refreshMirrorFrame();   // the frame only exists while the two share one chart
  if (gAutoFit) fit(); else draw();
  renderEventTable();
};

// Y spacing only means anything while the two directions share one chart, so
// the control follows the stack checkbox.
function syncYSpacingEnabled() {
  const inp = document.getElementById('num-yspace');
  inp.disabled = !gStacked;
  document.getElementById('lbl-yspace').classList.toggle('disabled', !gStacked);
}

document.getElementById('num-yspace').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  gStackSpacingDb = Number.isFinite(v) ? Math.max(0, Math.min(60, v))
                                       : STACK_Y_SPACING_DEFAULT_DB;
  if (!gStacked) return;              // nothing to separate
  if (gAutoFit) fit(); else draw();   // live redraw
});
syncYSpacingEnabled();
document.getElementById('fiber-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addFibers();
});
for (const b of document.querySelectorAll('#dir-seg button')) {
  b.onclick = () => {
    document.querySelectorAll('#dir-seg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    gAddDir = b.dataset.dir;
  };
}

// ─── Boot ─────────────────────────────────────────────────────────────
// No default fiber.  The Viewer used to auto-load F64 (or the first common
// fiber) so the canvas was never empty; the boss asked for it to open blank
// and let the tech pick fibers from the Files panel on the right.  Kept as a
// function so the deep-link fallback below still has one place to call.
async function autoloadDefault() {
  setAddDir('both');
}

// Reflect a direction choice in gAddDir + the toolbar segmented buttons.
function setAddDir(dir) {
  gAddDir = (dir === 'a' || dir === 'b' || dir === 'both') ? dir : 'both';
  document.querySelectorAll('#dir-seg button').forEach(b =>
    b.classList.toggle('active', b.dataset.dir === gAddDir));
}

// Deep-link boot:
//   ?fiber=64&km=29.2866&dir=both    Splice Report grid → jump to one splice.
//   ?fibers=410,418&dir=a            Duplicate Check pair → overlay BOTH fibers
//                                    (comma-separated) in one direction + Fit.
// Falls back to the default fiber.
// Apply a jump target (fiber/km/dir, or a comma list of fibers).  Shared by
// the URL deep-link boot AND the live pop-out path (postMessage from a report
// window), so a report cell click re-plots THIS already-open window in place —
// no reload, no reopen.
// `t.replace` — clear the plot before loading.  The live pop-out path sets it
// so each report cell click SHOWS THAT FIBER instead of stacking traces (ten
// clicks used to leave ten traces + chips on the canvas).  A tech who wants to
// compare fibers shift-clicks the cell, which sends replace:false and keeps
// the additive behavior.  The URL boot path never sets it — a fresh page is
// already empty, so its behavior is unchanged.
async function applyTarget(t) {
  if (!gInfo || !t) return;
  // 'sr' | 'uni' — which report sent us here.  Decides the gate the
  // verdict column judges by, so the Viewer cannot contradict the grid.
  if (t.src) {
    gSourceReport = (t.src === 'uni') ? 'uni' : 'sr';
    syncGateUI();
    renderBackButton();
  }
  const fibers = t.fibers;
  if (fibers && /^\d+(\s*,\s*\d+)*$/.test(String(fibers))) {
    if (t.replace) clearAll();
    document.getElementById('fiber-input').value = String(fibers);
    setAddDir(t.dir || 'a');
    await addFibers();               // loads every listed fiber, then Fits
    return;
  }
  const fiber = t.fiber;
  if (fiber != null && /^\d+$/.test(String(fiber))) {
    if (t.replace) clearAll();
    document.getElementById('fiber-input').value = String(fiber);
    setAddDir(t.dir || 'both');
    await addFibers();
    const km = parseFloat(t.km);
    if (!isNaN(km)) zoomToKm(km, 2.5);
    return;
  }
  await autoloadDefault();
}

async function bootLoad() {
  if (!gInfo) return;
  const p = new URLSearchParams(location.search);
  await applyTarget({ fibers: p.get('fibers'), fiber: p.get('fiber'),
                      km: p.get('km'), dir: p.get('dir'), src: p.get('src') });
}

// ─── One boot pass at a time ──────────────────────────────────────────
// bootLoad() has TWO entry points — the boot IIFE at the bottom of this file
// and the window 'focus' listener above — and nothing stopped them running at
// the same time.  The focus listener is not hypothetical: the hub's pop-out
// calls vw.focus() on the viewer window (app.py), and a window manager raising
// a freshly opened viewer fires it too, so it lands squarely inside boot's
// first fetch.
//
// Both passes then reach addFibers(), which PLANS synchronously and COMMITS
// after its awaits: it decides which keys are missing with
// `gTraces.some(t => t.key === key)` up front, then fetches, then pushes.  A
// second pass that starts while the first is still fetching therefore sees an
// empty gTraces, plans the very same keys, and pushes them again — the dedupe
// cannot see a pass that has not committed yet.  Measured on a slow first-visit
// folder: gTraces came back ["b-64","a-64","b-64","a-64"], the readout said
// "4 traces loaded", every trace was drawn twice, the event list counted every
// event twice (40 events / 16 flagged instead of 20 / 8), and — because the
// FastReporter grid only renders for <= 2 traces — the FR layout was replaced
// by the flat list entirely.
//
// So the two passes must not both run.  A second caller JOINS the pass already
// in flight instead of starting its own.  The handle is cleared when the pass
// settles, which keeps the retry the focus listener exists for: folders seeded
// after boot still get a fresh pass, because by then nothing is in flight.
let gBootInFlight = null;          // the one boot pass, while it is running
function bootLoadOnce() {
  if (gBootInFlight) return gBootInFlight;      // already booting — join it
  gBootInFlight = (async () => {
    try { await bootLoad(); }
    finally { gBootInFlight = null; }
  })();
  return gBootInFlight;
}

// Live pop-out update: a report window (Splice Report / FR / Uni) postMessages
// {type:'otdr-jump', fiber, km, dir} on every cell click → we re-plot in place.
// Loopback-only (the hub + this viewer are both localhost); ignore anything
// else.  Guarded so a message before gInfo is loaded can't throw.
window.addEventListener('message', function (ev) {
  try {
    if (!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(ev.origin)) return;
    const d = ev.data;
    if (!d || d.type !== 'otdr-jump') return;
    // Same overlap, second door.  The hub does `vw.focus(); vw.postMessage(…)`
    // back to back (app.py), so on a viewer that is still booting the focus
    // starts a boot pass and this jump would plan against the same uncommitted
    // gTraces.  Wait for the pass in flight — there usually is none, and then
    // this is a bare microtask — so applyTarget's replace/clear acts on a
    // settled gTraces instead of interleaving with it.
    Promise.resolve(gBootInFlight)
      .catch(() => {})                 // a failed boot must not eat the jump
      .then(() => applyTarget(d))
      .catch(e => reportJsError((e && e.message) || String(e), e && e.stack));
  } catch (e) { /* never let a stray message break the viewer */ }
});

(async function boot() {
  // Size + paint the canvas FIRST, before any network call.  A cold (frozen)
  // launch can have the trace server still binding when this page loads; if the
  // very first /api/list rejected we used to skip resizeCanvas() entirely and the
  // canvas was never given a pixel size — a permanently blank Viewer.  Sizing up
  // front guarantees the empty chart frame paints no matter what the server does.
  resizeCanvas();
  // Retry loadInfo() through the cold-start window (up to ~6 s) so a single early
  // fetch failure can't leave the page stuck.  loadInfo() returns false only when
  // the fetch itself failed; true (folders present OR the empty-folder prompt)
  // ends the loop.
  wireEventSettings();
  let ok = await loadInfo();
  for (let i = 0; i < 12 && ok === false; i++) {
    await new Promise(r => setTimeout(r, 500));
    resizeCanvas();
    ok = await loadInfo();
  }
  try { await bootLoadOnce(); } catch (e) {
    // A boot-path crash must be VISIBLE (readout) and REPORTED (Slack) —
    // this catch used to swallow everything, which also suppressed the
    // unhandledrejection reporter.
    reportJsError((e && e.message) || String(e), e && e.stack);
    setReadout('viewer failed to auto-load: ' + (e && e.message || e));
  }
  draw();
})();
</script>
