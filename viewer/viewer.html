           + ` ${j.stamped === 'b' ? 'B→A' : 'A→B'}`);
    }
    // One direction under several spellings of its name (long shots, short
    // shots and plain names of one span).  Each spelling used to count as a
    // direction: the biggest two became A and B and the rest were ignored.
    for (const v of (j.name_variants || [])) {
      msg += ` · ${v.keys.join(', ')} kept together as ${v.as}:`
           + ` every file's Direction says ${v.stamped === 'b' ? 'B→A' : 'A→B'}`;
    }
    // Files mislabeled for direction still load (the boss, 2026-09-29); the
    // tech fixes their direction from the Files panel.  Say where they went.
    let moved = false;
    if (j.kept_whole && j.kept_whole.length) {
      const on = j.added === 'B' ? j.b_prefix : j.a_prefix;
      warn.push(`${j.kept_whole.join(', ')} files kept with ${on || 'the rest'}:`
           + ` their fibers fill its gaps, so they were read as one direction with the names wrong`);
      moved = true;
    }
    for (const f of (j.folded || [])) {
      warn.push(`${f.key} files loaded with ${f.into}, the side their fibers were missing from`);
      moved = true;
    }
    if (j.repeats_placed && j.repeats_placed.length) {
      const n = j.repeats_placed.length;
      const shown = j.repeats_placed.slice(0, 6).join(', ') + (n > 6 ? `, … (+${n - 6} more)` : '');
      warn.push(`${n} file(s) share a name with a file of the other direction,`
           + ` so they went on the other side: ${shown}`);
      moved = true;
    }
    if (moved) warn.push('to change a file\'s direction, right-click it > Direction');
    if (j.ignored && j.ignored.length) {
      fail.push(`not loaded: ${j.ignored.join(', ')} (their fibers are already on both sides)`);
    }
    // A dragged PARENT folder arrives FLAT, without its subfolders.  A repeat
    // the drop could not put on the other side (see _place_repeats) is not
    // loaded; say so, or those files go missing in silence.
    if (j.repeated && j.repeated.length) {
      const uniq = [...new Set(j.repeated)].sort();
      const shown = uniq.slice(0, 6).join(', ')
                  + (uniq.length > 6 ? `, … (+${uniq.length - 6} more)` : '');
      fail.push(`${j.repeated.length} file(s) not loaded: they arrived under a name already dropped,`
           + ` kept the first: ${shown}. Drop one direction at a time`);
    }
    // Draw what was dropped (demo list #31): the drop used to list
    // its files and leave the chart blank, "0 of 4 selected".  Every file of
    // each side this drop wrote is selected, beside whatever the other side
    // already had on the chart; a whole cable goes through the overview, as
    // a Select All does.
    const want = new Set(gTraces.map(t => t.key));
    for (const d of ['a', 'b']) {
      if (!String(j.added || '').toLowerCase().includes(d)) continue;
      for (const f of ((gInfo && gInfo['fibers_' + d]) || [])) {
        const key = `${d}-${f}`;
        if (!gRemovedFiles.has(key)) want.add(key);
      }
    }
    gDropInFlight = false;             // the load below is the page's own, not the drop's
    const loading = want.size !== gTraces.length;
    if (loading) {
      await selectFiles(want);
    } else {
      renderChips();
      if (gAutoFit) fit();
      draw();
      renderEventTable();
    }
    if (loading) msg += loadFailNote();   // a dropped file that would not load stays red
    setReadout(msg, { warn: warn.join(' · '), fail: fail.join(' · ') });
  } catch (e) {
    setReadout('drop failed: ' + ((e && e.message) || e));
    cnt.textContent = '';
    reportDropFailure(e, at, files.length, total, Date.now() - t0);
  } finally { gDropInFlight = false; }
}
// A failed drop goes to Slack with where it stopped, so the cause can be read
// off the report instead of guessed at: which step, which file and how far in,
// how many uploads were in flight, and whether the server still answers a
// plain GET afterwards (a dead server and a refused upload read the same on
// the page: "Failed to fetch").  When the report itself cannot get through
// it is tried again, as the server may only be busy.
async function reportDropFailure(e, at, count, total, ms) {
  try {
    const mb = n => (n / 1048576).toFixed(1) + ' MB';
    let alive;
    try {
      const r = await fetch('/api/list', { cache: 'no-store' });
      alive = 'server answers GET /api/list: ' + r.status;
    } catch (e2) {
      alive = 'server does NOT answer GET /api/list: ' + ((e2 && e2.message) || e2);
    }
    const where = at.stage === 'file'
      ? `at file ${at.index} of ${count} (${at.file}, ${mb(at.size)})`
      : `at ${at.stage}`;
    const message = `Viewer drop failed ${where}: ${(e && e.name) || 'Error'}: ${(e && e.message) || e}`;
    const detail = [
      `stage=${at.stage} files=${count} total=${mb(total)}`,
      `sent_ok=${at.sent} (${mb(at.bytes)}) in_flight=${at.busy} retries=${at.retries} after=${(ms / 1000).toFixed(1)} s`,
      alive,
      `dirs before: A=${(gInfo && gInfo.dir_a) || '-'} B=${(gInfo && gInfo.dir_b) || '-'}`,
      `browser: ${navigator.userAgent}`,
      String((e && e.stack) || ''),
    ].join('\n');
    const body = JSON.stringify({ message, stack: detail, page: location.href });
    for (let i = 0; i < 4; i++) {
      try {
        const r = await fetch('/api/jserror', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
        });
        if (r.ok) return;
      } catch (e3) { /* busy or gone: try again */ }
      await new Promise(res => setTimeout(res, 2000 * (i + 1)));
    }
  } catch (e4) { /* reporting must never break the viewer */ }
}
// The FILES panel and the chart (with the event table under it) both take a
// drop; a drop on the chart used to be thrown away in silence (demo
// list #31).  Only files count: text dragged out of a box is not a drop.
function _dragHasFiles(ev) {
  const t = ev.dataTransfer && ev.dataTransfer.types;
  return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0;
}
(() => {
  const panel = document.getElementById('files-panel');
  let depth = 0;
  panel.addEventListener('dragenter', (ev) => { ev.preventDefault(); depth += 1; panel.classList.add('dragging'); });
  panel.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
  panel.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) panel.classList.remove('dragging'); });
  panel.addEventListener('drop', (ev) => {
    ev.preventDefault(); depth = 0; panel.classList.remove('dragging');
    handleFilesDrop(ev.dataTransfer);
  });
  // The chart and the event table under it take the same drop.
  const main = document.getElementById('main'), wrap = document.getElementById('canvas-wrap');
  let mdepth = 0;
  main.addEventListener('dragenter', (ev) => {
    if (!_dragHasFiles(ev)) return;
    ev.preventDefault(); mdepth += 1; wrap.classList.add('dragging');
  });
  main.addEventListener('dragover', (ev) => {
    if (!_dragHasFiles(ev)) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
  });
  main.addEventListener('dragleave', () => { mdepth = Math.max(0, mdepth - 1); if (!mdepth) wrap.classList.remove('dragging'); });
  main.addEventListener('drop', (ev) => {
    ev.preventDefault(); mdepth = 0; wrap.classList.remove('dragging');
    if (_dragHasFiles(ev)) handleFilesDrop(ev.dataTransfer);
  });
  // A drop anywhere else must not navigate the page away to the file.
  window.addEventListener('dragover', ev => ev.preventDefault());
  window.addEventListener('drop', ev => ev.preventDefault());
})();

// ─── Load /api/list at startup ────────────────────────────────────────
async function loadInfo() {
  try {
    const r = await fetch('/api/list');
    // Snapshot the gate BEFORE gInfo and gThresholds are replaced below, so
    // the comparison after them can tell whether this poll actually moved it
    // (a second direction arriving moves it too: see oneDirOnly).
    const wasGate = activeGateDb();
    const wasMode = gAnalysisMode;
    gInfo = await r.json();
    // The hub's Analysis Mode switch moves CONFIG under a Viewer that already
    // has traces on screen.  The table is laid out per mode (the Splice
    // Report's own in OTDR Mode, FastReporter's in FR Mode), so a new mode
    // lays it out again; before, it kept the old layout until Clear All.
    gAnalysisMode = gInfo.analysis_mode === 'fr' ? 'fr' : 'suite';
    const modeMoved = gAnalysisMode !== wasMode;
    gLaunchA = Number(gInfo.launch_a_km) || 0;   // null (no reel) → 0
    gSpanDecl = gInfo.span_decl || { a: null, b: null };
    if (gInfo.thresholds) gThresholds = gInfo.thresholds;
    gEndRefl = Array.isArray(gInfo.end_refl) ? gInfo.end_refl : [];
    if (gInfo.end_pending) pollEndVerdicts();
    syncGateUI();
    renderFilesPanel();
    renderBackButton();
    // The gate can MOVE under a live pop-out: the hub points the trace server
    // at each report's own gates, so re-running under another customer profile
    // changes what /api/list serves.  syncGateUI only repaints the box and the
    // label, so without this the verdict column keeps the previous run's
    // answers until something else happens to re-render — which is the same
    // report/Viewer disagreement, just one click wide.
    if (gTraces.length && (modeMoved || activeGateDb() !== wasGate)) {
      renderEventTable();
      if (modeMoved) draw();     // the chart marks only the events the table prints
    }
  } catch (e) {
    setReadout('viewer server not ready yet…');
    return false;                       // signal not-ready → the boot loop retries
  }
  const nA = (gInfo.fibers_a || []).length, nB = (gInfo.fibers_b || []).length;
  if (nA === 0 && nB === 0) {
    setReadout('pick / paste A + B folders in the sidebar →');
    return true;
  }
  // A short shot is a truncated near-end acquisition: no end-of-fiber event,
  // so the cable's far end is simply not in the file.  A and B then cover
  // OPPOSITE ends of the cable and cannot be put on one frame — mirroring
  // would fold B about wherever the acquisition happened to stop, which looks
  // completely plausible and is wrong by however much cable is missing.  Say
  // so wherever it is drawn (frameWarn).
  gFrameWarn = (nB && gInfo.cable_end_known_b === false)
    ? '   ⚠ B never reaches the end of the fiber: cable length unknown, so A/B '
      + 'cannot be aligned. Check B is the full-length shot, not the short shot.'
    : '';
  setReadout(`A: ${gInfo.dir_a_name} (${nA} fibers)   ` +
             `B: ${gInfo.dir_b_name} (${nB} fibers)` +
             (gAnalysisMode === 'fr' ? '   ·   FastReporter analysis' : ''));
  return true;
}
// Every later readout ("N traces loaded", errors) would wipe
// a warning written once at load, so the frame warning is re-appended here —
// it has to stay visible for as long as it is true.
// Put the seeded gate in the box and name its source beside it.  Called
// after /api/list and again whenever the source report changes.
function syncGateUI() {
  const el = document.getElementById('set-loss');
  // Empty, not 1e9, when the report graded no loss at all — typing a number
  // still works and is picked up as an override, the usual escape hatch.
  if (el && gGateOverride == null)
    el.value = gateIsOff() ? '' : activeGateDb().toFixed(3);
  // Beside the box only when it is news: the Settings box down (breaks
  // only), a typed override, loss grading off (the box is empty), or one
  // direction loaded on a bidirectional report (#371: a different gate).
  // "(following OTDR Settings 0.160 dB)" just repeated the number in the
  // box (Robert 2026-09-29), so that usual case says it on hover.
  const lbl = document.getElementById('gate-src');
  const unusual = flagsOff() || gGateOverride != null || gateIsOff()
    || (gSourceReport !== 'uni' && oneDirOnly());
  if (lbl) {
    lbl.textContent = unusual ? `(${gateLabel()})` : '';
    lbl.classList.toggle('overridden', gGateOverride != null);
  }
  if (el) el.title = unusual ? gateLabel() : `following ${gateLabel()}`;
}

// ─── Back to the report ───────────────────────────────────────────────
// Report cells open this Viewer in its own window, which had no way back.
// Hidden when the hub embeds the Viewer in its own tab: that page already has
// its "← Back to …" buttons above the frame.
function renderBackButton() {
  const b = document.getElementById('btn-back');
  if (!b) return;
  b.hidden = window.top !== window || !(gInfo && gInfo.hub_url);
  b.textContent = '← Back to ' + (gSourceReport === 'uni' ? 'Unidirectional'
    : gSourceReport === 'sr' ? 'Splice Report' : 'reports');
}
document.getElementById('btn-back').addEventListener('click', () => {
  if (!gInfo || !gInfo.hub_url) return;
  const nav = gSourceReport === 'uni' ? 'uni' : gSourceReport === 'sr' ? 'sr' : '';
  const q = new URLSearchParams();
  if (nav) {
    q.set('nav', nav);
    if (gInfo.dir_a) q.set('sra', gInfo.dir_a);
    // A Unidirectional run on one of the panel's folders brings both back,
    // and the side it ran on; otherwise its one folder is the A box's.
    const uniSide = nav === 'uni' ? gUniSide : null;
    if (gInfo.dir_b && (nav !== 'uni' || uniSide)) q.set('srb', gInfo.dir_b);
    if (uniSide) q.set('pside', uniSide);
    if (gInfo.hub_carry) q.set('cs', gInfo.hub_carry);
  }
  const url = gInfo.hub_url + '/' + (nav ? '?' + q.toString() : '');
  // OTDR Suite App: the hub is always the App's main window, so ask the App to
  // bring it forward.  From this pop-out WebView2 cannot find it by name, and
  // the route below opened a second hub window (VM test, 2026-09-27).  No App
  // window (the regular OTDR Suite, browser tabs): the named route as before.
  fetch('/api/raise_hub', { method: 'POST' })
    .then(r => (r.ok ? r.json() : null)).catch(() => null)
    .then(j => { if (!(j && j.raised)) openHubByName(url); });
});
function openHubByName(url) {
  // The hub tab names itself 'otdr_hub'.  Opening that name with no URL brings
  // the existing tab forward with its report untouched.  If that tab is gone the
  // browser hands back a blank window instead, so load the report page in it.
  const w = window.open('', 'otdr_hub');
  if (!w) { window.open(url, '_blank'); return; }
  let blank = false;
  try { blank = w.location.href === 'about:blank'; } catch (e) { blank = false; }
  if (blank) w.location.href = url;
  w.focus();
}

// The readout line shows failures (bold red) and warnings (bold orange: the
// FR frame warning, the B-mirrored note) and nothing else; plain notes such
// as "48 traces loaded" are not shown (Robert 2026-09-30, "no plain notes").
// Each part keeps its own colour when one line carries both.
// absentNote()'s "F999 is not in the A/B folder" / "F1, F2, F3 (+4 more) are
// not in the A folder" / "no B folder is set" are failures too, whole or as the
// tail of a load readout.
// The B folder's short-shot warning, only while one of its traces is drawn
// lined up against A (stacked, A loaded): that is the one picture it is about.
// It used to follow the folder alone, so it sat on every readout and Summary
// Report of an A-only load, and of a short shot loaded by itself and drawn
// as shot, where nothing is aligned.
function frameWarn() {
  return gFrameWarn && gTraces.some(t => t.visible && t.src === 'b' && isFlipped(t))
    ? gFrameWarn : '';
}
const READOUT_FAIL_START = /^(could not |viewer failed|drop failed|nothing written|no [AB/]+ folder is set|F\d+(, F\d+)* (\(\+\d+ more\) )?(is|are) not in the )/;
const READOUT_FAIL_TAIL = /, (could not load |F\d+(, F\d+)* (\(\+\d+ more\) )?(is|are) not in the )/;
// The status line floats centred over the top of the chart.  The A/B marker
// readout holds the top right corner, so while it is up the status moves to
// the left, between the dB axis and that box, and is cut short to fit rather
// than run under it.
function placeReadout() {
  const el = document.getElementById('readout');
  const box = document.getElementById('marker-readout');
  if (!el) return;
  if (!box || box.style.display === 'none') {
    el.style.left = el.style.transform = el.style.maxWidth = '';
    return;
  }
  let left = 56;                       // the plot's left margin, M.l
  try { left = M.l; } catch (e) { /* not set up yet */ }
  el.style.left = left + 'px';
  el.style.transform = 'none';
  el.style.maxWidth = Math.max(60, box.offsetLeft - left - 10) + 'px';
}
function setReadout(s, extra = {}) {
  s = String(s || '');
  const el = document.getElementById('readout');
  const parts = [];
  if (READOUT_FAIL_START.test(s)) parts.push([s, 'ro-fail']);
  else {
    // A load readout ends in loadFailNote()'s ", could not load F12 A: ..."
    // tail: keep the failure, drop the note in front of it.
    const cut = s.search(READOUT_FAIL_TAIL);
    if (cut >= 0) parts.push([s.slice(cut + 2), 'ro-fail']);
  }
  // A drop hands over what it could not load and what it moved (see
  // handleFilesDrop): those are a failure and a warning whatever they say.
  if (extra.fail) parts.push([extra.fail, 'ro-fail']);
  if (extra.warn) parts.push([extra.warn, 'ro-warn']);
  parts.push([frameWarn().trim(), 'ro-warn'], [gMirrorNote.trim(), 'ro-warn']);
  const shown = parts.filter(([t]) => t);
  el.textContent = shown.map(([t]) => t).join('   ');
  placeReadout();
  // One line, cut off at the window edge: hovering it shows the whole text.
  el.title = el.textContent;
  if (!shown.length) return;
  el.replaceChildren(...shown.map(([t, c], i) => {
    const sp = document.createElement('span');
    sp.className = c;
    sp.textContent = (i ? '   ' : '') + t;
    return sp;
  }));
}

// Hub can poke the viewer to re-read /api/list after folders change.
// If nothing is loaded yet (cold-start deep link that missed the server, or
// folders that were seeded AFTER boot), re-run the deep-link load too — the
// old behavior refreshed the fiber list but never retried the requested
// fiber, leaving a permanently blank chart.
// `bootLoadOnce`, not `bootLoad` — this listener and the boot IIFE are two
// entry points into the SAME load, and they overlap (see bootLoadOnce).
// "Nothing loaded yet" means never, not just now: an empty canvas after the
// link was shown, or after a cell jump, is not retried (see gDeepLinkDone).
window.addEventListener('focus', async () => {
  const ok = await loadInfo();
  if (ok && !gTraces.length) {
    try { await bootLoadOnce(); } catch (e) { reportJsError((e && e.message) || String(e), e && e.stack); }
    draw();
  }
});

// The hub's Analysis Mode switch reaches the Viewer here.  The embedded
// Viewer never gets a focus event when the switch beside it is clicked, and
// a pop-out window beside the hub may not either, so a cheap ask for the mode
// runs every MODE_POLL_MS (the browser slows it down in a hidden tab, and the
// tab coming back into view asks at once).  Only a CHANGE costs anything
// (loadInfo, then the table in the new layout).  One ask at a time, and none
// while a drop is going up: the server takes one request at a time.
const MODE_POLL_MS = 1500;

async function pollAnalysisMode() {
  if (gModePollBusy || gDropInFlight || !gInfo) return;
  gModePollBusy = true;

    const j = await (await fetch('/api/mode', { cache: 'no-store' })).json();
    const m = j && j.analysis_mode === 'fr' ? 'fr' : 'suite';
    // The folders can move under the page too: the hub's A/B boxes, or
    // another window.  A side whose folder changed forgets what this page

    const moved = j && 'dir_a' in j

setInterval(pollAnalysisMode, MODE_POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollAnalysisMode(); });

// ─── Add traces ───────────────────────────────────────────────────────
async function addFibers() {
  gSelNext = null;                   // the box (or a report jump) is the newer ask
  const raw = document.getElementById('fiber-input').value;
  const fibers = parseFibers(raw);
  if (!fibers.length) { setReadout('no valid fibers in input'); return; }
  const plan = planOrSay(fibers, gAddDir);
  if (!plan) return;                   // nothing to load: the plot stays as it was
  const dirs = plan.dirs;
  const absentTail = plan.absent.length ? ', ' + absentNote(plan) : '';

  const tasks = [];
  for (const { f, d } of plan.pairs) {
    const key = `${d}-${f}`;
    // A trace still on its way (a second click on Add while the first is
    // fetching) is not asked for again: see gLoadingKeys.
    if (gTraces.some(t => t.key === key) || gRemovedFiles.has(key) || gLoadingKeys.has(key)) continue;
    tasks.push({ key, f, d });
  }
  // Two regimes.
  //
  // DETAIL (<= MAX_DETAIL_TRACES): full resolution, one fetch per trace, the
  // FastReporter-style event grid.  Unchanged behaviour.
  //
  // OVERVIEW: a whole cable, up to MAX_OVERVIEW_FIBERS per direction.  At full
  // resolution 1152 x 39,173 points is 340 MB and thousands of serial fetches,
  // which is why the old cap was 48.  Both are fixed server-side: /api/traces
  // returns the lot in one response, decimated to ~OVERVIEW_PTS points per
  // fiber by bucketed min/max, which is lossy in POSITION (~35 m at 69.5 km)
  // but not in DEPTH — a narrow spike is the extreme of its bucket, so it
  // survives.  Measured: plain striding kept 0.111 dB of a 0.943 dB glint;
  // min/max kept 0.957.
  //
  // A+B USED TO BE EXCLUDED from this — the gate read `dirs.length === 1`, so
  // asking for a cable in both directions silently gave you 48 traces and the
  // field asked why.  The reason was never the transfer: it was that the event
  // grid's column clustering was cubic, so 2,304 traces would not render.  That
  // is gone, and the numbers now say so plainly.  Measured here on 864 fibers
  // both ways — 1,728 traces, 22,767 events:
  //
  //     clustering       348 ms      the part that used to be impossible
  //     fetch         36,127 ms      62 MB through a single-threaded server
  //
  // So the cost is transfer, it is linear, and it is the tech's to spend: they
  // asked for a whole cable in two directions.  The readout says how many are
  // coming so a 36-second wait is an expectation rather than a hang.
  // 1728, not 1152.  1152 was never a limit, it was the size of the spans this
  // was built against, which are all 1152-fiber sets.  The
  // engine already states the real ceiling, in run_splicereport.py's stray-fiber
  // guard: "No real cable exceeds ~1728 fibers".  Leaving the viewer at 1152
  // meant one direction of a 1728-fiber cable was capped while the SAME 1728
  // traces loaded fine as 864 A + 864 B, which is a difference the glass does
  // not have.
  const overview = tasks.length > MAX_DETAIL_TRACES;
  const MAX_TRACES = overview ? MAX_OVERVIEW_FIBERS * dirs.length
                              : MAX_DETAIL_TRACES;
  let capped = false;
  const room = Math.max(0, MAX_TRACES - gTraces.length);
  if (tasks.length > room) {
    if (room === 0) {
      setReadout(`already at the ${MAX_TRACES}-trace limit. Remove some first`);
      return;
    }
    tasks.length = room;
    capped = true;
  }
  if (overview) {
    gLoadFailures = plan.gaps.slice();
    const ok = await loadOverview(tasks);
    syncFileMarks();                 // what the box loaded is selected in FILES
    renderChips();
    if (gAutoFit) fit();
    draw();
    renderEventTable();
    setReadout(`${gTraces.length} traces loaded in overview (~${OVERVIEW_PTS} pts each` +
               `, spikes preserved)` +
               (capped ? `, capped at ${MAX_TRACES}` : '') +
               loadFailNote() + absentTail +
               (ok ? '' : '. Bulk load failed, see console'));
    return;
  }
  gLoadFailures = plan.gaps.slice();
  setReadout(`loading ${tasks.length} trace${tasks.length===1?'':'s'}…`);
  // Throttle the fan-out so the single-threaded trace server stays responsive.
  const BATCH = 6;
  for (let i = 0; i < tasks.length; i += BATCH) {
    await Promise.all(tasks.slice(i, i + BATCH).map(t => loadOne(t.key, t.f, t.d)));
  }
  syncFileMarks();
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  setReadout(`${gTraces.length} trace${gTraces.length===1?'':'s'} loaded` +
             (capped ? `, capped at ${MAX_TRACES}; narrow the fiber range for more` : '') +
             loadFailNote() + absentTail);
}

// What the folders can serve of an asked-for load, from /api/list's fibre
// lists, before anything is fetched or cleared.  The click-through audit
// (2026-09-29, a 1152-fibre span): F999 cleared the chart and read "could not
// load F999 A: HTTP 404; F999 B: HTTP 404", and A + B with no B folder set
// read "could not load F1 B: not found; ... (+237 more)" for a load that was
// fine.
//   dirs    the directions to load.  A + B with one folder set is that side
//           alone, silently.
//   pairs   {f, d} to fetch: each fibre in each direction whose folder lists it.
//   absent  fibres no direction lists: said plainly, never fetched.
//   gaps    a fibre one folder lists and the other does not: a note for the
//           load readout, the way a failed file is.
// A folder whose list is empty (a server that sends none) is tried for every
// fibre, as before; so is everything when /api/list has not answered yet.
function planFiberLoad(fibers, addDir, info) {
  const asked = addDir === 'a' ? ['a'] : addDir === 'b' ? ['b'] : ['a', 'b'];
  if (!info) return { dirs: asked, pairs: fibers.flatMap(f => asked.map(d => ({ f, d }))),
                      absent: [], gaps: [], noFolder: false };
  const dirs = asked.filter(d => info['dir_' + d]);
  if (!dirs.length) return { dirs: asked, pairs: [], absent: fibers.slice(), gaps: [], noFolder: true };
  const lists = dirs.map(d => { const l = info['fibers_' + d]; return l && l.length ? new Set(l) : null; });
  const pairs = [], absent = [], gaps = [];
  for (const f of fibers) {
    const has = dirs.filter((d, i) => !lists[i] || lists[i].has(f));
    if (!has.length) { absent.push(f); continue; }
    for (const d of dirs) {
      if (has.includes(d)) pairs.push({ f, d });
      else gaps.push(`F${f} ${d.toUpperCase()}: not in the folder`);
    }
  }
  return { dirs, pairs, absent, gaps, noFolder: false };
}

// "F999 is not in the A/B folder"; "F998, F999 are not in the A folder".
function absentNote(plan) {
  const where = plan.dirs.map(d => d.toUpperCase()).join('/');
  if (plan.noFolder) return `no ${where} folder is set`;
  const a = plan.absent;
  return a.slice(0, 3).map(f => 'F' + f).join(', ') +
         (a.length > 3 ? ` (+${a.length - 3} more)` : '') +
         ` ${a.length === 1 ? 'is' : 'are'} not in the ${where} folder`;
}

// The plan, or null after saying why nothing will load.  Null leaves the
// chart, the Fibers box and the table exactly as they were.
function planOrSay(fibers, addDir) {
  const plan = planFiberLoad(fibers, addDir, gInfo);
  if (plan.pairs.length) return plan;
  setReadout(absentNote(plan));
  return null;
}

// The ", could not load F12 A: ..." tail of a load readout: the first three
// by name, then a count.  One copy for every load path.  The overview readout
// used to print none of it, so a bad file just left the count one short.
function loadFailNote() {
  if (!gLoadFailures.length) return '';
  return `, could not load ${gLoadFailures.slice(0, 3).join('; ')}` +
         (gLoadFailures.length > 3 ? ` (+${gLoadFailures.length - 3} more)` : '');
}

// Ctrl+A (Cmd+A on a Mac) with the focus off an input: select every file in
// the FILES list, the way it does in a Windows file list, and LOAD them —
// marking alone left the tech with a highlighted list and an empty chart, and
// the one thing "select all" is asked for is seeing the whole cable.  It goes
// through the same selectFiles a click does, so a selection past
// MAX_DETAIL_TRACES takes the bulk overview instead of stopping at 48.
// Without this the browser selected the page's text.
//
// gSelectedFiles is THE selection, FastReporter's single one: the rows a
// click, a key or a drag picked, painted at once, and once the load settles
// exactly the traces that are loaded (syncFileMarks).  The right-click menu
// acts on it, so a right-click Remove on a selected row removes them all.
const gSelectedFiles = new Set();     // "<dir>-<fiber>" keys
async function selectAllFiles() {
  const want = new Set(fileRowKeys());
  if (!want.size) { setReadout('no files loaded'); return; }
  setReadout(`${want.size} files selected, loading…`);
  await selectFiles(want);              // paints the marks, then loads
}
function clearFileSelection() {
  if (!gSelectedFiles.size) return;
  gSelectedFiles.clear();
  document.querySelectorAll('#files-list .file-row.selected').forEach(r => r.classList.remove('selected'));
}

// The two load regimes, shared by the Fibers box and the FILES panel: up to
// MAX_DETAIL_TRACES at full resolution, beyond that the bulk/decimated
// overview, up to MAX_OVERVIEW_FIBERS per direction.  These lived inside
// addFibers, so a FILES-panel selection was stuck on a flat 48 -- marking a
// whole cable in the list loaded 48 of it and said so in the readout, while
// typing the same fibers into the Fibers box loaded the lot.
const MAX_DETAIL_TRACES = 48;
const MAX_OVERVIEW_FIBERS = 1728;      // per direction, so A+B gets 3456

// Points per fiber requested in overview mode.  2000 is ~35 m per point on a
// 69.5 km span: enough to see a spike or an outlier trace, not enough to read
// a splice loss off the screen — which is what the detail regime is for.
const OVERVIEW_PTS = 2000;

// Whole-cable bulk load: ONE request, decimated server-side.  Chunked so the
// canvas fills in progressively instead of showing nothing for ~30 s while
// 1152 SOR files are parsed on first visit to a folder.
async function loadOverview(tasks) {
  const CHUNK = 144;                       // one ribbon-group per request
  let done = 0;
  // /api/traces serves ONE direction per request, and in A+B mode the task
  // list interleaves them — so group first and walk each direction's chunks.
  // Grouped rather than interleaved on purpose: the server is single-threaded,
  // so A's fibers arrive as a run and the canvas shows a coherent direction
  // early instead of a half-drawn X.
  const byDir = new Map();
  for (const t of tasks) {
    if (!byDir.has(t.d)) byDir.set(t.d, []);
    byDir.get(t.d).push(t);
  }
  for (const [dir, dirTasks] of byDir) {
  for (let i = 0; i < dirTasks.length; i += CHUNK) {
    const slice = dirTasks.slice(i, i + CHUNK);
    const spec = slice.map(t => t.f).join(',');
    try {
      const r = await fetch(`/api/traces?dir=${dir}&fibers=${spec}&maxpts=${OVERVIEW_PTS}`);
      if (!r.ok) { gLoadFailures.push(`bulk HTTP ${r.status}`); return false; }
      const payload = await r.json();
      for (const data of (payload.traces || [])) {
        const key = `${dir}-${data.fiber}`;
        if (gTraces.some(t => t.key === key) || gRemovedFiles.has(key)) continue;
        // The file's own direction stamp, as a detail load reads it (loadOne):
        // without it a file saved the other way was drawn as its folder past
        // 48 files and as itself below.
        if (data.stored_dir && data.stored_dir !== dir) gStoredDir[key] = data.stored_dir;
        else delete gStoredDir[key];
        const tr = {
          key, fiber: data.fiber, src: dir, dir: effDir(dir, data.fiber), visible: true,
          data, overview: true,
        };
        tr.color = traceColor(tr);
        gTraces.push(tr);
      }
      // `missing` holds every fiber that did not come back; `failed` is the
      // part whose file is there but would not parse.  Only the rest is
      // truly not found.  The direction letter matches loadOne's notes, and
      // tells F12 A from F12 B in an A+B load.
      const failed = new Map((payload.failed || []).map(x => [x.fiber, x.error]));
      const D = dir.toUpperCase();
      for (const f of (payload.missing || [])) {
        gLoadFailures.push(failed.has(f) ? `F${f} ${D}: unreadable (${failed.get(f)})`
                                         : `F${f} ${D}: not found`);
      }
    } catch (err) {
      console.warn('bulk load failed', err);
      gLoadFailures.push(String(err));
      return false;
    }
    done += slice.length;
    setReadout(`loading ${done}/${tasks.length} traces…`);
    // draw() early-returns on `!gView`, and gView is null on a cold page and
    // again after Clear All.  fit() -- the only thing that fills it -- runs in
    // addFibers() AFTER this loop returns, so every draw() below was a no-op:
    // the canvas stayed blank for the whole ~30 s load, which is the exact
    // thing the chunking above exists to prevent.  Re-fit as the traces land
    // instead.  `gAutoFit` is already false once the tech has zoomed or panned,
    // so this cannot yank a view out from under them mid-load.
    if (gAutoFit) { const b = dataBounds(); if (b) gView = b; }
    // Same shape, same cause: the chip strip printed the literal "no traces
    // loaded" beside a readout counting up to 1152.  Cheap to do per chunk --
    // the Files panel highlights each chunk's files as they arrive, which
    // doubles as a progress indicator.
    renderChips();
    // renderEventTable() stays OUT of the loop deliberately: it rebuilds every
    // one of ~10k rows, and eight passes would cost more than the redraw buys.
    // Yield so the progress text paints and the tab stays responsive.
    draw();
    await new Promise(res => setTimeout(res, 0));
  }
  }
  return true;
}

let gLoadFailures = [];            // per-addFibers() failure notes for the readout
// The traces being fetched right now.  A load plans what is missing and then
// awaits its fetches, so a second Add (a double-click, Enter then Add) used to
// plan the same keys again and push every trace twice: gTraces a-354, b-354,
// a-354, b-354, drawn twice, and listed twice in the Summary Report (
// demo list #33).  A key in here is never planned again, and neither loadOne
// nor loadOverview pushes a key that is already loaded, however loads overlap.
const gLoadingKeys = new Set();
// fetch() that retries a THROWN fetch (connection refused/reset: "Failed to
// fetch") a few times with a short backoff.  An HTTP error is an answer from
// the server, so it comes straight back and is never retried.
async function fetchRetry(url, tries = 3) {
  for (let i = 0; ; i++) {
    try {
      return await fetch(url);
    } catch (e) {
      if (i + 1 >= tries) throw e;
      await new Promise(res => setTimeout(res, 150 * (i + 1)));
    }
  }
}

async function loadOne(key, fiber, dir) {
  if (gLoadingKeys.has(key) || gTraces.some(t => t.key === key)) return;
  gLoadingKeys.add(key);
  try {
    const r = await fetchRetry(`/api/trace?dir=${dir}&fiber=${fiber}`);
    if (!r.ok) {
      console.warn('fail', key, r.status);
      gLoadFailures.push(`F${fiber} ${dir.toUpperCase()}: HTTP ${r.status}`);
      return;
    }
    const data = await r.json();
    if (data.error) {
      console.warn('err', key, data.error);
      gLoadFailures.push(`F${fiber} ${dir.toUpperCase()}: ${data.error}`);
      return;
    }
    if (data.stored_dir && data.stored_dir !== dir) gStoredDir[key] = data.stored_dir;
    else delete gStoredDir[key];
    if (gRemovedFiles.has(key)) return;    // taken out of the list meanwhile
    if (gTraces.some(t => t.key === key)) return;   // loaded meanwhile: never twice
    const t = { key, fiber, src: dir, dir: effDir(dir, fiber), visible: true, data };
    t.color = traceColor(t);
    gTraces.push(t);
  } catch (e) {
    console.warn(e);
    gLoadFailures.push(`F${fiber} ${dir.toUpperCase()}: ${e && e.message || 'fetch failed'}`);
  } finally {
    gLoadingKeys.delete(key);
  }
}

function removeTrace(key) {
  gTraces = gTraces.filter(t => t.key !== key);
  COLORS_USED.delete(key);
  syncFileMarks();
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
}

// "Remove from viewer" on a FILES row: out of the list and, if loaded, off
// the chart and grid.  removeTrace re-renders the list, which now skips it.
function removeFile(key, fiber) {
  const next = fileAfterRemove(fileRowKeys(), new Set([key]));
  gRemovedFiles.add(key);
  removeTrace(key);
  const msg = `F${fiber} removed from the viewer (reopen the Viewer to list it again)`;
  setReadout(msg);
  selectAfterRemove(next, msg);
  unloadEmptiedSides();
}

function removeSelectedFiles() {
  const keys = [...gSelectedFiles];
  const next = fileAfterRemove(fileRowKeys(), new Set(keys));
  gSelectedFiles.clear();
  keys.forEach(key => gRemovedFiles.add(key));
  gTraces = gTraces.filter(t => !gRemovedFiles.has(t.key));
  prunePick();
  keys.forEach(key => COLORS_USED.delete(key));
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  const msg = `${keys.length} file${keys.length === 1 ? '' : 's'} removed from the viewer`
    + ` (reopen the Viewer to list ${keys.length === 1 ? 'it' : 'them'} again)`;
  setReadout(msg);
  selectAfterRemove(next, msg);
  unloadEmptiedSides();
}

// FastReporter never leaves the list with nothing selected: after a Remove
// the file that slides into the removed spot is selected, or the last file
// when the removed ones were at the bottom.  Only when the Remove took the
// whole selection; removing a file outside it leaves the selection alone.
async function selectAfterRemove(next, msg) {
  if (!next || gSelectedFiles.size) return;
  gFileAnchor = gFileFocus = next;
  if (gFilesView === 'fibers') {         // the next fibre, both of its files
    gFiberAnchor = gFiberFocus = String(splitFileKey(next)[1]);
    selectFibers([gFiberFocus]);
    return;
  }
  await selectFiles(new Set([next]));
  setReadout(`${msg} · ${fileNameOf(next)} selected`);
}

function clearAll() {
  gSelNext = null;                   // a FILES selection still queued is dropped too
  gTraces = [];
  COLORS_USED.clear();
  clearFileSelection();
  gPickKey = null;                   // nothing left to point at
  gAutoFit = true;
  gView = null;
  gMarkers = { a: null, b: null };   // drop stale markers — they're meaningless
  gDragMarker = null;                // with no trace, and left set they fed the
                                     // null-gView crash on the next mouse-move.
  document.getElementById('fiber-input').value = '';
  renderChips();
  draw();
  renderEventTable();
  setReadout('');                    // not the last load's or view's words
}

// ─── Files panel (right side, the way FastReporter lists files) ───────
// renderChips keeps its name: it is the one choke point every add, remove,
// clear and visibility change routes through, which is exactly when the
// measured mirror frame can go stale.
function renderChips() {
  refreshMirrorFrame();
  renderFilesPanel();
  syncFiberBox();
}

// The Fibers box says what is loaded, however it got there: a FILES-panel
// click, a removal, a report jump.  It kept the last typed list, so after
// Clear All it still read "1-240" over an empty chart.  Left alone while the
// tech is typing in it.  The Dir buttons follow too: A, B or A + B by the
// folder each trace comes from (`src`), which is what Add loads from, not
// the direction it is drawn as after a Direction change.
function syncFiberBox() {
  const box = document.getElementById('fiber-input');
  if (document.activeElement === box) return;
  box.value = fiberRangeText(gTraces.map(t => t.fiber));
  if (!gTraces.length) return;
  const dirs = new Set(gTraces.map(t => t.src || t.dir));
  setAddDir(dirs.size === 1 ? [...dirs][0] : 'both');
}

// [1,2,3,4,7,9,10] -> "1-4, 7, 9, 10": a run of three or more is a range,
// the form parseFibers reads back.
function fiberRangeText(fibers) {
  const f = [...new Set(fibers)].sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < f.length; ) {
    let j = i;
    while (j + 1 < f.length && f[j + 1] === f[j] + 1) j++;
    if (j - i >= 2) out.push(`${f[i]}-${f[j]}`);
    else for (let k = i; k <= j; k++) out.push(String(f[k]));
    i = j + 1;
  }
  return out.join(', ');
}

// Every file in both folders, A then B, unless a header click sorted them.
// The selected files are loaded and drawn; a loaded file's dot (in the trace
// colour) toggles its visibility.  Hovering a row shows the whole file name,
// which the column cuts short.
function renderFilesPanel() {
  syncFiberBoxEnabled();
  const list = document.getElementById('files-list');
  if (!list) return;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Say what the NEXT drop will do.  A one-direction drop fills the empty
  // side (trace_server._single_drop_side), so the hint names it rather than
  // leaving the tech to find out by losing the folder they just dropped.
  const sayNextDrop = () => {
    const hint = document.getElementById('files-drop-hint');
    if (!hint) return;
    const gone = emptiedSides();
    const hasA = !!(gInfo && gInfo.dir_a) && !gone.includes('a');
    const hasB = !!(gInfo && gInfo.dir_b) && !gone.includes('b');
    hint.textContent =
      (hasA && hasB) ? 'both sides loaded, dropping a folder here starts a new span'
      : hasA ? 'drop the other direction here, A stays loaded'
      : hasB ? 'drop the other direction here, B stays loaded'
      : 'drop .sor / .json / .trc files, a folder, or a .zip here';
  };
  syncFilesTabs();
  if (gFilesView === 'fibers') { renderFibersView(list, esc); sayNextDrop(); return; }
  const loaded = new Map(gTraces.map(t => [t.key, t]));
  const cols = shownFileCols();
  const wantFacts = filesNeedFacts();
  const paired = wantFacts ? pairedFileKeys() : null;
  const rows = [];
  for (const dir of ['a', 'b']) {
    const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
    const files = (gInfo && gInfo['files_' + dir]) || [];
    fibers.forEach((f, i) => {
      if (gRemovedFiles.has(`${dir}-${f}`)) return;
      const t = loaded.get(`${dir}-${f}`);
      const eff = effDir(dir, f);
      const arrow = eff === 'a' ? 'A→B' : 'B→A';
      // P/F, wavelength and date, once the file's details are read.
      const tr = wantFacts ? fileTraits(`${dir}-${f}`, paired) : null;
      const acq = tr ? (gFileFacts.get(`${dir}-${f}`) || {}).acq : null;
      const cell = {
        pf: `<span class="file-pf${tr ? (tr.pf ? ' fpf-fail' : flagsOff() ? '' : ' fpf-pass') : ''}">`
          + `${tr ? pfMark(tr.pf) : ''}</span>`,
        name: `<span class="file-name">${esc(files[i] || 'F' + f)}</span>`,
        dir: `<span class="file-dir"${eff !== dir ? ' title="direction changed from the folder\'s"' : ''}>`
          + `${arrow}${eff !== dir ? '*' : ''}</span>`,
        fiber: `<span class="file-num">${f}</span>`,
        wl: `<span class="file-num">${tr && tr.wl ? tr.wl : ''}</span>`,
        date: `<span class="file-date"${acq ? ` title="shot ${new Date(acq * 1000).toLocaleString()}"` : ''}>`
          + `${tr && tr.day ? tr.day : ''}</span>`,
      };
      rows.push({
        order: rows.length, name: files[i] || '', eff, fiber: f, tr, acq,
        html: `<div class="file-row${t ? ' loaded' : ''}${t && !t.visible ? ' faded' : ''}`
          + `${gSelectedFiles.has(`${dir}-${f}`) ? ' selected' : ''}`
          + `${gFileFocus === `${dir}-${f}` ? ' focus' : ''}" `
          + `data-dir="${dir}" data-fiber="${f}" data-name="${esc(files[i] || '')}" title="${esc(files[i] || 'F' + f)}">`
          + `<span class="file-vis"${t ? ` style="color:${t.color};text-shadow:0 0 1px #333" title="show / hide"` : ''}>`
          + `${t ? (t.visible ? '●' : '○') : ''}</span>`
          + cols.map(([c]) => cell[c]).join('') + '</div>',
      });
    });
  }
  if (gFileSort) rows.sort(fileRowCompare(gFileSort));
  renderFilesHeader(cols);
  list.innerHTML = rows.length ? rows.map(r => r.html).join('')
    : '<span id="chip-empty">no folders loaded</span>';
  // FastReporter's status bar: "Selected files: n/N".
  document.getElementById('files-count').textContent =
    (rows.length ? `${gSelectedFiles.size} of ${rows.length} selected` : '')
    + (gFactsNote && rows.length ? ` · ${gFactsNote}` : '');
  sayNextDrop();
  if (wantFacts && rows.length) ensureFileFacts();
}

// ─── FILES columns and sorting, as in FastReporter's Files tab ────────
// Right-click the header row for the columns, with Restore Default; click a
// header to sort by it, again to reverse.  FR has no unsorted state either;
// Restore Default puts the Viewer's own order back (A then B, by fiber).
// Ties keep that order, where FR scrambles them.  File Name always shows.
// P/F, λ and Date need every file's header and events, so they are off
// until asked for, and then read in the background (ensureFileFacts) while
// the header counts them in.
const FILE_COLS = [
  // [key, header, width, header tooltip]
  // Narrow enough that all six fit the panel's 300 px; the name gives way
  // first and says itself in full on hover.
  ['pf', 'P/F', '30px', 'each file at the gates of the table row it lands in'],
  ['name', 'File Name', 'minmax(40px, 1fr)', ''],
  ['dir', 'Dir.', '34px', ''],
  ['fiber', 'Fiber', '30px', ''],
  ['wl', 'λ (nm)', '38px', ''],
  ['date', 'Date', '64px', 'the day the trace was shot, not the file date'],
];
const FILE_COLS_DEFAULT = ['dir'];
let gFileCols = new Set(FILE_COLS_DEFAULT);   // File Name shows whatever this says
let gFileSort = null;                          // { col, desc }, or null: A then B, by fiber
try {
  const v = JSON.parse(localStorage.getItem('otdr_viewer_files_view') || 'null');
  if (v && Array.isArray(v.cols)) gFileCols = new Set(v.cols.filter(c => FILE_COLS.some(x => x[0] === c)));
  if (v && v.sort && FILE_COLS.some(x => x[0] === v.sort.col)) gFileSort = { col: v.sort.col, desc: !!v.sort.desc };
} catch (e) { /* first visit, or storage off */ }
function saveFilesView() {
  try {
    localStorage.setItem('otdr_viewer_files_view',
                         JSON.stringify({ cols: [...gFileCols], sort: gFileSort }));
  } catch (e) {}
}
function shownFileCols() {
  return FILE_COLS.filter(([c]) => c === 'name' || gFileCols.has(c));
}
const FACT_COLS = ['pf', 'wl', 'date'];
function filesNeedFacts() {
  return FACT_COLS.some(c => gFileCols.has(c)) || !!(gFileSort && FACT_COLS.includes(gFileSort.col));
}

// What a row sorts on; null for a file not read yet, which sorts last
// whichever way the column runs.
function fileSortValue(r, col) {
  switch (col) {
    case 'name': return r.name.toLowerCase();
    case 'dir': return r.eff;
    case 'fiber': return r.fiber;
    case 'pf': return r.tr ? (r.tr.pf ? 1 : 0) : null;
    case 'wl': return r.tr && r.tr.wl ? r.tr.wl : null;
    case 'date': return r.acq || null;
    default: return null;
  }
}
function fileRowCompare(sort) {
  return (x, y) => {
    const a = fileSortValue(x, sort.col), b = fileSortValue(y, sort.col);
    if (a == null || b == null) return ((a == null) - (b == null)) || (x.order - y.order);
    const c = typeof a === 'string' ? a.localeCompare(b, undefined, { numeric: true }) : a - b;
    return (sort.desc ? -c : c) || (x.order - y.order);
  };
}

function renderFilesHeader(cols) {
  const hd = document.getElementById('files-cols');
  if (!hd) return;
  hd.classList.remove('fibers');
  document.getElementById('files-panel').style.setProperty(
    '--files-grid', ['18px', ...cols.map(c => c[2])].join(' '));
  hd.innerHTML = '<span></span>' + cols.map(([c, label, , tip]) => {
    const on = gFileSort && gFileSort.col === c;
    return `<span data-col="${c}"${on ? ' class="sorted"' : ''}`
         + ` title="${tip ? tip + '. ' : ''}click to sort, right-click for columns">`
         + `${label}${on ? (gFileSort.desc ? ' ▼' : ' ▲') : ''}</span>`;
  }).join('');
}
document.getElementById('files-cols').addEventListener('click', (ev) => {
  const h = ev.target.closest('[data-col]');
  if (!h) return;
  const c = h.dataset.col;
  gFileSort = gFileSort && gFileSort.col === c ? { col: c, desc: !gFileSort.desc } : { col: c, desc: false };
  saveFilesView();
  renderFilesPanel();

document.getElementById('files-cols').addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  if (gFilesView === 'fibers') return;       // the Fibers tab's columns are fixed
  showFilesColsMenu(ev.clientX, ev.clientY);
});
// FR's column list: a tick per column that can go, then Restore Default.
function showFilesColsMenu(x, y) {
  closeSpanMenu();
  const m = document.createElement('div');
  m.id = 'span-menu';

    + '<button data-reset="1">Restore Default</button>';

// The P/F, λ and Date columns read every file's details once, in the
// background, a ribbon's worth per request; the header counts them in and
// the rows fill as they arrive.  A file that could not be read is not asked
// for again until its name changes.
let gFactsNote = '';
let gFactsLoading = null;
const gFactsTried = new Set();       // "<key>|<file name>" the server could not read
let gFactsRetryAt = 0;               // after a failed request, wait before asking again
function ensureFileFacts(now) {
  if (gFactsLoading) return gFactsLoading;
  if (!now && Date.now() < gFactsRetryAt) return Promise.resolve(false);
  const keys = fileRowKeys().filter(k => {
    const name = fileNameOf(k);
    const f = gFileFacts.get(k);
    return (!f || f.name !== name) && !gFactsTried.has(`${k}|${name}`);
  });
  if (!keys.length) return Promise.resolve(true);
  gFactsLoading = (async () => {
    try {
      return await loadFileFacts(keys, (done, total) => {
        gFactsNote = `reading ${done} of ${total}`;
        renderFilesPanel();
      });
    } finally {
      gFactsLoading = null;
      gFactsNote = '';
      renderFilesPanel();
    }
  })();
  return gFactsLoading;
}

// ─── Fibers: FR's Identifiers and Matched Files, one row per fibre ─────
// FastReporter's panel also lists the files by fibre (its Identifiers tree:
// click a fibre and both directions are selected) and shows what it paired
// with what (its Matched Files tab).  The Viewer's Fibers tab is both in one
// list: a row per fibre, its A→B and B→A files side by side, and whether
// the two make the pair the table's Average row needs, and if not, why:
//   A only / B only        the other direction has no file
//   both A→B / both B→A    both files are drawn as one direction (a file's
//                          own stamp or a Direction change), so no pair
//   2 A files              two files of one fibre on a side (two
//                          wavelengths), which the Viewer cannot tell apart
// Clicks work as in Files, a fibre at a time: click, Shift+click,
// Ctrl/Cmd+click and the arrow keys select the fibre's files, and a
// right-click opens the file menu on them.
let gFilesView = 'files';            // 'files' | 'fibers'
try { if (localStorage.getItem('otdr_viewer_files_tab') === 'fibers') gFilesView = 'fibers'; } catch (e) {}
let gFiberAnchor = null;             // as gFileAnchor / gFileFocus, a fibre at a time
let gFiberFocus = null;

function syncFilesTabs() {
  document.querySelectorAll('#files-tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === gFilesView));
  const h = document.querySelector('#files-hd h2');
  if (h) h.textContent = gFilesView === 'fibers' ? 'Fibers' : 'Files';
}
document.getElementById('files-tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-view]');
  if (!b || b.dataset.view === gFilesView) return;
  gFilesView = b.dataset.view;
  try { localStorage.setItem('otdr_viewer_files_tab', gFilesView); } catch (e) {}
  renderFilesPanel();
});

// Every fibre in the two folders as { fiber, a: [names], b: [names] }, in
// fibre order, removed files left out.
function fiberTable() {
  const by = new Map();
  for (const dir of ['a', 'b']) {
    const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
    const files = (gInfo && gInfo['files_' + dir]) || [];
    fibers.forEach((f, i) => {
      if (gRemovedFiles.has(`${dir}-${f}`)) return;
      if (!by.has(f)) by.set(f, { fiber: f, a: [], b: [] });
      by.get(f)[dir].push(files[i] || `F${f}`);
    });
  }
  return [...by.values()].sort((x, y) => x.fiber - y.fiber);
}
// Whether a fibre's files make a pair, and if not, why.  The Viewer pairs on
// the fibre number and the direction each file is drawn as.
function fiberPairNote(r, dirOf) {
  if (r.a.length > 1) return { ok: false, text: `${r.a.length} A files` };
  if (r.b.length > 1) return { ok: false, text: `${r.b.length} B files` };
  if (!r.a.length) return { ok: false, text: 'B only' };
  if (!r.b.length) return { ok: false, text: 'A only' };
  const da = dirOf('a', r.fiber), db = dirOf('b', r.fiber);
  if (da === db) return { ok: false, text: da === 'a' ? 'both A→B' : 'both B→A' };
  return { ok: true, text: '✓' };
}
function fiberFileKeys(r) {
  return [...(r.a.length ? [`a-${r.fiber}`] : []), ...(r.b.length ? [`b-${r.fiber}`] : [])];
}
// 'selected' when every file of the fibre is, 'partial' when some are.
function fiberState(r) {
  const ks = fiberFileKeys(r), n = ks.filter(k => gSelectedFiles.has(k)).length;
  return n && n === ks.length ? 'selected' : n ? 'partial' : '';
}

function renderFibersView(list, esc) {
  const rows = fiberTable();
  const loaded = new Map(gTraces.map(t => [t.key, t]));
  const hd = document.getElementById('files-cols');
  hd.classList.add('fibers');
  hd.innerHTML = '<span></span><span>Fiber</span><span>A→B</span><span>B→A</span>'
               + '<span title="whether the two files make the pair the table averages">Pair</span>';
  const WHY = { 'A only': 'no B→A file for this fibre', 'B only': 'no A→B file for this fibre' };
  list.innerHTML = rows.length ? rows.map(r => {
    const t = loaded.get(`a-${r.fiber}`) || loaded.get(`b-${r.fiber}`);
    const pair = fiberPairNote(r, effDir);
    const why = WHY[pair.text] || (pair.ok ? 'A→B and B→A: the table averages them'
                                           : 'these files do not make a pair');
    return `<div class="fiber-row ${fiberState(r)}${gFiberFocus === String(r.fiber) ? ' focus' : ''}"`
      + ` data-fkey="${r.fiber}">`
      + `<span class="file-vis"${t ? ` style="color:${t.color};text-shadow:0 0 1px #333"` : ''}>${t ? '●' : ''}</span>`
      + `<span class="file-num">${r.fiber}</span>`
      + `<span title="${esc(r.a.join(', '))}">${esc(r.a.join(', ') || '-')}</span>`
      + `<span title="${esc(r.b.join(', '))}">${esc(r.b.join(', ') || '-')}</span>`
      + `<span class="fib-pair${pair.ok ? '' : ' bad'}" title="${why}">${pair.text}</span></div>`;
  }).join('') : '<span id="chip-empty">no folders loaded</span>';
  const full = rows.filter(r => fiberState(r) === 'selected').length;
  document.getElementById('files-count').textContent =
    rows.length ? `${full} of ${rows.length} fibers selected` : '';
}

// Select these fibres' files, in place of the selection.
function selectFibers(fkeys) {
  const byKey = new Map(fiberTable().map(r => [String(r.fiber), r]));
  const want = new Set();
  for (const k of fkeys) {
    const r = byKey.get(String(k));
    if (r) fiberFileKeys(r).forEach(x => want.add(x));
  }
  if (want.size) selectFiles(want);
}
// ─── FILES selection, the way FastReporter does it ────────────────────
// FR3 was driven click by click (2026-09-30) and these are its rules:
//   click                   select just this file
//   click on a file that is already one of several selected
//                           nothing: the selection stays, so a drag or a
//                           right-click that starts there keeps the set
//   Shift+click             the files from the anchor to this one, in screen
//                           order, in place of the selection
//   Ctrl+click              add or remove this one file (Cmd on a Mac), but
//                           never the last one
//   Ctrl+Shift+click        the range added to the selection (Explorer's rule;
//                           FR adds the one file, which is the less useful)
//   drag from a file outside the selection    the files swept
//   right-click a file outside the selection  select it first, then the menu
//   Down / Up               move the selection a row; with Shift, the range
//   Home / End              the first / last file
// FR never has nothing selected, so none of these can empty it.  The
// selection is what is loaded and drawn, and the chart and table follow it.
let gFileAnchor = null;              // where a Shift range starts
let gFileFocus = null;               // the row the arrow keys move from

// Every row in screen order, as "<dir>-<fiber>" keys.
function fileRowKeys() {
  // The Fibers tab lists fibres, not files: its files are each fibre's A
  // then B, in fibre order, so Ctrl+A, Select Same and a Remove still see
  // every file from there.
  if (gFilesView === 'fibers') return fiberTable().flatMap(fiberFileKeys);
  // Two files of one fibre on a side (two wavelengths) share a key, and the
  // keys would stop on the second copy of it, so each key is listed once.
  return [...new Set([...document.querySelectorAll('#files-list .file-row')]
    .map(r => `${r.dataset.dir}-${r.dataset.fiber}`))];
}
function fileRowEl(key) {
  const [d, f] = splitFileKey(key);
  return document.querySelector(`#files-list .file-row[data-dir="${d}"][data-fiber="${f}"]`);
}
// A file's name from the listing, whichever tab is showing.
function fileNameOf(key) {
  const [d, f] = splitFileKey(key);
  const fibers = (gInfo && gInfo['fibers_' + d]) || [], files = (gInfo && gInfo['files_' + d]) || [];
  const i = fibers.indexOf(f);
  return (i >= 0 && files[i]) || `F${f}`;
}
const sameKeys = (a, b) => a.size === b.size && [...a].every(k => b.has(k));

// The rows from `a` to `b`, both included, whichever comes first.  A start
// that has left the list (removed, renamed) leaves just `b`.
function fileRange(keys, a, b) {
  const i = keys.indexOf(a), j = keys.indexOf(b);
  if (j < 0) return [];
  if (i < 0) return [b];
  return keys.slice(Math.min(i, j), Math.max(i, j) + 1);
}

// What a click does, worked out on plain lists so the rules read (and test)
// apart from the page.  `keys` is every row in screen order and `sel` the
// selection now.  Returns { want, anchor, focus }, where a null `want` keeps
// the selection as it is; null for a click that changes nothing at all.
function fileClickSelection(keys, sel, anchor, key, shift, ctrl) {
  if (shift && anchor) {
    const want = new Set(fileRange(keys, anchor, key));
    if (ctrl) sel.forEach(k => want.add(k));
    return { want, anchor, focus: key };
  }
  if (ctrl) {
    const want = new Set(sel);
    if (want.has(key)) {
      if (want.size === 1) return null;          // never the last one
      want.delete(key);
    } else {
      want.add(key);
    }
    return { want, anchor: key, focus: key };
  }
  if (sel.has(key) && sel.size > 1) return { want: null, anchor: key, focus: key };
  return { want: new Set([key]), anchor: key, focus: key };
}

// The keys.  Down / Up move a single selection one row; Shift+Down /
// Shift+Up grow or shrink the range from the anchor; Home / End go to the
// first / last row.  From nowhere, Down starts at the top and Up at the bottom.
function fileKeySelection(keys, anchor, focus, key, shift) {
  if (!keys.length) return null;
  const last = keys.length - 1;
  let i = keys.indexOf(focus);
  if (i < 0) i = keys.indexOf(anchor);
  const j = key === 'ArrowDown' ? (i < 0 ? 0 : Math.min(last, i + 1))
          : key === 'ArrowUp'   ? (i < 0 ? last : Math.max(0, i - 1))
          : key === 'Home'      ? 0 : last;
  if (!shift) return { want: new Set([keys[j]]), anchor: keys[j], focus: keys[j] };
  const a = keys.includes(anchor) ? anchor : keys[i < 0 ? j : i];
  return { want: new Set(fileRange(keys, a, keys[j])), anchor: a, focus: keys[j] };
}

// After a Remove: the row that slides into the first removed spot, or the
// last one left when the removed rows were at the bottom; null if none is.
function fileAfterRemove(keys, removed) {
  const first = keys.findIndex(k => removed.has(k));
  const rest = keys.filter(k => !removed.has(k));
  if (first < 0 || !rest.length) return null;
  return rest[Math.min(first, rest.length - 1)];
}

// One selection load at a time.  A click, key or drag while a load is still
// running paints its rows at once and loads when that load ends, and only the
// newest one does, so holding Down does not queue a load for every row it
// passed (and a fast double-click cannot load one file twice).
let gSelLoading = false;
let gSelNext = null;                 // the newest selection still to load
async function selectFiles(want) {
  markFiles(want);
  gSelNext = want;
  if (gSelLoading) return;
  gSelLoading = true;
  try {
    while (gSelNext) {
      const w = gSelNext;
      gSelNext = null;
      try {
        await applyFileSelection(w);
      } catch (e) {                    // one bad load must not stop the next
        reportJsError((e && e.message) || String(e), e && e.stack);
      }
    }
  } finally {
    gSelLoading = false;
  }
}

// Once a load settles, the selection is exactly what is loaded: a file the
// cap cut off, or one that would not load, is not left highlighted, and a
// trace the Fibers box or a report jump loaded is selected like any other.
// A newer selection still waiting to load keeps its own marks.
function syncFileMarks() {
  prunePick();
  if (gSelNext) return;
  gSelectedFiles.clear();
  for (const t of gTraces) gSelectedFiles.add(t.key);
  syncFiberBox();
}

const filesList = document.getElementById('files-list');

// A press on a row gives the list the keys.  A plain press on a file outside
// the selection may turn into a drag, which selects the rows swept: marked as
// the pointer moves, loaded on release.  A drag from a selected file does
// nothing, as in FR.
let gFileDrag = null;                // { from, to, moved, y } while the button is down
let gFileDragClick = false;          // the click a real drag ends with is not a click
let gFileDragTimer = null;
filesList.addEventListener('mousedown', (ev) => {
  gFileDragClick = false;
  const row = ev.target.closest('.file-row');
  if (!row) return;
  filesList.focus({ preventScroll: true });
  if (ev.shiftKey) ev.preventDefault();  // no text selection
  if (ev.button !== 0 || ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.target.closest('.file-vis')) return;          // the dot shows and hides
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (gSelectedFiles.has(key)) return;
  gFileDrag = { from: key, to: key, moved: false, y: ev.clientY };
});
document.addEventListener('mousemove', (ev) => {
  if (!gFileDrag) return;
  if (!(ev.buttons & 1)) { endFileDrag(); return; }    // let go outside the page
  gFileDrag.y = ev.clientY;
  fileDragTo(ev.clientY);
  fileDragScroll();
});
document.addEventListener('mouseup', () => { if (gFileDrag) endFileDrag(); });

function fileDragTo(clientY) {
  const r = filesList.getBoundingClientRect();
  const y = Math.max(r.top + 2, Math.min(r.bottom - 2, clientY));
  const el = document.elementFromPoint(r.left + Math.min(40, r.width / 2), y);
  const row = el && el.closest ? el.closest('.file-row') : null;
  if (!row) return;
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (key === gFileDrag.to) return;
  gFileDrag.to = key;
  gFileDrag.moved = true;
  markFiles(new Set(fileRange(fileRowKeys(), gFileDrag.from, key)));
}
// Held past the top or bottom of the list, the list scrolls and the range
// follows the edge row.
function fileDragScroll() {
  const past = () => {
    const r = filesList.getBoundingClientRect();
    return !gFileDrag ? 0 : gFileDrag.y < r.top ? gFileDrag.y - r.top
         : gFileDrag.y > r.bottom ? gFileDrag.y - r.bottom : 0;
  };
  if (!past()) { clearInterval(gFileDragTimer); gFileDragTimer = null; return; }
  if (gFileDragTimer) return;
  gFileDragTimer = setInterval(() => {
    const d = past();
    if (!d) { clearInterval(gFileDragTimer); gFileDragTimer = null; return; }
    filesList.scrollTop += Math.max(-40, Math.min(40, d));
    fileDragTo(gFileDrag.y);
  }, 40);
}
function endFileDrag() {
  const d = gFileDrag;
  gFileDrag = null;
  clearInterval(gFileDragTimer);
  gFileDragTimer = null;
  if (!d || !d.moved) return;        // a plain click: the click handler has it
  gFileDragClick = true;
  gFileAnchor = d.from;
  gFileFocus = d.to;
  selectFiles(new Set(fileRange(fileRowKeys(), d.from, d.to)));
}

filesList.addEventListener('keydown', (ev) => {
  if (gFilesView === 'fibers') return;           // the Fibers tab has its own keys
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const s = fileKeySelection(fileRowKeys(), gFileAnchor, gFileFocus, ev.key, ev.shiftKey);
  if (!s) return;
  ev.preventDefault();               // the list does not scroll on its own
  gFileAnchor = s.anchor;
  gFileFocus = s.focus;
  selectFiles(s.want);
  const el = fileRowEl(s.focus);
  if (el) el.scrollIntoView({ block: 'nearest' });
});

// On a Mac, Control+click IS the right-click, so it opens the menu; Cmd+click
// adds or removes a file there.  On Windows a Ctrl+right-click still toggles.
// A right-click on a file outside the selection selects that file first, as
// FR does, so the highlight and the menu agree on what the menu acts on.
const IS_MAC = /Mac/i.test(navigator.platform || navigator.userAgent);
document.getElementById('files-list').addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.file-row');
  if (!row) return;
  ev.preventDefault();
  if (ev.ctrlKey && !IS_MAC) { onFileClick(ev); return; }
  selectForMenu(row);
  showFileDirMenu(ev.clientX, ev.clientY, row.dataset.dir, +row.dataset.fiber, row.dataset.name);
});
function selectForMenu(row) {
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (gSelectedFiles.has(key)) return;           // the menu takes the whole selection
  gFileAnchor = gFileFocus = key;
  selectFiles(new Set([key]));                   // not awaited: the menu opens now
}

// The Fibers tab's clicks, keys and right-click (see renderFibersView).
// Here, after the Files handlers, so each finds its own rows first.
// A click on a fibre: the Files rules (fileClickSelection), a fibre at a
// time.  A fibre only partly selected counts as not selected.
filesList.addEventListener('click', (ev) => {
  const row = ev.target.closest('.fiber-row');
  if (!row) return;
  const table = fiberTable();
  const keys = table.map(r => String(r.fiber));
  const sel = new Set(table.filter(r => fiberState(r) === 'selected').map(r => String(r.fiber)));
  const s = fileClickSelection(keys, sel, gFiberAnchor, row.dataset.fkey,
                               ev.shiftKey, ev.ctrlKey || ev.metaKey);
  if (!s) return;
  gFiberAnchor = s.anchor;
  gFiberFocus = s.focus;
  if (!s.want || sameKeys(s.want, sel)) { renderFilesPanel(); return; }
  selectFibers(s.want);
});
filesList.addEventListener('keydown', (ev) => {
  if (gFilesView !== 'fibers') return;
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const keys = fiberTable().map(r => String(r.fiber));
  const s = fileKeySelection(keys, gFiberAnchor, gFiberFocus, ev.key, ev.shiftKey);
  if (!s) return;
  ev.preventDefault();
  gFiberAnchor = s.anchor;
  gFiberFocus = s.focus;
  selectFibers(s.want);
  const el = document.querySelector(`#files-list .fiber-row[data-fkey="${s.focus}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
});
// A right-click on a fibre outside the selection selects it first, then the
// file menu opens on the selection, named for the fibre's first file.
filesList.addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.fiber-row');
  if (!row) return;
  ev.preventDefault();
  const r = fiberTable().find(x => String(x.fiber) === row.dataset.fkey);
  if (!r) return;
  if (fiberState(r) !== 'selected') {
    gFiberAnchor = gFiberFocus = String(r.fiber);
    selectFibers([String(r.fiber)]);
  }
  const dir = r.a.length ? 'a' : 'b';
  showFileDirMenu(ev.clientX, ev.clientY, dir, r.fiber, (dir === 'a' ? r.a : r.b)[0] || '');
});

// The (side, fiber) a files-panel key stands for: 'a-12' -> ['a', 12].
function splitFileKey(key) {
  const i = key.indexOf('-');
  return [key.slice(0, i), +key.slice(i + 1)];
}

// ─── Select Same …: FastReporter's selection tools ────────────────────
// FR's Measurements menu (driven 2026-09-30) selects every file that shares
// one property with the selection: Select Same Pass/Fail Status, Identifiers,
// Type and Date, and Multiple Option Selection, which takes any of them
// together against the right-clicked file.  Here they sit in the FILES menu,
// named for what the Viewer calls the same things:
//   Select Same Pass/Fail Status   every file with the same verdict (fileFails)
//   Select Same Fiber              FR's Identifiers: both directions of the
//                                  selected fibers (FR takes one fiber at a
//                                  time; this takes every fiber selected)
//   Select Same Wavelength         FR's Type: 1310, 1550, 1625 ...
//   Select Same Day                FR's Date: the day the trace was SHOT, in
//                                  local time, not the file's date on disk
//   Select By…                     any of the four at once, all to match
// Each REPLACES the selection, and each is greyed, as in FR, while the
// selected files differ on its property.  The whole list's wavelengths, days
// and events come from the files themselves (/api/traces?facts=1), read once
// and kept; a loaded trace already carries its own.
const gFileFacts = new Map();        // "<dir>-<fiber>" -> { name, wl, acq, events }
const SAME_NAMES = { pf: 'Pass/Fail Status', fiber: 'Fiber', wl: 'Wavelength', day: 'Day' };

// A side's files changed under the page (a new drop, a rename): what was read
// about them no longer holds.  Keyed on the fibre, so a new span with the
// same names would otherwise inherit the last one's verdicts and dates.
function forgetFileFacts(dir) {
  for (const k of [...gFileFacts.keys()]) if (k.startsWith(dir + '-')) gFileFacts.delete(k);
  for (const k of [...gFactsTried]) if (k.startsWith(dir + '-')) gFactsTried.delete(k);
}
function factsOf(data) {
  return { name: data.filename || '', wl: data.wavelength_nm || null,
           acq: data.acq_time || null, events: data.events || [] };
}
// "2026-09-13": the day a trace was shot, in the viewer's own time zone, the
// way FR shows its date.
function fileDay(acq) {
  if (!acq) return null;
  const d = new Date(acq * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
       + `-${String(d.getDate()).padStart(2, '0')}`;
}
// A file's own verdict, FR's per-measurement P/F, by the gates of the table
// row the file lands in.  A file whose fibre has its other direction too
// (`paired`) sits on an A→B or B→A row of the two-direction table: a splice
// at the single-direction gate, a connector at the one-direction connector
// gate, a reflection at the report's mid-span reflectance rule.  A file with
// no partner sits in the one-direction table, which grades every loss at the
// gate the report grades that view by (activeGateDb: the Uni report's, the
// loss box's override ...).  Neither judges the launch level or the far end
// here, and the report's own flags (a break, an end connector) need the
// report, so a file's row can still carry one this does not.
function fileFails(events, dir, paired) {
  if (flagsOff()) return false;
  if (!paired) {
    return events.some(e => e.time_of_travel !== 0 && !e.is_end && clearsGate(e.splice_loss));
  }
  const own = Number(gInfo && (dir === 'a' ? gInfo.launch_a_km : gInfo.launch_b_km)) || 0;
  const far = Number(gInfo && (dir === 'a' ? gInfo.launch_b_km : gInfo.launch_a_km)) || 0;
  const end = events.find(e => e.is_end);
  const eof = end ? end.dist_km - own - far : null;
  return events.some(e => {
    if (e.time_of_travel === 0 || e.is_end) return false;
    if (clearsAt(e.splice_loss, gateFor(!!e.is_reflective, true))) return true;
    return !!e.is_reflective && reflFails(e.reflection, e.dist_km - own, eof);
  });
}
// What Select Same compares for one row, or null for a file not read yet.
// `paired`: the files whose fibre makes a pair (pairedFileKeys), worked out
// once per pass over the list rather than once per file.
function fileTraits(key, paired) {
  const f = gFileFacts.get(key);
  if (!f) return null;
  paired = paired || pairedFileKeys();
  const [dir, fiber] = splitFileKey(key);
  return { fiber, wl: f.wl, day: fileDay(f.acq), pf: fileFails(f.events, dir, paired.has(key)) };
}
// Every file whose fibre has both directions, drawn as opposite ones: the
// files that sit on a two-direction table's A→B or B→A row.
function pairedFileKeys() {
  const out = new Set();
  for (const r of fiberTable()) {
    if (fiberPairNote(r, effDir).ok) fiberFileKeys(r).forEach(k => out.add(k));
  }
  return out;
}
// The rows that match `ref` on every one of `kinds` ('pf', 'fiber', 'wl',
// 'day').  A row not read, or with nothing recorded for a property, never
// matches on it.
function fileSameKeys(keys, traits, ref, kinds) {
  return keys.filter(k => {
    const t = traits(k);
    return !!t && kinds.every(p => t[p] != null && t[p] === ref[p]);
  });
}
// Do the files agree on `p`?  Only the ones read so far can say; a file
// still loading does not stop the item.
function filesAgreeOn(keys, p) {
  const paired = pairedFileKeys();
  const seen = new Set(keys.map(k => fileTraits(k, paired)).filter(Boolean).map(t => t[p]));
  return seen.size <= 1 && !seen.has(null);
}

// Read what the list does not know yet, a ribbon's worth of files per
// request and one direction at a time.  Loaded traces already carry theirs.
// A row whose file name changed since (a rename, a new drop) is read again.
// `onProgress(done, total)` hears after each request.
async function loadFileFacts(keys, onProgress) {
  for (const t of gTraces) gFileFacts.set(t.key, factsOf(t.data));
  const need = keys.filter(k => {
    const f = gFileFacts.get(k);
    return !f || f.name !== fileNameOf(k);
  });
  const byDir = { a: [], b: [] };
  need.forEach(k => { const [d, f] = splitFileKey(k); byDir[d].push(f); });
  let done = 0, ok = true;
  for (const d of ['a', 'b']) {
    for (let i = 0; i < byDir[d].length; i += 144) {
      const part = byDir[d].slice(i, i + 144);
      try {
        const r = await fetchRetry(`/api/traces?dir=${d}&fibers=${part.join(',')}&maxpts=200&facts=1`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        for (const t of (j.traces || [])) gFileFacts.set(`${d}-${t.fiber}`, factsOf(t));
        // A file the server could not read is not asked for again until its
        // name changes; a request that failed outright is (see gFactsRetryAt).
        for (const f of (j.missing || [])) gFactsTried.add(`${d}-${f}|${fileNameOf(`${d}-${f}`)}`);
      } catch (e) {
        setReadout(`could not read the files' details: ${(e && e.message) || e}`);
        gFactsRetryAt = Date.now() + 10000;
        ok = false;                      // carry on: the rest may still come
      }
      done += part.length;
      if (onProgress) onProgress(done, need.length);
    }
  }
  return ok;
}

// Select Same Fiber takes the whole selection's fibers; the rest compare
// every row with the right-clicked file.
async function selectSame(kinds, refKey) {
  const keys = fileRowKeys();
  let want;
  if (kinds.length === 1 && kinds[0] === 'fiber') {
    const fibers = new Set([...gSelectedFiles, refKey].map(k => splitFileKey(k)[1]));
    want = keys.filter(k => fibers.has(splitFileKey(k)[1]));
  } else {
    // The read already in flight first, then whatever it did not cover: one
    // read at a time, so the columns and this never ask for the list twice.
    if (gFactsLoading) await gFactsLoading;
    await ensureFileFacts(true);
    const paired = pairedFileKeys();
    const ref = fileTraits(refKey, paired);
    if (!ref) { setReadout(`could not read ${fileNameOf(refKey)}`); return; }
    want = fileSameKeys(keys, k => fileTraits(k, paired), ref, kinds);
  }
  if (!want.length) return;
  gFileAnchor = gFileFocus = refKey;
  await selectFiles(new Set(want));
  const el = fileRowEl(refKey);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// FR's Multiple Option Selection: tick any of the four, and every file that
// matches the right-clicked one on all of them is selected.  The ticks are
// remembered, as FR remembers them.
function showSelectByDialog(refKey) {
  closeSelectByDialog();
  let ticked;
  try { ticked = JSON.parse(localStorage.getItem('otdr_viewer_select_by') || 'null'); } catch (e) { ticked = null; }
  if (!Array.isArray(ticked)) ticked = ['pf'];
  const bg = document.createElement('div'); bg.id = 'sel-dlg-bg';
  const d = document.createElement('div'); d.id = 'sel-dlg';
  d.innerHTML = `<h3>Select By</h3>`
    + `<div class="sub">Select the files that match ${fileNameOf(refKey).replace(/&/g, '&amp;').replace(/</g, '&lt;')} on every item ticked.</div>`
    + ['pf', 'fiber', 'wl', 'day'].map(p => {
        // Nothing is graded while the Settings box is down: every file would
        // "match" on Pass/Fail and the whole cable would load.
        const off = p === 'pf' && flagsOff();
        return `<label${off ? ' title="the Settings box did not load, so nothing is graded" style="opacity:.45"' : ''}>`
             + `<input type="checkbox" data-p="${p}"${ticked.includes(p) && !off ? ' checked' : ''}${off ? ' disabled' : ''}>`
             + ` ${SAME_NAMES[p]}</label>`;
      }).join('')
    + `<div class="btns"><button data-cancel="1">Cancel</button><button class="primary" data-ok="1">OK</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);
  const boxes = [...d.querySelectorAll('input[data-p]')];
  const ok = d.querySelector('button[data-ok]');
  const sync = () => { ok.disabled = !boxes.some(b => b.checked); };
  boxes.forEach(b => { b.onchange = sync; });
  sync();
  const go = () => {
    const kinds = boxes.filter(b => b.checked).map(b => b.dataset.p);
    if (!kinds.length) return;
    try { localStorage.setItem('otdr_viewer_select_by', JSON.stringify(kinds)); } catch (e) {}
    closeSelectByDialog();
    selectSame(kinds, refKey);
  };
  ok.onclick = go;
  d.querySelector('button[data-cancel]').onclick = closeSelectByDialog;
  bg.onclick = closeSelectByDialog;
  d.onkeydown = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); closeSelectByDialog(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); go(); }
  };
  (boxes.find(b => b.checked) || boxes[0]).focus();
}
function closeSelectByDialog() {
  for (const id of ['sel-dlg', 'sel-dlg-bg']) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

// The Select part of the file menu.  Each item is greyed while the selected
// files differ on its property, as FR greys it.
function selectSameMenuHtml(marks) {
  for (const t of gTraces) gFileFacts.set(t.key, factsOf(t.data));
  const item = (p, label, why) => why
    ? `<button data-same="${p}" disabled style="opacity:.45" title="${why}">${label}</button>`
    : `<button data-same="${p}">${label}</button>`;
  const differ = p => filesAgreeOn(marks, p) ? '' : `the selected files differ in ${SAME_NAMES[p].toLowerCase()}`;
  const fibers = new Set(marks.map(k => splitFileKey(k)[1])).size;
  return '<div class="span-menu-hd">Select</div>'
    + item('pf', 'Select Same Pass/Fail Status',
           flagsOff() ? 'the Settings box did not load, so nothing is graded' : differ('pf'))
    + `<button data-same="fiber" title="${fibers > 1 ? `both directions of the ${fibers} selected fibers`
