}
// The view switches, under their own heading because they change what is
// PRINTED, not what a span or a trace setting is.  "Show only flagged rows"
// used to be a checkbox in the EVENTS header strip, where nobody found it:
// the boss, on being told it existed, asked for both switches to live here.
function viewItems() {
  return `<div class="span-menu-hd">View</div>`
    + `<button data-view="rows">${gFlaggedOnly ? '✓ ' : ''}Show Only Flagged Rows</button>`
    + `<button data-view="cells">${gFailCellsOnly ? '✓ ' : ''}Show Only Failing Cells</button>`
    + `<button data-view="warncells">${gWarnCellsOnly ? '✓ ' : ''}Show Only Warning Cells</button>`
    + `<button data-view="avg">${gAvgOnly ? '✓ ' : ''}Show Averages Only</button>`
    + `<button data-view="gainers">${gShowGainers ? '✓ ' : ''}Show Gainers</button>`
    + `<div class="span-menu-hd">Distance Unit</div>`
    + Object.entries(DIST_UNITS).map(([k, u]) =>
        `<button data-unit="${k}"${k === gDistUnit ? ' class="primary"' : ''}>`
        + `${k === gDistUnit ? '✓ ' : ''}${u.name}</button>`).join('');
}
function toggleView(which) {
  if (which === 'rows') gFlaggedOnly = !gFlaggedOnly;
  else if (which === 'warncells') gWarnCellsOnly = !gWarnCellsOnly;
  else if (which === 'avg') {
    gAvgOnly = !gAvgOnly;
    try { localStorage.setItem('otdr_viewer_avg_only', gAvgOnly ? '1' : '0'); } catch (e) {}
  }
  else if (which === 'gainers') {
    gShowGainers = !gShowGainers;
    try { localStorage.setItem('otdr_viewer_gainers', gShowGainers ? '1' : '0'); } catch (e) {}
  }
  else gFailCellsOnly = !gFailCellsOnly;
  const cb = document.getElementById('set-failcells');
  if (cb) cb.checked = gFailCellsOnly;       // the menu and the box are one switch
  const wb = document.getElementById('set-warncells');
  if (wb) wb.checked = gWarnCellsOnly;
  const vb = document.getElementById('set-avg-only');
  if (vb) vb.checked = gAvgOnly;
  const gb = document.getElementById('set-gainers');
  if (gb) gb.checked = gShowGainers;
  syncViewBtn();
  renderEventTable();
  const on = [];
  if (gFlaggedOnly) on.push('flagged rows only');
  if (gFailCellsOnly) on.push('failing cells only');
  if (gWarnCellsOnly) on.push('warning cells only');
  if (gAvgOnly) on.push('averages only');
  if (!gShowGainers) on.push('gainers hidden');
  setReadout(on.length ? `showing ${on.join(', ')}` : 'showing every row and every event');
}
function showSpanMenu(x, y, dir, km, fiber, src) {
  closeSpanMenu();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  // Only the two edges that reach the picture are offered as the headline
  // actions; the other two are stored for the engine but change nothing here,
  // so putting them in front of a tech would be inviting a pointless click.
  const useful = dir === 'a' ? 'start' : 'end';
  const items = [
    ['start', `Span START of ${arrow} Here`],
    ['end',   `Span END of ${arrow} Here`],
    // Named for what it does to the picture (Robert 2026-09-26); the header
    // above already says which direction.
    ['clear', 'Reset to Full Span'],
    ['edit',  `Trace Settings (IOR, Names)…`],
  ];
  const m = document.createElement('div');
  m.id = 'span-menu';
  // Named for what it does: this sets the whole DIRECTION's span, for every
  // fiber in the folder, not a property of the row that was clicked.  The row
  // only says which event was meant, and each fiber snaps to its own.
  m.innerHTML = `<div class="span-menu-hd">${arrow} Span: All Fibers in This Folder`
    + `<br><span class="span-menu-sub">picked on F${fiber} at ${fmtDist(km)}; `
    + `each fiber uses its own event there</span></div>`
    + items.map(([e, label]) =>
        `<button data-edge="${e}"${e === useful ? ' class="primary"' : ''}>${label}</button>`).join('')
    + viewItems();
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  m.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      closeSpanMenu();
      if (b.dataset.unit) { setDistUnit(b.dataset.unit); return; }
      if (b.dataset.view) { toggleView(b.dataset.view); return; }
      if (b.dataset.edge === 'edit') showEditDialog(src || dir, fiber);
      else setSpanEdge(dir, b.dataset.edge, km);
    };
  });
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}
async function setSpanEdge(dir, edge, km) {
  try {
    const r = await fetch('/api/span', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir, edge, km }),
    });
    const j = await r.json();
    if (!r.ok || j.error) { setReadout(`could not save the span: ${j.error || r.status}`); return; }
    gSpanDecl = j.span_decl || { a: null, b: null };
  } catch (e) {
    setReadout(`could not save the span: ${(e && e.message) || e}`);
    return;
  }
  refreshMirrorFrame();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  setReadout(`${gTraces.length} traces loaded`);
}

// ─── OTDR Suite mode: the Splice Report's own table ────────────────────
// In OTDR Suite mode the table IS the Splice Report.  Its columns are the
// report's (Splice N, Entry, Bends, Damage, REFL, Connector, between the two
// end columns), and under each one every fibre prints the numbers the report
// worked from, flagged or not: A→B, B→A and the bidirectional value, three
// rows per fibre as in the FastReporter table.  A leg the report measured on
// the silent side is grey.  There are no Section columns: the report has
// none.  The columns are found across the whole cable, so they cannot be
// built from the fibres on screen; they come from the report through
// /api/suite_table -- the one that opened the Viewer, or the server's own
// run on the two folders (the table waits for it).  Nothing here computes a
// figure.  A cell the report flagged is red and carries the report's words
// for it; the losses are also judged at the report's gates, as every row of
// the FastReporter table is.  Reflectance and the two ends are the report's
// verdict alone: those rules read the whole population.  At an end the
// report judges each row on its own (A→B and B→A at the one-direction
// connector gate, the Average at the pair gates), so one bad direction is
// red on its own row whatever the other reads.
let gSuiteTableSeq = 0;
let gSuitePoll = null;
// Every repaint of the event panel starts here.  A table still being waited
// for belongs to the traces that asked for it, not to what is drawn now; the
// hidden Sections switch belongs to the last table.
function suiteTableReset() {
  gSuiteTableSeq++;
  if (gSuitePoll) { clearTimeout(gSuitePoll); gSuitePoll = null; }
  const secLab = document.getElementById('set-sections-off').closest('label');
  if (secLab) secLab.style.display = '';
}
function renderSuiteBidiGrid(traces, host, hint) {
  const byFiber = new Map();
  traces.forEach((t, ti) => {
    const g = byFiber.get(t.fiber) || {};
    g[t.dir] = ti;
    byFiber.set(t.fiber, g);
  });
  const pairs = [], singles = [];
  for (const [fiber, g] of byFiber) {
    if (g.a != null && g.b != null) pairs.push({ fiber, ta: traces[g.a], tb: traces[g.b] });
    else singles.push(fiber);
  }
  // Every fibre from one direction only (Robert 2026-09-30: "it has to work
  // for one direction OR bidi, equally"): that direction's own report, the
  // Unidirectional one, supplies the table, in that direction's frame.
  let oneDir = null;
  if (!pairs.length) {
    const dirs = new Set(traces.map(t => t.dir));
    if (dirs.size !== 1) return false;
    oneDir = [...dirs][0];
    if (oneDir !== 'a' && oneDir !== 'b') return false;
    for (const [fiber, g] of byFiber) {
      pairs.push({ fiber, ta: oneDir === 'a' ? traces[g.a] : null,
                          tb: oneDir === 'b' ? traces[g.b] : null });
    }
    singles.length = 0;
  }
  const seq = ++gSuiteTableSeq;
  hint.textContent = oneDir
    ? `OTDR Suite table: reading ${pairs.length} fibre${pairs.length === 1 ? '' : 's'} from one direction…`
    : `OTDR Suite table: reading ${pairs.length} fibre pair${pairs.length === 1 ? '' : 's'}…`;
  // No report table: say so and why.  FastReporter's table never stands in
  // for it (Robert 2026-09-30: "Error, no FR stand-in"), so a tech can never
  // read FR's pairing as OTDR Suite's; FastReporter mode shows that table.
  // The drawer keeps the files' own event numbers (no marks were set).
  const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const noTable = (why) => {
    host.innerHTML = `<div class="suite-err" role="alert"><b>OTDR Suite table could not be built.</b> `
      + `${esc(why)}. The traces and their own events still show above; `
      + `switch to FastReporter mode for FastReporter's table.</div>`;
    hint.textContent = 'OTDR Suite table unavailable';
  };
  const ask = () => fetch(`/api/suite_table?${oneDir ? `dir=${oneDir}&` : ''}fibers=${pairs.map(p => p.fiber).join(',')}`)
    .then(r => r.json())
    .then(res => {
      if (seq !== gSuiteTableSeq) return;
      gSuitePoll = null;
      res = res || {};
      if (res.pending) {
        hint.textContent = 'OTDR Suite table: running the Splice Report on this span for its columns…';
        gSuitePoll = setTimeout(ask, 3000);
        return;
      }
      const tables = res.tables || {};
      if (res.error || !pairs.some(p => Array.isArray(tables[String(p.fiber)]))) {
        noTable(res.error || 'The report has no table for these fibers');
        return;
      }
      paintSuiteBidiGrid(pairs, singles, res, host, hint);
    })
    .catch(e => {
      if (seq !== gSuiteTableSeq) return;
      noTable(`The Viewer could not reach the report (${(e && e.message) || 'request failed'})`);
    });
  ask();
  return true;
}

function paintSuiteBidiGrid(pairs, singles, res, host, hint) {
  host.innerHTML = '';
  gGridGoTo = null;
  const secLab = document.getElementById('set-sections-off').closest('label');
  if (secLab) secLab.style.display = 'none';       // the report has no sections
  const tables = res.tables || {};
  const have = pairs.filter(p => Array.isArray(tables[String(p.fiber)]));
  const missing = pairs.filter(p => !have.includes(p)).map(p => p.fiber);
  // The report's km is measured from A's panel; the chart draws the file as
  // it was shot, a launch length further along.
  const launchA = Number(res.launch_a_km) || 0;
  // A one-direction table (the Unidirectional report's): one row per fibre,
  // judged by that report's flag and its own loss gate; no Average row.
  const oneDir = (res.direction === 'a' || res.direction === 'b') ? res.direction : null;
  // Its km is in that direction's OWN frame (`launch_a_km` is then the run's
  // own launch), and a B trace is mirrored onto the chart whenever an A trace
  // is loaded, shown or hidden.  So a one-direction km reaches the chart
  // through the trace: with A loaded but hidden, B's columns zoomed to their
  // mirror image (0.000 km on a 62 m panel tie went to 1.000 km, B's
  // connector drawn at 1.1006 km).  An A+B table's km is already A's frame.
  const legOf = p => oneDir === 'b' ? p.tb : p.ta;
  const leadT = oneDir ? have.map(legOf).find(Boolean) : null;
  const toView = (km, t) => (oneDir && (t || leadT)) ? dispKm(t || leadT, km) : km;
  // Columns: the report's, in its order; ev[fi] is fibre fi's cell there.
  const cols = (res.columns || []).map(c => ({
    title: String(c.title || ''), kind: c.kind, km: Number(c.km) || 0,
    isEnd: c.kind === 'end' || !!c.end,
    viewKm: toView((Number(c.km) || 0) + launchA),
    eventKind: c.event_kind ? String(c.event_kind) : '',
    eventTip: c.event_kind_tip ? String(c.event_kind_tip) : '',
    ev: have.map(() => null),
  }));
  have.forEach((p, fi) => tables[String(p.fiber)].forEach(cell => {
    if (cols[cell.col]) cols[cell.col].ev[fi] = cell;
  }));
  // The report's columns are the closures and the two ends: the chart marks
  // each direction's own reading there and nothing else.
  tableMarkReset(have.flatMap(p => [p.ta, p.tb]));
  cols.forEach(c => c.ev.forEach((x, fi) => {
    if (!x) return;
    if (x.a && x.a.km != null) tableMark(have[fi].ta, x.a.km);
    if (x.b && x.b.km != null) tableMark(have[fi].tb, x.b.km);
  }));
  draw();                                  // painted after a fetch: the chart follows
  const fmt  = v => (v == null || isNaN(v)) ? '---' : v.toFixed(3);
  const fmtR = v => (v == null || isNaN(v)) ? '---' : v.toFixed(1);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                            .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // A leg's own km, rounded as /api/trace rounds an event's dist_km, so a
  // click on the trace's event number finds the cell (see gGridGoTo).
  const rawKm = km => Math.round(km * 1e4) / 1e4;
  // A stored reading; a leg the report measured itself is never judged.
  const legOk = leg => !!leg && !leg.grey && leg.loss != null;
  const LEGS = oneDir ? [oneDir] : ['a', 'b', 'avg'];
  const oneGate = oneDir && res.gate_db != null ? Number(res.gate_db) : null;

  // ── Verdicts ──
  // The report's flag first.  A loss is also judged at the report's gates,
  // row by row: the Average at the bidirectional gate, a direction at the
  // single-direction gate.  The two ends take the report's verdict only.
  const lossFails = (c, x, which) => {
    if (which === 'avg') {
      return !!x.flag || (!c.isEnd && clearsAt(x.loss, gateFor(!!x.reflective, false)));
    }
    const leg = x[which];
    if (!leg || gainerHidden(leg.loss)) return false;
    if (oneDir) {
      return !!leg.flag || (!c.isEnd && !x.reflective && oneGate != null
                            && legOk(leg) && clearsAt(leg.loss, oneGate));
    }
    return !!leg.flag
        || (!c.isEnd && legOk(leg) && clearsAt(leg.loss, gateFor(!!x.reflective, true)));
  };
  const reflFlagged = (x, which) => which !== 'avg' && !!(x[which] && x[which].flag_refl);
  const cellFails = (c, x, which) => lossFails(c, x, which) || reflFlagged(x, which);
  const lossWarns = (c, x, which) => {
    if (oneDir || c.isEnd || lossFails(c, x, which)) return false;
    if (which === 'avg') return clearsAt(x.loss, warnFor(!!x.reflective, false));
    const leg = x[which];
    return legOk(leg) && !gainerHidden(leg.loss) && clearsAt(leg.loss, warnFor(!!x.reflective, true));
  };
  const legFails = (fi, which) => cols.some(c => c.ev[fi] && cellFails(c, c.ev[fi], which));
  const rowFails = have.map((_p, fi) => LEGS.some(w => legFails(fi, w)));
  // What the cell filters keep of a loss (the boss, 2026-09-29: "we only
  // need to see if it's failing Bidi Average"): the Average row's verdict
  // alone, never a direction at the single-direction gate.  A direction
  // keeps only what the report itself flagged on it -- the one direction
  // that read a spot the other could not, or a launch side.  Reflectance is
  // still judged per direction.  The rows' own P/F is unchanged.  A
  // connector keeps each direction that fails on its own row (the boss,
  // 2026-09-29: "we can't average connector losses A and B, we have to see
  // them separately"; Robert: every connector): at an end column that is
  // the report's own per-direction flag, mid-span the one-direction gate.
  const lossKept = (c, x, which) => which === 'avg'
    ? (gFailCellsOnly && lossFails(c, x, which)) || (gWarnCellsOnly && lossWarns(c, x, which))
    : oneDir ? gFailCellsOnly && lossFails(c, x, which)
    : gFailCellsOnly && (x.reflective ? lossFails(c, x, which)
                                      : !!(x[which] && x[which].flag && !gainerHidden(x[which].loss)));
  const cellKept = (c, x, which) => lossKept(c, x, which) || (gFailCellsOnly && reflFlagged(x, which));
  const legKept = (fi, which) => cols.some(c => c.ev[fi] && cellKept(c, c.ev[fi], which));
  // The cell filters collapse the table to what failed, as in the
  // FastReporter table: a fibre, a column or a direction row with nothing
  // kept leaves; each fibre that stays keeps its Average row.
  const collapse = cellFilterOn();
  const keepCol = cols.map(c => !collapse
    || have.some((_p, fi) => c.ev[fi] && LEGS.some(w => cellKept(c, c.ev[fi], w))));
  // The drawer marks these columns with these verdicts (see drawPairing).
  // A gray leg the report gave no km of its own sits at the column's cell.
  const drawerLeg = (c, x, w) => {
    const leg = x[w];
    if (!leg || (leg.km == null && !leg.grey)) return null;
    return { km: leg.km, loss: leg.loss, hollow: !!leg.grey,
             fail: cellFails(c, x, w), warn: lossWarns(c, x, w) };
  };
  const marks = { mode: 'suite', single: !!oneDir, have, goCell: () => {},
    cols: cols.map((c, i) => ({ i, title: c.title, km: c.viewKm, cells: keepCol[i]
      ? c.ev.map((x, fi) => x && { fi, avg: x.loss,
                                   km: x.km != null ? toView(x.km + launchA, oneDir && legOf(have[fi])) : c.viewKm,
                                   // A one-direction table has no Average: its tag carries that
                                   // direction's own verdict, as its one row does.
                                   avgFail: lossFails(c, x, oneDir || 'avg'), avgWarn: lossWarns(c, x, oneDir || 'avg'),
                                   legs: { a: drawerLeg(c, x, 'a'), b: drawerLeg(c, x, 'b') } })
             .filter(Boolean)
      : [] })) };

  // What the report said about a cell, for its tooltip: the row's own
  // reason first (an end connector's rows are judged one by one), then the
  // report's words for the cell.
  const saidOf = (c, x, own) => [own && own.said, x.label ? x.label
                         : (c.isEnd && x.tags && x.tags.length ? x.tags.join(', ') : '')]
    .filter(Boolean).join('; ');
  const lossCell = (c, x, which, attrs) => {
    const leg = which === 'avg' ? null : x[which];
    const v = which === 'avg' ? x.loss : (leg ? leg.loss : null);
    if (leg && gainerHidden(v)) return `<td${attrs}></td>`;       // a hidden gainer
    const fails = lossFails(c, x, which), warns = lossWarns(c, x, which);
    if (cellFilterOn() && !lossKept(c, x, which)) return `<td${attrs}></td>`;   // blank AND uncoloured
    const cls = [];
    if (fails) cls.push('fr-hi'); else if (warns) cls.push('fr-warn');
    if (leg && leg.grey) cls.push('fr-synth');
    const flagged = which === 'avg' ? !!x.flag : !!(leg && leg.flag);
    // a flagged cell with no number prints the report's own words for it
    const txt = (v == null && flagged && x.label)
      ? esc(x.label.replace(/^\d+\s+/, '')) : fmt(v);
    const said = flagged ? saidOf(c, x, which === 'avg' ? x : leg) : '';
    return `<td${cls.length ? ` class="${cls.join(' ')}"` : ''}${attrs}`
         + `${said ? ` title="Splice Report: ${esc(said)}"` : ''}>${txt}</td>`;
  };
  const reflCell = (c, x, which) => {
    const leg = x[which];
    const bad = reflFlagged(x, which);
    if (cellFilterOn() && !(gFailCellsOnly && bad)) return '<td></td>';
    const cls = [bad ? 'fr-hi' : '', leg && leg.grey ? 'fr-synth' : ''].filter(Boolean).join(' ');
    const said = bad ? saidOf(c, x) : '';
    return `<td${cls ? ` class="${cls}"` : ''}`
         + `${said ? ` title="Splice Report: ${esc(said)}"` : ''}>${fmtR(leg ? leg.refl : null)}</td>`;
  };

  // ── Header: three rows (column / distance / units) ──
  const LEAD = [['Identifiers', 'fr-rowlab'], ['P/F', ''], ['λ (nm)', ''], ['Dir.', '']];
  let h1 = LEAD.map(([l, c]) => `<th rowspan="3" class="fr-rowlab ${c}">${l}</th>`).join('');
  let h2 = '', h3 = '';
  cols.forEach((c, i) => {
    if (!keepCol[i]) return;
    const n = c.ev.filter(x => x).length;
    h1 += `<th colspan="2" class="fr-evhdr" data-km="${c.viewKm}" title="zoom to ${c.km.toFixed(3)} km">`
        + `${esc(c.title)} (${n}/${have.length})</th>`;
    // An event column's FastReporter word before the distance, as in FR
    // mode ("Non-reflective" / "21.8759km, 71,771'"); a Mixed column names
    // each fibre's type on hover.  The report stores the word on the column.
    const kindTxt = c.eventKind
      ? `<span class="fr-evkind"${c.eventTip ? ` title="${esc(c.eventTip)}"` : ''}>${esc(c.eventKind)}</span><br>`
      : '';
    h2 += `<th colspan="2" class="fr-evsub">${kindTxt}<span class="fr-km">${kmFt(c.km)}</span></th>`;
    h3 += '<th class="fr-sub">Loss<br>(dB)</th><th class="fr-sub">Refl.<br>(dB)</th>';
  });

  const shown = have.map((_p, i) => i).filter(i => (!gFlaggedOnly || rowFails[i])
    && (!collapse || LEGS.some(w => legKept(i, w))));
  const descs = shown.flatMap(fi => LEGS
    .filter(w => oneDir || ((!collapse || w === 'avg' || legKept(fi, w))
              && (collapse || !gAvgOnly || w === 'avg'))).map(w => [fi, w]));
  const rowHtml = ([fi, which]) => {
    const p = have[fi];
    const t = which === 'b' ? p.tb : p.ta;
    const fail = legFails(fi, which);
    const label = which === 'a' ? 'A→B' : which === 'b' ? 'B→A' : 'Average';
    const cells = [
      `<td class="fr-rowlab"><span style="display:inline-block;width:8px;height:8px;`
      + `border-radius:50%;background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${p.fiber}</td>`,
      `<td class="${pfClass(fail)}" title="${which === 'avg'
        ? `the Splice Report's flags, and the A+B value at its gates (${gateLabel()})`
        : "the Splice Report's flags, and this direction at its single-direction gates"}`
      + `">${pfMark(fail)}</td>`,
      `<td>${t.data.wavelength_nm || '---'}</td>`,
      `<td>${label}</td>`,
    ];
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const x = c.ev[fi];
      if (!x) {
        cells.push(`<td>${cellText('---')}</td><td>${cellText('---')}</td>`);
      } else if (which === 'avg') {
        // no reflectance on the Average row, as in the FastReporter table
        cells.push(lossCell(c, x, 'avg', ` data-col="${i}"`) + `<td>${cellText('---')}</td>`);
      } else if (!x[which]) {
        // the report has no reading from this direction here
        cells.push(lossCell(c, x, which, ` data-col="${i}"`) + `<td>${cellText('---')}</td>`);
      } else {
        const leg = x[which];
        cells.push(lossCell(c, x, which, ` data-col="${i}"`
                     + (leg.km != null ? ` data-km="${rawKm(leg.km)}"` : ''))
                 + reflCell(c, x, which));
      }
    });
    // The picked row is marked: a direction's row for its own trace, the
    // Average row when both of its fibre's traces are the pick.
    const pk = which === 'avg' ? samePick([p.ta.key, p.tb.key]) : gPickKey === t.key;
    const attrs = (which === 'avg' ? ` class="fr-avg${pk ? ' fr-pick' : ''}" data-avg="1" data-fiber="${p.fiber}"`
      : `${pk ? ' class="fr-pick"' : ''} data-dir="${t.dir}" data-src="${t.src || t.dir}" data-fiber="${p.fiber}"`)
      + ` data-row="${fi}-${which}"`;           // the drawer's way in (gridGoCell)
    return `<tr${attrs}>${cells.join('')}</tr>`;
  };

  // Robert, 2026-09-29: no table description, "report run by the Viewer",
  // one-direction list or right-click advice over the Suite table.  What
  // stays is what the table cannot show: fibres the report left out, and
  // which filter is ticked.
  hint.textContent = [
    missing.length ? `not in the report: F${missing.join(', F')}` : '',
    gFlaggedOnly ? 'flagged rows only' : '',
    gFailCellsOnly ? (descs.length ? 'failing cells only' : 'failing cells only: nothing fails') : '',
    gWarnCellsOnly ? (descs.length ? 'warning cells only' : 'warning cells only: no warnings') : '',
    gShowGainers ? '' : 'gainers hidden',
  ].filter(Boolean).join(' · ');

  // ── Assembly, virtualised like the FastReporter table ──
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';
  const kept = cols.filter((_c, i) => keepCol[i]);
  const NCELL = LEAD.length + kept.length * 2;
  // Said after the caption, not inside it, so it reads right whichever
  // wording the caption has.  With a cell filter on, the filter decides.
  if (gAvgOnly && !cellFilterOn() && !oneDir)
    hint.textContent = [hint.textContent, 'averages only'].filter(Boolean).join(' · ');
  // ── Minimum / Maximum / Average down the column, over the fibres'
  // AVERAGE rows (every fibre loaded, not just the rows on screen).
  const aggRow = (label, fn, gated) => {
    const cells = [`<td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`];
    const num = v => v != null && !isNaN(v);
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const xs = c.ev.filter(x => x);
      const ls = xs.map(x => x.loss).filter(num);
      const v = ls.length ? fn(ls) : null;
      const refl = xs.some(x => x.reflective);
      const g = c.isEnd ? null : gateFor(refl, false);
      const w = c.isEnd ? null : warnFor(refl, false);
      const fails = gated && v != null && clearsAt(v, g);
      const warns = gated && v != null && !fails && clearsAt(v, w);
      const keep = (gFailCellsOnly && fails) || (gWarnCellsOnly && warns);
      const cls = fails ? ' class="fr-hi"' : warns ? ' class="fr-warn"' : '';
      cells.push((cellFilterOn() && !keep ? '<td></td>' : `<td${cls}>${fmt(v)}</td>`) + '<td></td>');
    });
    return `<tr class="fr-agg">${cells.join('')}</tr>`;
  };
  const aggRows = [
    aggRow('Minimum', a => Math.min(...a), false),
    aggRow('Maximum', a => Math.max(...a), false),
    aggRow('Average', a => a.reduce((x, y) => x + y, 0) / a.length, true),
  ];
  table.innerHTML = `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead><tbody></tbody>`
                  + `<tfoot>${aggRows.join('')}</tfoot>`;
  const tb = table.querySelector('tbody');
  gTableExport = { table, rows: () => descs.map(rowHtml) };    // every row, for the Report
  scroller.appendChild(table);
  host.appendChild(scroller);
  const spacerRow = h =>
    `<tr class="fr-spacer" style="height:${h}px"><td colspan="${NCELL}" style="border:0;padding:0"></td></tr>`;
  let lastFirst = -1;
  function paintRows() {
    const top = scroller.scrollTop;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const view = Math.max(0, scroller.clientHeight - headH);
    const first = Math.max(0, Math.floor((top - headH) / FR_ROW_H) - 4);
    const count = Math.ceil(view / FR_ROW_H) + 8;
    const last = Math.min(descs.length, first + count);
    lastFirst = first;
    const html = [];
    if (first > 0) html.push(spacerRow(first * FR_ROW_H));
    for (let k = first; k < last; k++) html.push(rowHtml(descs[k]));
    if (last < descs.length) html.push(spacerRow((descs.length - last) * FR_ROW_H));
    tb.innerHTML = html.join('');
  }
  scroller.addEventListener('scroll', () => {
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const f = Math.max(0, Math.floor((scroller.scrollTop - headH) / FR_ROW_H) - 4);
    if (f !== lastFirst) { lastFirst = f; paintRows(); }
  });
  fitColumns(table, descs.map(rowHtml));   // widths from every row
  paintRows();
  // A click on the drawer's mark for a cell comes here (drawPairing), and a
  // click on a fibre's name picks it on the chart.
  if (marks) {
    marks.goCell = (fi, which, col) => gridGoCell({ scroller, table, tb, descs, paintRows }, fi, which, col);
    gDrawerMarks.push(marks);
  }
  appendOneDirGrid(singles, host);
  draw();
  requestAnimationFrame(() => {
    const hrows = table.tHead ? [...table.tHead.rows] : [];
    let off = 0;
    for (const r of hrows) {
      for (const th of r.cells) th.style.top = off + 'px';
      off += r.offsetHeight;
    }
  });
  table.querySelectorAll('th.fr-evhdr').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', () => zoomToKm(+th.dataset.km, 2));
  });
  // A click on an event number on the trace: scroll that fibre's row for the
  // trace's direction into view and mark the cell that reading is printed in.
  gGridGoTo = (t, e) => {
    const fi = have.findIndex(p => p.ta === t || p.tb === t);
    if (fi < 0) return;
    const w = t === have[fi].tb ? 'b' : 'a';
    let k = descs.findIndex(d => d[0] === fi && d[1] === w);
    if (k < 0) k = descs.findIndex(d => d[0] === fi);
    if (k < 0) return;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const rowTop = headH + k * FR_ROW_H;
    if (!e) {                                // a click on the trace: its row, centred
      // between the pinned header and the pinned Minimum/Maximum rows
      const mid = Math.max(FR_ROW_H, scroller.clientHeight - headH - pinnedFootH(table));
      scroller.scrollTop = Math.max(0, rowTop - headH - (mid - FR_ROW_H) / 2);
      paintRows();
      return;
    }
    const view = scroller.clientHeight - headH;
    const winTop = scroller.scrollTop + headH, winBot = winTop + view;
    if (rowTop < winTop || rowTop + FR_ROW_H > winBot) {
      scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
    }
    paintRows();
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = [...tb.querySelectorAll(sel)].find(row => row.querySelector(`td[data-km="${e.dist_km}"]`));
    const td = tr && tr.querySelector(`td[data-km="${e.dist_km}"]`);
    if (!td) return;
    table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
    const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
    const leadW = tr.cells[0].offsetWidth;
    const dxL = cr.left - (sr.left + leadW) - 8;
    const dxR = cr.right - sr.right + 8;
    if (dxL < 0) scroller.scrollLeft += dxL;
    else if (dxR > 0) scroller.scrollLeft += dxR;
    td.classList.add('fr-hit');
    setTimeout(() => td.classList.add('fading'), 1500);
    setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
  };
  // A click on a row picks it (pickRow): a direction's row its trace, the
  // Average row both of its fibre's.  Again on the same row lets go.
  tb.addEventListener('click', (ev) => {
    // Not the second click of a double-click (it would let go at once), and
    // not a mouse-up that ends selecting text to copy.
    if (ev.detail > 1 || String(window.getSelection() || '').trim()) return;
    const tr = ev.target.closest('tr[data-fiber]');
    if (!tr) return;
    const p = have.find(q => String(q.fiber) === tr.dataset.fiber);
    if (!p) return;
    pickRow(tr.dataset.avg ? [p.ta.key, p.tb.key] : [`${tr.dataset.src}-${tr.dataset.fiber}`]);
    paintRows();
  });
  // Right-click a direction's cell for the span menu, as in the other grids;
  // the Average row names no direction, so it has no menu.
  tb.addEventListener('contextmenu', (ev) => {
    const td = ev.target.closest('td[data-km]');
    const tr = td && td.closest('tr[data-dir]');
    if (!td || !tr) return;
    ev.preventDefault();
    showSpanMenu(ev.clientX, ev.clientY, tr.dataset.dir, +td.dataset.km,
                 tr.dataset.fiber, tr.dataset.src);
  });
}

// ─── Editing a trace's settings (the boss's "IOR is wrong, correct it in
// software, trace name, ...") ─────────────────────────────────────────
// The dialog pre-fills from the clicked fiber's file, then writes edited COPIES
// into a sibling folder.  Nothing here can touch an original: the server
// refuses the source folder and refuses to overwrite.  "All fibers" is the
// common case (a wrong IOR is wrong for the whole shoot); a fiber id is the
// one per-fiber field, so it is greyed out in that scope.
const EDIT_FIELDS = [
  ['cable_id',   'Cable ID'],   ['fiber_id',  'Fiber ID'],
  ['loc_a',      'Location A'], ['loc_b',     'Location B'],
  ['cable_code', 'Cable Code'], ['job_id',    'Job ID'],
  ['customer',   'Customer'],   ['company',   'Company'],
  ['operator',   'Operator A'], ['operator_b','Operator B'],
  ['comment',    'Comment'],
];
// The span the tech declared for this direction (right-click, "Span START /
// END here") can go into the copies too, the way FR saves one: each fiber
// snaps to its own event at that km.  Offered only when one is declared.
function spanRow(dir) {
  const s = gSpanDecl && gSpanDecl[dir];
  if (!s || (s.start_km == null && s.end_km == null)) return '';
  const parts = [];
  if (s.start_km != null) parts.push(`Start ${s.start_km.toFixed(4)} km`);
  if (s.end_km != null) parts.push(`End ${s.end_km.toFixed(4)} km`);
  return `<div class="row"><label>Declared Span</label><label style="color:var(--text)">`
    + `<input type="checkbox" id="edit-span" checked> Write It Into the Copies (${parts.join(', ')})</label></div>`;
}
// FR's Test Parameters and Test Settings, row for row.  Formats are FR's:
// the boss reads that panel daily, and one that rounds differently is one he
// has to stop and re-check.  A value the file does not carry prints '---'.
// IOR is the one row that can be changed here, so it is the input itself.
function frPanelHtml(p, iorVal) {
  const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const n = (v, dp, unit) => (v == null || !isFinite(v)) ? '---' : `${(+v).toFixed(dp)}${unit}`;
  const row = (label, val, cls) => `<tr><td>${label}</td><td${cls ? ` class="${cls}"` : ''}>${val}</td></tr>`;
  const params = [
    ['Wavelength', n(p.wavelength_nm, 0, ' nm')],
    ['Range',      n(p.range_km, 4, ' km')],
    ['Pulse',      n(p.pulse_ns, 0, ' ns')],
    ['Duration',   n(p.duration_s, 0, ' s')],
    ['Resolution', n(p.resolution_m, 3, ' m')],
  ];
  // The micron figure is in no field of the file; the glass code is.
  const core = p.fiber_type ? `<span title="FastReporter's core size is not stored in the .sor; the file says the fiber is G.${esc(p.fiber_type)}">n/a (G.${esc(p.fiber_type)})</span>` : '---';
  const splitOn = !!p.splitter_on;
  const settings = [
    ['IOR', `<input type="number" id="edit-ior" step="0.000001" min="1.40" max="1.55" value="${iorVal}" title="type a new IOR to write it into the copies">`],
    ['Backscatter', n(p.backscatter_db, 2, ' dB')],
    ['Helix Factor', n(p.helix_pct, 2, ' %')],
    ['Splice Loss Detection Threshold', n(p.splice_thr_db, 3, ' dB')],
    [`<label><input type="checkbox" disabled${splitOn ? ' checked' : ''}> Splitter Loss (SM Only)</label>`,
     n(p.splitter_thr_db, 3, ' dB'), splitOn ? '' : 'off'],
    ['Reflectance Detection Threshold', n(p.refl_thr_db, 1, ' dB')],
    ['End-of-Fiber Detection Threshold', n(p.eof_thr_db, 3, ' dB')],
    ['Fiber Core Size', core],
  ];
  return `<div class="fr-panels">`
    + `<table class="fr-panel"><tr><th colspan="2">Test Parameters</th></tr>`
    + params.map(([l, v]) => row(l, v)).join('')
    + `</table><table class="fr-panel"><tr><th colspan="2">Test Settings</th></tr>`
    + settings.map(([l, v, c]) => row(l, v, c)).join('') + `</table></div>`;
}
function closeEditDialog() {
  for (const id of ['edit-dlg', 'edit-dlg-bg']) {
    const e = document.getElementById(id);
    if (e) e.remove();
  }
}
async function showEditDialog(dir, fiber) {
  closeEditDialog();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  let s;
  try {
    const r = await fetch(`/api/trace_settings?dir=${dir}&fiber=${fiber}`);
    s = await r.json();
    if (!r.ok || s.error) { setReadout(`could not read F${fiber}: ${s.error || r.status}`); return; }
  } catch (e) {
    setReadout(`could not read F${fiber}: ${(e && e.message) || e}`); return;
  }
  const bg = document.createElement('div'); bg.id = 'edit-dlg-bg';
  const d = document.createElement('div'); d.id = 'edit-dlg';
  const ids = s.identifiers || {};
  // The panel's IOR is FR's own float64 (6 places); the FxdParams copy is
  // the fallback.  Either way the dialog compares against what it SHOWED.
  const shownIor = (s.panel && s.panel.ior != null) ? s.panel.ior : s.ior;
  const iorVal = shownIor == null ? '' : shownIor.toFixed(s.panel && s.panel.ior != null ? 6 : 5);
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  d.innerHTML = `<h3>Trace Settings: ${arrow}</h3>`
    + `<div class="sub">read from ${esc(s.filename)}${s.editable ? '' : ': <b>' + esc(s.why) + '</b>'}</div>`
    + `<div class="scope"><label><input type="radio" name="edit-scope" value="all" checked> All Fibers in This Folder</label>`
    + `<label><input type="radio" name="edit-scope" value="one"> Only F${fiber}</label></div>`
    + (s.panel
       ? frPanelHtml(s.panel, iorVal)
       : `<div class="row"><label>IOR</label><input type="number" id="edit-ior" step="0.00001" min="1.40" max="1.55" value="${iorVal}"></div>`)
    + EDIT_FIELDS.map(([k, label]) =>

    + spanRow(dir)
    + `<div class="note">Blank a field to leave it unchanged. The originals are never touched; edited copies go to the folder below. Browse to choose one, or type a full path (a bare name makes a folder of that name in Downloads).</div>`
    + `<div class="row"><label>Save Copies To</label><input type="text" id="edit-dest" value="${esc(s.dest_full || s.dest_default)}">`
    + `<button type="button" id="edit-browse" title="choose the folder edited copies are saved to">Browse…</button></div>`
    + `<div class="err" id="edit-err"></div>`
    + `<div class="btns"><button id="edit-cancel">Cancel</button><button class="primary" id="edit-save"${s.editable ? '' : ' disabled'}>Save Copies</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);
  // Remember what the file says, so an untouched field is NOT re-sent as a
  // change: the writer re-lays the proprietary stream for every field it is
  // handed, and "same text" is still a rewrite.
  if (s.panel) d.classList.add('has-panel');
  const original = { ior: iorVal === '' ? null : +iorVal, ids };
  const fid = d.querySelector('#edit-fiber_id');
  const syncScope = () => {
    const all = d.querySelector('input[name=edit-scope]:checked').value === 'all';
    fid.disabled = all;

  };
  d.querySelectorAll('input[name=edit-scope]').forEach(r => r.onchange = syncScope);
  syncScope();
  bg.onclick = closeEditDialog;
  d.querySelector('#edit-cancel').onclick = closeEditDialog;
  d.querySelector('#edit-save').onclick = () => submitEdit(dir, fiber, original);
  // The OS folder picker opens on this machine (the server runs here), so the
  // tech gets a real path back, not a browser upload.
  d.querySelector('#edit-browse').onclick = async () => {
    const err = d.querySelector('#edit-err');
    err.textContent = 'choose a folder in the dialog that just opened…';
    try {
      const r = await fetch('/api/pick_folder', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Save edited copies to' }),
      });
      const j = await r.json();
      if (!r.ok || j.error) { err.textContent = j.error || ('server said ' + r.status); return; }
      if (!j.available) { err.textContent = 'no folder picker on this machine. Type the full path instead'; return; }
      if (j.path) d.querySelector('#edit-dest').value = j.path;
      err.textContent = '';
    } catch (e) {
      err.textContent = (e && e.message) || String(e);
    }
  };
}
async function submitEdit(dir, fiber, original) {
  const d = document.getElementById('edit-dlg');
  const err = d.querySelector('#edit-err');
  const all = d.querySelector('input[name=edit-scope]:checked').value === 'all';
  const iorTxt = d.querySelector('#edit-ior').value.trim();
  const ior = iorTxt === '' ? null : +iorTxt;
  const fields = {};
  for (const inp of d.querySelectorAll('input[data-key]')) {
    if (inp.disabled) continue;
    const v = inp.value;
    if (v.trim() === '' || v === String(original.ids[inp.dataset.key] == null ? '' : original.ids[inp.dataset.key])) continue;
    fields[inp.dataset.key] = v;
  }
  const iorChanged = ior != null && (original.ior == null || Math.abs(ior - original.ior) > 5e-7);
  const spanBox = d.querySelector('#edit-span');
  const span = (spanBox && spanBox.checked && gSpanDecl[dir])
    ? { start_km: gSpanDecl[dir].start_km ?? null, end_km: gSpanDecl[dir].end_km ?? null } : {};
  const spanOn = span.start_km != null || span.end_km != null;
  if (!iorChanged && !Object.keys(fields).length && !spanOn) { err.textContent = 'nothing changed'; return; }
  if (ior != null && !(ior >= 1.40 && ior <= 1.55)) { err.textContent = 'IOR must be between 1.40 and 1.55'; return; }
  err.textContent = '';
  d.querySelector('#edit-save').disabled = true;
  let j;
  try {
    const r = await fetch('/api/trace_edit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir, fibers: all ? 'all' : [+fiber], ior: iorChanged ? ior : null,
                             fields, span, dest_name: d.querySelector('#edit-dest').value }),
    });
    j = await r.json();
    if (!r.ok || j.error) { err.textContent = j.error || ('server said ' + r.status); d.querySelector('#edit-save').disabled = false; return; }
  } catch (e) {
    err.textContent = (e && e.message) || String(e); d.querySelector('#edit-save').disabled = false; return;
  }
  // Say what happened IN the dialog, and leave it open until the tech has
  // read it.  Closing at once and putting one line in the readout is how the
  // boss saved a file and then could not find it: the line named a folder he
  // was not looking in, and a second try was "skipped: already exists" in the
  // same small print.  The full path and every skip reason go here instead.
  const n = (j.written || []).length, k = (j.skipped || []).length;
  let msg = `wrote ${n} edited cop${n === 1 ? 'y' : 'ies'} to ${j.dest}`;
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const lines = [`<b>Wrote ${n} edited cop${n === 1 ? 'y' : 'ies'}</b> to:<br><code>${esc(j.dest)}</code>`];
  if (k) {
    const why = {};
    for (const s of j.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    const parts = Object.entries(why).map(([r, c]) => `${c} ${r}`);
    msg += `; skipped ${k}: ` + parts.join(', ');
    lines.push(`<b>Skipped ${k}:</b> ` + parts.map(esc).join('; ')
      + (Object.keys(why).some(r => r.startsWith('already exists'))
         ? '<br>A copy already in that folder is never overwritten. Pick a different folder, or remove the old copy first.' : ''));
  }
  if (!n && !k) lines.push('Nothing was written.');
  setReadout(msg);
  d.innerHTML = `<h3>Edited Copies Saved</h3><div class="note" style="font-size:12px;line-height:1.5">`
    + lines.map(l => `<div style="margin:6px 0">${l}</div>`).join('') + `</div>`
    + `<div class="btns"><button class="primary" id="edit-done">Done</button></div>`;
  d.querySelector('#edit-done').onclick = closeEditDialog;
}

// ─── Rename files (FILES panel > right-click > Rename files…) ──────────
//
// PowerRename's shape, which is what the boss asked for by name: a find and
// replace rule at the top, and under it a tick and a live "before → after"
// for every file in scope.  The ORIGINALS are renamed, in place.  Everything
// else the Viewer writes is a copy, because an edited .sor is a changed
// measurement record; a rename is not — the bytes never move, only the name
// does — so this acts on the folder itself instead of leaving a second copy
// of a 1152-fibre cable behind.  Undo puts the last batch back.
//
// The preview is the contract.  The names shown here are the names POSTed:
// the server never re-derives a name from the rule, because a Python regex
// is a second dialect and would be a second answer, and the tech would be
// told one thing and handed another.  The server's own refusals are mirrored
// in nameProblem() so a bad name is red HERE, before the click.

const gRenameUndo = [];        // [{n, batches:[{dir, pairs}]}] — newest last
let gRenameRows = [];          // the dialog's rows, refs kept for the preview

// trace_server.extract_fiber_num, mirrored.  The FILES list, every trace key
// in here and every report grid are keyed on the fiber number the FILENAME
// carries, so a rename that moves that number renames the fiber.  Sometimes
// that IS the intent (a cable numbered from the wrong end); sometimes it is
// a typo in a regex.  The preview says which, in amber, rather than asking
// the server one round trip per keystroke.  Pinned to the Python source by
// desktop/tests/test_viewer_rename.py.
const RN_WAVELENGTHS = /[\s_\-.](?:850|1300|1310|1383|1490|1550|1577|1625|1650)+$/;
function fiberNumOf(name) {
  const base = String(name || '').replace(/^.*[\/\\]/, '');
  if (base.startsWith('._')) return null;          // macOS AppleDouble sidecar
  const dot = base.lastIndexOf('.');
  let stem = dot > 0 ? base.slice(0, dot) : base;
  stem = stem.replace(/\s+$/, '').replace(RN_WAVELENGTHS, '');
  const runs = stem.match(/\d+/g);
  if (!runs) return null;
  const run = runs[runs.length - 1];
  const pad = run.match(/0\d{3}$/);                // tie-panel: ILA digit + 0NNN port
  if (pad && pad[0].length < run.length) return +pad[0];
  return +run;
}

// trace_server.rename_check, mirrored: Windows' file-name rules, applied on
// every platform because the techs are on Windows and a folder renamed on a
// Mac that Windows then cannot open is the worse failure.
const RN_RESERVED = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;
function nameProblem(n) {
  if (!n) return 'the new name is empty';
  if (/[\/\\]/.test(n) || n === '.' || n === '..') return 'must be a plain file name, not a path';
  if (n.startsWith('.')) return 'a name starting with "." is hidden';
  if (/[\x00-\x1f]/.test(n)) return 'control characters in the name';
  const bad = [...new Set(n.split('').filter(c => '<>:"|?*'.includes(c)))].sort();
  if (bad.length) return 'not allowed in a file name: ' + bad.join(' ');
  if (n.endsWith(' ') || n.endsWith('.')) return 'a name cannot end in a space or a dot';
  if (n.length > 255) return 'name longer than 255 characters';
  const stem = n.split('.', 1)[0].trim();
  if (RN_RESERVED.test(stem)) return '"' + stem + '" is a reserved name on Windows';
  if (!/\.(sor|json|trc)$/i.test(n)) return 'the extension must stay .sor, .json or .trc';
  return null;
}

// The rows the FILES panel is showing for one direction, in its order.
function panelFiles(dir) {
  const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
  const files = (gInfo && gInfo['files_' + dir]) || [];
  const out = [];
  fibers.forEach((f, i) => {
    if (!files[i] || gRemovedFiles.has(`${dir}-${f}`)) return;
    out.push({ dir, fiber: f, name: files[i] });
  });
  return out;
}

function closeRenameDialog() {
  gRenameRows = [];
  for (const id of ['rn-dlg', 'rn-dlg-bg']) {
    const el = document.getElementById(id);

}

    const shown = gRenameRows.filter(r => r.matched !== false);

    shown.forEach(r => { r.cb.checked = anyOff; });
    renamePreview();
  };
  d.querySelector('#rn-list').addEventListener('change', ev => {
    if (ev.target.type === 'checkbox') renamePreview();
  });
