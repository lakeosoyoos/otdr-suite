    else if (cell.avgWarn) out.nWarn++;
    const r = cell.avgFail ? 2 : cell.avgWarn ? 1 : 0;
    const v = cell.avg != null && !isNaN(cell.avg) ? cell.avg : -Infinity;
    if (r > rank || (r === rank && (out.worst == null || v > out.worst))) {
      rank = r;
      out.worst = v === -Infinity ? null : v;
      out.worstFi = cell.fi;
    }
  }
  return out;
}

// Place tags along the bottom of the chart without covering one another.
// Each tag {x, full, short} goes on the first lane its full text fits, then
// the first its short text fits; failing both it is a small dot on the row
// above the lanes (lane === lanes; dots may touch, text never does, and a
// dot is still a click target).  `w(text)` measures; `lo`/`hi` bound the
// plot.  Returns [{lane, text, x0, x1}] in the tags' order.
function layoutDrawerTags(tags, w, lo, hi, lanes = DRAWER_LANES) {
  const GAP = 4, DOT = 8;
  const ends = new Array(lanes).fill(-Infinity);
  const order = tags.map((_t, i) => i).sort((a, b) => tags[a].x - tags[b].x);
  const out = new Array(tags.length);
  const place = (x, width) => {
    const x0 = Math.min(Math.max(lo, x - width / 2), Math.max(lo, hi - width));
    return [x0, x0 + width];
  };
  for (const i of order) {
    const t = tags[i];
    let got = null;
    for (const text of [t.full, t.short]) {
      if (text == null) continue;
      const [x0, x1] = place(t.x, w(text));
      const lane = ends.findIndex(e => x0 >= e + GAP);
      if (lane >= 0) { got = { lane, text, x0, x1 }; break; }
    }
    if (!got) {
      const [x0, x1] = place(t.x, DOT);
      out[i] = { lane: lanes, text: null, x0, x1 };
      continue;
    }
    ends[got.lane] = Math.max(ends[got.lane], got.x1);
    out[i] = got;
  }
  return out;
}

// Draw the marks of every table in the panel (`sets`, see gDrawerMarks);
// returns the traces they covered.  `failedOnly` marks only the cells that
// fail (Show Failed Event Labels); the rest are left to the files' own
// event numbers.
function drawPairing(sets, r, failedOnly = false) {
  const marked = cell => !failedOnly || drawerCellFailed(cell);
  const covered = new Set();
  const colorOf = (fail, warn) => fail ? DRAWER_COLOR.fail : warn ? DRAWER_COLOR.warn : DRAWER_COLOR.pass;
  const yAt = (t, km) => {
    const i = lowerBound(t.data.dist_km, km);
    return yToPx(dispDb(t, t.data.trace_db[Math.min(i, t.data.trace_db.length - 1)] ?? 0), r);
  };
  const tags = [];
  // Every label this frame takes its box from the chart's one pool (see
  // chartLabels), so a value never lands on a tag, an axis label or another
  // value (Robert 2026-10-01: labels must never run together, at any width).
  const labels = chartLabels(r);
  const pendingValues = [];         // value labels, placed after the tags
  // A value label's own spot first (A above and right, B below and right,
  // a filled-in leg on the other side), then the other three corners round
  // its tick, then the same four one line further out.  A label with no
  // clear spot is left off; its tick stays, and a click on it still goes to
  // the cell.
  const placeValueLabels = () => {
    ctx.font = "600 11px 'Segoe UI', sans-serif";
    const th = 13;
    for (const v of pendingValues) {
      const { q, py, txt, color } = v;
      const tw = ctx.measureText(txt).width;
      const left0 = q.leg.hollow, up0 = (q.w === 'a') !== left0;
      const near = q.leg.hollow ? 6 : 13;
      const spots = [];
      for (const out of [0, th]) {
        for (const [left, up] of [[left0, up0], [left0, !up0], [!left0, up0], [!left0, !up0]]) {
          const ty = up ? py - near - out : py + near + out;
          spots.push({ left, up, ty,
                       box: { x0: left ? q.px - 5 - tw : q.px + 4, x1: left ? q.px - 5 : q.px + 4 + tw,
                              y0: up ? ty - th : ty, y1: up ? ty : ty + th } });
        }
      }
      const fill = q.leg.hollow ? DRAWER_COLOR.gray
        : color === DRAWER_COLOR.warn ? '#8a7400' : color;
      const spot = labels.place(spots);
      if (!spot) {                    // the hover tip shows it (drawLabelTip)
        v.rec.hiddenText = txt; v.rec.hiddenColor = fill;
        continue;
      }
      ctx.globalAlpha = v.dim;
      ctx.textAlign = spot.left ? 'right' : 'left';
      ctx.textBaseline = spot.up ? 'bottom' : 'top';
      ctx.fillStyle = fill;
      ctx.fillText(txt, spot.left ? q.px - 5 : q.px + 4, spot.ty);
      const b = spot.box, h = v.rec;
      h.x0 = Math.min(h.x0, b.x0 - 2); h.x1 = Math.max(h.x1, b.x1 + 2);
      h.y0 = Math.min(h.y0, b.y0); h.y1 = Math.max(h.y1, b.y1);
    }
    ctx.globalAlpha = 1;
  };
  const inView = (lo, hi) => hi >= gView.x0 && lo <= gView.x1;
  const band = (lo, hi, color, alpha) => {
    const x0 = xToPx(lo, r), x1 = xToPx(hi, r);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.fillRect(x0 - 2, r.y, Math.max(4, x1 - x0 + 4), r.h);
    ctx.globalAlpha = 1;
  };
  const fmtV = v => v != null && !isNaN(v) ? v.toFixed(3) : null;
  for (const D of sets) {
    D.have.forEach(p => { if (p.ta) covered.add(p.ta); if (p.tb) covered.add(p.tb); });
    const pickFi = gPickKey ? D.have.findIndex(p => (p.ta && p.ta.key === gPickKey)
                                                 || (p.tb && p.tb.key === gPickKey)) : -1;
    // Counted over the fibres ON SCREEN, not the table's: the Report draws
    // each fibre's page by hiding the rest, and that page is drawn in full.
    const shown = new Set();
    D.have.forEach((p, fi) => {
      if ((p.ta && p.ta.visible) || (p.tb && p.tb.visible)) shown.add(fi);
    });
    const detail = shown.size <= DRAWER_DETAIL_MAX;
    const allTicks = shown.size <= DRAWER_TICK_MAX;
    // What a cell's value is called on its tag: the A+B tables' Average, or
    // a one-direction table's own loss.  A column may name and format its own
    // (`word`, `fmt`): the FEC table's reflectance column prints dB to 0.1.
    const word = D.single ? 'loss' : 'avg';
    // A leg's place: its own km on its own trace, or -- a gray leg the report
    // gave no km of its own -- the cell's km on that trace.
    const legAt = (p, cell, w) => {
      const leg = cell.legs[w];
      const t = w === 'a' ? p.ta : p.tb;
      if (!leg || !t || !t.visible) return null;
      const raw = leg.km != null ? leg.km
        : (leg.hollow && cell.km != null ? dataKmFromDisp(t, cell.km) : null);
      if (raw == null) return null;
      const dx = dispKm(t, raw);
      return { t, leg, w, raw, dx, px: xToPx(dx, r) };
    };
    // What a right-click on a mark or tag opens the span menu on: a leg that
    // is a real event of its file, at that event's own raw km.  A filled-in
    // leg is not one; the cell's other leg is (the boss, 2026-10-02: a
    // right-click on a gray mark or on a tag gave the browser's own menu).
    const legPick = (t, leg) => t && leg && !leg.hollow && leg.km != null
      ? { dir: t.dir, km: leg.km, fiber: t.fiber, src: t.src || t.dir } : null;
    const cellPicks = (p, cell) =>
      [legPick(p.ta, cell.legs.a), legPick(p.tb, cell.legs.b)].filter(Boolean);
    // A column's tag is every fibre's: each direction uses the first fibre
    // (the worst first) with a real event there, as the header's ⋯ does.
    const colPicks = (cells) => ['a', 'b'].map(w => {
      for (const c of cells) {
        const p = D.have[c.fi];
        const pk = legPick(w === 'a' ? p.ta : p.tb, c.legs[w]);
        if (pk) return pk;
      }
      return null;
    }).filter(Boolean);
    // One leg's mark.  `label` prints "A 0.175" beside it: A above, B below,
    // so the two directions' numbers never sit on one another.  A filled-in
    // leg's goes to the other side and the LEFT of its ring, clear of the
    // readings beside it (FastReporter copies a leg onto the other
    // direction's reading, a band's width away from its own).
    const legMark = (q, cell, ci, label, dim) => {
      const fi = cell.fi;
      const py = yAt(q.t, q.raw);
      const color = q.leg.hollow ? DRAWER_COLOR.gray : colorOf(q.leg.fail, q.leg.warn);
      ctx.globalAlpha = dim;
      ctx.strokeStyle = color === DRAWER_COLOR.warn ? '#b8a000' : color;
      ctx.lineWidth = label ? 1.8 : 1.2;
      if (q.leg.hollow) {
        ctx.beginPath(); ctx.arc(q.px, py, 4, 0, 2 * Math.PI); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(q.px, py - 12); ctx.lineTo(q.px, py + 12); ctx.stroke();
      }
      const hit = { x0: q.px - 6, x1: q.px + 6, y0: py - 12, y1: py + 12 };
      // An end or launch row has no loss to print: its mark alone says where.
      // Its value is placed after the tags, clear of them and of every
      // other value (placeValueLabels).
      const valueTxt = label && q.leg.loss != null && !isNaN(q.leg.loss)
        ? (q.w === 'a' ? 'A ' : 'B ') + q.leg.loss.toFixed(3) : null;
      ctx.globalAlpha = 1;
      // A reading is a real event of the file: the span menu works on it as
      // on the file's own event number.  A filled-in leg is not one.
      const rec = { ...hit, go: () => D.goCell(fi, q.w, ci), pick: q.t,
                    t: q.leg.hollow ? null : q.t,
                    e: q.leg.hollow ? null : { dist_km: q.raw },
                    menu: q.leg.hollow ? cellPicks(D.have[fi], cell) : [legPick(q.t, q.leg)] };
      gLabelHits.push(rec);
      if (valueTxt) pendingValues.push({ q, py, txt: valueTxt, color, dim, rec });
    };
    // One fibre at one column, in full: band, labeled ticks, its own tag.
    // A one-direction reading's number is on its tag, so its tick is bare.
    const fullCell = (col, cell, many) => {
      if (!marked(cell)) return;
      const p = D.have[cell.fi];
      const qs = ['a', 'b'].map(w => legAt(p, cell, w)).filter(Boolean);
      const xs = qs.map(q => q.dx);
      const lo = xs.length ? Math.min(...xs) : col.km, hi = xs.length ? Math.max(...xs) : col.km;
      if (!inView(lo, hi)) return;
      const color = colorOf(cell.avgFail, cell.avgWarn);
      band(lo, hi, color, 0.13);
      qs.forEach(q => legMark(q, cell, col.i, !D.single, 1));
      const v = (col.fmt || fmtV)(cell.avg);
      const who = many ? `F${fiberLabel(p.fiber)}${D.single ? ((p.ta ? ' A' : ' B')) : ''} ` : '';
      tags.push({ x: (xToPx(lo, r) + xToPx(hi, r)) / 2, color,
                  full: `${who}${col.title}${v ? `  ${col.word || word} ${v}` : ''}${cell.avgFail ? '  FAIL' : ''}`,
                  short: `${who}${v || col.title}`, menu: cellPicks(p, cell),
                  go: () => D.goCell(cell.fi, D.single ? (p.ta ? 'a' : 'b') : 'avg', col.i) });
    };
    for (const col0 of D.cols) {
      const col = { ...col0, cells: col0.cells.filter(c => shown.has(c.fi)) };
      if (!col.cells.length) continue;
      if (detail) {
        col.cells.forEach(cell => fullCell(col, cell, shown.size > 1));
        continue;
      }
      // The column as one: a band over its fibres' readings, their ticks,
      // one tag.  The picked fibre is drawn in full on top.  With Show
      // Failed Event Labels only the failing fibres are marked, and a column
      // with none is skipped; the tag still counts every fibre ("1/24 FAIL").
      const drawn = col.cells.filter(marked);
      if (!drawn.length) continue;
      let lo = Infinity, hi = -Infinity;
      const legs = [];
      for (const cell of drawn) {
        if (cell.fi === pickFi) continue;
        for (const w of ['a', 'b']) {
          const q = legAt(D.have[cell.fi], cell, w);
          if (!q) continue;
          if (q.dx < lo) lo = q.dx;
          if (q.dx > hi) hi = q.dx;
          if (allTicks || cell.avgFail) legs.push([q, cell]);
        }
      }
      if (lo > hi) lo = hi = col.km;           // no leg on screen: the column's own km
      const s = drawerColumnSummary(col);
      const color = colorOf(s.nFail > 0, s.nWarn > 0);
      if (inView(lo, hi)) {
        band(lo, hi, color, 0.09);
        const dim = pickFi >= 0 ? 0.3 : 0.75;
        legs.forEach(([q, cell]) => legMark(q, cell, col.i, false, dim));
        const worst = (col.fmt || fmtV)(s.worst);
        const count = s.nFail ? `  ${s.nFail}/${s.n} FAIL` : s.nWarn ? `  ${s.nWarn}/${s.n} warn` : '';
        const wp = D.have[s.worstFi];
        tags.push({ x: (xToPx(lo, r) + xToPx(hi, r)) / 2, color,
                    full: `${col.title}${worst ? `  max ${worst}` : ''}${count}`,
                    short: s.nFail ? `${s.nFail}/${s.n}` : (worst || col.title),
                    menu: colPicks([...drawn.filter(c => c.fi === s.worstFi),
                                    ...drawn.filter(c => c.fi !== s.worstFi)]),
                    go: () => D.goCell(s.worstFi, D.single && wp ? (wp.ta ? 'a' : 'b') : 'avg', col.i) });
      }
      const picked = col.cells.find(c => c.fi === pickFi);
      if (picked) fullCell(col, picked, true);
    }
  }
  // Tags last, over every band and tick, from the bottom of the chart up.
  ctx.font = "600 12px 'Segoe UI', sans-serif";
  const TAG_H = 18;
  const placed = layoutDrawerTags(tags, s => ctx.measureText(s).width + 12, r.x + 2, r.x + r.w - 2);
  placed.forEach((g, k) => {
    const t = tags[k];
    const y = r.y + r.h - 6 - (g.lane + 1) * (TAG_H + 3);
    ctx.fillStyle = t.color;
    if (g.text == null) {
      ctx.fillRect(g.x0, y + TAG_H - 8, g.x1 - g.x0, 8);
      gLabelHits.push({ x0: g.x0 - 2, x1: g.x1 + 2, y0: y + TAG_H - 10, y1: y + TAG_H + 2,
                        go: t.go, t: null, e: null, menu: t.menu });
      return;
    }
    ctx.fillRect(g.x0, y, g.x1 - g.x0, TAG_H);
    ctx.fillStyle = t.color === DRAWER_COLOR.warn ? '#3d3300' : '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(g.text, (g.x0 + g.x1) / 2, y + TAG_H / 2 + 0.5);
    gLabelHits.push({ x0: g.x0, x1: g.x1, y0: y, y1: y + TAG_H, go: t.go, t: null, e: null, menu: t.menu });
  });
  // The tags are down: they and every value placed so far are taken space.
  placed.forEach(g => {
    const y = r.y + r.h - 6 - (g.lane + 1) * (TAG_H + 3);
    labels.take({ x0: g.x0, x1: g.x1, y0: y, y1: y + TAG_H });
  });
  placeValueLabels();
  return covered;
}

// The A+B pairs of one span's traces: per listed fibre id, its A with its B
// (a copy row, "12 (copy 2)", has an id of its own and pairs with the
// other side's same copy).  A file set to the other direction than its
// folder's meets the folder's own file there: the folder's own pairs first,
// and every trace left over is a single with its own one-direction table
// (appendOneDirGrid) -- every trace shows its events and losses (Robert
// 2026-10-02).  `tkey` names the pair's table: the fibre for span 1's own A
// and B, as ever, else 'fibre:srcA:srcB'.
function pairTraces(traces) {
  const by = new Map();
  for (const t of traces) {
    const g = by.get(t.fiber) || { a: [], b: [] };
    g[t.dir].push(t);
    by.set(t.fiber, g);
  }
  const pairs = [], singles = [];
  for (const [fiber, g] of by) {
    g.a.sort((x, y) => (x.src[0] !== 'a') - (y.src[0] !== 'a'));
    g.b.sort((x, y) => (x.src[0] !== 'b') - (y.src[0] !== 'b'));
    const n = Math.min(g.a.length, g.b.length);
    for (let k = 0; k < n; k++) {
      const ta = g.a[k], tb = g.b[k];
      const tkey = (ta.src === 'a' && tb.src === 'b') ? String(fiber) : `${fiber}:${ta.src}:${tb.src}`;
      pairs.push({ fiber, ta, tb, tkey });
    }
    singles.push(...g.a.slice(n), ...g.b.slice(n));
  }
  return { pairs, singles };
}
// The /api/fr_table query for `pairs`: by fibre when every pair is span 1's
// own A and B, else each pair's two sources.
function frTableQuery(pairs) {
  return pairs.every(p => p.tkey === String(p.fiber))
    ? `fibers=${pairs.map(p => p.fiber).join(',')}`
    : `pairs=${pairs.map(p => `${p.fiber}:${p.ta.src}:${p.tb.src}`).join(',')}`;
}
// A fibre loaded one way among paired ones has no A+B table in either mode
// (FastReporter builds none for it either), but it is not left out: its own
// single-direction table sits under the A+B one, judged at the report's
// single-direction gate, and the drawer marks it as it marks an A-only load.
function appendOneDirGrid(singles, host) {
  const traces = singles.filter(t => t.visible);
  if (!traces.length) return;
  const box = document.createElement('div');
  box.className = 'onedir-box';
  const cap = document.createElement('div');
  cap.className = 'onedir-cap';
  cap.textContent = `One direction only: F${[...new Set(traces.map(t => t.fiber))].map(fiberLabel).join(', F')}`;
  box.appendChild(cap);
  host.appendChild(box);
  renderFastReporterGrid(traces, box, document.createElement('div'), { oneDir: true });
}

// Take the panel to one cell: row `fi`'s line for `which` ('a', 'b' or
// 'avg'; the fibre's Average when that line is filtered away), column `col`.
// `g` is the grid's {scroller, table, tb, descs, paintRows, topExtra?}; rows
// carry data-row="<fi>-<which>" and loss cells data-col, in every table.
// `topExtra()` is a pinned strip above the rows (the one-direction table's
// statistics names).  `opts.centre` puts the row in the middle of the window
// even when it is already on screen; `opts.refl` flashes the Refl. cell beside
// the loss cell (it follows it in every table) when the row is `which`'s own.
function gridGoCell(g, fi, which, col, opts = {}) {
  const { scroller, table, tb, descs } = g;
  let k = descs.findIndex(d => d[0] === fi && d[1] === which);
  if (k < 0) k = descs.findIndex(d => d[0] === fi && d[1] === 'avg');
  if (k < 0) k = descs.findIndex(d => d[0] === fi);
  if (k < 0) return;
  const headH = (table.tHead ? table.tHead.offsetHeight : 0) + (g.topExtra ? g.topExtra() : 0);
  const rowTop = headH + k * FR_ROW_H;
  const view = scroller.clientHeight - headH - pinnedFootH(table);
  const winTop = scroller.scrollTop + headH, winBot = winTop + view;
  if (opts.centre || rowTop < winTop || rowTop + FR_ROW_H > winBot) {
    scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
  }
  g.paintRows(k);
  const tr = tb.querySelector(`tr[data-row="${descs[k][0]}-${descs[k][1]}"]`);
  const loss = tr && tr.querySelector(`td[data-col="${col}"]`);
  const td = (opts.refl && descs[k][1] === which && loss && loss.nextElementSibling) || loss;
  if (!td) return;
  table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
  const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
  const leadW = tr.cells[0].offsetWidth;
  const dxL = cr.left - (sr.left + leadW) - 8;
  const dxR = cr.right - sr.right + 8;
  if (dxL < 0) scroller.scrollLeft += dxL;
  else if (dxR > 0) scroller.scrollLeft += dxR;
  td.classList.add('fr-hit');
  setTimeout(() => td.classList.add('fading'), 1500);
  setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
}
// A report link (?fiber=354&km=44.099, a report cell click) zoomed the chart
// to the event and left the table on its first column.  Once the table is up,
// it goes to the column whose event is nearest the km (within half a km, in
// the chart's frame, as the headers' own zoom clicks are), brings that
// fiber's row into view when others are loaded too, and flashes the header.
const TABLE_GO_TOL_KM = 0.5;
function tableGoKm() {
  const go = gTableGoKm;
  if (!go) return;
  gTableGoKm = null;
  const host = document.getElementById('event-tbody-wrap');
  const heads = host ? [...host.querySelectorAll('th.fr-evhdr[data-km]')] : [];
  let th = null, best = TABLE_GO_TOL_KM;
  for (const h of heads) {
    const d = Math.abs(+h.dataset.km - go.km);
    if (d <= best) { best = d; th = h; }
  }
  if (!th) return;
  if (new Set(gTraces.map(t => t.fiber)).size > 1 && gGridGoTo) {
    const t = gTraces.find(x => x.visible && x.fiber === go.fiber);
    if (t) gGridGoTo(t, null);
  }
  const scroller = th.closest('table') && th.closest('table').parentElement;
  if (!scroller) return;
  // The fiber column stays put and covers the left edge.
  const sr = scroller.getBoundingClientRect(), cr = th.getBoundingClientRect();
  const lab = th.closest('thead').querySelector('th.fr-rowlab');
  const leadR = lab ? Math.max(sr.left, lab.getBoundingClientRect().right) : sr.left;
  if (cr.left < leadR + 8 || cr.right > sr.right - 8) {
    // centered in what the labels leave
    scroller.scrollLeft += (cr.left + cr.right) / 2 - (leadR + sr.right) / 2;
  }
  th.classList.remove('fr-hit', 'fading');
  th.classList.add('fr-hit');
  setTimeout(() => th.classList.add('fading'), 1500);
  setTimeout(() => th.classList.remove('fr-hit', 'fading'), 2200);
}

// The two A+B tables' Minimum and Maximum cells, like the one-direction
// table's (#274): the number is one fibre's, so a click picks that row (the
// Average row for a loss, the direction's row for a reflectance), centres it,
// flashes the cell it came from and draws its trace bold.  Again lets go.
// `fi` is the fibre's index in `have`; -1 (nobody, or a blank cell) gives none.
function aggOwnAttrs(have, fi, which, col, refl) {
  if (fi < 0) return '';
  const p = have[fi];
  const dir = which === 'a' ? ' A→B' : which === 'b' ? ' B→A' : '';
  return ` class="fr-own" data-own-fi="${fi}" data-own-w="${which}" data-own-col="${col}"`
       + (refl ? ' data-own-refl="1"' : '') + ` title="F${fiberLabel(p.fiber)}${dir}: click to find it"`;
}
function wireAggJump(g, have) {
  const footer = g.table.tFoot;
  if (!footer) return;
  footer.addEventListener('click', (ev) => {
    const td = ev.target.closest('td.fr-own');
    if (!td) return;
    const fi = +td.dataset.ownFi, which = td.dataset.ownW, p = have[fi];
    if (!p) return;
    const keys = (which === 'avg' ? [p.ta, p.tb] : [which === 'b' ? p.tb : p.ta])
      .filter(Boolean).map(t => t.key);
    const dir = which === 'a' ? ' A→B' : which === 'b' ? ' B→A' : '';
    if (samePick(keys)) { gPickKey = null; g.paintRows(); draw(); setReadout(''); return; }
    gPickKey = keys.length === 1 ? keys[0] : keys;
    if (!g.descs.some(d => d[0] === fi)) {   // its rows are filtered out of the grid
      g.paintRows(); draw();
      setReadout(`F${fiberLabel(p.fiber)}${dir} holds it. Its row is hidden by "Show only flagged rows"`);
      return;
    }
    gridGoCell(g, fi, which, +td.dataset.ownCol, { centre: true, refl: !!td.dataset.ownRefl });
    draw();                                  // bold above, the rest dimmed
    setReadout(`F${fiberLabel(p.fiber)}${dir} holds it. Click the cell again to let go`);
  });
}
// A trace's event nearest a display km: the one a click between events on
// its line stands for.
function nearestEvent(t, km) {
  let best = null, bd = Infinity;
  for (const e of (t.data.events || [])) {
    const d = Math.abs(dispKm(t, e.dist_km) - km);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function labelHit(px, py) {
  // Last drawn is on top, so search from the end.
  for (let i = gLabelHits.length - 1; i >= 0; i--) {
    const h = gLabelHits[i];

// ─── Trace under the cursor ───────────────────────────────────────────
// Robert 2026-09-30: hover a trace and the chart says which fiber it is;
// click it and the event table goes to that fiber's row.  FastReporter has
// neither (driven 2026-09-30: a trace line gives no tooltip and a click on
// one picks nothing; only an event mark has a tooltip, its Type, Position and
// Loss), so this one is the Viewer's own.  The box names the fiber only: no
// km or dB, which stay off the hover (Robert 2026-09-29), and one fiber
// only, the nearest, even where a bundle overlaps (Robert 2026-09-30).
const TRACE_HIT_PX = 5;                // this near the drawn line is "on" it

function segDist(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy;
  const u = L > 0 ? Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / L)) : 0;
  return Math.hypot(x0 + u * dx - px, y0 + u * dy - py);
}
// Every visible trace whose line passes within TRACE_HIT_PX of (px, py),
// nearest first, as [{t, d}].  Measured to the line between samples, so a
// steep fall (an end, a break) is as easy to land on as the flat backscatter,
// and over the same samples drawTrace strokes (its window and its step), so
// what is hit is what is drawn and a whole cable stays quick to hover.
function traceHits(px, py, r) {
  if (!gView || px < r.x || px > r.x + r.w || py < r.y || py > r.y + r.h) return [];
  const kmA = pxToX(px - TRACE_HIT_PX, r), kmB = pxToX(px + TRACE_HIT_PX, r);
  const hits = [];
  const span = (t, a, b) => {                    // display km -> data km, low first
    const p = dataKmFromDisp(t, a), q = dataKmFromDisp(t, b);
    return p <= q ? [p, q] : [q, p];             // a flipped B runs backwards

    if (!t.visible) continue;
    const xs = t.data.dist_km, ys = t.data.trace_db, n = xs.length;
    if (!n) continue;
    const [vlo, vhi] = span(t, gView.x0, gView.x1);
    const v0 = Math.max(0, lowerBound(xs, vlo) - 1);
    const v1 = Math.min(n - 1, upperBound(xs, vhi) + 1);
    const step = Math.max(1, Math.floor(Math.max(1, (v1 - v0) / r.w) / 2));
    const [lo, hi] = span(t, kmA, kmB);
    let i0 = Math.max(v0, lowerBound(xs, lo) - step);
    i0 = v0 + Math.floor((i0 - v0) / step) * step; // on drawTrace's own points
    const i1 = Math.min(v1, upperBound(xs, hi) + step);
    let x0 = xToPx(dispKm(t, xs[i0]), r), y0 = yToPx(dispDb(t, ys[i0]), r);
    let best = Math.hypot(x0 - px, y0 - py);
    for (let i = i0 + step; i <= i1; i += step) {
      const x1 = xToPx(dispKm(t, xs[i]), r), y1 = yToPx(dispDb(t, ys[i]), r);
      best = Math.min(best, segDist(px, py, x0, y0, x1, y1));
      x0 = x1; y0 = y1;
    }

}

  const PAD = 6, SW = 10, GAP = 6, OFF = 14, BH = 24;
  ctx.font = "12px 'Segoe UI', sans-serif";
  const bw = PAD * 2 + SW + GAP + ctx.measureText(text).width;
  const cw = canvas.width / canvasDpr(), ch = canvas.height / canvasDpr();
  let bx = gMouse.px + OFF, by = gMouse.py + OFF;
  if (bx + bw > cw - 2) bx = gMouse.px - OFF - bw;

  // Traces of more than one span: one plain line and no table at all, not
  // a merged one, not one span's (Robert 2026-10-02: "we should have an
  // error that says we are trying to display multiple spans and show
  // nothing. we don't want to attempt").  The table comes back as soon as
  // one span's traces are showing.
  if (new Set(visible.map(t => t.span || 1)).size > 1) {
    hint.textContent = '';
    host.innerHTML = `<div class="tbl-multispan">${MULTI_SPAN_NOTE}</div>`;
    return;
  }

  // The FastReporter grid, at any size.  It used to be capped at two traces
  // because the column clustering was cubic and the rows were all built up
  // front; both are fixed (see clusterColumns and paintRows), so the whole
  // cable gets the layout the report and FR itself use.  The tech loading a
  // tray no longer drops to a flat list with no statistics on the end of it —
  // which is exactly what the field reported.
  // Every fibre loaded in both directions gets a bidirectional table (A→B,
  // B→A, Average), in the app's analysis mode: the Splice Report's own in
  // OTDR Suite mode, FastReporter's in FastReporter mode.  The
  // single-direction grid stands in when nothing is paired.
  if (gFecMode && renderFecGrid(visible, host, hint)) return;
  const server = gAnalysisMode === 'suite'
    ? renderSuiteBidiGrid(visible, host, hint) : renderFrBidiGrid(visible, host, hint);
  if (!server) {
    renderFastReporterGrid(visible, host, hint);
    return;
  }
  if (gTableBusy && prev.length) holdOldTable(host, prev);
}

// ── FEC mode table ──────────────────────────────────────────────────────
// One row per trace, never paired: the panel connector after the launch
// reel, the events within the combine reach behind it, the combined loss and
// the reflectance, judged by the engine's FEC rule (run_splicereport.py
// fec_grade) at the customer profile's FEC gates -- the same numbers the
// Splice Report FEC tool prints.  The side is the folder the trace came
// from (A box / B box), not a direction.
let gFecSeq = 0;
// The FEC gates on the Viewer's own boxes (Robert 2026-10-02, "show FEC
// gates in the boxes"): Loss shows the FEC loss gate (> when strict, as the
// profile decides), the Refl Band's low end the FEC reflectance gate, and
// its high end is 0 and fixed, since FEC fails any reflectance above the
// gate.  Typing in a box overrides that gate for this window only, as the
// Viewer's Loss box overrides the report's; the customer profile is never
// changed.  Typing the profile's value back lets go.
let gFecGates = null;                  // the gates the table on screen was graded at
let gFecBase = null;                   // the profile's, from the last un-overridden read
const gFecOverride = { loss: null, refl: null };
function fecOverridden() { return gFecOverride.loss != null || gFecOverride.refl != null; }
function setFecGateOverride(which, v) {
  const key = which === 'loss' ? 'FEC_LOSS_GATE' : 'FEC_REFL_GATE';
  const base = gFecBase ? Number(gFecBase[key]) : null;
  gFecOverride[which] = (base != null && Math.abs(v - base) < 1e-9) ? null : v;
  renderEventTable();
}
// Before a table is graded: the profile's gates as the server has them
// (none = the engine's defaults, known after the first read).
function fecGatesShown() {
  return gFecGates || gFecBase || (gInfo && gInfo.fec_gates
    && gInfo.fec_gates.FEC_LOSS_GATE != null ? gInfo.fec_gates : null);
}
function fecGateLabel() {
  const g = fecGatesShown();
  if (!g) return 'FEC gates: loading';
  return `FEC: ${fecGateText(g)}${fecOverridden() ? ', overridden in this window' : ', customer profile'}`;
}
function syncFecGateUI() {
  const g = fecGatesShown();
  const loss = document.getElementById('set-loss');
  const lo = document.getElementById('set-refl-lo');
  const hi = document.getElementById('set-refl-hi');
  const op = document.getElementById('loss-op');
  if (loss) loss.value = g ? Number(g.FEC_LOSS_GATE).toFixed(3) : '';
  if (lo) lo.value = g ? Number(g.FEC_REFL_GATE).toFixed(1) : '';
  if (op && g) op.textContent = g.FEC_LOSS_STRICT ? 'Loss >' : 'Loss ≥';
  if (lo) lo.step = '0.1';
  if (hi) {
    hi.value = '0';
    hi.disabled = true;
    hi.title = 'FEC fails any reflectance above the low end; there is no high end';
  }
  if (loss) loss.title = `${fecGateLabel()}. Type to override for this window; the profile is not changed.`;
  const lbl = document.getElementById('gate-src');
  if (lbl) {
    lbl.textContent = fecOverridden() ? '(FEC gates overridden)' : '';
    lbl.classList.toggle('overridden', fecOverridden());
  }
}
function renderFecGrid(traces, host, hint) {
  const fibers = [...new Set(traces.map(t => t.fiber))];
  if (!fibers.length) return false;
  const seq = ++gFecSeq;
  hint.textContent = `FEC table: grading ${traces.length} trace${traces.length === 1 ? '' : 's'}…`;
  const ov = (gFecOverride.loss != null ? `&loss_gate=${gFecOverride.loss}` : '')
           + (gFecOverride.refl != null ? `&refl_gate=${gFecOverride.refl}` : '');
  fetch(`/api/fec_table?fibers=${fibers.join(',')}${ov}`)
    .then(r => r.json())
    .then(res => { if (seq === gFecSeq) paintFecGrid(traces, res || {}, host, hint); })
    .catch(e => {
      if (seq !== gFecSeq) return;
      hint.textContent = `FEC table unavailable (${(e && e.message) || 'fetch failed'})`;
    });

}
function fecGateText(g) {
  if (!g) return '';
  return `loss ${g.FEC_LOSS_STRICT ? '>' : '≥'} ${Number(g.FEC_LOSS_GATE).toFixed(3)} dB `
       + `(connector + events within ${Number(g.FEC_COMBINE_M).toFixed(0)} m), `
       + `reflectance > ${Number(g.FEC_REFL_GATE).toFixed(1)} dB`;
}
function paintFecGrid(traces, res, host, hint) {
  host.innerHTML = '';
  gGridGoTo = null;
  const grades = res.grades || {};
  const gates = res.gates || null;
  // the boxes show what this table was graded at (see syncFecGateUI)
  gFecGates = gates;
  if (gates && !fecOverridden()) gFecBase = gates;
  syncGateUI();
  const all = traces.map(t => {
    const side = t.src[0] === 'b' ? 'B' : 'A';      // 'b2', 'br2' -> B
    // The server grades span 1's own two folders; a copy or another span's
    // file shows ungraded rather than take span 1's grade of its fiber.
    const own = t.src === 'a' || t.src === 'b';
    return { t, side, g: own ? ((grades[side] || {})[String(t.fiber)] || null) : null };
  });
  const fails = all.filter(r => r.g && (r.g.fail_loss || r.g.fail_refl)).length;
  // The chart numbers only what the table prints, as on the Viewer's other
  // tables (see tableMark; Robert 2026-10-01, "make FEC viewer match Viewer
  // in all areas"): each graded trace's panel connector and the events the
  // rule combines with it.  The grade's km comes from the engine's own read
  // of the file, so each is matched to the trace's nearest event within
  // FEC_MARK_TOL_KM.  A trace with no grade keeps every number, as a trace
  // no table has taken does.
  const FEC_MARK_TOL_KM = 0.005;
  const graded0 = all.filter(r => r.g && r.g.found);
  tableMarkReset(graded0.map(r => r.t));
  // Each trace's own events behind its row, by key: the panel connector's
  // ('conn') and the combined ones' ('comb'), for the span menu (an event's
  // own raw km) and for an event number clicked on the chart (its cell).
  const evAt = new Map();              // t.key -> {conn: km, comb: [km]}
  const evCol = new Map();             // `${t.key}|${tableKmKey(km)}` -> cell
  for (const { t, g } of graded0) {
    const evs = (t.data && t.data.events) || [];
    const own = { conn: null, comb: [] };
    [g.conn_km, ...(g.combined || []).map(c => c.km)].forEach((km, k) => {

      for (const e of evs) {

      }
      if (!best) return;
      tableMark(t, best.e.dist_km);
      evCol.set(`${t.key}|${tableKmKey(best.e.dist_km)}`, k === 0 ? 'conn' : 'comb');
      if (k === 0) own.conn = best.e.dist_km; else own.comb.push(best.e.dist_km);
    });
    evAt.set(t.key, own);
  }
  // The gear's switches, the FEC way.  A gainer (a negative connector or FEC
  // loss: one trace's reading) prints blank with Show Gainers off and leaves
  // the Minimum / Maximum / Average; it never fails, so no verdict moves.
  // "Failing cells only" keeps the traces that fail and, on them, only what
  // failed: the loss with the connector and events it adds up, and/or the
  // reflectance.  FEC grades pass or fail, with no warning band, so
  // "warning cells only" alone keeps nothing.
  const num = v => v != null && !isNaN(v);
  const hideG = v => gainerHidden(v);
  const kept = (g, col) => !cellFilterOn() || (gFailCellsOnly && !!g && !!(col === 'refl' ? g.fail_refl : g.fail_loss));
  const collapse = cellFilterOn();
  // "Show Only Flagged Rows" (the table's ⋯ menu) keeps the traces that fail
  const failsRow = g => !!(g && (g.fail_loss || g.fail_refl));
  const rows = all.filter(({ g }) => (!gFlaggedOnly || failsRow(g))
    && (!collapse || (gFailCellsOnly && failsRow(g))));
  hint.textContent = `FEC: ${all.length} trace${all.length === 1 ? '' : 's'}, ${fails} failing`
    + (gates ? `  ·  fails on ${fecGateText(gates)}` : '')
    + (res.error ? `  ·  ${res.error}` : '')
    + (gFailCellsOnly ? `  ·  failing cells only${fails ? '' : ': nothing fails'}` : '')
    + (gWarnCellsOnly ? '  ·  warning cells only: FEC has no warning band' : '')
    + (gShowGainers ? '' : '  ·  gainers hidden')
    + (gFlaggedOnly ? `  ·  flagged rows only${fails ? '' : ': nothing fails'}` : '')
    + (fecOverridden() ? '  ·  gates overridden in this window' : '');
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';

    return d === 0 ? Math.round(v).toLocaleString() : v.toFixed(d);
  };

             'Connector<br>Loss (dB)', 'Combined With', 'FEC Loss<br>(dB)',

  const head = H.map((h, i) => `<th class="${i === 0 ? 'fr-rowlab ' : ''}${i === 4 ? 'fr-evhdr' : ''}" data-col="0">${h}</th>`).join('');
  const f3 = v => (v == null || isNaN(v)) ? '---' : Number(v).toFixed(3);
  const f1 = v => (v == null || isNaN(v)) ? '---' : Number(v).toFixed(1);
  const fecHi = x => (x && !flagsOff()) ? 'fr-hi' : '';

    const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;`

      + `<td class="${pfClass(fail)}" title="FEC rule: ${fecGateText(gates)}">${pfMark(fail)}</td>`
      + `<td>${(t.data && t.data.wavelength_nm) || '---'}</td><td>${side}</td>`
      + `<td class="fr-fec-km" data-col="km" data-km="${g.conn_km}" style="cursor:pointer" title="zoom to the connector">${dist(g.conn_km, 4)}</td>`
      + `<td data-col="conn">${lossTxt(g, g.conn_loss)}</td><td data-col="comb">${kept(g, 'loss') ? (comb || '---') : ''}</td>`
      + `<td data-col="loss" class="${hideG(g.loss) ? '' : fecHi(g.fail_loss)}">${lossTxt(g, g.loss)}</td>`
      + `<td data-col="refl" class="${fecHi(g.fail_refl)}">${kept(g, 'refl') ? f1(g.refl) : ''}</td>`
      + `<td>${fail ? where : ''}</td></tr>`;
  });
  // Minimum / Maximum / Average down each number column, as every other
  // Viewer table ends, over the figures the column prints (the rows on screen,
  // less the cells a filter or Show Gainers blanks).  A Minimum or Maximum is
  // one trace's figure, so the cell names it and a click finds its row (the
  // owner is matched on the PRINTED figure; ties go to the first row).  The
  // Average is nobody's measurement and stays inert; all three stay plain,
  // since the FEC verdict is per trace.
  const graded = rows.map((r, ti) => ({ ...r, ti })).filter(r => r.g && r.g.found);
  const AGG_COLS = [['km', g => g.conn_km, v => dist(v, 4), () => true],
                    ['conn', g => g.conn_loss, f3, g => kept(g, 'loss') && !hideG(g.conn_loss)],
                    ['loss', g => g.loss, f3, g => kept(g, 'loss') && !hideG(g.loss)],
                    ['refl', g => g.refl, f1, g => kept(g, 'refl')]];
  const aggCell = (col, fn, owned) => {
    const [key, get, fmt, prints] = col;
    const have = graded.filter(r => num(get(r.g)) && prints(r.g));
    if (!have.length) return `<td>${collapse ? '' : '---'}</td>`;
    const v = fn(have.map(r => Number(get(r.g))));
    const own = owned ? have.find(r => fmt(get(r.g)) === fmt(v)) : null;
    return own
      ? `<td class="fr-own" data-ti="${own.ti}" data-own-col="${key}"`
        + ` title="F${fiberLabel(own.t.fiber)} ${own.side}: click to find it">${fmt(v)}</td>`
      : `<td>${fmt(v)}</td>`;
  };
  const aggRow = (label, fn, owned) => {
    const c = AGG_COLS.map(col => aggCell(col, fn, owned));
    return `<tr class="fr-agg"><td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`
      + `${c[0]}${c[1]}<td></td>${c[2]}${c[3]}<td></td></tr>`;
  };
  const aggRows = graded.length ? [

    aggRow('Maximum', a => Math.max(...a), true),

  table.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body.join('')}</tbody>`
    + (aggRows.length ? `<tfoot>${aggRows.join('')}</tfoot>` : '');

  scroller.appendChild(table);
  host.appendChild(scroller);
  // one header row: pin it at the top (the stylesheet's offsets are for the
  // three-row FR headers, which set their own per row the same way)

  });
  // A click on a trace on the chart (goToTrace) lands here: its row, marked
  // and centred.  An event number clicked on the chart (`e`) flashes its own
  // cell, as on the other tables: the connector's loss, or the Combined With
  // cell for an event the rule adds to it.  A row a filter has taken out
  // says so instead.
  gGridGoTo = (t, e) => {
    markPick();
    const tr = tb.querySelector(`tr[data-key="${t.key}"]`);
    if (!tr) {
      setReadout(`F${fiberLabel(t.fiber)}: its row is hidden by "${gFlaggedOnly ? 'Show Only Flagged Rows' : 'Show Failing Cells Only'}"`);

    }

    const col = e ? evCol.get(`${t.key}|${tableKmKey(e.dist_km)}`) : null;

  };

  // trace's row, or the ⋯ on the Panel Connector header.  The event it is
  // picked on is the trace's own: the combined event for a right-click on
  // Combined With, the panel connector anywhere else on the row.

    const own = evAt.get(t.key);
    const km = own && ((which === 'comb' && own.comb[0] != null) ? own.comb[0] : own.conn);
    if (km == null) return false;

    return true;
  };
  tb.addEventListener('contextmenu', (ev) => {
    const tr = ev.target.closest('tr[data-key]');
    const r = tr && rows[+tr.dataset.ti];

  });

  // row, at that trace's own connector.

  // drawPairing), as a one-direction table: each trace's panel connector
  // (tagged with its FEC loss), every event the rule combines with it (its
  // own loss) and the connector's reflectance, colored by the FEC verdict --
  // a combined event fails with the loss it is part of.  Each trace is its
  // own "fibre", on the side it came from.  Only the cells the table prints
  // are marked, so the filters reach the chart.
  const fecRows = rows.filter(r => r.g && r.g.found);
  const fecHave = fecRows.map(({ t, side }) => side === 'A' ? { fiber: t.fiber, ta: t } : { fiber: t.fiber, tb: t });
  const fecCell = (r, fi, km, v, fail) => {
    const w = r.side === 'A' ? 'a' : 'b';

  };

    const cells = fecRows.map((r, fi) => (kept(r.g, key) && at(r.g) != null)
      ? fecCell(r, fi, at(r.g), val(r.g), fail(r.g)) : null).filter(Boolean);
    return { i: ci, title, km: cells.length ? cells[0].km : 0, cells };
  };
  const nComb = Math.max(0, ...fecRows.map(r => (r.g.combined || []).length));
  const combCols = Array.from({ length: nComb }, (_x, k) => fecCol(2 + k,
    nComb > 1 ? `Combined Event ${k + 1}` : 'Combined Event', 'loss',
    g => (g.combined || [])[k] ? g.combined[k].km : null,
    g => { const v = g.combined[k].loss; return hideG(v) ? null : v; },
    g => g.fail_loss));
  if (fecRows.length) gDrawerMarks.push({
    mode: 'fec', single: true, have: fecHave,
    cols: [fecCol(0, 'Panel Connector', 'loss', g => g.conn_km,
                  g => hideG(g.loss) ? null : g.loss, g => g.fail_loss),
           ...combCols,
           { ...fecCol(1, 'Connector Refl.', 'refl', g => g.conn_km, g => g.refl, g => g.fail_refl),
             word: 'refl', fmt: v => (v != null && !isNaN(v)) ? v.toFixed(1) : null }]
      .filter(c => c.cells.length),
    // a tag or tick goes to that trace's row and flashes the cell it marks
    goCell: (fi, _w, ci) => {
      const t = fecRows[fi] && fecRows[fi].t;
      if (!t) return;
      gPickKey = t.key;
      markPick();
      draw();
      const tr = tb.querySelector(`tr[data-key="${t.key}"]`);
      if (!tr) return;
      centre(tr);
      const cell = tr.querySelector(`td[data-col="${ci === 1 ? 'refl' : ci >= 2 ? 'comb' : 'loss'}"]`);
      if (cell) flash(cell);
    },
  });
  draw();
}

// The flat per-trace list.  Nothing routes here any more — the grid scales, so
// it is the one event view — but it is kept whole and self-contained rather
// than half-deleted, because its virtualisation is the pattern the grid copies
// and its row model is what `flagEvent` is tested through.
function renderFlatEventList(visible, host, hint) {
  host.innerHTML = '';

  // 3+ traces → flat per-trace list, VIRTUALISED.
  //
  // Building a real <tr> per event does not survive cable scale: 1152 fibers
  // produced a 172,140 px tall table (~4,600 rows) that pushed the canvas off
  // the page entirely.  Rows are laid out on a fixed-height spacer and only
  // the visible slice is in the DOM, so 1152 fibers cost the same as 12.
  //
  // Every event is listed, flagged or not; the flagged ones are highlighted
  // and can be isolated with the "Show only flagged rows" toggle.
  const rows = buildEventRows(visible);
  const nFlag = rows.filter(r => r.flag).length;
  hint.textContent =
    `${visible.length} trace${visible.length === 1 ? '' : 's'}, ${rows.length} events` +
    (nFlag ? `, ${nFlag} flagged` : ', none flagged') +
    (gFlaggedOnly ? ' (showing flagged rows only)' : '');
  renderVirtualEventList(rows.filter(r => !gFlaggedOnly || r.flag), host);
}

// Flat, sortable row model for the event list.  `flag` and `why` come from the
// same rules the unidirectional report applies, evaluated per event.
//
// `km` is the DISPLAYED km — the same frame the canvas draws the marker in and
// the same one the FR grid clusters on (`renderFastReporterGrid` calls dispKm
// too).  Listing the raw km here put A and B rows in two different frames: F71's
// B event #4 printed 11.2782 while its marker sat at 54.8116, and the sort below
// interleaved the two rows' events in an order that matched neither picture.
// `flagEvent` still gets the RAW event, since its rules are own-frame.
function buildEventRows(traces) {
  const out = [];
  for (const t of traces) {
    const arrow = (t.dir === 'a' ? 'A→B' : 'B→A') + (t.src && t.src.length > 1 ? srcTag(t.src) : '');
    for (const e of (t.data.events || [])) {
      const v = flagEvent(e, t);
      out.push({
        fiber: t.fiber, dir: t.dir, arrow, color: t.color,
        num: e.number, km: dispKm(t, e.dist_km),
        loss: e.splice_loss, refl: e.reflection, slope: e.slope,
        isEnd: !!e.is_end, isRefl: !!e.is_reflective,
        flag: v.flag, why: v.why,
      });
    }
  }
  out.sort((a, b) => realFiber(a.fiber) - realFiber(b.fiber) || a.fiber - b.fiber || a.km - b.km);
  return out;
}

// Distance the way every OTDR Suite report prints it: both units, one cell.
// 4 decimals on the km — the viewer places events, the reports round to 10 m.
// ─── Distance unit (Robert, 2026-09-24): FastReporter's five, picked from
// an event's ⋯ menu, and applied to every distance the Viewer shows.
// Remembered on this PC.  km keeps the "km, feet" pair the boss asked for.
const DIST_UNITS = {
  km:  { f: 1,          label: 'km',  name: 'km (Kilometers)', dp: 4 },
  mi:  { f: 0.621371,   label: 'mi',  name: 'mi (Miles)',      dp: 4 },
  kft: { f: 3.2808399,  label: 'kft', name: 'kft (Kilofeet)',  dp: 3 },
  m:   { f: 1000,       label: 'm',   name: 'm (Meters)',      dp: 1 },
  ft:  { f: 3280.8399,  label: 'ft',  name: 'ft (Feet)',       dp: 0 },
};
let gDistUnit = (() => {
  try { const u = localStorage.getItem('otdr.distUnit'); return DIST_UNITS[u] ? u : 'km'; }
  catch (e) { return 'km'; }
})();
function distU() { return DIST_UNITS[gDistUnit]; }
// One distance, in the chosen unit, with its unit ("26.1036 mi").
function fmtDist(km, dp) {
  const u = distU();
  const v = km * u.f;
  const d = dp == null ? u.dp : dp;
  return (d === 0 ? Math.round(v).toLocaleString() : v.toFixed(d)) + ' ' + u.label;
}
function setDistUnit(u) {
  if (!DIST_UNITS[u]) return;
  gDistUnit = u;
  try { localStorage.setItem('otdr.distUnit', u); } catch (e) { /* private mode */ }
  draw();
  renderEventTable();
  updateMarkerReadout();
  setReadout('distances in ' + DIST_UNITS[u].name);
}
function kmFt(km) {
  if (gDistUnit !== 'km') return fmtDist(km);
  return `${km.toFixed(4)}km, ${Math.round(km * 3280.84).toLocaleString()}'`;
}

// The Min/Max/Average strip's height when it is pinned over the rows; 0 when
// "Pin Min/Max/Average" is off and it sits under the last row instead.
function pinnedFootH(table) {
  if (!table.tFoot || document.getElementById('event-panel').classList.contains('agg-unpinned')) return 0;
  return table.tFoot.offsetHeight;
}

const EVENT_ROW_H = 22;                 // must match the CSS row height
const FR_ROW_H    = 22;                 // ditto, for the FastReporter grid

// Fit every column to its contents, across ALL rows, not the slice on screen.
// The tables are virtual, so left to itself the browser sizes a column to the
// few rows painted and the columns jump as you scroll.  Each column's longest
// cell (by characters) is found in the row HTML, those few rows are laid out
// once on a hidden copy of the table with its header and footer, and the
// widths it lands on are pinned with a <colgroup>.  In the auto layout the
// grids use a <col> width is a floor, so a cell a character wider than
// guessed still gets its room.
function fitColumns(table, rows, extra) {
  const best = [];                      // per column: [length, row index]
  let ncol = 0;
  rows.forEach((html, k) => {
    let c = 0;
    for (const m of html.matchAll(/<t([dh])\b([^>]*)>([\s\S]*?)<\/t\1>/g)) {
      const span = +((/colspan="(\d+)"/.exec(m[2]) || [])[1] || 1);
      if (span === 1) {
        const len = m[3].replace(/<[^>]*>/g, '').replace(/&[#\w]+;/g, 'x').length;
        if (!best[c] || len > best[c][0]) best[c] = [len, k];
      }
      c += span;
    }
    ncol = Math.max(ncol, c);
  });
  const pick = [...new Set(best.filter(Boolean).map(b => b[1]))].map(k => rows[k]);
  const probe = table.cloneNode(false);
  probe.style.cssText = 'position:absolute;left:-100000px;top:0;visibility:hidden;'
                      + 'width:max-content;table-layout:auto';
  if (table.tHead) probe.appendChild(table.tHead.cloneNode(true));
  const tb = document.createElement('tbody');
  // The ruler: one empty cell per column, so a colspan anywhere above cannot
  // hide where a column starts and ends.
  tb.innerHTML = (extra || '') + pick.join('')
    + `<tr>${'<td style="padding:0;border:0;height:0"></td>'.repeat(ncol)}</tr>`;
  probe.appendChild(tb);
  if (table.tFoot) probe.appendChild(table.tFoot.cloneNode(true));
  document.body.appendChild(probe);
  const widths = [...tb.rows[tb.rows.length - 1].cells]
    .map(td => +td.getBoundingClientRect().width.toFixed(2));
  probe.remove();
  if (widths.some(w => w > 0)) {
    const cg = document.createElement('colgroup');
    cg.innerHTML = widths.map(w => `<col style="width:${w}px">`).join('');
    const old = table.querySelector(':scope > colgroup');
    if (old) old.remove();
    table.insertBefore(cg, table.firstChild);
  }
}

function renderVirtualEventList(rows, host) {
  const head = document.createElement('table');
  head.className = 'evt-head';
  // One distance column, both units in the cell — the same
  // "42.0100km, 137,834'" the Splice Report and Uni grids print.
  head.innerHTML = `<thead><tr>
      <th>Trace</th><th>#</th><th>Distance</th>
      <th>Loss (dB)</th><th>Refl (dB)</th><th>Slope</th><th>Type</th>
    </tr></thead>`;
  host.appendChild(head);

  const scroller = document.createElement('div');
  scroller.className = 'evt-scroll';
  const spacer = document.createElement('div');
  spacer.style.height = (rows.length * EVENT_ROW_H) + 'px';
  spacer.style.position = 'relative';
  const slice = document.createElement('table');
  slice.className = 'evt-body';
  slice.style.position = 'absolute';
  slice.style.left = '0';
  slice.style.right = '0';
  const tb = document.createElement('tbody');
  slice.appendChild(tb);
  spacer.appendChild(slice);
  scroller.appendChild(spacer);
  host.appendChild(scroller);

  function paint() {
    const top = scroller.scrollTop;
    const vis = Math.ceil(scroller.clientHeight / EVENT_ROW_H) + 6;
    const i0 = Math.max(0, Math.floor(top / EVENT_ROW_H) - 3);
    const i1 = Math.min(rows.length, i0 + vis);
    slice.style.top = (i0 * EVENT_ROW_H) + 'px';
    tb.innerHTML = '';
    for (let i = i0; i < i1; i++) {
      const r = rows[i];
      const tr = document.createElement('tr');
      tr.className = (r.flag ? 'flagged ' : '') +
                     (r.isEnd ? 'end' : (r.isRefl ? 'refl' : ''));
      tr.innerHTML =
        `<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${fiberLabel(r.fiber)} ${r.arrow}</td>` +
        `<td>${r.num}</td>` +
        `<td>${kmFt(r.km)}</td>` +
        `<td>${r.loss == null ? '---' : r.loss.toFixed(3)}</td>` +
        `<td>${r.refl == null ? '---' : r.refl.toFixed(2)}</td>` +
        `<td>${r.slope == null ? '---' : r.slope.toFixed(3)}</td>` +
        `<td>${r.isEnd ? 'END' : (r.isRefl ? 'reflective' : 'non-refl')}</td>`;
      tb.appendChild(tr);
    }
  }
  scroller.addEventListener('scroll', paint);
  paint();
}

// ─── FR-grid column tolerance, derived from the PULSE WIDTH ──────────────
//
// How far apart can two readings of the SAME physical point land?  An OTDR
// cannot resolve two events closer together than one pulse length, so the
// pulse IS the scale on which a position is uncertain — and EXFO's own
// event-match tolerance is about a pulse width (established on LANCASTER↔
// KANSAS CITY).  A and B are two independent acquisitions, each carrying that
// uncertainty, and the mirror frame adds a systematic offset on top: it is
// built from a folder-MEDIAN launch offset, and at the far end A's and B's
// population medians for the same column differ by ~40 m (0.8 pulse).
//
// Measured on job R (500 ns → 51.0 m of fiber), over all 1,152 fibers and
// 10,876 A/B correspondences: median disagreement 16.5 m (0.32 pulse), p90
// 44.7 m, p99 88.0 m, MAX 116.0 m (2.28 pulses).  Three pulse widths clears
// that measured maximum with headroom; two did NOT — it split 13 real
// correspondences into adjacent columns, and a split pair loses the Average
// row, which is the bidirectional number this table exists to show.
//
// Above ~2.5 pulses the tolerance stops doing any separating work at all:
// 2.5, 3, 4 pulses and the old flat 200 m all produce the identical 10,876
// pairs, because the widest correspondence the data actually contains is
// 116 m.  What separates the B-end box connector from the ILA splice 79–90 m
// behind it is the TYPE test below, not distance — no tolerance ever could,
// since they are closer than the pulse.
const TOL_PULSES   = 3;         // pulse widths: A + B localization, + frame
const TOL_MIN_KM   = 0.020;     // floor — see below
const TOL_MAX_KM   = 0.200;     // ceiling on the multiplied value
const C_KM_PER_S   = 299792.458;

// One pulse expressed as fiber length: c·t / 2n (there and back).
function pulseLenKm(t) {
  const ns  = t.data && t.data.pulse_ns;
  const ior = (t.data && t.data.ior) || 1.4682;
  if (!(ns > 0) || !(ior > 0)) return null;
  return C_KM_PER_S * (ns * 1e-9) / 2 / ior;
}

// The COARSEST loaded trace governs — a 500 ns shot paired with a 10 ns one is
// only as certain as its 500 ns leg.
//
// The FLOOR exists because part of the A↔B disagreement is not the pulse at
// all: the launch connector's own position varies 3–5 m fiber-to-fiber within
// one folder (measured, job R short set) and the mirror uses the folder
// median.  That error does not shrink with the pulse, so a 10 ns acquisition
// (1.0 m per pulse) must not tighten to 3 m.
//
// The CEILING caps the multiplied value, but the result is never allowed
// below ONE pulse smear.  That is the splice report's own idiom
// (`_RUN_PULSE_SMEAR_KM`, which floors every clustering radius it has): the
// instrument cannot localize better than its pulse, so a radius tighter than
// the smear manufactures distinctions the data cannot support.  On a 2500 ns
// acquisition the smear alone is 255 m and the floor wins — so this is NOT a
// rule that only ever tightens, and it should not be: clamping a 2500 ns shot
// to 200 m would be the KANLAN repair-splice bug (one splice read as two
// columns) reintroduced in the Viewer.
//
// No pulse width in the file → fall back to the old flat tolerance rather
// than guess a number the trace cannot support.
function columnTolKm(traces) {
  let widest = 0;
  for (const t of traces) {
    const p = pulseLenKm(t);
    if (p != null && p > widest) widest = p;
  }
  if (!widest) return TOL_MAX_KM;
  return Math.max(widest,
                  Math.min(TOL_MAX_KM, Math.max(TOL_MIN_KM, TOL_PULSES * widest)));
}

// May these two columns be the same physical point?
//
// (1) REFLECTIVITY.  A reflective connector and a non-reflective splice are
//     never the same event, however close.  This is the rule that matters at
//     the B-end end, where B's ILA splice opens a column at the lower display
//     km and A's far connector used to join it — 259 of 1,152 fibers married a
//     connector to a splice, and the orphaned partner lost its own column.
// (2) One event per trace: a column is a row of cells, one per loaded trace.
// (3) Within tolerance (above).
// `ev` is a Map of trace index -> event during clustering and a dense array
// afterwards; see clusterColumns for why.  Walk the SMALLER of the two, so a
// column that has collected a thousand traces still tests in a few steps.
function columnsMayMerge(p, q, tolKm) {
  if (p.refl !== q.refl) return false;
  const [small, big] = p.ev.size <= q.ev.size ? [p.ev, q.ev] : [q.ev, p.ev];
  for (const ti of small.keys()) if (big.has(ti)) return false;
  return Math.abs(p.km - q.km) <= tolKm;
}

// MUTUAL NEAREST NEIGHBOUR clustering.
//
// Every event starts as its own column; then the CLOSEST mergeable pair
// anywhere in the list is merged, repeatedly, until nothing is close enough.
// Taking pairs in ascending distance is exactly iterated mutual-nearest-
// neighbour: the globally closest pair is by definition each other's nearest,
// so it can be committed without looking further.
//
// What this replaces was greedy against the LAST column only, in display
// order.  An event joined whichever column happened to open first rather than
// the one it is actually closest to, so a single early arrival could capture a
// partner that belonged to the column behind it.
// Same answer, but in O(k log k) instead of O(k^3) — which is what lets the
// grid hold a whole cable instead of two traces.
//
// The old shape was literal: rescan every pair, take the global minimum, merge,
// re-sort, repeat.  Measured on this machine it ran 9 ms at 10 traces, 37 at
// 20, 303 at 40 and 4,258 at 80 — a clean cube, so 1152 fibers in A+B (2,304
// traces, ~46,000 events) came out near a DAY.  It also allocated one dense
// `traces.length` array per starting event, which at that size is 106 million
// slots before a single merge.
//
// Two changes, neither of which moves a column:
//
//  1. The list is sorted, so the globally closest pair is ADJACENT unless
//     something between them is unmergeable.  Keep adjacent candidates in a
//     heap; when one is vetoed, push (a, the node after b) in its place.  A
//     non-adjacent pair (a,c) can only be the global minimum if every node
//     between them fails to merge with a, and each of those failures is
//     exactly what pushes the next candidate — so the same pairs are examined
//     in the same ascending order, and the same one wins.
//
//  2. Occupancy is a Map of trace index -> event while clustering, so a column
//     costs what it holds rather than what the span could hold, and the
//     one-event-per-trace test walks the smaller side.  The surviving columns
//     (tens, not thousands) are widened back into the dense arrays the render
//     code indexes by trace.
//
// Verified column-for-column against the old implementation on real spans;
// see test_viewer_fr_grid.py.
function clusterColumns(traces, items, tolKm) {
  const nodes = items.map((it, i) => ({
    km: it.km, n: 1, ev: new Map([[it.ti, it.e]]),
    refl: !!it.e.is_reflective, alive: true, ver: 0, prev: i - 1, next: i + 1,
  }));
  if (!nodes.length) return [];
  nodes.sort((a, b) => a.km - b.km);
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].prev = i - 1;
    nodes[i].next = i + 1 < nodes.length ? i + 1 : -1;
  }

  // Binary min-heap of candidate merges.  Entries go stale rather than being
  // deleted: a pop re-checks that both ends are still alive and unchanged.
  const heap = [];
  const less = (x, y) => x.d < y.d || (x.d === y.d && (x.a < y.a || (x.a === y.a && x.b < y.b)));
  function push(e) {
    heap.push(e);
    for (let i = heap.length - 1; i > 0;) {
      const p = (i - 1) >> 1;
      if (!less(heap[i], heap[p])) break;
      [heap[i], heap[p]] = [heap[p], heap[i]]; i = p;
    }
  }
  function pop() {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      for (let i = 0;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < heap.length && less(heap[l], heap[m])) m = l;
        if (r < heap.length && less(heap[r], heap[m])) m = r;
        if (m === i) break;
        [heap[i], heap[m]] = [heap[m], heap[i]]; i = m;
      }
    }
    return top;
  }
  // Offer `a` against `b` and, if that is out of tolerance, nothing further —
  // the list is sorted, so everything past b is further still.
  function offer(a, b) {
    if (a < 0 || b < 0) return;
    const d = nodes[b].km - nodes[a].km;
    if (d > tolKm) return;
    push({ d, a, b, va: nodes[a].ver, vb: nodes[b].ver });
  }
  for (let i = 0; i < nodes.length; i++) offer(i, nodes[i].next);

  while (heap.length) {
    const e = pop();
    const A = nodes[e.a], B = nodes[e.b];
    if (!A.alive || !B.alive || A.ver !== e.va || B.ver !== e.vb) continue;
    if (!columnsMayMerge(A, B, tolKm)) { offer(e.a, B.next); continue; }
    A.km = (A.km * A.n + B.km * B.n) / (A.n + B.n);
    A.n += B.n;
    for (const [ti, ev] of B.ev) if (!A.ev.has(ti)) A.ev.set(ti, ev);
    A.ver++;
    B.alive = false;
    A.next = B.next;
    // `prev` is bookkeeping, not part of the merge test, so it must NOT bump
    // that node's version — doing so would invalidate its own live candidate
    // and silently drop a merge that should have happened.
    if (B.next >= 0) nodes[B.next].prev = e.a;
    // A moved, so every candidate touching it is stale; re-offer both sides.
    offer(A.prev, e.a);
    offer(e.a, A.next);
  }

  // Widen the survivors into the dense per-trace arrays the grid indexes.
  const out = [];
  for (const nd of nodes) {
    if (!nd.alive) continue;
    const ev = new Array(traces.length).fill(null);
    for (const [ti, e] of nd.ev) ev[ti] = e;
    out.push({ km: nd.km, n: nd.n, ev, refl: nd.refl });
  }
  out.sort((a, b) => a.km - b.km);
  return out;
}

// Where a single-direction table's distances read from: the first unflipped
// trace's own declared start, in the frame the columns are laid out in.  A B
// trace mirrored onto A's frame -- a fibre loaded B only, under the A+B table
// -- has no start of its own on that frame, so it read from A's OTDR port
// while the A+B table above it and the chart's axis read from A's declared
// start: on a tie panel with the start declared on A's 1.0383 km reel, a
// column the A+B table printed at 0.0617 km printed 1.0383 km further on in
// the B-only table under it.  A's declared start is its zero too.
// With nothing declared the zero is the port, as FR's own table prints.
function oneDirTableZeroKm(traces) {
  const zeroT = traces.find(t => !isFlipped(t) && ownSpanWindow(t) && ownSpanWindow(t).lo != null);
  if (zeroT) return dispKm(zeroT, ownSpanWindow(zeroT).lo);
  const A = gSpanDecl && gSpanDecl.a;
  if (A && A.start_km != null && traces.some(isFlipped)) return axisZeroKm();
  return 0;
}

// FastReporter-style grid for 1–2 traces (a fiber's A/B, OR two fibers of a
// duplicate pair): events matched by DISPLAYED km into columns; each trace is
// its own row; Average / Minimum / Maximum (loss) across the traces below.
// `opts.oneDir`: these are the fibres loaded ONE way among paired ones,
// shown under the A+B table (see appendOneDirGrid).  They are judged as the
// report judges a single direction, at its single-direction gate, and the
// A+B table keeps the event-number clicks and the Report's rows.
function renderFastReporterGrid(traces, host, hint, opts = {}) {
  const TOL = columnTolKm(traces);
  const overGate = opts.oneDir ? (v => clearsAt(v, gateFor(false, true))) : clearsGate;
  const warnGate = warnFor(false, !!opts.oneDir);
  const arrow = t => (t.dir === 'a' ? 'A→B' : 'B→A') + (t.src && t.src.length > 1 ? srcTag(t.src) : '');

  // Collect every event tagged with its trace index, at its displayed km
  // (dispKm flips a B trace into A's frame in stack mode; two same-direction
  // pair fibers stay in native km, so duplicates line up column-for-column).
  // Only the declared span's events reach the table (see spanEventNumbers):
  // with no declaration every event does, as before.
  const items = [];
  traces.forEach((t, ti) => (t.data.events || []).forEach(e => {
    if (inDeclaredSpan(t, e)) items.push({ km: dispKm(t, e.dist_km), ti, e });
  }));
  items.sort((p, q) => p.km - q.km);
  // Distances in the table read from the declared start, as FR's do once a
  // span is set: the start event prints 0.0000 km.  Zoom targets (`data-km`,
  // the header title) stay in raw km on purpose, because the canvas axis does.
  const zeroKm = oneDirTableZeroKm(traces);

  // Cluster into columns; a column holds at most one event per trace.
  const cols = clusterColumns(traces, items, TOL);
  tableMarkReset(traces);
  cols.forEach(c => c.ev.forEach((e, ti) => { if (e) tableMark(traces[ti], e.dist_km); }));
  draw();                                  // the chart may have drawn before the table

  // ─── FastReporter event-table layout ────────────────────────────────
  // Mirrors FR3's OTDR > Event Table: leading identity columns, then EVENT
  // and SECTION column groups alternating across the span, then a Statistics
  // block.  Every figure below comes from the stored KeyEvents table, the
  // same source FR reads, so the two line up column for column:
  //
  //   Launch Level      the event whose time-of-travel is 0 (the OTDR port)
  //   Reflective        1F
  //   Non-reflective    0F with a loss >= 0
  //   Positive          0F with a NEGATIVE loss — FR's word for a gainer
  //   Continuous Fiber  1O
  //   Section Att.      the NEXT event's stored slope (dB/km)
  //   Section Length    distance between the two bounding events
  //   Section Loss      Length x Att.
  //
  // Verified against a tech's FR3 screenshots of a short test span: fiber 0001's
  // Splice Loss average 0.049 reproduces from its eight non-reflective
  // events, and Connector Reflectance -66.0 from its two reflective ones.
  const fibers = [...new Set(traces.map(t => t.fiber))];
  const isPair = traces.length === 2 && traces[0].fiber !== traces[1].fiber;
  // Like the Suite table's: no headline, only the ticked filters (Robert).
  hint.textContent = [
    gFlaggedOnly ? 'flagged rows only' : '',
    gFailCellsOnly ? 'failing cells only' : '',
    gWarnCellsOnly ? 'warning cells only' : '',
    gShowGainers ? '' : 'gainers hidden',
  ].filter(Boolean).join(' · ');

  // An empty cell is '---', as in the A+B tables and FastReporter's own.
  const fmt  = v => (v == null || isNaN(v)) ? '---' : v.toFixed(3);
  const fmtK = v => (v == null || isNaN(v)) ? '---' : v.toFixed(4);
  const fmtR = v => (v == null || isNaN(v) || v === 0) ? '---' : v.toFixed(1);
  const lossCell = (v, isBreak, attrs = '') => {
    let cls = '';
    if (v != null && !isNaN(v)) {
      if (isBreak && !flagsOff()) cls = ' class="fr-brk"';
      else if (overGate(v)) cls = ' class="fr-hi"';   // the REPORT's verdict
      else if (clearsAt(v, warnGate)) cls = ' class="fr-warn"';
    }
    // Flagged means the report's own verdict: over the gate, or a break.
    const keep = (gFailCellsOnly && (cls === ' class="fr-hi"' || cls === ' class="fr-brk"'))
              || (gWarnCellsOnly && cls === ' class="fr-warn"');
    if (cellFilterOn() && !keep) return `<td${attrs}></td>`;
    return `<td${cls}${attrs}>${fmt(v)}</td>`;
  };

  // FR's own vocabulary for the event kind, shown under the column number.
  //
  // The gainer/loser line used to be inferred from sign(splice_loss).  That
  // agrees with FastReporter almost always, but FR carries its own Type field
  // and on 4 of 4,727 events across a 432-fiber span FR's Type disagrees with
  // the sign of FR's OWN stored loss.  Reproducing FR means following FR's
  // Type where it exists, and only falling back to the inference where it does
  // not (a file with no proprietary block).
  //
  // Type 1 = Positive (a gainer), Type 2 = Non-reflective (a loser).  The
  // reflective / end / continuous / launch rows above are decided before this
  // and are unchanged -- checked against FR's Status 0x40 on 6,455 events,
  // where `time_of_travel === 0` agreed every time.
  function evKind(e) {
    if (!e) return '';
    if (e.is_end) return 'End of Fiber';
    if (String(e.type || '').startsWith('1O')) return 'Continuous Fiber';
    if (e.time_of_travel === 0) return 'Launch Level';
    if (e.is_reflective) return 'Reflective';
    if (e.fr_type === 1) return 'Positive';
    if (e.fr_type === 2) return 'Non-reflective';
    return (e.splice_loss != null && e.splice_loss < 0) ? 'Positive' : 'Non-reflective';
  }
  // The column's kind.  A and B can legitimately disagree about the SAME
  // physical point — the cable's A end is A's Launch Level and B's End of
  // Fiber — so name both rather than let whichever trace loaded first
  // silently speak for the column.
  const colKind = c => [...new Set(c.ev.filter(x => x).map(evKind))].join(' / ');

  // A launch-level event carries no loss of its own in FR — it is the
  // reference the rest of the trace is measured against.
  const evLossRaw = e => (!e || e.time_of_travel === 0 || e.is_end) ? null : e.splice_loss;
  // A hidden gainer is no reading at all: every verdict, filter and
  // statistic below goes through evLoss, so it drops out of all of them.
  const evLoss = e => { const L = evLossRaw(e); return gainerHidden(L) ? null : L; };

  // Section between column i and i+1, as THIS trace measures it.  Both
  // bounding events must exist in this trace or there is no section.
  //
  // An event's stored `slope` describes the section that ENDS at it, in the
  // trace's OWN frame — verified on job R F71: the 0 → 1.0376 km launch reel
  // measures 0.189 dB/km and event #2 (at 1.0376) stores 0.192, while event #1
  // (the port, at 0) stores 0.000.
  //
  // Columns are ordered by DISPLAYED km.  For an unflipped trace display km
  // rises with own-frame km, so the section's far end is `b` and its slope is
  // b.slope.  For a FLIPPED B trace the mirror reverses that: `b` is the
  // SMALLER own-frame distance, so the section ends at `a` and the attenuation
  // is a.slope.  Reading b.slope there took the slope of the section on the far
  // side of the marker — up to 20.9 dB of Section Loss error on this span, and
  // a blank cell on every B row's last section (B's port event stores 0.000).
  // The Math.abs on the length below is the same reversal, already half-noticed.
  function section(ti, i) {
    const a = cols[i] && cols[i].ev[ti], b = cols[i + 1] && cols[i + 1].ev[ti];
    if (!a || !b) return null;
    const len = Math.abs(b.dist_km - a.dist_km);
    const att = isFlipped(traces[ti]) ? a.slope : b.slope;
    if (!(len > 0) || att == null || isNaN(att) || att === 0) return { len, att: null, loss: null };
    return { len, att, loss: len * att };
  }

  // "Show failing cells only" collapses the table to what failed, as the
  // bidirectional table does (the boss, 2026-09-26): a fibre with no failing
  // cell leaves, an event column no fibre fails leaves, and the Section and
  // Statistics columns leave (the filter empties them anyway).  Event
  // numbers keep their full-table numbering so a column is findable.
  // "Show warning cells only" collapses the same way around the yellow cells.
  const warnsGate = v => !overGate(v) && clearsAt(v, warnGate);
  const keeps = v => (gFailCellsOnly && overGate(v)) || (gWarnCellsOnly && warnsGate(v));
  const collapse = cellFilterOn();
  const keepCol = cols.map(c => !collapse
    || traces.some((_t, ti) => keeps(evLoss(c.ev[ti]))));
  const showSec = gShowSections && !collapse;
  // The drawer marks this table too, in either mode: a tick on each event a
  // column holds and a tag with its loss, at the same verdicts as the cells
  // (see drawPairing).  One row per trace, so a "fibre" here is a trace.
  const marks = { mode: gAnalysisMode, single: true, goCell: () => {},
    have: traces.map(t => ({ fiber: t.fiber, ta: t.dir === 'a' ? t : null, tb: t.dir === 'b' ? t : null })),
    cols: cols.map((c, i) => {
      const present = c.ev.filter(x => x);
      const title = present.length > 0 && present.every(x => x.is_end) ? 'End' : `Event ${i + 1}`;
      return { i, title, km: c.km, cells: keepCol[i]
        ? c.ev.map((e, ti) => {
          if (!e) return null;
          const v = evLoss(e), fail = overGate(v), warn = !fail && clearsAt(v, warnGate);
          const leg = { km: e.dist_km, loss: v, hollow: false, fail, warn };
          return { fi: ti, avg: v, km: c.km, avgFail: fail, avgWarn: warn,
                   legs: { a: traces[ti].dir === 'a' ? leg : null, b: traces[ti].dir === 'b' ? leg : null } };
        }).filter(Boolean)
        : [] };
    }) };

  // ── Header: three rows (group / kind+distance / units) ──
  const LEAD = [['Identifiers', 'fr-rowlab'], ['P/F', ''], ['λ (nm)', ''], ['Dir.', '']];
  let h1 = LEAD.map(([l, c]) => `<th rowspan="3" class="fr-rowlab ${c}">${l}</th>`).join('');
  let h2 = '', h3 = '';
  cols.forEach((c, i) => {
    if (!keepCol[i]) return;
    const present = c.ev.filter(x => x);
    const isEnd = present.length > 0 && present.every(x => x.is_end);
    h1 += `<th colspan="2" class="fr-evhdr" data-km="${c.km}" data-col="${i}" `
        + `title="zoom to ${c.km.toFixed(3)} km, span and settings">${isEnd ? 'End' : 'Event ' + (i + 1)}`
        + `<button class="fr-evmenu" data-col="${i}" title="span and settings">⋯</button></th>`;
    h2 += `<th colspan="2" class="fr-evsub" data-col="${i}">${colKind(c)}<br>`
        + `<span class="fr-km">${kmFt(c.km - zeroKm)}</span></th>`;
    h3 += `<th class="fr-sub" data-col="${i}">Loss<br>(dB)</th><th class="fr-sub" data-col="${i}">Refl.<br>(dB)</th>`;
    if (showSec && i < cols.length - 1) {
      const s = section(0, i);
      h1 += '<th colspan="3" class="fr-sechdr">Section</th>';
      h2 += `<th colspan="3" class="fr-sechdr fr-evsub">`
          + `<span class="fr-km">${s ? fmtDist(s.len) : ''}</span></th>`;
      h3 += `<th class="fr-sub fr-sec">Length<br>(${distU().label})</th>`
          + '<th class="fr-sub fr-sec">Loss<br>(dB)</th>'
          + '<th class="fr-sub fr-sec">Att.<br>(dB/km)</th>';
    }
  });
  // Statistics: FR splits Event (splice / connector / reflectance) from
  // Section (loss / attenuation), each Minimum, Maximum, Average.
  const STAT_EV  = collapse ? [] : ['Splice Loss (dB)', 'Connector Loss (dB)', 'Connector Refl. (dB)'];
  // With sections toggled off the Section statistics go too — they are the
  // same numbers summarised, so leaving them would half-hide the group.
  const STAT_SEC = showSec ? ['Section Loss (dB)', 'Section Att. (dB/km)'] : [];
  // Section cells per column: 3 when shown, 0 when hidden (the last column
  // never has one either way).
  const NSEC = showSec ? 3 : 0;
  if (STAT_EV.length) h1 += `<th colspan="${(STAT_EV.length + STAT_SEC.length) * 3}" class="fr-stathdr">Statistics</th>`;
  if (STAT_EV.length) h2 += `<th colspan="${STAT_EV.length * 3}" class="fr-stathdr">Event</th>`
      + (STAT_SEC.length ? `<th colspan="${STAT_SEC.length * 3}" class="fr-stathdr">Section</th>` : '');
  [...STAT_EV, ...STAT_SEC].forEach(() => {
    h3 += '<th class="fr-sub fr-stat">Min</th><th class="fr-sub fr-stat">Max</th>'
        + '<th class="fr-sub fr-stat">Avg</th>';
  });
  // The statistic NAMES belong on their own strip — three header rows already
  // carry group, kind and units, so a fourth would bury the data.
  const statNameRow = '<tr class="fr-statnames">'
    + `<td colspan="${LEAD.length}"></td>`
    + cols.map((_c, i) => keepCol[i] ? `<td colspan="${i < cols.length - 1 ? 2 + NSEC : 2}"></td>` : '').join('')
    + [...STAT_EV, ...STAT_SEC].map(n => `<td colspan="3" class="fr-stat">${n}</td>`).join('')
    + '</tr>';

  const stats = arr => {
    const v = arr.filter(x => x != null && !isNaN(x));
    return v.length
      ? [Math.min(...v), Math.max(...v), v.reduce((s, x) => s + x, 0) / v.length]
      : [null, null, null];
  };

  // Which fibers carry something the report would flag.  Needed twice over: for
  // the P/F column, and for "flagged rows", which at a whole cable is the
  // difference between reading the grid and scrolling it.  Arithmetic only, no
  // DOM, so it costs nothing next to the render it saves.
  const rowFails = traces.map((_t, ti) => cols.some(c => overGate(evLoss(c.ev[ti]))));
  const rowKept = traces.map((_t, ti) => cols.some(c => keeps(evLoss(c.ev[ti]))));
  const shown = traces.map((_t, i) => i)
    .filter(i => (!gFlaggedOnly || rowFails[i]) && (!collapse || rowKept[i]));

  // ── One row per loaded trace, built ON DEMAND ──
  // At 1,152 fibers in A+B this is 2,304 rows of ~80 cells; materialising them
  // all is 184,000 elements and the panel stops responding.  The scroller below
  // asks for the dozen it can actually show.
  const rowHtml = (ti) => {
    const t = traces[ti];
    const mine = cols.map(c => c.ev[ti]);
    const splice = [], connLoss = [], connRefl = [], secLoss = [], secAtt = [];
    const fail = rowFails[ti];      // same rule the row filter uses
    mine.forEach(e => {
      if (!e) return;
      const L = evLoss(e);
      if (e.is_end) return;
      if (e.is_reflective) {
        if (L != null) connLoss.push(L);
        if (e.reflection) connRefl.push(e.reflection);
      } else if (L != null) {
        splice.push(L);
      }
    });
    cols.forEach((_c, i) => {
      const s = section(ti, i);
      if (s) { if (s.loss != null) secLoss.push(s.loss); if (s.att != null) secAtt.push(s.att); }
    });

    const cells = [
      `<td class="fr-rowlab"><span style="display:inline-block;width:8px;height:8px;`
      + `border-radius:50%;background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${fiberLabel(t.fiber)}</td>`,
      `<td class="${pfClass(fail)}" title="following `
      + `${gateLabel()}, this is OUR verdict, not FastReporter's`
      + `">${pfMark(fail)}</td>`,
      `<td>${t.data.wavelength_nm || '---'}</td>`,
      `<td>${arrow(t)}</td>`,
    ];
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const e = c.ev[ti];
      // `data-km` is the event's OWN raw km, not the displayed one: a declared
      // span is stored in the direction's own frame, which is the only frame
      // that survives the mirror being re-derived.
      if (gainerHidden(evLossRaw(e))) {       // a hidden gainer: blank, unjudged
        cells.push(`<td data-col="${i}" data-km="${e.dist_km}"></td>`
                 + `<td>${cellText(fmtR(e.reflection))}</td>`);
      } else
      cells.push(lossCell(evLoss(e), e && e.is_end,
                          e ? ` data-col="${i}" data-km="${e.dist_km}"` : '')
               + `<td>${cellText(fmtR(e ? e.reflection : null))}</td>`);
      if (showSec && i < cols.length - 1) {
        const s = section(ti, i);
        cells.push(`<td class="fr-sec">${cellText(s ? fmtK(s.len) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(s ? fmt(s.loss) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(s ? fmt(s.att) : '---')}</td>`);
      }
    });
    const statArrs = [splice, connLoss, connRefl];
    if (showSec) statArrs.push(secLoss, secAtt);
    if (!collapse) statArrs.forEach(arr => {
      const [mn, mx, av] = stats(arr);
      const f = (arr === connRefl) ? fmtR : fmt;
      cells.push(`<td class="fr-stat">${cellText(f(mn))}</td>`
               + `<td class="fr-stat">${cellText(f(mx))}</td>`
               + `<td class="fr-stat">${cellText(f(av))}</td>`);
    });
    const pick = isPicked(t.key) ? ' class="fr-pick"' : '';
    return `<tr${pick} data-dir="${t.dir}" data-src="${t.src || t.dir}" `
         + `data-fiber="${t.fiber}" data-row="${ti}-${t.dir}">${cells.join('')}</tr>`;
  };

  // ── Minimum / Maximum / Average across the loaded traces ──
  const NSTAT = (STAT_EV.length + STAT_SEC.length) * 3;
  // `gated` — only the Average row is judged against the report's threshold.
  // The Average is the number the bidirectional report actually decides on, so
  // leaving it plain hid the verdict on exactly the cell that carries it: F71
  // at 27.4555 km printed A 0.154 plain, B 0.167 red and Average 0.161 plain,
