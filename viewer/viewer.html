  if (gAutoFit || drop.length) fit();
  draw();
  renderEventTable();
  setReadout(`${gTraces.length} trace${gTraces.length === 1 ? '' : 's'} loaded`
    + (overview ? ` in overview (~${OVERVIEW_PTS} pts each, spikes preserved)` : '')
    + (capped ? `, capped at ${MAX}` : '')
    + (gLoadFailures.length ? `, could not load ${gLoadFailures.slice(0, 3).join('; ')}` : ''));
}

// ─── View math ────────────────────────────────────────────────────────
function dataBounds() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const d = t.data;
    if (!d.dist_km.length) continue;
    const xs = d.dist_km;
    const ys = d.trace_db;
    // skip pre-launch zone
    let i0 = 0;
    while (i0 < xs.length && xs[i0] < -0.2) i0++;
    // trim trailing noise floor past end-of-fiber + small margin
    let i1 = xs.length - 1;
    const endEv = (d.events || []).find(e => e.is_end);
    if (endEv) {
      const limKm = endEv.dist_km + 2.0;
      while (i1 > i0 && xs[i1] > limKm) i1--;
    }
    if (i1 <= i0) continue;
    // walk via display transforms — handles flipped B + Y offset
    for (let i = i0; i <= i1; i++) {
      const dx = dispKm(t, xs[i]);
      const dy = dispDb(t, ys[i]);
      if (dx < x0) x0 = dx;
      if (dx > x1) x1 = dx;
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(x0)) return null;
  const yPad = Math.max(0.5, (y1 - y0) * 0.08);
  const xPad = (x1 - x0) * 0.02;
  return { x0: x0 - xPad, x1: x1 + xPad, y0: y0 - yPad, y1: y1 + yPad };
}

function fit() {
  gAutoFit = true;
  gView = dataBounds();
  draw();
}

// Y-extent of the visible traces within an X (distance) window — for Fit Y.
function dataYBounds(xlo, xhi) {
  let y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const d = t.data;
    if (!d.dist_km.length) continue;
    const xs = d.dist_km, ys = d.trace_db;
    let i0 = 0;
    while (i0 < xs.length && xs[i0] < -0.2) i0++;
    let i1 = xs.length - 1;
    const endEv = (d.events || []).find(e => e.is_end);
    if (endEv) {
      const limKm = endEv.dist_km + 2.0;
      while (i1 > i0 && xs[i1] > limKm) i1--;
    }
    for (let i = i0; i <= i1; i++) {
      const dx = dispKm(t, xs[i]);
      if (dx < xlo || dx > xhi) continue;
      const dy = dispDb(t, ys[i]);
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(y0)) return null;
  const pad = Math.max(0.5, (y1 - y0) * 0.08);
  return { y0: y0 - pad, y1: y1 + pad };
}

// Fit the distance (X) axis to the data, keeping the current dB (Y) zoom.
function fitX() {
  const b = dataBounds();
  if (!b) return;
  if (!gView) { fit(); return; }
  gView = { x0: b.x0, x1: b.x1, y0: gView.y0, y1: gView.y1 };
  gAutoFit = false;
  draw();
}

// Fit the dB (Y) axis to the data in the visible distance window, keeping X.
function fitY() {
  if (!gView) { fit(); return; }
  const yb = dataYBounds(gView.x0, gView.x1);
  if (!yb) return;
  gView = { x0: gView.x0, x1: gView.x1, y0: yb.y0, y1: yb.y1 };
  gAutoFit = false;
  draw();
}

// ─── Chart geometry ───────────────────────────────────────────────────
const M = { l: 56, r: 16, t: 12, b: 36 };
function plotRect() {
  const w = canvas.width  / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  return { x: M.l, y: M.t, w: w - M.l - M.r, h: h - M.t - M.b };
}
function xToPx(x, r) { return r.x + (x - gView.x0) / (gView.x1 - gView.x0) * r.w; }
function yToPx(y, r) { return r.y + r.h - (y - gView.y0) / (gView.y1 - gView.y0) * r.h; }
function pxToX(px, r) { return gView.x0 + (px - r.x) / r.w * (gView.x1 - gView.x0); }
function pxToY(py, r) { return gView.y0 + (r.y + r.h - py) / r.h * (gView.y1 - gView.y0); }

// ─── Draw ─────────────────────────────────────────────────────────────
function draw() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  if (gTraces.length === 0 || !gView) return;

  const r = plotRect();
  gLabelHits = [];
  if (r.w <= 0 || r.h <= 0) return;      // folded away behind the event panel

  // Grid + axes
  drawGrid(r);

  // Clip traces to plot area
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();

  // A picked trace goes LAST so it lies over the rest, and the rest go
  // translucent so it can be followed across a screen of a hundred.
  const order = gPickKey
    ? [...gTraces].sort((a, b) => (a.key === gPickKey) - (b.key === gPickKey))
    : gTraces;
  const dim = t => { ctx.globalAlpha = (gPickKey && t.key !== gPickKey) ? 0.22 : 1; };
  for (const t of order) {
    if (!t.visible) continue;
    dim(t);
    drawTrace(t, r);
  }
  if (gShowEvents) {
    for (const t of order) {
      if (!t.visible) continue;
      drawEventMarkers(t, r);        // dims itself: its ticks set their own alpha
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Border
  ctx.strokeStyle = '#b0bdcc';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w, r.h);

  // Box-zoom rectangle
  if (gDragging && gDragging.kind === 'box') {
    const x0 = Math.min(gDragging.startPx, gDragging.curPx);
    const x1 = Math.max(gDragging.startPx, gDragging.curPx);
    ctx.fillStyle = 'rgba(74,158,255,0.15)';
    ctx.fillRect(x0, r.y, x1 - x0, r.h);
    ctx.strokeStyle = '#4a9eff';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(x0 + 0.5, r.y + 0.5, x1 - x0, r.h);
    ctx.setLineDash([]);
  }

  // A/B measurement markers (drawn above traces, below crosshair)
  drawMarkers(r);
  updateMarkerReadout();

  // Crosshair + readout values for each visible trace at cursor x
  if (gMouse) drawCrosshair(r);
}

// ─── A/B measurement markers ──────────────────────────────────────────
function drawMarkerLine(km, r, color, label) {
  if (km == null) return;
  if (km < gView.x0 || km > gView.x1) return;
  const px = Math.round(xToPx(km, r)) + 0.5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, r.y);
  ctx.lineTo(px, r.y + r.h);
  ctx.stroke();
  // Flag at top
  ctx.fillStyle = color;
  ctx.fillRect(px, r.y, 16, 13);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, px + 8, r.y + 7);
}

function drawMarkers(r) {
  if (!gMarkers.a && !gMarkers.b) return;
  // Shade the span between A and B
  if (gMarkers.a != null && gMarkers.b != null) {
    const xa = xToPx(gMarkers.a, r), xb = xToPx(gMarkers.b, r);
    ctx.fillStyle = 'rgba(74,158,255,0.07)';
    ctx.fillRect(Math.min(xa, xb), r.y, Math.abs(xb - xa), r.h);
  }
  drawMarkerLine(gMarkers.a, r, '#2ecc71', 'A');
  drawMarkerLine(gMarkers.b, r, '#ff6ec7', 'B');
}

// dB value of a trace at a given DISPLAY km (raw trace dB, offset removed).
function traceDbAtDispKm(t, dispKmVal) {
  const dataKm = dataKmFromDisp(t, dispKmVal);
  const xs = t.data.dist_km;
  if (dataKm < xs[0] || dataKm > xs[xs.length - 1]) return null;
  const idx = Math.min(lowerBound(xs, dataKm), t.data.trace_db.length - 1);
  const v = t.data.trace_db[idx];
  return v === undefined ? null : v;
}

function updateMarkerReadout() {
  const box = document.getElementById('marker-readout');
  if (!gMarkerMode && gMarkers.a == null && gMarkers.b == null) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  const a = gMarkers.a, b = gMarkers.b;
  const fmtKm = v => (v == null ? '-' : v.toFixed(4));
  const fmtFt = v => (v == null ? '-' : Math.round(v * 3280.84).toLocaleString());

  let html = `<div><span class="mr-a">A</span>: ${fmtKm(a)} km (${fmtFt(a)} ft)` +
             ` &nbsp; <span class="mr-b">B</span>: ${fmtKm(b)} km (${fmtFt(b)} ft)</div>`;

  if (a != null && b != null) {
    const dkm = Math.abs(b - a);
    html += `<div>Δ: <b>${dkm.toFixed(4)} km</b> (${Math.round(dkm * 3280.84).toLocaleString()} ft)</div>`;
    const vis = gTraces.filter(t => t.visible);
    if (vis.length) {
      html += '<table><thead><tr><th>Trace</th><th>dB@A</th><th>dB@B</th><th>Δ Loss</th><th>dB/km</th></tr></thead><tbody>';
      for (const t of vis) {
        const va = traceDbAtDispKm(t, a);
        const vb = traceDbAtDispKm(t, b);
        let dloss = '-', slope = '-';
        if (va != null && vb != null) {
          // Signal descends with loss; loss over the span (upstream→downstream).
          const lo = Math.min(a, b), hi = Math.max(a, b);
          const vlo = traceDbAtDispKm(t, lo), vhi = traceDbAtDispKm(t, hi);
          const d = (vlo != null && vhi != null) ? (vlo - vhi) : null;
          if (d != null) {
            dloss = d.toFixed(3);
            slope = dkm > 1e-6 ? (d / dkm).toFixed(3) : '-';
          }
        }
        const arrow = t.dir === 'a' ? 'A→B' : 'B→A';
        html += `<tr><td><span style="color:${t.color};text-shadow:0 0 1px #333">■</span> F${t.fiber} ${arrow}</td>` +
                `<td>${va == null ? '-' : va.toFixed(3)}</td>` +
                `<td>${vb == null ? '-' : vb.toFixed(3)}</td>` +
                `<td>${dloss}</td><td>${slope}</td></tr>`;
      }
      html += '</tbody></table>';
    }
  } else if (gMarkerMode) {
    html += `<div class="hint">click to place ${a == null ? 'A' : 'B'}</div>`;
  }
  box.innerHTML = html;
}

function drawGrid(r) {
  ctx.fillStyle = '#56697c';
  ctx.font = '11px Consolas, monospace';

  // X ticks
  const xTicks = niceTicks(gView.x0, gView.x1, 10);
  ctx.strokeStyle = '#e6edf4';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const x of xTicks) {
    const px = Math.round(xToPx(x, r)) + 0.5;
    ctx.moveTo(px, r.y);
    ctx.lineTo(px, r.y + r.h);
  }
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (const x of xTicks) {
    ctx.fillText(x.toFixed(2) + ' km', xToPx(x, r), r.y + r.h + 6);
  }

  // Y ticks
  const yTicks = niceTicks(gView.y0, gView.y1, 8);
  ctx.beginPath();
  for (const y of yTicks) {
    const py = Math.round(yToPx(y, r)) + 0.5;
    ctx.moveTo(r.x, py);
    ctx.lineTo(r.x + r.w, py);
  }
  ctx.stroke();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const y of yTicks) {
    ctx.fillText(y.toFixed(1), r.x - 6, yToPx(y, r));
  }

  // Axis labels
  ctx.save();
  ctx.translate(14, r.y + r.h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#56697c';
  ctx.fillText('signal (dB, descending = loss)', 0, 0);
  ctx.restore();
  ctx.fillStyle = '#56697c';
  ctx.textAlign = 'center';
  ctx.fillText('distance (km)', r.x + r.w / 2, r.y + r.h + 22);
}

function niceTicks(lo, hi, n) {
  const span = hi - lo;
  if (span <= 0) return [lo];
  const step0 = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  let step;
  if (norm < 1.5) step = 1 * mag;
  else if (norm < 3) step = 2 * mag;
  else if (norm < 7) step = 5 * mag;
  else step = 10 * mag;
  const start = Math.ceil(lo / step) * step;
  const out = [];
  for (let v = start; v <= hi + step*1e-6; v += step) out.push(v);
  return out;
}

function drawTrace(t, r) {
  const xs = t.data.dist_km, ys = t.data.trace_db;
  const n = xs.length;
  if (n === 0) return;
  ctx.strokeStyle = t.color;
  const lw = (gPickKey && t.key === gPickKey) ? 2.6 : 1.2;   // the picked trace is bold
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Visible-window data range — invert for flipped (B-stacked) traces
  let dataLo, dataHi;
  if (isFlipped(t)) {
    // Same inversion dataKmFromDisp does — routed through it so the slice
    // can never drift out of step with the transform that draws the points.
    dataLo = dataKmFromDisp(t, gView.x1);
    dataHi = dataKmFromDisp(t, gView.x0);
  } else {
    dataLo = gView.x0;
    dataHi = gView.x1;
  }
  let i0 = lowerBound(xs, dataLo);
  let i1 = upperBound(xs, dataHi);
  i0 = Math.max(0, i0 - 1);
  i1 = Math.min(n - 1, i1 + 1);

  // Decimate when zoomed out: at most 2 samples per pixel
  const samplesPerPx = Math.max(1, (i1 - i0) / r.w);
  const stride = Math.max(1, Math.floor(samplesPerPx / 2));

  ctx.beginPath();
  let started = false;
  for (let i = i0; i <= i1; i += stride) {
    const px = xToPx(dispKm(t, xs[i]), r);
    const py = yToPx(dispDb(t, ys[i]), r);
    if (!started) { ctx.moveTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  if ((i1 - i0) % stride !== 0) {
    ctx.lineTo(xToPx(dispKm(t, xs[i1]), r), yToPx(dispDb(t, ys[i1]), r));
  }
  const edge = LIGHT_EDGE[t.color];
  if (edge) {
    ctx.strokeStyle = edge;
    ctx.lineWidth = lw + 1.8;
    ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = lw;
  }
  ctx.stroke();
}

function lowerBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] < v) lo = mid + 1; else hi = mid;
  }
  return lo;
}
function upperBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] <= v) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function drawEventMarkers(t, r) {
  const evs = t.data.events || [];
  // Marker labels carry the same numbers as the table's columns: counted from
  // the declared span start when there is one.  An event outside the span
  // keeps its tick, dimmed and unnumbered, so the reel is still visible.
  const nums = spanEventNumbers(t);
  // A picked trace dims everything else, its markers and numbers included —
  // they set their own alpha below, so the dimming has to be folded in here
  // rather than left to the caller.  The tick width is stated rather than
  // inherited, so a bold trace drawn just before does not fatten it.
  const dimA = (gPickKey && t.key !== gPickKey) ? 0.22 : 1;
  ctx.lineWidth = 1.2;
  ctx.font = '10px Consolas, monospace';
  // The numbers are click targets: each one's box is kept for the mouse
  // handlers, which take the tech to that event's cell in the table below.
  const LABEL_PAD = 3;
  for (const e of evs) {
    const dx = dispKm(t, e.dist_km);
    if (dx < gView.x0 || dx > gView.x1) continue;
    const px = xToPx(dx, r);
    const dataIdx = lowerBound(t.data.dist_km, e.dist_km);
    const rawY = t.data.trace_db[Math.min(dataIdx, t.data.trace_db.length - 1)] ?? 0;
    const py = yToPx(dispDb(t, rawY), r);
    const n = nums.get(e);
    ctx.strokeStyle = e.is_reflective ? '#b8860b' : t.color;
    ctx.globalAlpha = (n == null ? 0.35 : 0.55) * dimA;
    ctx.beginPath();
    ctx.moveTo(px, py - 10);
    ctx.lineTo(px, py + 10);
    ctx.stroke();
    ctx.globalAlpha = dimA;
    if (n == null) {
      // Outside the declared span the event keeps its tick but loses its
      // number.  The tick is still a target, so the tech can right-click the
      // port or reel event and put the span start back on it.
      gLabelHits.push({ x0: px - 4, x1: px + 4, y0: py - 10, y1: py + 10, t, e });
      continue;
    }
    ctx.fillStyle = LIGHT_EDGE[t.color] || t.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(String(n), px, py - 11);
    const tw = ctx.measureText(String(n)).width;
    gLabelHits.push({ x0: px - tw / 2 - LABEL_PAD, x1: px + tw / 2 + LABEL_PAD,
                      y0: py - 11 - 10 - LABEL_PAD, y1: py - 11 + LABEL_PAD, t, e });
  }
  ctx.globalAlpha = 1;
}
function labelHit(px, py) {
  // Last drawn is on top, so search from the end.
  for (let i = gLabelHits.length - 1; i >= 0; i--) {
    const h = gLabelHits[i];
    if (px >= h.x0 && px <= h.x1 && py >= h.y0 && py <= h.y1) return h;
  }
  return null;
}

function drawCrosshair(r) {
  if (gMouse.px < r.x || gMouse.px > r.x + r.w) return;
  // Vertical line at cursor
  ctx.strokeStyle = '#93a6ba';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(gMouse.px, r.y);
  ctx.lineTo(gMouse.px, r.y + r.h);
  ctx.stroke();
  ctx.setLineDash([]);

  const dKm = pxToX(gMouse.px, r);
  const ft = dKm * 3280.84;
  const lines = [`km: ${dKm.toFixed(4)}  ft: ${ft.toFixed(0)}`];
  for (const t of gTraces) {
    if (!t.visible) continue;
    const dataKm = dataKmFromDisp(t, dKm);
    const idx = lowerBound(t.data.dist_km, dataKm);
    const v = t.data.trace_db[Math.min(idx, t.data.trace_db.length - 1)];
    if (v === undefined) continue;
    const arrow = t.dir === 'a' ? 'A' : 'B';
    lines.push(`${arrow} F${t.fiber}: ${v.toFixed(3)} dB`);
  }
  setReadout(lines.join('   '));
}

// ─── Event table ──────────────────────────────────────────────────────
// Viewer flag thresholds.  These MIRROR the unidirectional engine's defaults
// (UNI_BEND_THRESHOLD, UNI_REFL_FLOOR_DB, UNI_REFL_CEIL_DB) so the panel
// highlights what a uni report would flag.
//
// SCOPE, stated plainly: these are the per-event rules, which is everything
// that can be decided from one event in isolation.  The engine ALSO does
// population work the viewer cannot — discovering which closures are real
// across the cable, and classifying an event as at-splice vs off-splice
// against them.  So this panel highlights "over threshold", not "reburn this
// splice"; the report remains the authority on classification.  The rules are
// deliberately NOT reimplemented beyond that, because a second copy of the
// engine's logic in JavaScript would drift from it.
const gViewerSettings = { lossDb: 0.250, reflLo: -80.0, reflHi: 0.0 };

// Which engine threshold this Viewer is judging by.  Seeded from the report
// that opened it — the Splice Report flags bidirectional
// reburns at REBURN_THRESHOLD, the uni report uses its own tech rule — so the
// two screens agree by construction.  Standalone falls back to the reburn
// gate, the Viewer's main (bidirectional) mode.
function activeGateDb() {
  if (gGateOverride != null) return gGateOverride;
  if (gSourceReport === 'uni') return gThresholds.uni_bend;
  return gThresholds.reburn;
}
// The hub turns a detection OFF by sending the engine an unreachable
// threshold (1e9) instead of removing it, so "off" arrives here as a number.
// clearsGate already gets this right — nothing reaches 1e9, so nothing flags,
// which is what the report did too — but printing `1000000000.000 dB` in a box
// labelled "loss >= ___ dB" reads as a bug rather than as a switch.
const GATE_OFF = 1e6;
function gateIsOff() { return activeGateDb() >= GATE_OFF; }
function gateLabel() {
  if (gGateOverride != null) return `overridden ${gGateOverride.toFixed(3)} dB`;
  const src = gSourceReport === 'uni' ? 'Uni report'
            : gSourceReport === 'sr'  ? 'Splice Report' : 'Splice Report';
  return gateIsOff() ? `${src}: loss grading off`
                     : `${src} ${activeGateDb().toFixed(3)} dB`;
}
// The engine gates on the value it PRINTS, not the full-precision float:
// 0.1595 prints ".160" and must flag against a 0.160 threshold.  Comparing raw
// here would disagree with the report on exactly those cells — the engine's
// _clears_threshold comment names WSC<->SUI 637@Splice 7 and 1067@Splice 2.
function clearsGate(loss) {
  if (loss == null || isNaN(loss)) return false;
  return Math.round(Math.abs(loss) * 1000) / 1000 >= activeGateDb();
}
// The two ways to strip the grid down to what failed, both in the event
// menu.  They are different axes and compose:
//
//   "Show only flagged rows"   drops a fiber whose events all pass — the
//                              rows that remain print every cell as normal.
//   "Show only failing cells"  keeps every row and column where it is and
//                              empties every cell the report does not flag,
//                              so the failures are read off the grid's own
//                              geometry instead of hunted for.
//
// Both on = only the failing fibers, showing only their failing cells.
// The trace a Minimum / Maximum cell points at.  Clicking one of those cells
// asks "which fiber IS this number?" -- so the answer is given in all three
// places at once: the row is highlighted and centred in the EVENTS panel, and
// the trace is drawn bold above with the others dimmed back.  One key, because
// one cell names exactly one trace.
let gPickKey = null;
let gFlaggedOnly = false;               // the ROW filter (Show only flagged rows)
let gFailCellsOnly = false;             // the CELL filter (Show only failing cells)
// A data cell the cell filter empties.  The <td> and its data attributes
// stay, so the right-click span menu still works on a blanked cell.
const cellText = (txt) => gFailCellsOnly ? '' : txt;
// FR event table: show the Section column groups + Section statistics.
let gShowSections = true;
try { gShowSections = localStorage.getItem('otdr_viewer_sections') !== '0'; } catch (e) {}

function flagEvent(e, t) {
  if (e.is_end) return { flag: false, why: '' };
  const why = [];
  // ONE loss rule for the whole Viewer — the gate the report judges by,
  // compared the engine's way (round to what is printed, then test).  This
  // used to be a second, looser number, so "flagged rows" and the verdict
  // column could disagree with each other AND with the report.
  const loss = (e.splice_loss == null) ? null : Math.abs(e.splice_loss);
  if (clearsGate(e.splice_loss)) {
    why.push(`loss ${loss.toFixed(3)} \u2265 ${activeGateDb().toFixed(3)} dB`);
  }
  const refl = e.reflection;
  if (gViewerSettings.reflLo < 0 && refl != null && refl < 0 &&
      refl >= gViewerSettings.reflLo &&
      (gViewerSettings.reflHi >= 0 || refl <= gViewerSettings.reflHi)) {
    why.push(`reflectance ${refl.toFixed(1)} dB in band`);
  }
  return { flag: why.length > 0, why: why.join('; ') };
}

function wireEventSettings() {
  const bind = (id, key, onChange) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      const v = parseFloat(el.value);
      if (Number.isFinite(v)) { gViewerSettings[key] = v; renderEventTable(); }
    });
  };
  const lossEl = document.getElementById('set-loss');
  if (lossEl) lossEl.addEventListener('change', () => {
    const v = parseFloat(lossEl.value);
    if (!Number.isFinite(v)) return;
    // Back to following the report when the tech types its value back in.
    gGateOverride = (Math.abs(v - (gSourceReport === 'uni'
                     ? gThresholds.uni_bend : gThresholds.reburn)) < 1e-9)
                  ? null : v;
    syncGateUI();
    renderEventTable();
  });
  bind('set-refl-lo', 'reflLo');
  bind('set-refl-hi', 'reflHi');
}

function renderEventTable() {
  const host = document.getElementById('event-tbody-wrap');
  const hint = document.getElementById('event-hint');
  host.innerHTML = '';
  gGridGoTo = null;

  const visible = gTraces.filter(t => t.visible);
  if (visible.length === 0) {
    hint.textContent = 'add a trace to see events';
    return;
  }

  // The FastReporter grid, at any size.  It used to be capped at two traces
  // because the column clustering was cubic and the rows were all built up
  // front; both are fixed (see clusterColumns and paintRows), so the whole
  // cable gets the layout the report and FR itself use.  The tech loading a
  // tray no longer drops to a flat list with no statistics on the end of it —
  // which is exactly what the field reported.
  // Every fibre loaded in both directions gets FR's bidirectional table
  // (renderFrBidiGrid): A→B, B→A and Average rows, judged on the Average.
  // Both analysis modes use that layout; the server runs the engine in the
  // app's mode, so only the numbers differ.  The single-direction grid
  // stands in when nothing is paired.
  if (renderFrBidiGrid(visible, host, hint)) return;
  renderFastReporterGrid(visible, host, hint);
  return;
}

// The flat per-trace list.  Nothing routes here any more — the grid scales, so
// it is the one event view — but it is kept whole and self-contained rather
// than half-deleted, because its virtualisation is the pattern the grid copies
// and its row model is what `flagEvent` is tested through.
function renderFlatEventList(visible, host, hint) {
  host.innerHTML = '';

  // 3+ traces → flat per-trace list, VIRTUALISED.
  //
  // Building a real <tr> per event does not survive cable scale: 1152 fibers
  // produced a 172,140 px tall table (~4,600 rows) that pushed the canvas off
  // the page entirely.  Rows are laid out on a fixed-height spacer and only
  // the visible slice is in the DOM, so 1152 fibers cost the same as 12.
  //
  // Every event is listed, flagged or not; the flagged ones are highlighted
  // and can be isolated with the "Show only flagged rows" toggle.
  const rows = buildEventRows(visible);
  const nFlag = rows.filter(r => r.flag).length;
  hint.textContent =
    `${visible.length} trace${visible.length === 1 ? '' : 's'}, ${rows.length} events` +
    (nFlag ? `, ${nFlag} flagged` : ', none flagged') +
    (gFlaggedOnly ? ' (showing flagged rows only)' : '');
  renderVirtualEventList(rows.filter(r => !gFlaggedOnly || r.flag), host);
}

// Flat, sortable row model for the event list.  `flag` and `why` come from the
// same rules the unidirectional report applies, evaluated per event.
//
// `km` is the DISPLAYED km — the same frame the canvas draws the marker in and
// the same one the FR grid clusters on (`renderFastReporterGrid` calls dispKm
// too).  Listing the raw km here put A and B rows in two different frames: F71's
// B event #4 printed 11.2782 while its marker sat at 54.8116, and the sort below
// interleaved the two rows' events in an order that matched neither picture.
// `flagEvent` still gets the RAW event, since its rules are own-frame.
function buildEventRows(traces) {
  const out = [];
  for (const t of traces) {
    const arrow = t.dir === 'a' ? 'A→B' : 'B→A';
    for (const e of (t.data.events || [])) {
      const v = flagEvent(e, t);
      out.push({
        fiber: t.fiber, dir: t.dir, arrow, color: t.color,
        num: e.number, km: dispKm(t, e.dist_km),
        loss: e.splice_loss, refl: e.reflection, slope: e.slope,
        isEnd: !!e.is_end, isRefl: !!e.is_reflective,
        flag: v.flag, why: v.why,
      });
    }
  }
  out.sort((a, b) => a.fiber - b.fiber || a.km - b.km);
  return out;
}

// Distance the way every OTDR Suite report prints it: both units, one cell.
// 4 decimals on the km — the viewer places events, the reports round to 10 m.
function kmFt(km) {
  return `${km.toFixed(4)}km, ${Math.round(km * 3280.84).toLocaleString()}'`;
}

const EVENT_ROW_H = 22;                 // must match the CSS row height
const FR_ROW_H    = 22;                 // ditto, for the FastReporter grid

function renderVirtualEventList(rows, host) {
  const head = document.createElement('table');
  head.className = 'evt-head';
  // One distance column, both units in the cell — the same
  // "42.0100km, 137,834'" the Splice Report and Uni grids print.
  head.innerHTML = `<thead><tr>
      <th>Trace</th><th>#</th><th>Distance</th>
      <th>Loss (dB)</th><th>Refl (dB)</th><th>Slope</th><th>Type</th>
    </tr></thead>`;
  host.appendChild(head);

  const scroller = document.createElement('div');
  scroller.className = 'evt-scroll';
  const spacer = document.createElement('div');
  spacer.style.height = (rows.length * EVENT_ROW_H) + 'px';
  spacer.style.position = 'relative';
  const slice = document.createElement('table');
  slice.className = 'evt-body';
  slice.style.position = 'absolute';
  slice.style.left = '0';
  slice.style.right = '0';
  const tb = document.createElement('tbody');
  slice.appendChild(tb);
  spacer.appendChild(slice);
  scroller.appendChild(spacer);
  host.appendChild(scroller);

  function paint() {
    const top = scroller.scrollTop;
    const vis = Math.ceil(scroller.clientHeight / EVENT_ROW_H) + 6;
    const i0 = Math.max(0, Math.floor(top / EVENT_ROW_H) - 3);
    const i1 = Math.min(rows.length, i0 + vis);
    slice.style.top = (i0 * EVENT_ROW_H) + 'px';
    tb.innerHTML = '';
    for (let i = i0; i < i1; i++) {
      const r = rows[i];
      const tr = document.createElement('tr');
      tr.className = (r.flag ? 'flagged ' : '') +
                     (r.isEnd ? 'end' : (r.isRefl ? 'refl' : ''));
      tr.innerHTML =
        `<td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${r.fiber} ${r.arrow}</td>` +
        `<td>${r.num}</td>` +
        `<td>${kmFt(r.km)}</td>` +
        `<td>${r.loss == null ? '-' : r.loss.toFixed(3)}</td>` +
        `<td>${r.refl == null ? '-' : r.refl.toFixed(2)}</td>` +
        `<td>${r.slope == null ? '-' : r.slope.toFixed(3)}</td>` +
        `<td>${r.isEnd ? 'END' : (r.isRefl ? 'reflective' : 'non-refl')}</td>`;
      tb.appendChild(tr);
    }
  }
  scroller.addEventListener('scroll', paint);
  paint();
}

// ─── FR-grid column tolerance, derived from the PULSE WIDTH ──────────────
//
// How far apart can two readings of the SAME physical point land?  An OTDR
// cannot resolve two events closer together than one pulse length, so the
// pulse IS the scale on which a position is uncertain — and EXFO's own
// event-match tolerance is about a pulse width (established on LANCASTER↔
// KANSAS CITY).  A and B are two independent acquisitions, each carrying that
// uncertainty, and the mirror frame adds a systematic offset on top: it is
// built from a folder-MEDIAN launch offset, and at the far end A's and B's
// population medians for the same column differ by ~40 m (0.8 pulse).
//
// Measured on WSC↔SUI (500 ns → 51.0 m of fiber), over all 1,152 fibers and
// 10,876 A/B correspondences: median disagreement 16.5 m (0.32 pulse), p90
// 44.7 m, p99 88.0 m, MAX 116.0 m (2.28 pulses).  Three pulse widths clears
// that measured maximum with headroom; two did NOT — it split 13 real
// correspondences into adjacent columns, and a split pair loses the Average
// row, which is the bidirectional number this table exists to show.
//
// Above ~2.5 pulses the tolerance stops doing any separating work at all:
// 2.5, 3, 4 pulses and the old flat 200 m all produce the identical 10,876
// pairs, because the widest correspondence the data actually contains is
// 116 m.  What separates the Suisun box connector from the ILA splice 79–90 m
// behind it is the TYPE test below, not distance — no tolerance ever could,
// since they are closer than the pulse.
const TOL_PULSES   = 3;         // pulse widths: A + B localization, + frame
const TOL_MIN_KM   = 0.020;     // floor — see below
const TOL_MAX_KM   = 0.200;     // ceiling on the multiplied value
const C_KM_PER_S   = 299792.458;

// One pulse expressed as fiber length: c·t / 2n (there and back).
function pulseLenKm(t) {
  const ns  = t.data && t.data.pulse_ns;
  const ior = (t.data && t.data.ior) || 1.4682;
  if (!(ns > 0) || !(ior > 0)) return null;
  return C_KM_PER_S * (ns * 1e-9) / 2 / ior;
}

// The COARSEST loaded trace governs — a 500 ns shot paired with a 10 ns one is
// only as certain as its 500 ns leg.
//
// The FLOOR exists because part of the A↔B disagreement is not the pulse at
// all: the launch connector's own position varies 3–5 m fiber-to-fiber within
// one folder (measured, WSC↔SUI short set) and the mirror uses the folder
// median.  That error does not shrink with the pulse, so a 10 ns acquisition
// (1.0 m per pulse) must not tighten to 3 m.
//
// The CEILING caps the multiplied value, but the result is never allowed
// below ONE pulse smear.  That is the splice report's own idiom
// (`_RUN_PULSE_SMEAR_KM`, which floors every clustering radius it has): the
// instrument cannot localize better than its pulse, so a radius tighter than
// the smear manufactures distinctions the data cannot support.  On a 2500 ns
// acquisition the smear alone is 255 m and the floor wins — so this is NOT a
// rule that only ever tightens, and it should not be: clamping a 2500 ns shot
// to 200 m would be the KANLAN repair-splice bug (one splice read as two
// columns) reintroduced in the Viewer.
//
// No pulse width in the file → fall back to the old flat tolerance rather
// than guess a number the trace cannot support.
function columnTolKm(traces) {
  let widest = 0;
  for (const t of traces) {
    const p = pulseLenKm(t);
    if (p != null && p > widest) widest = p;
  }
  if (!widest) return TOL_MAX_KM;
  return Math.max(widest,
                  Math.min(TOL_MAX_KM, Math.max(TOL_MIN_KM, TOL_PULSES * widest)));
}

// May these two columns be the same physical point?
//
// (1) REFLECTIVITY.  A reflective connector and a non-reflective splice are
//     never the same event, however close.  This is the rule that matters at
//     the Suisun end, where B's ILA splice opens a column at the lower display
//     km and A's far connector used to join it — 259 of 1,152 fibers married a
//     connector to a splice, and the orphaned partner lost its own column.
// (2) One event per trace: a column is a row of cells, one per loaded trace.
// (3) Within tolerance (above).
// `ev` is a Map of trace index -> event during clustering and a dense array
// afterwards; see clusterColumns for why.  Walk the SMALLER of the two, so a
// column that has collected a thousand traces still tests in a few steps.
function columnsMayMerge(p, q, tolKm) {
  if (p.refl !== q.refl) return false;
  const [small, big] = p.ev.size <= q.ev.size ? [p.ev, q.ev] : [q.ev, p.ev];
  for (const ti of small.keys()) if (big.has(ti)) return false;
  return Math.abs(p.km - q.km) <= tolKm;
}

// MUTUAL NEAREST NEIGHBOUR clustering.
//
// Every event starts as its own column; then the CLOSEST mergeable pair
// anywhere in the list is merged, repeatedly, until nothing is close enough.
// Taking pairs in ascending distance is exactly iterated mutual-nearest-
// neighbour: the globally closest pair is by definition each other's nearest,
// so it can be committed without looking further.
//
// What this replaces was greedy against the LAST column only, in display
// order.  An event joined whichever column happened to open first rather than
// the one it is actually closest to, so a single early arrival could capture a
// partner that belonged to the column behind it.
// Same answer, but in O(k log k) instead of O(k^3) — which is what lets the
// grid hold a whole cable instead of two traces.
//
// The old shape was literal: rescan every pair, take the global minimum, merge,
// re-sort, repeat.  Measured on this machine it ran 9 ms at 10 traces, 37 at
// 20, 303 at 40 and 4,258 at 80 — a clean cube, so 1152 fibers in A+B (2,304
// traces, ~46,000 events) came out near a DAY.  It also allocated one dense
// `traces.length` array per starting event, which at that size is 106 million
// slots before a single merge.
//
// Two changes, neither of which moves a column:
//
//  1. The list is sorted, so the globally closest pair is ADJACENT unless
//     something between them is unmergeable.  Keep adjacent candidates in a
//     heap; when one is vetoed, push (a, the node after b) in its place.  A
//     non-adjacent pair (a,c) can only be the global minimum if every node
//     between them fails to merge with a, and each of those failures is
//     exactly what pushes the next candidate — so the same pairs are examined
//     in the same ascending order, and the same one wins.
//
//  2. Occupancy is a Map of trace index -> event while clustering, so a column
//     costs what it holds rather than what the span could hold, and the
//     one-event-per-trace test walks the smaller side.  The surviving columns
//     (tens, not thousands) are widened back into the dense arrays the render
//     code indexes by trace.
//
// Verified column-for-column against the old implementation on real spans;
// see test_viewer_fr_grid.py.
function clusterColumns(traces, items, tolKm) {
  const nodes = items.map((it, i) => ({
    km: it.km, n: 1, ev: new Map([[it.ti, it.e]]),
    refl: !!it.e.is_reflective, alive: true, ver: 0, prev: i - 1, next: i + 1,
  }));
  if (!nodes.length) return [];
  nodes.sort((a, b) => a.km - b.km);
  for (let i = 0; i < nodes.length; i++) {
    nodes[i].prev = i - 1;
    nodes[i].next = i + 1 < nodes.length ? i + 1 : -1;
  }

  // Binary min-heap of candidate merges.  Entries go stale rather than being
  // deleted: a pop re-checks that both ends are still alive and unchanged.
  const heap = [];
  const less = (x, y) => x.d < y.d || (x.d === y.d && (x.a < y.a || (x.a === y.a && x.b < y.b)));
  function push(e) {
    heap.push(e);
    for (let i = heap.length - 1; i > 0;) {
      const p = (i - 1) >> 1;
      if (!less(heap[i], heap[p])) break;
      [heap[i], heap[p]] = [heap[p], heap[i]]; i = p;
    }
  }
  function pop() {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      for (let i = 0;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < heap.length && less(heap[l], heap[m])) m = l;
        if (r < heap.length && less(heap[r], heap[m])) m = r;
        if (m === i) break;
        [heap[i], heap[m]] = [heap[m], heap[i]]; i = m;
      }
    }
    return top;
  }
  // Offer `a` against `b` and, if that is out of tolerance, nothing further —
  // the list is sorted, so everything past b is further still.
  function offer(a, b) {
    if (a < 0 || b < 0) return;
    const d = nodes[b].km - nodes[a].km;
    if (d > tolKm) return;
    push({ d, a, b, va: nodes[a].ver, vb: nodes[b].ver });
  }
  for (let i = 0; i < nodes.length; i++) offer(i, nodes[i].next);

  while (heap.length) {
    const e = pop();
    const A = nodes[e.a], B = nodes[e.b];
    if (!A.alive || !B.alive || A.ver !== e.va || B.ver !== e.vb) continue;
    if (!columnsMayMerge(A, B, tolKm)) { offer(e.a, B.next); continue; }
    A.km = (A.km * A.n + B.km * B.n) / (A.n + B.n);
    A.n += B.n;
    for (const [ti, ev] of B.ev) if (!A.ev.has(ti)) A.ev.set(ti, ev);
    A.ver++;
    B.alive = false;
    A.next = B.next;
    // `prev` is bookkeeping, not part of the merge test, so it must NOT bump
    // that node's version — doing so would invalidate its own live candidate
    // and silently drop a merge that should have happened.
    if (B.next >= 0) nodes[B.next].prev = e.a;
    // A moved, so every candidate touching it is stale; re-offer both sides.
    offer(A.prev, e.a);
    offer(e.a, A.next);
  }

  // Widen the survivors into the dense per-trace arrays the grid indexes.
  const out = [];
  for (const nd of nodes) {
    if (!nd.alive) continue;
    const ev = new Array(traces.length).fill(null);
    for (const [ti, e] of nd.ev) ev[ti] = e;
    out.push({ km: nd.km, n: nd.n, ev, refl: nd.refl });
  }
  out.sort((a, b) => a.km - b.km);
  return out;
}

// FastReporter-style grid for 1–2 traces (a fiber's A/B, OR two fibers of a
// duplicate pair): events matched by DISPLAYED km into columns; each trace is
// its own row; Average / Minimum / Maximum (loss) across the traces below.
function renderFastReporterGrid(traces, host, hint) {
  const TOL = columnTolKm(traces);
  const arrow = t => t.dir === 'a' ? 'A→B' : 'B→A';

  // Collect every event tagged with its trace index, at its displayed km
  // (dispKm flips a B trace into A's frame in stack mode; two same-direction
  // pair fibers stay in native km, so duplicates line up column-for-column).
  // Only the declared span's events reach the table (see spanEventNumbers):
  // with no declaration every event does, as before.
  const items = [];
  traces.forEach((t, ti) => (t.data.events || []).forEach(e => {
    if (inDeclaredSpan(t, e)) items.push({ km: dispKm(t, e.dist_km), ti, e });
  }));
  items.sort((p, q) => p.km - q.km);
  // Distances in the table read from the declared start, as FR's do once a
  // span is set: the start event prints 0.0000 km.  The zero is the first
  // unflipped trace's own start, in the frame the columns are laid out in.
  // Zoom targets (`data-km`, the header title) stay in raw km on purpose,
  // because the canvas axis does.
  const zeroT = traces.find(t => !isFlipped(t) && ownSpanWindow(t) && ownSpanWindow(t).lo != null);
  const zeroKm = zeroT ? dispKm(zeroT, ownSpanWindow(zeroT).lo) : 0;

  // Cluster into columns; a column holds at most one event per trace.
  const cols = clusterColumns(traces, items, TOL);

  // ─── FastReporter event-table layout ────────────────────────────────
  // Mirrors FR3's OTDR > Event Table: leading identity columns, then EVENT
  // and SECTION column groups alternating across the span, then a Statistics
  // block.  Every figure below comes from the stored KeyEvents table, the
  // same source FR reads, so the two line up column for column:
  //
  //   Launch Level      the event whose time-of-travel is 0 (the OTDR port)
  //   Reflective        1F
  //   Non-reflective    0F with a loss >= 0
  //   Positive          0F with a NEGATIVE loss — FR's word for a gainer
  //   Continuous Fiber  1O
  //   Section Att.      the NEXT event's stored slope (dB/km)
  //   Section Length    distance between the two bounding events
  //   Section Loss      Length x Att.
  //
  // Verified against Zach's FR3 screenshots of WSC_SUIsh: fiber 0001's
  // Splice Loss average 0.049 reproduces from its eight non-reflective
  // events, and Connector Reflectance -66.0 from its two reflective ones.
  const fibers = [...new Set(traces.map(t => t.fiber))];
  const isPair = traces.length === 2 && traces[0].fiber !== traces[1].fiber;
  // Right-click is the ONLY way into the span menu and the settings editor,
  // and until this line nothing on screen said so — a tech who never thinks
  // to try it concludes we do not have the feature.  FastReporter signposts
  // the same two jobs with visible IOR and SPAN buttons in its ribbon; this
  // is the cheap half of matching that, and the button is still worth adding.
  // Short on purpose — the full sentence spelling out both jobs wrapped this
  // row early.  It still names both nouns rather than saying "more options":
  // a generic label is the kind of thing eyes skip, and a tech hunting a
  // wrong IOR has to see that this menu is where settings live.
  const RIGHT_CLICK_HINT = ' · ⋯ or right-click an event for span and settings';
  hint.textContent = (
      isPair ? `Pair F${traces[0].fiber} ↔ F${traces[1].fiber}: events aligned by distance (click a column to zoom)`
    : fibers.length === 1 ? `F${traces[0].fiber}: FastReporter event table (click a column to zoom)`
    : `${fibers.length} fibers, ${traces.length} traces: FastReporter event table `
      + `(click a column to zoom; Min/Max/Avg pinned below)`
  ) + (zeroT ? ' · span set: numbered and measured from its start' : '')
    + (gFlaggedOnly ? ' · flagged rows only' : '')
    + (gFailCellsOnly ? ' · failing cells only' : '') + RIGHT_CLICK_HINT;

  const fmt  = v => (v == null || isNaN(v)) ? '-' : v.toFixed(3);
  const fmtK = v => (v == null || isNaN(v)) ? '-' : v.toFixed(4);
  const fmtR = v => (v == null || isNaN(v) || v === 0) ? '-' : v.toFixed(1);
  const lossCell = (v, isBreak, attrs = '') => {
    let cls = '';
    if (v != null && !isNaN(v)) {
      if (isBreak) cls = ' class="fr-brk"';
      else if (clearsGate(v)) cls = ' class="fr-hi"';   // the REPORT's verdict
      else if (v < 0) cls = ' class="fr-gain"';
    }
    // Flagged means the report's own verdict: over the gate, or a break.  A
    // gainer is coloured but is not a failure, so it empties with the rest.
    const keep = cls === ' class="fr-hi"' || cls === ' class="fr-brk"';
    // A blanked cell loses its colour too -- a green gainer shading with no
    // number in it reads as a missing value.
    if (gFailCellsOnly && !keep) return `<td${attrs}></td>`;
    return `<td${cls}${attrs}>${fmt(v)}</td>`;
  };

  // FR's own vocabulary for the event kind, shown under the column number.
  //
  // The gainer/loser line used to be inferred from sign(splice_loss).  That
  // agrees with FastReporter almost always, but FR carries its own Type field
  // and on 4 of 4,727 events across the Zayo 432 span FR's Type disagrees with
  // the sign of FR's OWN stored loss.  Reproducing FR means following FR's
  // Type where it exists, and only falling back to the inference where it does
  // not (a file with no proprietary block).
  //
  // Type 1 = Positive (a gainer), Type 2 = Non-reflective (a loser).  The
  // reflective / end / continuous / launch rows above are decided before this
  // and are unchanged -- checked against FR's Status 0x40 on 6,455 events,
  // where `time_of_travel === 0` agreed every time.
  function evKind(e) {
    if (!e) return '';
    if (e.is_end) return 'End of Fiber';
    if (String(e.type || '').startsWith('1O')) return 'Continuous Fiber';
    if (e.time_of_travel === 0) return 'Launch Level';
    if (e.is_reflective) return 'Reflective';
    if (e.fr_type === 1) return 'Positive';
    if (e.fr_type === 2) return 'Non-reflective';
    return (e.splice_loss != null && e.splice_loss < 0) ? 'Positive' : 'Non-reflective';
  }
  // The column's kind.  A and B can legitimately disagree about the SAME
  // physical point — the cable's A end is A's Launch Level and B's End of
  // Fiber — so name both rather than let whichever trace loaded first
  // silently speak for the column.
  const colKind = c => [...new Set(c.ev.filter(x => x).map(evKind))].join(' / ');

  // A launch-level event carries no loss of its own in FR — it is the
  // reference the rest of the trace is measured against.
  const evLoss = e => (!e || e.time_of_travel === 0 || e.is_end) ? null : e.splice_loss;

  // Section between column i and i+1, as THIS trace measures it.  Both
  // bounding events must exist in this trace or there is no section.
  //
  // An event's stored `slope` describes the section that ENDS at it, in the
  // trace's OWN frame — verified on WSC_SUI F71: the 0 → 1.0376 km launch reel
  // measures 0.189 dB/km and event #2 (at 1.0376) stores 0.192, while event #1
  // (the port, at 0) stores 0.000.
  //
  // Columns are ordered by DISPLAYED km.  For an unflipped trace display km
  // rises with own-frame km, so the section's far end is `b` and its slope is
  // b.slope.  For a FLIPPED B trace the mirror reverses that: `b` is the
  // SMALLER own-frame distance, so the section ends at `a` and the attenuation
  // is a.slope.  Reading b.slope there took the slope of the section on the far
  // side of the marker — up to 20.9 dB of Section Loss error on this span, and
  // a blank cell on every B row's last section (B's port event stores 0.000).
  // The Math.abs on the length below is the same reversal, already half-noticed.
  function section(ti, i) {
    const a = cols[i] && cols[i].ev[ti], b = cols[i + 1] && cols[i + 1].ev[ti];
    if (!a || !b) return null;
    const len = Math.abs(b.dist_km - a.dist_km);
    const att = isFlipped(traces[ti]) ? a.slope : b.slope;
    if (!(len > 0) || att == null || isNaN(att) || att === 0) return { len, att: null, loss: null };
    return { len, att, loss: len * att };
  }

  // ── Header: three rows (group / kind+distance / units) ──
  const LEAD = [['Identifiers', 'fr-rowlab'], ['P/F', ''], ['λ (nm)', ''], ['Dir.', '']];
  let h1 = LEAD.map(([l, c]) => `<th rowspan="3" class="fr-rowlab ${c}">${l}</th>`).join('');
  let h2 = '', h3 = '';
  cols.forEach((c, i) => {
    const present = c.ev.filter(x => x);
    const isEnd = present.length > 0 && present.every(x => x.is_end);
    h1 += `<th colspan="2" class="fr-evhdr" data-km="${c.km}" `
        + `title="zoom to ${c.km.toFixed(3)} km">${isEnd ? 'End' : 'Event ' + (i + 1)}`
        + `<button class="fr-evmenu" data-col="${i}" title="span and settings">⋯</button></th>`;
    h2 += `<th colspan="2" class="fr-evsub">${colKind(c)}<br>`
        + `<span class="fr-km">${kmFt(c.km - zeroKm)}</span></th>`;
    h3 += '<th class="fr-sub">Loss<br>(dB)</th><th class="fr-sub">Refl.<br>(dB)</th>';
    if (gShowSections && i < cols.length - 1) {
      const s = section(0, i);
      h1 += '<th colspan="3" class="fr-sechdr">Section</th>';
      h2 += `<th colspan="3" class="fr-sechdr fr-evsub">`
          + `<span class="fr-km">${s ? s.len.toFixed(4) + ' km' : ''}</span></th>`;
      h3 += '<th class="fr-sub fr-sec">Length<br>(km)</th>'
          + '<th class="fr-sub fr-sec">Loss<br>(dB)</th>'
          + '<th class="fr-sub fr-sec">Att.<br>(dB/km)</th>';
    }
  });
  // Statistics: FR splits Event (splice / connector / reflectance) from
  // Section (loss / attenuation), each Minimum, Maximum, Average.
  const STAT_EV  = ['Splice Loss (dB)', 'Connector Loss (dB)', 'Connector Refl. (dB)'];
  // With sections toggled off the Section statistics go too — they are the
  // same numbers summarised, so leaving them would half-hide the group.
  const STAT_SEC = gShowSections ? ['Section Loss (dB)', 'Section Att. (dB/km)'] : [];
  // Section cells per column: 3 when shown, 0 when hidden (the last column
  // never has one either way).
  const NSEC = gShowSections ? 3 : 0;
  h1 += `<th colspan="${(STAT_EV.length + STAT_SEC.length) * 3}" class="fr-stathdr">Statistics</th>`;
  h2 += `<th colspan="${STAT_EV.length * 3}" class="fr-stathdr">Event</th>`
      + (STAT_SEC.length ? `<th colspan="${STAT_SEC.length * 3}" class="fr-stathdr">Section</th>` : '');
  [...STAT_EV, ...STAT_SEC].forEach(() => {
    h3 += '<th class="fr-sub fr-stat">Min</th><th class="fr-sub fr-stat">Max</th>'
        + '<th class="fr-sub fr-stat">Avg</th>';
  });
  // The statistic NAMES belong on their own strip — three header rows already
  // carry group, kind and units, so a fourth would bury the data.
  const statNameRow = '<tr class="fr-statnames">'
    + `<td colspan="${LEAD.length}"></td>`
    + cols.map((_c, i) => `<td colspan="${i < cols.length - 1 ? 2 + NSEC : 2}"></td>`).join('')
    + [...STAT_EV, ...STAT_SEC].map(n => `<td colspan="3" class="fr-stat">${n}</td>`).join('')
    + '</tr>';

  const stats = arr => {
    const v = arr.filter(x => x != null && !isNaN(x));
    return v.length
      ? [Math.min(...v), Math.max(...v), v.reduce((s, x) => s + x, 0) / v.length]
      : [null, null, null];
  };

  // Which fibers carry something the report would flag.  Needed twice over: for
  // the P/F column, and for "flagged rows", which at a whole cable is the
  // difference between reading the grid and scrolling it.  Arithmetic only, no
  // DOM, so it costs nothing next to the render it saves.
  const rowFails = traces.map((_t, ti) => cols.some(c => clearsGate(evLoss(c.ev[ti]))));
  const shown = traces.map((_t, i) => i).filter(i => !gFlaggedOnly || rowFails[i]);

  // ── One row per loaded trace, built ON DEMAND ──
  // At 1,152 fibers in A+B this is 2,304 rows of ~80 cells; materialising them
  // all is 184,000 elements and the panel stops responding.  The scroller below
  // asks for the dozen it can actually show.
  const rowHtml = (ti) => {
    const t = traces[ti];
    const mine = cols.map(c => c.ev[ti]);
    const splice = [], connLoss = [], connRefl = [], secLoss = [], secAtt = [];
    const fail = rowFails[ti];      // same rule the row filter uses
    mine.forEach(e => {
      if (!e) return;
      const L = evLoss(e);
      if (e.is_end) return;
      if (e.is_reflective) {
        if (L != null) connLoss.push(L);
        if (e.reflection) connRefl.push(e.reflection);
      } else if (L != null) {
        splice.push(L);
      }
    });
    cols.forEach((_c, i) => {
      const s = section(ti, i);
      if (s) { if (s.loss != null) secLoss.push(s.loss); if (s.att != null) secAtt.push(s.att); }
    });

    const cells = [
      `<td class="fr-rowlab"><span style="display:inline-block;width:8px;height:8px;`
      + `border-radius:50%;background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${t.fiber}</td>`,
      `<td class="${fail ? 'fr-pf-fail' : 'fr-pf-pass'}" title="following `
      + `${gateLabel()}, this is OUR verdict, not FastReporter's`
      + `">${fail ? '✗' : '✓'}</td>`,
      `<td>${t.data.wavelength_nm || '-'}</td>`,
      `<td>${arrow(t)}</td>`,
    ];
    cols.forEach((c, i) => {
      const e = c.ev[ti];
      // `data-km` is the event's OWN raw km, not the displayed one: a declared
      // span is stored in the direction's own frame, which is the only frame
      // that survives the mirror being re-derived.
      cells.push(lossCell(evLoss(e), e && e.is_end,
                          e ? ` data-col="${i}" data-km="${e.dist_km}"` : '')
               + `<td>${cellText(fmtR(e ? e.reflection : null))}</td>`);
      if (gShowSections && i < cols.length - 1) {
        const s = section(ti, i);
        cells.push(`<td class="fr-sec">${cellText(s ? fmtK(s.len) : '-')}</td>`
                 + `<td class="fr-sec">${cellText(s ? fmt(s.loss) : '-')}</td>`
                 + `<td class="fr-sec">${cellText(s ? fmt(s.att) : '-')}</td>`);
      }
    });
    const statArrs = [splice, connLoss, connRefl];
    if (gShowSections) statArrs.push(secLoss, secAtt);
    statArrs.forEach(arr => {
      const [mn, mx, av] = stats(arr);
      const f = (arr === connRefl) ? fmtR : fmt;
      cells.push(`<td class="fr-stat">${cellText(f(mn))}</td>`
               + `<td class="fr-stat">${cellText(f(mx))}</td>`
               + `<td class="fr-stat">${cellText(f(av))}</td>`);
    });
    const pick = (t.key === gPickKey) ? ' class="fr-pick"' : '';
    return `<tr${pick} data-dir="${t.dir}" data-src="${t.src || t.dir}" `
         + `data-fiber="${t.fiber}">${cells.join('')}</tr>`;
  };

  // ── Minimum / Maximum / Average across the loaded traces ──
  const NSTAT = (STAT_EV.length + STAT_SEC.length) * 3;
  // `gated` — only the Average row is judged against the report's threshold.
  // The Average is the number the bidirectional report actually decides on, so
  // leaving it plain hid the verdict on exactly the cell that carries it: F71
  // at 27.4555 km printed A 0.154 plain, B 0.167 red and Average 0.161 plain,
  // and 0.161 IS the report's flagged figure (team .160, ours .1605).
  //
  // Minimum and Maximum stay plain deliberately.  In the ordinary
  // bidirectional view exactly two traces are loaded, so those rows restate
  // the A and B rows two rows lower — highlighting them would put three red
  // cells on screen where one belongs, without adding any information.
  //
  // A Minimum or Maximum is ONE trace's number, and the question it always
  // raises is which fiber's.  So those cells carry the trace that holds them
  // and a click answers in all three places at once — see pickTrace below.
  // The Average is nobody's measurement, so it stays inert.
  const aggRow = (label, fn, gated) => {
    const cells = [`<td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`];
    cols.forEach((c, i) => {
      const ls = c.ev.map(evLoss).filter(v => v != null && !isNaN(v));
      const v = ls.length ? fn(ls) : null;
      // Under "failing cells only" Minimum and Maximum print in the columns
      // whose Average fails, so the failing Average has its spread beside it.
      const colFails = ls.length > 0 && clearsGate(ls.reduce((s, x) => s + x, 0) / ls.length);
      const aggText = txt => (gFailCellsOnly && colFails) ? txt : cellText(txt);
      // Which trace holds it.  Compared on the PRINTED figure, so the cell
      // points at the row the tech can actually read the number off; ties go
      // to the first trace, which is the one the grid lists first.
      const owner = (!gated && v != null)
        ? c.ev.findIndex(e => { const L = evLoss(e); return L != null && fmt(L) === fmt(v); })
        : -1;
      const own = owner >= 0
        ? ` class="fr-own" data-ti="${owner}" data-own-col="${i}"`
          + ` title="F${traces[owner].fiber} ${arrow(traces[owner])}: click to find it"`
        : '';
      // `isBreak` is false here — evLoss already drops End-of-Fiber events, so
      // an aggregate is never a break.
      cells.push((gated ? lossCell(v, false) : `<td${own}>${aggText(fmt(v))}</td>`)
               + `<td>${cellText('-')}</td>`);
      if (gShowSections && i < cols.length - 1) {
        const ss = traces.map((_t, ti) => section(ti, i)).filter(Boolean);
        const pick = k => ss.map(s => s[k]).filter(v => v != null && !isNaN(v));
        const [pl, pa] = [pick('loss'), pick('att')];
        cells.push(`<td class="fr-sec">${cellText('-')}</td>`
                 + `<td class="fr-sec">${cellText(fmt(pl.length ? fn(pl) : null))}</td>`
                 + `<td class="fr-sec">${cellText(fmt(pa.length ? fn(pa) : null))}</td>`);
      }
    });
    cells.push(`<td class="fr-stat" colspan="${NSTAT}"></td>`);
    return `<tr class="fr-agg">${cells.join('')}</tr>`;
  };
  // FR prints the three summary rows even for a single measurement, so a
  // tech reading one fiber still sees its own min/max/average.
  const aggRows = [
    aggRow('Minimum', a => Math.min(...a), false),
    aggRow('Maximum', a => Math.max(...a), false),
    aggRow('Average', a => a.reduce((s, v) => s + v, 0) / a.length, true),
  ];

  // ── Assembly ──
  // ONE table, not a header table beside a body table: the grid's column count
  // and colspans are data-dependent, so two tables would need their widths
  // reconciled by hand and would drift the moment a span had a different
  // number of events.  Virtualising with SPACER ROWS keeps the single table,
  // so the browser goes on doing the column layout itself.
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';
  // Widest row, for the spacer cells: every column contributes loss + refl,
  // and every column BUT THE LAST also contributes the three section cells —
  // the same 5-and-then-2 the statistics name strip above counts.
  const NCELL = LEAD.length + cols.length * (2 + NSEC) - NSEC + NSTAT;
  table.innerHTML =
      `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead>`
    + `<tbody></tbody>`
    + `<tfoot>${aggRows.join('')}</tfoot>`;
  const tb = table.querySelector('tbody');
  scroller.appendChild(table);
  host.appendChild(scroller);

  // Header rows have to be measured, not assumed: the three-row header's
  // height decides where the sticky offsets sit and how tall a page is.
  const spacerRow = h =>
    `<tr class="fr-spacer" style="height:${h}px"><td colspan="${NCELL}" style="border:0;padding:0"></td></tr>`;

  let lastFirst = -1;
  // `mustK` — a row the caller is about to look up in the DOM.  The slice is
  // worked out from the scroll position and the panel's height, and on a
  // panel dragged down to a couple of rows that arithmetic can stop one short
  // of the row just scrolled to; the caller then finds nothing and the jump
  // silently does nothing.  Naming the row makes it certain.
  function paintRows(mustK) {
    const top = scroller.scrollTop;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const view = Math.max(0, scroller.clientHeight - headH);
    let first = Math.max(0, Math.floor((top - headH) / FR_ROW_H) - 4);
    const count = Math.ceil(view / FR_ROW_H) + 8;
    let last = Math.min(shown.length, first + count);
    if (mustK != null) {
      first = Math.min(first, Math.max(0, mustK - 2));
      last = Math.max(last, Math.min(shown.length, mustK + 3));
    }
    lastFirst = first;                 // the scroll handler skips a slice already painted
    const html = [statNameRow];
    if (first > 0) html.push(spacerRow(first * FR_ROW_H));
    for (let k = first; k < last; k++) html.push(rowHtml(shown[k]));
    if (last < shown.length) html.push(spacerRow((shown.length - last) * FR_ROW_H));
    tb.innerHTML = html.join('');
  }
  // Repainting on every scroll event is the whole cost of this view, so only
  // repaint when the slice actually changes.  (`gGridGoTo` relies on this too:
  // it sets scrollTop and paints in one go, and the scroll event that follows
  // must not repaint over the cell it just marked.)
  scroller.addEventListener('scroll', () => {
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const f = Math.max(0, Math.floor((scroller.scrollTop - headH) / FR_ROW_H) - 4);
    if (f !== lastFirst) { lastFirst = f; paintRows(); }
  });
  paintRows();

  // Pin the three header rows.  The offsets are measured after the first paint
  // because the header's height depends on which event kinds are present; the
  // statistics strip pins itself from CSS.
  requestAnimationFrame(() => {
    const hrows = table.tHead ? [...table.tHead.rows] : [];
    let off = 0;
    for (const r of hrows) {
      for (const th of r.cells) th.style.top = off + 'px';
      off += r.offsetHeight;
    }
  });

  table.querySelectorAll('th.fr-evhdr').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.fr-evmenu');
      if (!btn) { zoomToKm(+th.dataset.km, 2); return; }
      // The ⋯ opens the same menu a right-click on a cell does.  A header is
      // shared by every row, so each direction uses its first shown fiber
      // that has an event in this column, at that event's OWN raw km.
      ev.stopPropagation();
      const col = cols[+btn.dataset.col];
      const picks = [];
      for (const dir of ['a', 'b']) {
        const ti = shown.find(k => traces[k].dir === dir && col.ev[k]);
        if (ti != null) picks.push({ dir, km: col.ev[ti].dist_km, fiber: traces[ti].fiber, src: traces[ti].src || dir });
      }
      const r = btn.getBoundingClientRect();
      if (picks.length === 1) {
        const p = picks[0];
        showSpanMenu(r.left, r.bottom + 2, p.dir, p.km, p.fiber, p.src);
      } else if (picks.length === 2) {
        showDirChooser(r.left, r.bottom + 2, picks);
      }
    });
  });

  // A click on an event number on the trace lands here: scroll the row into
  // the window (the body is virtual, so paint it first), then the cell into
  // view sideways, and mark it for a moment.
  gGridGoTo = (t, e) => {
    const ti = traces.indexOf(t);
    const k = shown.indexOf(ti);
    if (k < 0) return;                       // hidden by "flagged rows"
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const footH = table.tFoot ? table.tFoot.offsetHeight : 0;
    const names = tb.querySelector('tr.fr-statnames');
    const namesH = names ? names.offsetHeight : 0;
    // Where the row sits in the table, and the window the pinned header and
    // footer leave between them.
    const rowTop = headH + namesH + k * FR_ROW_H;
    const view = scroller.clientHeight - headH - footH;
    const winTop = scroller.scrollTop + headH, winBot = winTop + view;
    if (rowTop < winTop || rowTop + FR_ROW_H > winBot) {
      scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
    }
    paintRows(k);
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = [...tb.querySelectorAll(sel)].find(row => row.querySelector(`td[data-km="${e.dist_km}"]`));
    const td = tr && tr.querySelector(`td[data-km="${e.dist_km}"]`);
    if (!td) return;
    table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
    const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
    const leadW = tr.cells[0].offsetWidth;   // the sticky fiber column covers the left edge
    const dxL = cr.left - (sr.left + leadW) - 8;
    const dxR = cr.right - sr.right + 8;
    if (dxL < 0) scroller.scrollLeft += dxL;
    else if (dxR > 0) scroller.scrollLeft += dxR;
    td.classList.add('fr-hit');
    setTimeout(() => td.classList.add('fading'), 1500);
    setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
  };

  // A click on a Minimum or Maximum cell: that number is one trace's, so say
  // which in all three places at once -- the row is marked and CENTRED in the
  // panel (centred always, not just when it happens to be off screen: the
  // tech is looking for it, and a row that lands hard against the header is
  // the one they miss), the cell it came from is flashed, and the trace above
  // is drawn bold with the others dimmed back.  Clicking it again lets go.
  const footer = table.tFoot;
  if (footer) footer.addEventListener('click', (ev) => {
    const td = ev.target.closest('td.fr-own');
    if (!td) return;
    const ti = +td.dataset.ti, ci = +td.dataset.ownCol;
    const t = traces[ti];
    if (gPickKey === t.key) { gPickKey = null; renderEventTable(); draw(); return; }
    gPickKey = t.key;
    const k = shown.indexOf(ti);
    if (k < 0) {                       // its row is filtered out of the grid
      draw();
      setReadout(`F${t.fiber} ${arrow(t)} holds it. Its row is hidden by "Show only flagged rows"`);
      return;
    }
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const footH = footer.offsetHeight;
    const names = tb.querySelector('tr.fr-statnames');
    const namesH = names ? names.offsetHeight : 0;
    // The window the tech actually sees is what the pinned header, the pinned
    // statistics strip and the pinned footer leave between them; centre in
    // THAT, or the row lands half a strip low.
    const rowTop = headH + namesH + k * FR_ROW_H;
    const topPin = headH + namesH;
    const view = Math.max(FR_ROW_H, scroller.clientHeight - topPin - footH);
    scroller.scrollTop = Math.max(0, rowTop - topPin - (view - FR_ROW_H) / 2);
    paintRows(k);                      // the body is virtual: paint the slice first
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = tb.querySelector(sel);
    const cell = tr && tr.querySelector(`td[data-col="${ci}"]`);
    if (cell) {
      table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
      const sr = scroller.getBoundingClientRect(), cr = cell.getBoundingClientRect();
      const leadW = tr.cells[0].offsetWidth;      // the sticky fiber column covers the left edge
      const dxL = cr.left - (sr.left + leadW) - 8, dxR = cr.right - sr.right + 8;
      if (dxL < 0) scroller.scrollLeft += dxL;
      else if (dxR > 0) scroller.scrollLeft += dxR;
      cell.classList.add('fr-hit');
      setTimeout(() => cell.classList.add('fading'), 1500);
      setTimeout(() => cell.classList.remove('fr-hit', 'fading'), 2200);
    }
    draw();                            // bold above, the rest dimmed
    setReadout(`F${t.fiber} ${arrow(t)} holds it. Click the cell again to let go`);
  });

  // Right-click an event to make it the span's start or end, the way FR lets
  // you set one.  The row names the direction, the cell names the event, so
  // there is nothing to disambiguate — and the km recorded is the event's own,
  // which is what the store and (later) the engine both speak.
  tb.addEventListener('contextmenu', (ev) => {
    const td = ev.target.closest('td[data-km]');
    const tr = td && td.closest('tr[data-dir]');
    if (!td || !tr) return;
    ev.preventDefault();
    showSpanMenu(ev.clientX, ev.clientY, tr.dataset.dir, +td.dataset.km,
                 tr.dataset.fiber, tr.dataset.src);
  });
}

// ─── FastReporter mode: FR's bidirectional table, verbatim ─────────────
// In FastReporter mode the table IS FastReporter's.  For every fibre with
// both directions loaded, the rows of FR's merged bidirectional table (one
// per event pair, the silent leg synthesised, a section between each pair of
// rows) are laid out as FR3 lays out a .bdr: three rows per fibre -- A→B,
// B→A, Average -- the synthesised legs in grey, each section's loss and
// attenuation per direction and averaged.  The numbers come from the Splice
// Report engine's fr_bidi_table through /api/fr_table (it reproduces FR's
// own .bdr output row for row from the two .sor); nothing here computes a
// figure, it only prints them.  A fibre loaded in one direction only has no
// bidirectional table in FR either: it is named in the hint, and when
// nothing is paired the single-direction grid stands in.
let gFrTableSeq = 0;
function renderFrBidiGrid(traces, host, hint) {
  const byFiber = new Map();
  traces.forEach((t, ti) => {
    const g = byFiber.get(t.fiber) || {};
    g[t.dir] = ti;
    byFiber.set(t.fiber, g);
  });
  const pairs = [], singles = [];
  for (const [fiber, g] of byFiber) {
    if (g.a != null && g.b != null) pairs.push({ fiber, ta: traces[g.a], tb: traces[g.b] });
    else singles.push(fiber);
  }
  if (!pairs.length) return false;
  const seq = ++gFrTableSeq;
  hint.textContent = `FastReporter table: reading ${pairs.length} fibre pair${pairs.length === 1 ? '' : 's'}…`;
  fetch(`/api/fr_table?fibers=${pairs.map(p => p.fiber).join(',')}`)
    .then(r => r.json())
    .then(res => { if (seq === gFrTableSeq) paintFrBidiGrid(pairs, singles, res || {}, host, hint); })
    .catch(e => {
      if (seq !== gFrTableSeq) return;
      hint.textContent = `FastReporter table unavailable (${(e && e.message) || 'fetch failed'})`;
    });
  return true;
}

function paintFrBidiGrid(pairs, singles, res, host, hint) {
  host.innerHTML = '';
  gGridGoTo = null;
  const tables = res.tables || {};
  const have = pairs.filter(p => Array.isArray(tables[String(p.fiber)]) && tables[String(p.fiber)].length);
  const missing = pairs.filter(p => !have.includes(p)).map(p => p.fiber);
  if (!have.length) {
    hint.textContent = 'FastReporter table: ' + (res.error
      || "no table for these fibres (both directions must be .sor files with EXFO's trace block)");
    return;
  }
  // Display km is A's raw frame -- FR's MeanPosition -- measured from A's
  // declared start when the tech has set one (FR prints 0.0000 there).  The
  // declaration is per direction and span-wide, so one zero serves every
  // fibre; a row outside the declared span leaves the table, as FR's do.
  const win = ownSpanWindow(have[0].ta);
  const zeroKm = (win && win.lo != null) ? win.lo : 0;
  const inSpan = km => !win || ((win.lo == null || km >= win.lo - SPAN_SNAP_KM)
                             && (win.hi == null || km <= win.hi + SPAN_SNAP_KM));
  // Columns: FR's rows of every shown fibre, clustered by mean position the
  // way the single-direction grid clusters events (one row per fibre per
  // column; a reflective row never shares one with a splice).  With one
  // fibre loaded -- the ordinary case -- every row is its own column, in
  // FR's order.
  const items = [];
  have.forEach((p, fi) => {
    p.rows = tables[String(p.fiber)].filter(r => inSpan(r.mean_pos_m / 1000));
    p.rows.forEach((r, k) => items.push({ km: r.mean_pos_m / 1000, ti: fi,
                                          e: { is_reflective: r.type === 3, row: r, k } }));
  });
  items.sort((a, b) => a.km - b.km);
  const cols = clusterColumns(have, items, columnTolKm(have.flatMap(p => [p.ta, p.tb])));
  // The section a fibre's row carries runs to that fibre's NEXT row; it is
  // printed under column i only when the next row sits in column i + 1.
  const secOf = (fi, i) => {
    const c = cols[i].ev[fi], n = cols[i + 1] && cols[i + 1].ev[fi];
    if (!c || !n || n.k !== c.k + 1) return null;
    return c.row.section;
  };
  const fmt  = v => (v == null || isNaN(v)) ? '---' : v.toFixed(3);
  const fmtR = v => (v == null || isNaN(v)) ? '---' : v.toFixed(1);
  // FR's Type on the merged row: 3 reflective, 1 positive (a gainer), 2
  // non-reflective.  In the bidirectional table FR names the launch and end
  // rows by their type too -- "Reflective", not Launch Level / End of Fiber.
  const kind = r => r.type === 3 ? 'Reflective' : r.type === 1 ? 'Positive'
              : r.type === 2 ? 'Non-reflective' : '';
  const colKind = c => [...new Set(c.ev.filter(x => x).map(x => kind(x.row)))].join(' / ');
  // `ungated` -- an A→B or B→A leg.  A fibre is judged on its Average row
  // only (Robert 2026-09-25), so a leg is never coloured as a failure.
  const lossCell = (v, synthetic, attrs = '', ungated = false) => {
    const cls = [];
    if (v != null && !isNaN(v)) {
      if (!ungated && clearsGate(v)) cls.push('fr-hi');   // the REPORT's verdict
      else if (v < 0) cls.push('fr-gain');
    }
    const keep = cls.includes('fr-hi');   // a gainer or a synthesised leg is not a failure
    if (gFailCellsOnly && !keep) return `<td${attrs}></td>`;   // blank AND uncoloured
    if (synthetic) cls.push('fr-synth');
    return `<td${cls.length ? ` class="${cls.join(' ')}"` : ''}${attrs}>`
         + `${(gFailCellsOnly && !keep) ? '' : fmt(v)}</td>`;
  };
  // A leg's own km, rounded as /api/trace rounds an event's dist_km, so a
  // click on the trace's event number finds the cell (see gGridGoTo).
  const rawKm = m => Math.round(m / 1000 * 1e4) / 1e4;

  // ── Header: three rows (group / kind+distance / units) ──
  const LEAD = [['Identifiers', 'fr-rowlab'], ['P/F', ''], ['λ (nm)', ''], ['Dir.', '']];
  let h1 = LEAD.map(([l, c]) => `<th rowspan="3" class="fr-rowlab ${c}">${l}</th>`).join('');
  let h2 = '', h3 = '';
  cols.forEach((c, i) => {
    const n = c.ev.filter(x => x).length;
    h1 += `<th colspan="2" class="fr-evhdr" data-km="${c.km}" title="zoom to ${c.km.toFixed(3)} km">`
        + `Event ${i + 1} (${n}/${have.length})</th>`;
    h2 += `<th colspan="2" class="fr-evsub">${colKind(c)}<br><span class="fr-km">${kmFt(c.km - zeroKm)}</span></th>`;
    h3 += '<th class="fr-sub">Loss<br>(dB)</th><th class="fr-sub">Refl.<br>(dB)</th>';
    if (gShowSections && i < cols.length - 1) {
      const lens = have.map((_p, fi) => secOf(fi, i)).filter(s => s && s.length_m != null)
                       .map(s => s.length_m / 1000);
      const len = lens.length ? lens.reduce((a, b) => a + b, 0) / lens.length : null;
      h1 += '<th colspan="2" class="fr-sechdr">Section</th>';
      h2 += `<th colspan="2" class="fr-sechdr fr-evsub"><span class="fr-km">${len != null ? len.toFixed(4) + ' km' : ''}</span></th>`;
      h3 += '<th class="fr-sub fr-sec">Loss<br>(dB)</th><th class="fr-sub fr-sec">Att.<br>(dB/km)</th>';
    }
  });
  const NSEC = gShowSections ? 2 : 0;

  // ── Rows: A→B, B→A, Average per fibre ──
  const legFails = (fi, which) => cols.some(c => {
    const x = c.ev[fi];
    if (!x) return false;
    return clearsGate(which === 'avg' ? x.row.loss : x.row[which].loss);
  });
  const rowFails = have.map((_p, fi) => legFails(fi, 'avg'));
  const shown = have.map((_p, i) => i).filter(i => !gFlaggedOnly || rowFails[i]);
  const descs = shown.flatMap(fi => [[fi, 'a'], [fi, 'b'], [fi, 'avg']]);
  const rowHtml = ([fi, which]) => {
    const p = have[fi];
    const t = which === 'b' ? p.tb : p.ta;
    const fail = which === 'avg' && legFails(fi, 'avg');
    const label = which === 'a' ? 'A→B' : which === 'b' ? 'B→A' : 'Average';
    const cells = [
      `<td class="fr-rowlab"><span style="display:inline-block;width:8px;height:8px;`
      + `border-radius:50%;background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${p.fiber}</td>`,
      // FR marks every row; on its tables a direction row always passes at the
      // gate and only the Average row can fail (Robert 2026-09-25).
      which !== 'avg' ? '<td class="fr-pf-pass" title="the verdict is the Average row\'s">✓</td>'
      : `<td class="${fail ? 'fr-pf-fail' : 'fr-pf-pass'}" title="following `
      + `${gateLabel()} on the A+B average, this is OUR verdict, not FastReporter's`
      + `">${fail ? '✗' : '✓'}</td>`,
      `<td>${t.data.wavelength_nm || '---'}</td>`,
      `<td>${label}</td>`,
    ];
    cols.forEach((c, i) => {
      const x = c.ev[fi];
      if (!x) {
        cells.push(`<td>${cellText('---')}</td><td>${cellText('---')}</td>`);
      } else if (which === 'avg') {
        // FR prints no reflectance on the Average row
        cells.push(lossCell(x.row.loss, false, ` data-col="${i}"`)
                 + `<td>${cellText('---')}</td>`);
      } else {
        const leg = x.row[which];
        cells.push(lossCell(leg.loss, leg.synthetic, ` data-col="${i}" data-km="${rawKm(leg.pos_m)}"`, true)
                 + `<td${leg.synthetic ? ' class="fr-synth"' : ''}>${cellText(fmtR(leg.refl))}</td>`);
      }
      if (gShowSections && i < cols.length - 1) {
        const s = secOf(fi, i);
        const v = s ? (which === 'avg' ? s : s[which]) : null;
        cells.push(`<td class="fr-sec">${cellText(v ? fmt(v.loss) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(v ? fmt(v.att_db_km) : '---')}</td>`);
      }
    });
    const attrs = which === 'avg' ? ' class="fr-avg"'
      : ` data-dir="${t.dir}" data-src="${t.src || t.dir}" data-fiber="${p.fiber}"`;
    return `<tr${attrs}>${cells.join('')}</tr>`;
  };

  hint.textContent = (
      have.length === 1
        ? `F${have[0].fiber}: FastReporter bidirectional table (A→B, B→A, Average; click a column to zoom)`
        : `${have.length} fibres: FastReporter bidirectional table (A→B, B→A, Average per fibre; click a column to zoom)`)
    + (win && win.lo != null ? ' · span set: measured from its start' : '')
    + (missing.length ? ` · no FR table for F${missing.join(', F')}` : '')
    + (singles.length ? ` · one direction only, no bidirectional table: F${singles.join(', F')}` : '')
    + (res.error ? ` · ${res.error}` : '')
    + (gFlaggedOnly ? ' · flagged rows only' : '')
    + (gFailCellsOnly ? ' · failing cells only' : '')
    + ' · right-click an event for span and settings';

  // ── Assembly, virtualised like the single-direction grid ──
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';
  const NCELL = LEAD.length + cols.length * (2 + NSEC) - NSEC;
  // ── Minimum / Maximum / Average down the column, as FR prints them under
  // the fibres: taken over the fibres' AVERAGE rows (every fibre loaded, not
  // just the rows on screen).  The Average is judged like any Average row.
  const aggRow = (label, fn, gated) => {
    const cells = [`<td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`];
    const num = v => v != null && !isNaN(v);
    cols.forEach((c, i) => {
      const ls = c.ev.filter(x => x).map(x => x.row.loss).filter(num);
      const v = ls.length ? fn(ls) : null;
      const colFails = ls.length > 0 && clearsGate(ls.reduce((a, b) => a + b, 0) / ls.length);
      const txt = t => (gFailCellsOnly && colFails) ? t : cellText(t);
      cells.push((gated ? lossCell(v, false) : `<td>${txt(fmt(v))}</td>`) + '<td></td>');
      if (gShowSections && i < cols.length - 1) {
        const ss = have.map((_p, fi) => secOf(fi, i)).filter(Boolean);
        const pick = k => ss.map(x => x[k]).filter(num);
        const [pl, pa] = [pick('loss'), pick('att_db_km')];
        cells.push(`<td class="fr-sec">${cellText(pl.length ? fmt(fn(pl)) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(pa.length ? fmt(fn(pa)) : '---')}</td>`);
      }
    });
    return `<tr class="fr-agg">${cells.join('')}</tr>`;
  };
  const aggRows = [
    aggRow('Minimum', a => Math.min(...a), false),
    aggRow('Maximum', a => Math.max(...a), false),
    aggRow('Average', a => a.reduce((x, y) => x + y, 0) / a.length, true),
  ];
  table.innerHTML = `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead><tbody></tbody>`
                  + `<tfoot>${aggRows.join('')}</tfoot>`;
  const tb = table.querySelector('tbody');
  scroller.appendChild(table);
  host.appendChild(scroller);
  const spacerRow = h =>
    `<tr class="fr-spacer" style="height:${h}px"><td colspan="${NCELL}" style="border:0;padding:0"></td></tr>`;
  let lastFirst = -1;
  function paintRows() {
    const top = scroller.scrollTop;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const view = Math.max(0, scroller.clientHeight - headH);
    const first = Math.max(0, Math.floor((top - headH) / FR_ROW_H) - 4);
    const count = Math.ceil(view / FR_ROW_H) + 8;
    const last = Math.min(descs.length, first + count);
    lastFirst = first;
    const html = [];
    if (first > 0) html.push(spacerRow(first * FR_ROW_H));
