            Object.assign(at, { failed: true, file: first.name + more, size: job.bytes, index: job.start });
          }
          throw e;
        } finally { at.busy -= 1; }
        done += job.files.length;
        at.sent = done; at.bytes += job.bytes;
        cnt.textContent = `uploading ${done} / ${files.length}`;
        showDropSign('load', `uploading ${done} / ${files.length} files`);
      }
    };
    // The server takes one request at a time, so two in flight keep it busy.
    await Promise.all([worker(), worker()]);
    at.stage = 'end';
    const before = { a: (gInfo && gInfo.dir_a) || '', b: (gInfo && gInfo.dir_b) || '' };
    // Where each file came from, so each side is named after its folder.
    const from = {};
    for (const f of files) {
      const dir = gDropFolder.get(f);
      if (dir) from[f.name] = dir;
    }
    const gone = emptiedSides();
    const j = await post(`/api/drop_end?token=${token}&emptied=${gone}`,
                         JSON.stringify({ folders: from }));
    at.stage = 'after';
    // Another span's source the tech emptied with Remove: let go of, so
    // forgotten too (span 1's below, as ever).
    for (const d of emptiedList(gone)) if (d.length > 1) forgetSide(d);
    // A drop ADDS (Robert 2026-10-02: "keep adding and nothing gets reset
    // until the person does it"): a side it grew keeps everything on it,
    // even when the server moved it to a copy of a folder picked in the hub
    // (`grown`).  Only a side that went away -- the tech emptied it with
    // Remove -- is forgotten.
    const grown = String(j.grown || '').toLowerCase();
    for (const d of ['a', 'b']) {
      if ((j['dir_' + d] || '') !== before[d] && !grown.includes(d)) forgetSide(d);
    }
    // A file dropped again that the tech had removed: dragging it in asks
    // for it back.
    const back = (j.already_keys || []).filter(k => gRemovedFiles.has(k));
    back.forEach(k => gRemovedFiles.delete(k));
    await loadInfo();
    // A side whose names carry no site at all has a COUNT and no name: the
    // whole file name is not a direction, and printing '0001_1550.SOR' here
    // would read as one.
    const side = (name, count) => (name ? name + ' ' : '') + `(${count} files)`;
    let msg = `loaded: A ${j.dir_a ? side(j.a_prefix, j.a_count) : '(none)'}`;
    if (j.dir_b) msg += ` · B ${side(j.b_prefix, j.b_count)}`;
    // Say WHY it landed where it did: the files carry their own direction
    // (EXFO's LocationsDirection, the one FR's Direction column reads), so a
    // B-side folder dropped first goes to B instead of becoming A.
    msg += j.added_by === 'file'
      ? (j.added === 'AB' ? ', A and B as the files name them'
                          : `, the files name this folder the ${j.added} side`)
      : (j.added === 'AB' || !j.added ? '' : `, dropped into the ${j.added} side`);
    // And HOW the drop was split, when it was not by the file names.  Nothing
    // could split it: 0001_1550.sor and 0002_1550.sor are two FIBERS of one
    // direction, so the drop is kept whole and lands on one side instead of
    // loading fiber 1 against fiber 2 as if they were the two directions.
    if (j.split_by === 'unnamed') {
      // unless the files' own Direction split a parent folder (repeats_placed)
      if (j.added !== 'AB') msg += ` · the names carry no site, so the drop was kept whole`
           + `. Drop each direction's folder on its own`;
    } else if (j.split_by === 'location') {
      msg += ' · split by the locations in the file headers';
    } else if (j.split_by === 'sitecode') {
      msg += ' · split by site code';
    }
    // One direction with a block of fibers whose header names the two sites
    // the other way round.  That used to split the drop and put those fibers
    // on B; every file's own Direction agrees, so they stay together.
    // What the readout SHOWS (Robert 2026-09-30): a file moved to the other
    // side, or kept on one side against what its name or header says, is a
    // warning (bold orange); a file that did not load is a failure (bold
    // red).  The rest of `msg` is a plain note and is not shown.
    const warn = [], fail = [];
    if (j.sites_swapped) {
      warn.push(`kept as one direction: ${j.sites_swapped} file(s) list the two sites`
           + ` the other way round, but every file's Direction says`
           + ` ${j.stamped === 'b' ? 'B→A' : 'A→B'}`);
    }
    // One direction under several spellings of its name (long shots, short
    // shots and plain names of one span).  Each spelling used to count as a
    // direction: the biggest two became A and B and the rest were ignored.
    for (const v of (j.name_variants || [])) {
      msg += ` · ${v.keys.join(', ')} kept together as ${v.as}:`
           + ` every file's Direction says ${v.stamped === 'b' ? 'B→A' : 'A→B'}`;
    }
    // Files mislabeled for direction still load (the boss, 2026-09-29); the
    // tech fixes their direction from the Files panel.  Say where they went.
    let moved = false;
    if (j.kept_whole && j.kept_whole.length) {
      const on = j.added === 'B' ? j.b_prefix : j.a_prefix;
      warn.push(`${j.kept_whole.join(', ')} files kept with ${on || 'the rest'}:`
           + ` their fibers fill its gaps, so they were read as one direction with the names wrong`);
      moved = true;
    }
    for (const f of (j.folded || [])) {
      warn.push(`${f.key} files loaded with ${f.into}, the side their fibers were missing from`);
      moved = true;
    }
    if (j.repeats_placed && j.repeats_placed.length) {
      const n = j.repeats_placed.length;
      const shown = j.repeats_placed.slice(0, 6).join(', ') + (n > 6 ? `, … (+${n - 6} more)` : '');
      warn.push(`${n} file(s) share a name with a file of the other direction,`
           + ` so they went on the other side: ${shown}`);
      moved = true;
    }
    // Files whose name reads as the other direction of where their stamp
    // put them: the stamp decides (Robert 2026-10-02: "they will always
    // have an A or B label"; the stamp wins over the name), and the tech
    // checks these by hand.
    if (j.against_name && j.against_name.length) {
      const n = j.against_name.length;
      const shown = j.against_name.slice(0, 6).join(', ') + (n > 6 ? `, … (+${n - 6} more)` : '');
      warn.push(`${n} file(s) named like the other direction are stamped for the side they`
           + ` loaded on: ${shown}`);
      moved = true;
    }
    // Another cable is ADDED as a span of its own, never into this one.
    // The hub's reports run on span 1, so say so.
    for (const n of (j.new_spans || [])) {
      if (n > 1) warn.push(`span ${n} added beside the loaded span; the hub's reports run on span 1`);
    }
    if (moved) warn.push('to change a file\'s direction, right-click it > Direction');
    if (j.ignored && j.ignored.length) {
      fail.push(`not loaded: ${j.ignored.join(', ')} (their fibers are already on both sides)`);
    }
    // A dragged PARENT folder arrives FLAT, without its subfolders.  A repeat
    // the drop could not put on the other side (see _place_repeats) is not
    // loaded; say so, or those files go missing in silence.
    // Byte for byte a file the Viewer has: not loaded twice (Robert
    // 2026-10-02: "it should tell us that they are already in there").
    if (j.already && j.already.length) {
      const n = j.already.length;
      const shown = j.already.slice(0, 6).join(', ') + (n > 6 ? `, … (+${n - 6} more)` : '');
      warn.push((j.added ? `${n} file(s) already in the Viewer, not added again: `
                         : `nothing added: ${n === 1 ? 'that file is' : `all ${n} files are`}`
                           + ' already in the Viewer: ') + shown
                + (back.length ? ` (${back.length} removed file(s) put back)` : ''));
    }
    // A different file of a fiber a side already has: its own row.
    if (j.copies && j.copies.length) {
      const n = j.copies.length;
      const shown = j.copies.slice(0, 6).join(', ') + (n > 6 ? `, … (+${n - 6} more)` : '');
      warn.push(`${n} file(s) added as another copy of a fiber already loaded,`
           + ` listed as "(copy 2)": ${shown}`);
    }
    if (j.repeated && j.repeated.length) {
      const uniq = [...new Set(j.repeated)].sort();
      const shown = uniq.slice(0, 6).join(', ')
                  + (uniq.length > 6 ? `, … (+${uniq.length - 6} more)` : '');
      fail.push(`${j.repeated.length} file(s) not loaded: they arrived under a name already dropped,`
           + ` kept the first: ${shown}. Drop one direction at a time`);
    }
    // Draw what was dropped (demo list #31): the drop used to list
    // its files and leave the chart blank, "0 of 4 selected".  Every file of
    // each side this drop wrote is selected, beside whatever the other side
    // already had on the chart; a whole cable goes through the overview, as
    // a Select All does.
    // Only what this drop added (`new_keys`) and put back joins the chart:
    // the rows already there stay as the tech left them.
    const want = new Set(gTraces.map(t => t.key));
    for (const key of [...(j.new_keys || []), ...back]) {
      if (!gRemovedFiles.has(key)) want.add(key);
    }
    gDropInFlight = false;             // the load below is the page's own, not the drop's
    const loading = want.size !== gTraces.length;
    if (loading) {
      await selectFiles(want);
    } else {
      renderChips();
      if (gAutoFit) fit();
      draw();
      renderEventTable();
    }
    if (loading) msg += loadFailNote();   // a dropped file that would not load stays red
    setReadout(msg, { warn: warn.join(' · '), fail: fail.join(' · ') });
    showDropSign('done', [j.dir_a ? 'A: ' + side(j.a_prefix, j.a_count) : '',
                          j.dir_b ? 'B: ' + side(j.b_prefix, j.b_count) : '']
                         .filter(Boolean).join(' · '));
  } catch (e) {
    hideDropSign();
    setReadout('drop failed: ' + ((e && e.message) || e));
    cnt.textContent = '';
    reportDropFailure(e, at, files.length, total, Date.now() - t0);
  } finally { gDropInFlight = false; }
}
// A failed drop goes to Slack with where it stopped, so the cause can be read
// off the report instead of guessed at: which step, which file and how far in,
// how many uploads were in flight, and whether the server still answers a
// plain GET afterwards (a dead server and a refused upload read the same on
// the page: "Failed to fetch").  When the report itself cannot get through
// it is tried again, as the server may only be busy.
async function reportDropFailure(e, at, count, total, ms) {
  try {
    const mb = n => (n / 1048576).toFixed(1) + ' MB';
    let alive;
    try {
      const r = await fetch('/api/list', { cache: 'no-store' });
      alive = 'server answers GET /api/list: ' + r.status;
    } catch (e2) {
      alive = 'server does NOT answer GET /api/list: ' + ((e2 && e2.message) || e2);
    }
    const where = at.stage === 'file'
      ? `at file ${at.index} of ${count} (${at.file}, ${mb(at.size)})`
      : `at ${at.stage}`;
    const message = `Viewer drop failed ${where}: ${(e && e.name) || 'Error'}: ${(e && e.message) || e}`;
    const detail = [
      `stage=${at.stage} files=${count} total=${mb(total)}`,
      `sent_ok=${at.sent} (${mb(at.bytes)}) in_flight=${at.busy} retries=${at.retries} after=${(ms / 1000).toFixed(1)} s`,
      alive,
      `dirs before: A=${(gInfo && gInfo.dir_a) || '-'} B=${(gInfo && gInfo.dir_b) || '-'}`,
      `browser: ${navigator.userAgent}`,
      String((e && e.stack) || ''),
    ].join('\n');
    const body = JSON.stringify({ message, stack: detail, page: location.href });
    for (let i = 0; i < 4; i++) {
      try {
        const r = await fetch('/api/jserror', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
        });
        if (r.ok) return;
      } catch (e3) { /* busy or gone: try again */ }
      await new Promise(res => setTimeout(res, 2000 * (i + 1)));
    }
  } catch (e4) { /* reporting must never break the viewer */ }
}
// The FILES panel and the chart (with the event table under it) both take a
// drop; a drop on the chart used to be thrown away in silence (demo
// list #31).  Only files count: text dragged out of a box is not a drop.
function _dragHasFiles(ev) {
  const t = ev.dataTransfer && ev.dataTransfer.types;
  return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0;
}
// Only the FILES panel takes a drop, where the sign lights up (Robert
// 2026-10-01).  Anywhere else on the Viewer a file dragged in is refused:
// the cursor says no, letting go does nothing, and the page never navigates
// to the file or lets the browser save it.  The panel shows where to go.
(() => {
  const panel = document.getElementById('files-panel');
  const take = (ev) => {
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'copy';
    showDropSign('drag');
  };
  panel.addEventListener('dragenter', take);
  panel.addEventListener('dragover', take);
  panel.addEventListener('drop', (ev) => {
    ev.preventDefault();
    handleFilesDrop(ev.dataTransfer);
  });
  window.addEventListener('dragover', (ev) => {
    if (panel.contains(ev.target)) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'none';
    if (_dragHasFiles(ev)) showDropSign('hint');
  });
  window.addEventListener('drop', (ev) => {
    if (panel.contains(ev.target)) return;
    ev.preventDefault();
    hideDropSign();
  });
})();

// The sign over the FILES panel (#drop-sign): 'drag' while files are dragged
// over the panel, 'hint' while they are dragged over the rest of the Viewer or
// the hub page around it (where a drop does nothing), 'load' while a drop
// uploads,
// 'done' for a few seconds once it has loaded.  Dragover repeats while the
// drag is over the page, so a 'drag' sign goes by itself shortly after the
// drag leaves or is let go of elsewhere; a drag over the page during a drop
// does not cover the drop's progress.
const DROP_SIGN_DRAG_MS = 800, DROP_SIGN_DONE_MS = 4000;
let gDropSignTimer = null;
function showDropSign(state, small = '', big = '') {
  if ((state === 'drag' || state === 'hint') && gDropInFlight) return;
  const el = document.getElementById('drop-sign');
  clearTimeout(gDropSignTimer);
  el.className = 'on' + (state === 'done' || state === 'hint' ? ' ' + state : '');
  el.querySelector('.ds-big').textContent =
    big || { drag: 'Drop to load', hint: 'Drop here', load: 'Loading…', done: 'Loaded' }[state];
  el.querySelector('.ds-small').textContent = small
    || { drag: 'an A or B folder, .sor / .json / .trc / .olts files, or a .zip',
         hint: 'drag the files onto this Files panel' }[state] || '';
  if (state !== 'load') {
    gDropSignTimer = setTimeout(hideDropSign, state === 'done' ? DROP_SIGN_DONE_MS : DROP_SIGN_DRAG_MS);
  }
}
function hideDropSign() {
  clearTimeout(gDropSignTimer);
  document.getElementById('drop-sign').className = '';
}

// ─── Load /api/list at startup ────────────────────────────────────────
async function loadInfo() {
  try {
    const r = await fetch('/api/list');
    // Snapshot the gate BEFORE gInfo and gThresholds are replaced below, so
    // the comparison after them can tell whether this poll actually moved it
    // (a second direction arriving moves it too: see oneDirOnly).
    const wasGate = activeGateDb();
    const wasMode = gAnalysisMode;
    gInfo = await r.json();
    gCopies = Object.assign({}, gInfo.copies_a || {}, gInfo.copies_b || {},
                            ...(gInfo.sources || []).map(x => x.copies || {}));
    // Every source's own fields, named as span 1's are ('fibers_a2', ...),
    // so everything that reads gInfo['fibers_' + src] works for any source.
    gInfo.srcs = (gInfo.sources || []).map(x => x.src);     // allSrcs()
    for (const s of (gInfo.sources || [])) {
      if (s.src === 'a' || s.src === 'b') continue;
      gInfo['dir_' + s.src] = s.dir;
      gInfo['fibers_' + s.src] = s.fibers || [];
      gInfo['files_' + s.src] = s.files || [];
      gInfo['dir_' + s.src + '_name'] = s.name;
      gInfo['dir_' + s.src + '_dropped'] = !!s.dropped;
    }
    // The hub's Analysis Mode switch moves CONFIG under a Viewer that already
    // has traces on screen.  The table is laid out per mode (the Splice
    // Report's own in OTDR Mode, FastReporter's in FR Mode), so a new mode
    // lays it out again; before, it kept the old layout until Clear All.
    gAnalysisMode = gInfo.analysis_mode === 'fr' ? 'fr' : 'suite';
    const modeMoved = gAnalysisMode !== wasMode;
    gLaunchA = Number(gInfo.launch_a_km) || 0;   // null (no reel) → 0
    gSpanDecl = gInfo.span_decl || { a: null, b: null };
    if (gInfo.thresholds) gThresholds = gInfo.thresholds;
    if (gInfo.gate_sig != null) gGateSig = gInfo.gate_sig;
    gEndRefl = Array.isArray(gInfo.end_refl) ? gInfo.end_refl : [];
    if (gInfo.end_pending) pollEndVerdicts();
    syncGateUI();
    renderFilesPanel();
    renderBackButton();
    // The gate can MOVE under a live pop-out: the hub points the trace server
    // at each report's own gates, so re-running under another customer profile
    // changes what /api/list serves.  syncGateUI only repaints the box and the
    // label, so without this the verdict column keeps the previous run's
    // answers until something else happens to re-render — which is the same
    // report/Viewer disagreement, just one click wide.
    if (gTraces.length && (modeMoved || activeGateDb() !== wasGate)) {
      renderEventTable();
      if (modeMoved) draw();     // the chart marks only the events the table prints
    }
  } catch (e) {
    setReadout('viewer server not ready yet…');
    return false;                       // signal not-ready → the boot loop retries
  }
  const nA = new Set((gInfo.fibers_a || []).map(realFiber)).size,
        nB = new Set((gInfo.fibers_b || []).map(realFiber)).size;
  if (nA === 0 && nB === 0) {
    setReadout('pick / paste A + B folders in the sidebar →');
    return true;
  }
  // A short shot is a truncated near-end acquisition: no end-of-fiber event,
  // so the cable's far end is simply not in the file.  A and B then cover
  // OPPOSITE ends of the cable and cannot be put on one frame — mirroring
  // would fold B about wherever the acquisition happened to stop, which looks
  // completely plausible and is wrong by however much cable is missing.  Say
  // so wherever it is drawn (frameWarn).
  gFrameWarn = frameWarnText(nB);
  setReadout(`A: ${gInfo.dir_a_name} (${nA} fiber${nA === 1 ? '' : 's'})   ` +
             `B: ${gInfo.dir_b_name} (${nB} fiber${nB === 1 ? '' : 's'})` +
             (gAnalysisMode === 'fr' ? '   ·   FastReporter analysis' : ''));
  return true;
}
// Every later readout ("N traces loaded", errors) would wipe
// a warning written once at load, so the frame warning is re-appended here —
// it has to stay visible for as long as it is true.
// Put the seeded gate in the box and name its source beside it.  Called
// after /api/list and again whenever the source report changes.
function syncGateUI() {
  if (gFecMode) { syncFecGateUI(); return; }
  const el = document.getElementById('set-loss');
  // Empty, not 1e9, when the report graded no loss at all — typing a number
  // still works and is picked up as an override, the usual escape hatch.
  if (el && gGateOverride == null)
    el.value = gateIsOff() ? '' : activeGateDb().toFixed(3);
  // Beside the box only when it is news: the Settings box down (breaks
  // only), a typed override, loss grading off (the box is empty), or one
  // direction loaded on a bidirectional report (#371: a different gate).
  // "(following OTDR Settings 0.160 dB)" just repeated the number in the
  // box (Robert 2026-09-29), so that usual case says it on hover.
  const lbl = document.getElementById('gate-src');
  const unusual = flagsOff() || gGateOverride != null || gateIsOff()
    || (gSourceReport !== 'uni' && oneDirOnly());
  if (lbl) {
    lbl.textContent = unusual ? `(${gateLabel()})` : '';
    lbl.classList.toggle('overridden', gGateOverride != null);
  }
  if (el) el.title = unusual ? gateLabel() : `following ${gateLabel()}`;
}

// ─── Back to the report ───────────────────────────────────────────────
// Report cells open this Viewer in its own window, which had no way back.
// Hidden when the hub embeds the Viewer in its own tab: that page already has
// its "← Back to …" buttons above the frame.
function renderBackButton() {
  const b = document.getElementById('btn-back');
  if (!b) return;
  b.hidden = window.top !== window || !(gInfo && gInfo.hub_url);
  b.textContent = '← Back to ' + (gSourceReport === 'uni' ? 'Unidirectional'
    : gSourceReport === 'sr' ? 'Splice Report' : 'reports');
}
document.getElementById('btn-back').addEventListener('click', () => {
  if (!gInfo || !gInfo.hub_url) return;
  const nav = gSourceReport === 'uni' ? 'uni' : gSourceReport === 'sr' ? 'sr' : '';
  const q = new URLSearchParams();
  if (nav) {
    q.set('nav', nav);
    if (gInfo.dir_a) q.set('sra', gInfo.dir_a);
    // A Unidirectional run on one of the panel's folders brings both back,
    // and the side it ran on; otherwise its one folder is the A box's.
    const uniSide = nav === 'uni' ? gUniSide : null;
    if (gInfo.dir_b && (nav !== 'uni' || uniSide)) q.set('srb', gInfo.dir_b);
    if (uniSide) q.set('pside', uniSide);
    if (gInfo.hub_carry) q.set('cs', gInfo.hub_carry);
  }
  const url = gInfo.hub_url + '/' + (nav ? '?' + q.toString() : '');
  // The hub tab names itself 'otdr_hub'.  Opening that name with no URL brings
  // the existing tab forward with its report untouched.  If that tab is gone the
  // browser hands back a blank window instead, so load the report page in it.
  const w = window.open('', 'otdr_hub');
  if (!w) { window.open(url, '_blank'); return; }
  let blank = false;
  try { blank = w.location.href === 'about:blank'; } catch (e) { blank = false; }
  if (blank) w.location.href = url;
  w.focus();
});

// The readout line shows failures (bold red) and warnings (bold orange: the
// FR frame warning, the B-mirrored note) and nothing else; plain notes such
// as "48 traces loaded" are not shown (Robert 2026-09-30, "no plain notes").
// Each part keeps its own colour when one line carries both.
// absentNote()'s "F999 is not in the A/B folder" / "F1, F2, F3 (+4 more) are
// not in the A folder" / "no B folder is set" are failures too, whole or as the
// tail of a load readout.
// The B folder's short-shot warning, only while one of its traces is drawn
// lined up against A (stacked, A loaded): that is the one picture it is about.
// It used to follow the folder alone, so it sat on every readout and Summary
// Report of an A-only load, and of a short shot loaded by itself and drawn
// as shot, where nothing is aligned.
function frameWarn() {
  if (gFecMode) return gFrameWarn;    // Viewer FEC: its note, not a warning
  return gFrameWarn && gTraces.some(t => t.visible && t.src === 'b' && isFlipped(t))
    ? gFrameWarn : '';
}
const READOUT_FAIL_START = /^(could not |viewer failed|drop failed|nothing written|no [AB/]+ folder is set|No fiber numbers in "|F\d+(, F\d+)* (\(\+\d+ more\) )?(is|are) not in the )/;
const READOUT_FAIL_TAIL = /, (could not load |ignored "|F\d+(, F\d+)* (\(\+\d+ more\) )?(is|are) not in the )/;
// The status line floats centred over the top of the chart.  The A/B marker
// readout holds the top right corner, so while it is up the status moves to
// the left, between the dB axis and that box, and is cut short to fit rather
// than run under it.
function placeReadout() {
  const el = document.getElementById('readout');
  const box = document.getElementById('marker-readout');
  if (!el) return;
  if (!box || box.style.display === 'none') {
    el.style.left = el.style.transform = el.style.maxWidth = '';
    return;
  }
  let left = 56;                       // the plot's left margin, M.l
  try { left = M.l; } catch (e) { /* not set up yet */ }
  el.style.transform = 'none';
  if (box.style.left) {                // the readout moved to the left corner
    const from = box.offsetLeft + box.offsetWidth + 10;
    el.style.left = from + 'px';
    el.style.maxWidth = Math.max(60, el.parentElement.clientWidth - from - 16) + 'px';
    return;
  }
  el.style.left = left + 'px';
  el.style.maxWidth = Math.max(60, box.offsetLeft - left - 10) + 'px';
}
// A load's progress leads the line while it runs ("Loading 312 of 864
// traces…", then "Building the table…" while the table waits on the
// server).  It is not a plain note: a whole span takes 40 s or more, and a
// blank line looked like a hang.
let gReadoutLast = ['', {}];
function refreshReadout() { setReadout(gReadoutLast[0], gReadoutLast[1]); }
function setReadout(s, extra = {}) {
  s = String(s || '');
  gReadoutLast = [s, extra];
  const el = document.getElementById('readout');
  const parts = [[progressNote(), 'ro-prog']];
  if (READOUT_FAIL_START.test(s)) parts.push([s, 'ro-fail']);
  else {
    // A load readout ends in loadFailNote()'s ", could not load F12 A: ..."
    // tail: keep the failure, drop the note in front of it.
    const cut = s.search(READOUT_FAIL_TAIL);
    if (cut >= 0) parts.push([s.slice(cut + 2), 'ro-fail']);
  }
  // A drop hands over what it could not load and what it moved (see
  // handleFilesDrop): those are a failure and a warning whatever they say.
  if (extra.fail) parts.push([extra.fail, 'ro-fail']);
  if (extra.warn) parts.push([extra.warn, 'ro-warn']);
  parts.push([frameWarn().trim(), 'ro-warn'], [gMirrorNote.trim(), 'ro-warn']);
  const shown = parts.filter(([t]) => t);
  el.textContent = shown.map(([t]) => t).join('   ');
  placeReadout();
  // One line, cut off at the window edge: hovering it shows the whole text.
  el.title = el.textContent;
  if (!shown.length) return;
  el.replaceChildren(...shown.map(([t, c], i) => {
    const sp = document.createElement('span');
    sp.className = c;
    sp.textContent = (i ? '   ' : '') + t;
    return sp;
  }));
}

// Hub can poke the viewer to re-read /api/list after folders change.
// If nothing is loaded yet (cold-start deep link that missed the server, or
// folders that were seeded AFTER boot), re-run the deep-link load too — the
// old behavior refreshed the fiber list but never retried the requested
// fiber, leaving a permanently blank chart.
// `bootLoadOnce`, not `bootLoad` — this listener and the boot IIFE are two
// entry points into the SAME load, and they overlap (see bootLoadOnce).
// "Nothing loaded yet" means never, not just now: an empty canvas after the
// link was shown, or after a cell jump, is not retried (see gDeepLinkDone).
window.addEventListener('focus', async () => {
  const ok = await loadInfo();
  if (ok && !gTraces.length) {
    try { await bootLoadOnce(); } catch (e) { reportJsError((e && e.message) || String(e), e && e.stack); }
    draw();
  }
});

// The hub's Analysis Mode switch reaches the Viewer here.  The embedded
// Viewer never gets a focus event when the switch beside it is clicked, and
// a pop-out window beside the hub may not either, so a cheap ask for the mode
// runs every MODE_POLL_MS (the browser slows it down in a hidden tab, and the
// tab coming back into view asks at once).  Only a CHANGE costs anything
// (loadInfo, then the table in the new layout).  One ask at a time, and none
// while a drop is going up: the server takes one request at a time.
const MODE_POLL_MS = 1500;
let gModePollBusy = false;
// The hub's Light / Dark arrives the same way: the page is served marked with
// the theme of the moment, and this keeps it in step when the switch moves.
// The plot is painted, not styled, so it is drawn again.
function applyHubTheme(t) {
  const el = document.documentElement;
  const dark = t === 'dark';
  if ((el.getAttribute('data-theme') === 'dark') === dark) return;
  if (dark) el.setAttribute('data-theme', 'dark');
  else el.removeAttribute('data-theme');
  draw();
}
async function pollAnalysisMode() {
  if (gModePollBusy || gDropInFlight || !gInfo) return;
  gModePollBusy = true;
  try {
    const j = await (await fetch('/api/mode', { cache: 'no-store' })).json();
    const m = j && j.analysis_mode === 'fr' ? 'fr' : 'suite';
    if (j && j.theme) applyHubTheme(j.theme);
    // The folders can move under the page too: the hub's A/B boxes, or
    // another window.  A side whose folder changed forgets what this page
    // pinned to the old one (removed rows, loaded traces), as a drop does.
    // Every source, not just span 1's: a drop in another window adds a
    // span or a copy (sources_sig).
    const moved = j && 'dir_a' in j
      ? ['a', 'b'].filter(d => (j['dir_' + d] || '') !== ((gInfo && gInfo['dir_' + d]) || ''))
      : [];
    const srcMoved = !!(j && gInfo && j.sources_sig != null && gInfo.sources_sig != null
                        && j.sources_sig !== gInfo.sources_sig);
    if (moved.length || srcMoved) {
      moved.forEach(forgetSide);
      const before = srcMoved ? srcDirs() : null;
      await loadInfo();
      if (before) {
        const after = srcDirs();
        for (const d of new Set([...Object.keys(before), ...Object.keys(after)])) {
          if (!moved.includes(d) && (before[d] || '') !== (after[d] || '')) forgetSide(d);
        }
      }
      renderChips();
      if (gAutoFit) fit();
      draw();
      renderEventTable();
    } else if (m !== gAnalysisMode) await loadInfo();
    // A Customer Profile picked in the hub (or any setting, or a report run)
    // moves the gates: take them now, not at the next load.
    else if (j && j.gate_sig != null && gGateSig != null && j.gate_sig !== gGateSig) {
      await loadInfo();
      if (gTraces.length) renderEventTable();
    }
    // Another window changed the shared state: follow it (not awaited, so a
    // whole-cable load does not hold up the next poll).
    if (gStateReady && !gStateApplying && j && j.state_ver > gStateVer) {
      fetchViewerState().then(st => applyViewerState(st))
        .catch(e => reportJsError((e && e.message) || String(e), e && e.stack));
    }
  } catch (e) { /* server busy or restarting: the next tick asks again */ }
  finally { gModePollBusy = false; }
}
setInterval(pollAnalysisMode, MODE_POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollAnalysisMode(); });

// ─── Add traces ───────────────────────────────────────────────────────
async function addFibers() {
  // What was typed, read before anything waits: the box is rewritten from
  // the chart as a load lands (syncFiberBox).
  const raw = document.getElementById('fiber-input').value;
  // A restore still loading (another window's state, or the chart coming
  // back after a trip to another tool) finishes first: an Add planned while
  // it loads raced it, and a file could end up neither loaded nor failed.
  if (gStateLoad) { try { await gStateLoad; } catch (e) {} }
  gSelNext = null;                   // the box (or a report jump) is the newer ask
  const ignored = [];
  const fibers = parseFibers(raw, ignored);
  if (!fibers.length) {
    // An empty box says nothing, as before.
    setReadout(raw.trim() ? noFibersNote(raw) : 'no valid fibers in input');
    return;
  }
  const plan = planOrSay(fibers, gAddDir);
  if (!plan) return;                   // nothing to load: the plot stays as it was
  const dirs = plan.dirs;
  const absentTail = (plan.absent.length ? ', ' + absentNote(plan) : '') +
                     (ignored.length ? ', ' + ignoredPartsNote(ignored) : '');

  const tasks = [];
  for (const { f, d } of plan.pairs) {
    const key = `${d}-${f}`;
    // A trace still on its way (a second click on Add while the first is
    // fetching) is not asked for again: see gLoadingKeys.
    if (gTraces.some(t => t.key === key) || gRemovedFiles.has(key) || gLoadingKeys.has(key)) continue;
    tasks.push({ key, f, d });
  }
  // Enter again, or Add, while the same fibers are still coming: that load
  // finishes and draws the table itself.  Going on here drew the table of
  // the part that had landed and said "288 traces loaded" mid-load.
  if (!tasks.length && plan.pairs.some(({ f, d }) => gLoadingKeys.has(`${d}-${f}`))) return;
  const epoch = gLoadEpoch;
  // Two regimes.
  //
  // DETAIL (<= MAX_DETAIL_TRACES): full resolution, one fetch per trace, the
  // FastReporter-style event grid.  Unchanged behaviour.
  //
  // OVERVIEW: a whole cable, up to MAX_OVERVIEW_FIBERS per direction.  At full
  // resolution 1152 x 39,173 points is 340 MB and thousands of serial fetches,
  // which is why the old cap was 48.  Both are fixed server-side: /api/traces
  // returns the lot in one response, decimated to ~OVERVIEW_PTS points per
  // fiber by bucketed min/max, which is lossy in POSITION (~35 m at 69.5 km)
  // but not in DEPTH — a narrow spike is the extreme of its bucket, so it
  // survives.  Measured: plain striding kept 0.111 dB of a 0.943 dB glint;
  // min/max kept 0.957.
  //
  // A+B USED TO BE EXCLUDED from this — the gate read `dirs.length === 1`, so
  // asking for a cable in both directions silently gave you 48 traces and the
  // field asked why.  The reason was never the transfer: it was that the event
  // grid's column clustering was cubic, so 2,304 traces would not render.  That
  // is gone, and the numbers now say so plainly.  Measured here on 864 fibers
  // both ways — 1,728 traces, 22,767 events:
  //
  //     clustering       348 ms      the part that used to be impossible
  //     fetch         36,127 ms      62 MB through a single-threaded server
  //
  // So the cost is transfer, it is linear, and it is the tech's to spend: they
  // asked for a whole cable in two directions.  The readout says how many are
  // coming so a 36-second wait is an expectation rather than a hang.
  // 1728, not 1152.  1152 was never a limit, it was the size of the spans this
  // was built against, which are all 1152-fiber sets.  The
  // engine already states the real ceiling, in run_splicereport.py's stray-fiber
  // guard: "No real cable exceeds ~1728 fibers".  Leaving the viewer at 1152
  // meant one direction of a 1728-fiber cable was capped while the SAME 1728
  // traces loaded fine as 864 A + 864 B, which is a difference the glass does
  // not have.
  // Also when they join a chart already past the detail cap (a big partial
  // load: fibres 1-100, then 101-105): a detail load there was refused,
  // "already at the 48-trace limit" (Robert 2026-10-01: "add should
  // definitely work after a big partial load").
  const overview = tasks.length > MAX_DETAIL_TRACES
    || gTraces.length + tasks.length > MAX_DETAIL_TRACES;
  const MAX_TRACES = overview ? MAX_OVERVIEW_FIBERS * dirs.length
                              : MAX_DETAIL_TRACES;
  let capped = false;
  const room = Math.max(0, MAX_TRACES - gTraces.length);
  if (tasks.length > room) {
    if (room === 0) {
      setReadout(`already at the ${MAX_TRACES}-trace limit. Remove some first`);
      return;
    }
    tasks.length = room;
    capped = true;
  }
  if (overview) {
    gLoadFailures = plan.gaps.slice();
    const ld = beginLoad(tasks);
    let ok;
    try { ok = await loadOverview(tasks, ld); } finally { endLoad(ld); }
    if (epoch !== gLoadEpoch) return;  // cleared or replaced meanwhile
    syncFileMarks();                 // what the box loaded is selected in FILES
    renderChips();
    if (gAutoFit) fit();
    draw();
    await buildTable();
    setReadout(`${gTraces.length} traces loaded in overview (~${OVERVIEW_PTS} pts each` +
               `, spikes preserved)` +
               (capped ? `, capped at ${MAX_TRACES}` : '') +
               loadFailNote() + absentTail +
               (ok ? '' : '. Bulk load failed, see console'));
    return;
  }
  gLoadFailures = plan.gaps.slice();
  const ld = tasks.length ? beginLoad(tasks) : null;
  // Throttle the fan-out so the single-threaded trace server stays responsive.
  const BATCH = 6;
  try {
    for (let i = 0; i < tasks.length; i += BATCH) {
      const batch = tasks.slice(i, i + BATCH);
      await Promise.all(batch.map(t => loadOne(t.key, t.f, t.d)));
      loadStep(ld, batch.length);
      if (epoch !== gLoadEpoch) return;  // cleared or replaced meanwhile
    }
  } finally { if (ld) endLoad(ld); }
  syncFileMarks();
  renderChips();
  if (gAutoFit) fit();
  draw();
  await buildTable();
  setReadout(`${gTraces.length} trace${gTraces.length===1?'':'s'} loaded` +
             (capped ? `, capped at ${MAX_TRACES}; narrow the fiber range for more` : '') +
             loadFailNote() + absentTail);
}

// What the folders can serve of an asked-for load, from /api/list's fibre
// lists, before anything is fetched or cleared.  The click-through audit
// (2026-09-29, a 1152-fibre span): F999 cleared the chart and read "could not
// load F999 A: HTTP 404; F999 B: HTTP 404", and A + B with no B folder set
// read "could not load F1 B: not found; ... (+237 more)" for a load that was
// fine.
//   dirs    the directions to load.  A + B with one folder set is that side
//           alone, silently.
//   pairs   {f, d} to fetch: each fibre in each direction whose folder lists it.
//   absent  fibres no direction lists: said plainly, never fetched.
//   gaps    a fibre one folder lists and the other does not: a note for the
//           load readout, the way a failed file is.
// A folder whose list is empty (a server that sends none) is tried for every
// fibre, as before; so is everything when /api/list has not answered yet.
function planFiberLoad(fibers, addDir, info) {
  let asked = addDir === 'a' ? ['a'] : addDir === 'b' ? ['b'] : ['a', 'b'];
  // More than span 1's two folders loaded: typed fibers load from the spans
  // on the chart (the lowest loaded when it is empty), every copy of each
  // side included, so typing 5 never pulls span 2's fiber 5 in beside span
  // 1's.
  const srcs = ((info && info.sources) || []).map(x => x.src);
  if (srcs.some(d => d !== 'a' && d !== 'b')) {
    const sides = asked;
    const onChart = new Set(gTraces.map(t => t.span || 1));
    const spans = onChart.size ? onChart : new Set([Math.min(...srcs.map(spanOf))]);
    asked = srcs.filter(d => sides.includes(sideOf(d)) && spans.has(spanOf(d)));
  }
  if (!info) return { dirs: asked, pairs: fibers.flatMap(f => asked.map(d => ({ f, d }))),
                      absent: [], gaps: [], noFolder: false };
  const dirs = asked.filter(d => info['dir_' + d]);
  if (!dirs.length) return { dirs: asked, pairs: [], absent: fibers.slice(), gaps: [], noFolder: true };
  const lists = dirs.map(d => { const l = info['fibers_' + d]; return l && l.length ? new Set(l) : null; });
  const pairs = [], absent = [], gaps = [];
  for (const f of fibers) {
    const has = dirs.filter((d, i) => !lists[i] || lists[i].has(f));
    if (!has.length) { absent.push(f); continue; }
    for (const d of dirs) {
      if (has.includes(d)) pairs.push({ f, d });
      else gaps.push(`F${fiberLabel(f)} ${d.length > 1 ? srcLabel(d) : d.toUpperCase()}: not in the folder`);
    }
  }
  return { dirs, pairs, absent, gaps, noFolder: false };
}

// "F999 is not in the A/B folder"; "F998, F999 are not in the A folder".
function absentNote(plan) {
  const where = plan.dirs.map(d => d.length > 1 ? srcLabel(d) : d.toUpperCase()).join('/');
  if (plan.noFolder) return `no ${where} folder is set`;
  const a = plan.absent;
  return a.slice(0, 3).map(f => 'F' + fiberLabel(f)).join(', ') +
         (a.length > 3 ? ` (+${a.length - 3} more)` : '') +
         ` ${a.length === 1 ? 'is' : 'are'} not in the ${where} folder`;
}

// The plan, or null after saying why nothing will load.  Null leaves the
// chart, the Fibers box and the table exactly as they were.
function planOrSay(fibers, addDir) {
  const plan = planFiberLoad(fibers, addDir, gInfo);
  if (plan.pairs.length) return plan;
  setReadout(absentNote(plan));
  return null;
}

// A report link (or a pop-out jump) to fibers whose every file was removed
// from the Viewer: say so and leave the chart as it is.  It loaded nothing
// and said nothing, so the tech got a blank Viewer under the hub's "Jumped to
// fiber 354" (2026-10-02 click audit).  True when it said so.
function sayRemovedTarget(plan) {
  if (!plan.pairs.length || !plan.pairs.every(({ f, d }) => gRemovedFiles.has(`${d}-${f}`)))
    return false;
  const fibers = [...new Set(plan.pairs.map(p => p.f))];
  const names = fibers.slice(0, 3).map(f => 'F' + fiberLabel(f)).join(', ') +
                (fibers.length > 3 ? ` (+${fibers.length - 3} more)` : '');
  const one = fibers.length === 1;
  setReadout('', { warn: `${names} ${one ? 'was' : 'were'} removed from the Viewer. ` +
    `Right-click a file and choose Put Back to see ${one ? 'it' : 'them'} again.` });
  return true;
}

// The ", could not load F12 A: ..." tail of a load readout: the first three
// by name, then a count.  One copy for every load path.  The overview readout
// used to print none of it, so a bad file just left the count one short.
function loadFailNote() {
  if (!gLoadFailures.length) return '';
  return `, could not load ${gLoadFailures.slice(0, 3).join('; ')}` +
         (gLoadFailures.length > 3 ? ` (+${gLoadFailures.length - 3} more)` : '');
}

// Ctrl+A (Cmd+A on a Mac) with the focus off an input: select every file in
// the FILES list, the way it does in a Windows file list, and LOAD them —
// marking alone left the tech with a highlighted list and an empty chart, and
// the one thing "select all" is asked for is seeing the whole cable.  It goes
// through the same selectFiles a click does, so a selection past
// MAX_DETAIL_TRACES takes the bulk overview instead of stopping at 48.
// Without this the browser selected the page's text.
//
// gSelectedFiles is THE selection, FastReporter's single one: the rows a
// click, a key or a drag picked, painted at once, and once the load settles
// exactly the traces that are loaded (syncFileMarks).  The right-click menu
// acts on it, so a right-click Remove on a selected row removes them all.
const gSelectedFiles = new Set();     // "<dir>-<fiber>" keys
async function selectAllFiles() {
  const want = new Set(fileRowKeys());
  if (!want.size) { setReadout('no files loaded'); return; }
  setReadout(`${want.size} files selected, loading…`);
  await selectFiles(want);              // paints the marks, then loads
}
function clearFileSelection() {
  if (!gSelectedFiles.size) return;
  gSelectedFiles.clear();
  document.querySelectorAll('#files-list .file-row.selected').forEach(r => r.classList.remove('selected'));
}

// The two load regimes, shared by the Fibers box and the FILES panel: up to
// MAX_DETAIL_TRACES at full resolution, beyond that the bulk/decimated
// overview, up to MAX_OVERVIEW_FIBERS per direction.  These lived inside
// addFibers, so a FILES-panel selection was stuck on a flat 48 -- marking a
// whole cable in the list loaded 48 of it and said so in the readout, while
// typing the same fibers into the Fibers box loaded the lot.
const MAX_DETAIL_TRACES = 48;
const MAX_OVERVIEW_FIBERS = 1728;      // per direction, so A+B gets 3456

// Points per fiber requested in overview mode.  2000 is ~35 m per point on a
// 69.5 km span: enough to see a spike or an outlier trace, not enough to read
// a splice loss off the screen — which is what the detail regime is for.
const OVERVIEW_PTS = 2000;

// Whole-cable bulk load: ONE request, decimated server-side.  Chunked so the
// canvas fills in progressively instead of showing nothing for ~30 s while
// 1152 SOR files are parsed on first visit to a folder.
async function loadOverview(tasks, ld = null) {
  const CHUNK = 144;                       // one ribbon-group per request
  let done = 0;
  // Every key is on its way from now on, so a second Enter or Add during
  // the load plans none of them again (gLoadingKeys).  Before, the overview
  // never said so: a second Enter fetched all 864 traces a second time
  // through the single-threaded server, 36 s for a 13 s load.
  const epoch = gLoadEpoch;
  for (const t of tasks) gLoadingKeys.add(t.key);
  loadProgress(0, tasks.length);
  try {
  // /api/traces serves ONE direction per request, and in A+B mode the task
  // list interleaves them — so group first and walk each direction's chunks.
  // Grouped rather than interleaved on purpose: the server is single-threaded,
  // so A's fibers arrive as a run and the canvas shows a coherent direction
  // early instead of a half-drawn X.
  const byDir = new Map();
  for (const t of tasks) {
    if (!byDir.has(t.d)) byDir.set(t.d, []);
    byDir.get(t.d).push(t);
  }
  for (const [dir, dirTasks] of byDir) {
  for (let i = 0; i < dirTasks.length; i += CHUNK) {
    const slice = dirTasks.slice(i, i + CHUNK);
    const spec = slice.map(t => t.f).join(',');
    try {
      const r = await fetch(`/api/traces?dir=${dir}&fibers=${spec}&maxpts=${OVERVIEW_PTS}`);
      if (epoch !== gLoadEpoch) return false;   // cleared or replaced: push nothing
      if (!r.ok) { gLoadFailures.push(`bulk HTTP ${r.status}`); return false; }
      const payload = await r.json();
      if (epoch !== gLoadEpoch) return false;
      for (const t of slice) gLoadingKeys.delete(t.key);
      for (const data of (payload.traces || [])) {
        const key = `${dir}-${data.fiber}`;
        if (gTraces.some(t => t.key === key) || gRemovedFiles.has(key)) continue;
        // The file's own direction stamp, as a detail load reads it (loadOne):
        // without it a file saved the other way was drawn as its folder past
        // 48 files and as itself below.
        if (data.stored_dir && data.stored_dir !== dir[0]) gStoredDir[key] = data.stored_dir;
        else delete gStoredDir[key];
        const tr = {
          key, fiber: data.fiber, src: dir, span: dir.length > 1 ? spanOf(dir) : 1, dir: effDir(dir, data.fiber), visible: true,
          data, overview: true,
        };
        tr.color = traceColor(tr);
        gTraces.push(tr);
      }
      // `missing` holds every fiber that did not come back; `failed` is the
      // part whose file is there but would not parse.  Only the rest is
      // truly not found.  The direction letter matches loadOne's notes, and
      // tells F12 A from F12 B in an A+B load.
      const failed = new Map((payload.failed || []).map(x => [x.fiber, x.error]));
      const D = dir.toUpperCase();
      for (const f of (payload.missing || [])) {
        gLoadFailures.push(failed.has(f) ? `F${fiberLabel(f)} ${D}: unreadable (${failed.get(f)})`
                                         : `F${fiberLabel(f)} ${D}: not found`);
      }
    } catch (err) {
      console.warn('bulk load failed', err);
      gLoadFailures.push(String(err));
      return false;
    }
    done += slice.length;
    if (ld) loadStep(ld, slice.length);
    else setReadout(`loading ${done}/${tasks.length} traces…`);
    loadProgress(done, tasks.length);
    // draw() early-returns on `!gView`, and gView is null on a cold page and
    // again after Clear All.  fit() -- the only thing that fills it -- runs in
    // addFibers() AFTER this loop returns, so every draw() below was a no-op:
    // the canvas stayed blank for the whole ~30 s load, which is the exact
    // thing the chunking above exists to prevent.  Re-fit as the traces land
    // instead.  `gAutoFit` is already false once the tech has zoomed or panned,
    // so this cannot yank a view out from under them mid-load.
    if (gAutoFit) { const b = dataBounds(); if (b) gView = b; }
    // Same shape, same cause: the chip strip printed the literal "no traces
    // loaded" beside a readout counting up to 1152.  Cheap to do per chunk --
    // the Files panel highlights each chunk's files as they arrive, which
    // doubles as a progress indicator.
    renderChips();
    // renderEventTable() stays OUT of the loop deliberately: it rebuilds every
    // one of ~10k rows, and eight passes would cost more than the redraw buys.
    // Yield so the progress text paints and the tab stays responsive.
    draw();
    await new Promise(res => setTimeout(res, 0));
    if (epoch !== gLoadEpoch) return false;
  }
  }
  return true;
  } finally {
    if (epoch === gLoadEpoch) for (const t of tasks) gLoadingKeys.delete(t.key);
  }
}

// The readout shows no plain notes (Robert 2026-09-30), so the load's
// "loading 288/864 traces" never showed and the event panel said "add a
// trace to see events" for the whole 12-35 s of a cable load.  The panel's
// hint counts instead, until the table replaces it.
function loadProgress(done, total) {
  const hint = document.getElementById('event-hint');
  if (hint) hint.textContent = `loading ${done} of ${total} traces…`;
}

// ─── A load in flight ─────────────────────────────────────────────────
// A whole span (864 traces both ways) used to load with a blank status line,
// "add a trace to see events" under the chart, and a Fibers box and Dir
// buttons that followed the chunks as they landed: "1-144", "1-288", A→,
// and only then the full range and A + B.  While a load runs the line counts
// it, the hint says it is loading (loadProgress counts there too), and the
// box and the buttons show what was asked for (what is loaded plus what is
// on its way).  A new load epoch (Clear All, a new FILES selection) drops
// the older loads' asks with their keys (newLoadEpoch).  `tasks` are {f, d}.
function beginLoad(tasks) {
  const ld = { fibers: new Set(tasks.map(t => t.f)), dirs: new Set(tasks.map(t => t.d)),
               done: 0, total: tasks.length };
  gLoadsInFlight.add(ld);
  const hint = document.getElementById('event-hint');
  if (hint && !gTraces.some(t => t.visible)) hint.textContent = 'loading traces…';
  syncFiberBox();
  refreshReadout();
  return ld;
}
// The status line's count (progressNote); the event panel's hint counts
// too (loadProgress).
function loadStep(ld, n) {
  ld.done = Math.min(ld.total, ld.done + n);
  refreshReadout();
}
function endLoad(ld) {
  gLoadsInFlight.delete(ld);
  refreshReadout();
}
function progressNote() {
  if (gLoadsInFlight.size) {
    let done = 0, total = 0;
    for (const ld of gLoadsInFlight) { done += ld.done; total += ld.total; }
    return `Loading ${done} of ${total} trace${total === 1 ? '' : 's'}…`;
  }
  return gTableBusy ? 'Building the table…' : '';
}
// The table step, said before it starts: the line paints "Building the
// table…" first (a frame, or 50 ms in a hidden tab, where frames stop), then
// the table is built.  A table that waits on the server keeps the line up
// until it paints (tableSettled).
async function buildTable() {
  gTableBusy = true;
  refreshReadout();
  await new Promise(res => {
    let done = false;
    const go = () => { if (!done) { done = true; res(); } };
    requestAnimationFrame(() => setTimeout(go, 0));
    setTimeout(go, 50);
  });
  renderEventTable();
}
function tableSettled() {
  dropOldTable();
  if (gTableBusy) { gTableBusy = false; refreshReadout(); }
  tableGoKm();
}

// ─── The server-built tables, kept ─────────────────────────────────────
// A whole span's FastReporter table took a minute or more to come back, and
// every repaint of the event panel asked for it again: the end-connector
// verdicts landing a moment after it painted threw the finished table away,
// left the area blank under "Building the table…" and asked for the same
// rows a second time.  The rows depend only on the files (the loaded trace
// objects: a re-loaded or edited trace is a new object), the mode and the
// folders, so the answer is kept for exactly those, and a second ask while
// the first is on its way waits for it.
const gTraceStamps = new WeakMap();
let gTraceStampN = 0;
function traceStamp(t) {
  if (!t) return 0;
  let n = gTraceStamps.get(t);
  if (!n) { n = ++gTraceStampN; gTraceStamps.set(t, n); }
  return n;
}
// `extra`: whatever else the table's answer follows (the Splice Report's
// follows the report run's settings, see renderSuiteBidiGrid).
function serverTableKey(kind, pairs, extra = '') {
  return [kind, gAnalysisMode, (gInfo && gInfo.dir_a) || '', (gInfo && gInfo.dir_b) || '', extra,
          pairs.map(p => `${p.tkey || p.fiber}:${traceStamp(p.ta)}:${traceStamp(p.tb)}`).join(',')].join('|');
}
function keptServerTable(kind, key) {
  const k = gServerTables.get(kind);
  return k && k.key === key && k.res ? k.res : null;
}
// The answer for `key`, asked once: `keep(res)` says whether it may serve
// the next repaint (an answer still pending, or an error, is asked again).
function askServerTable(kind, key, url, keep) {
  const k = gServerTables.get(kind);
  if (k && k.key === key && k.pending) return k.pending;
  const entry = { key, res: null, pending: null };
  entry.pending = fetch(url).then(r => r.json()).then(res => {
    res = res || {};
    if (gServerTables.get(kind) === entry) {
      entry.pending = null;
      if (keep(res)) entry.res = res; else gServerTables.delete(kind);
    }
    return res;
  }, e => {
    if (gServerTables.get(kind) === entry) gServerTables.delete(kind);
    throw e;
  });
  gServerTables.set(kind, entry);
  return entry.pending;
}
// A table that has to come from the server again (a mode switch, other
// traces) leaves the last one on screen, dimmed, under a note, until the new
// one paints (tableSettled): never a blank area, and never a stale table
// without the note.  `prev`: [node, scrollTop, scrollLeft] of what was there.
function holdOldTable(host, prev) {
  const note = document.createElement('div');
  note.className = 'tbl-updating';
  note.textContent = 'Updating the table…';
  host.appendChild(note);
  gHeldNodes = [note];
  for (const [n] of prev) {
    host.appendChild(n);
    gHeldNodes.push(n);
  }
  // back where the tech had scrolled it (re-attached, it starts at the top)
  for (const [n, top, left] of prev) {
    if (top) n.scrollTop = top;
    if (left) n.scrollLeft = left;
  }
  host.classList.add('tbl-stale');
}
function dropOldTable() {
  const host = document.getElementById('event-tbody-wrap');
  if (!host) return;
  for (const n of gHeldNodes) if (n.parentNode === host) host.removeChild(n);
  gHeldNodes = [];
  host.classList.remove('tbl-stale');
}
// The end-connector verdicts change only the end marks, the P/F column and
// the drawer's marks of a server-built table: the one on screen takes them
// in place (refreshVerdicts).  It cannot when a filter decides which rows
// and columns show; the panel is laid out again then, from the kept answer.
function endVerdictsLanded() {
  // Mid-load the table is not built yet: the load builds it when it ends,
  // with these.  Built now it was a table of the traces loaded so far,
  // thrown away a few seconds later.
  if (gLoadsInFlight.size) return;
  const live = gTableLive;
  if (live && live.scroller.parentNode === live.host && live.refreshVerdicts()) return;
  renderEventTable();
}
function tableStepEnd(wasBusy) {
  if (gTableBusy !== wasBusy) refreshReadout();
  if (!gTableBusy) tableGoKm();
}

let gLoadFailures = [];            // per-addFibers() failure notes for the readout
// The traces being fetched right now.  A load plans what is missing and then
// awaits its fetches, so a second Add (a double-click, Enter then Add) used to
// plan the same keys again and push every trace twice: gTraces a-354, b-354,
// a-354, b-354, drawn twice, and listed twice in the Summary Report (
// demo list #33).  A key in here is never planned again, and neither loadOne
// nor loadOverview pushes a key that is already loaded, however loads overlap.
const gLoadingKeys = new Set();
// Which load the chart belongs to.  Clear All and a new FILES selection
// each start a new one; a fetch that comes back for an older one pushes
// nothing and stops its load.  Before (audit 2026-10-01)
// Clear All in the middle of a 432-fiber load emptied the chart for a moment
// and then the rest of the load kept landing: 720 of the 864 traces came
// back, with the Fibers box reading "1-432".  The keys still on their way
// belong to the old load, so they are let go at once and a load asked for
// straight after the clear plans them again.
let gLoadEpoch = 0;
function newLoadEpoch() {
  gLoadEpoch++;
  gLoadingKeys.clear();
  gLoadsInFlight.clear();            // their asks no longer count (syncFiberBox)
}
// fetch() that retries a THROWN fetch (connection refused/reset: "Failed to
// fetch") a few times with a short backoff.  An HTTP error is an answer from
// the server, so it comes straight back and is never retried.
async function fetchRetry(url, tries = 3) {
  for (let i = 0; ; i++) {
    try {
      return await fetch(url);
    } catch (e) {
      if (i + 1 >= tries) throw e;
      await new Promise(res => setTimeout(res, 150 * (i + 1)));
    }
  }
}

async function loadOne(key, fiber, dir) {
  if (gLoadingKeys.has(key) || gTraces.some(t => t.key === key)) return;
  gLoadingKeys.add(key);
  const epoch = gLoadEpoch;
  try {
    const r = await fetchRetry(`/api/trace?dir=${dir}&fiber=${fiber}`);
    if (epoch !== gLoadEpoch) return;     // cleared or replaced: push nothing
    if (!r.ok) {
      console.warn('fail', key, r.status);
      gLoadFailures.push(`F${fiberLabel(fiber)} ${dir.toUpperCase()}: HTTP ${r.status}`);
      return;
    }
    const data = await r.json();
    if (epoch !== gLoadEpoch) return;
    if (data.error) {
      console.warn('err', key, data.error);
      gLoadFailures.push(`F${fiberLabel(fiber)} ${dir.toUpperCase()}: ${data.error}`);
      return;
    }
    if (data.stored_dir && data.stored_dir !== dir[0]) gStoredDir[key] = data.stored_dir;
    else delete gStoredDir[key];
    if (gRemovedFiles.has(key)) return;    // taken out of the list meanwhile
    if (gTraces.some(t => t.key === key)) return;   // loaded meanwhile: never twice
    const t = { key, fiber, src: dir, span: dir.length > 1 ? spanOf(dir) : 1, dir: effDir(dir, fiber), visible: true, data };
    t.color = traceColor(t);
    gTraces.push(t);
  } catch (e) {
    console.warn(e);
    gLoadFailures.push(`F${fiberLabel(fiber)} ${dir.toUpperCase()}: ${e && e.message || 'fetch failed'}`);
  } finally {
    if (epoch === gLoadEpoch) gLoadingKeys.delete(key);
  }
}

function removeTrace(key) {
  gTraces = gTraces.filter(t => t.key !== key);
  COLORS_USED.delete(key);
  syncFileMarks();
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
}

// "Remove from viewer" on a FILES row: out of the list and, if loaded, off
// the chart and grid.  removeTrace re-renders the list, which now skips it.
function removeFile(key, fiber) {
  const next = fileAfterRemove(fileRowKeys(), new Set([key]));
  gRemovedFiles.add(key);
  removeTrace(key);
  const msg = `F${fiberLabel(fiber)} removed from the viewer and its reports (right-click a file to put it back)`;
  setReadout(msg);
  selectAfterRemove(next, msg);
  unloadEmptiedSides();
}

// Remove This File / Remove This Fiber: these files only, whatever else is
// marked.  The rest of the chart stays on it and the Fibers box follows
// ("1-199, 201-432"); only a Remove that empties the chart moves on to the
// next file, as FastReporter does (selectAfterRemove).
function removeOnly(keys, what) {
  const listed = fileRowKeys();
  keys = keys.filter(key => listed.includes(key));
  if (!keys.length) return;
  const next = fileAfterRemove(listed, new Set(keys));
  keys.forEach(key => { gRemovedFiles.add(key); COLORS_USED.delete(key); });
  gTraces = gTraces.filter(t => !gRemovedFiles.has(t.key));
  syncFileMarks();
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  const msg = `${what} removed from the viewer and its reports (right-click a file to put it back)`;
  setReadout(msg);
  selectAfterRemove(next, msg);
  unloadEmptiedSides();
}

function removeSelectedFiles() {
  const keys = [...gSelectedFiles];
  const next = fileAfterRemove(fileRowKeys(), new Set(keys));
  gSelectedFiles.clear();
  keys.forEach(key => gRemovedFiles.add(key));
  gTraces = gTraces.filter(t => !gRemovedFiles.has(t.key));
  prunePick();
  keys.forEach(key => COLORS_USED.delete(key));
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  const msg = `${keys.length} file${keys.length === 1 ? '' : 's'} removed from the viewer`
    + ` and its reports (right-click a file to put ${keys.length === 1 ? 'it' : 'them'} back)`;
  setReadout(msg);
  selectAfterRemove(next, msg);
  unloadEmptiedSides();
}

// Removed files stay out of the list, the chart and every report until the
// tech puts them back here (a trip to another tool no longer lists them
// again, now that the state is kept: see pushViewerState).
async function putBackRemovedFiles() {
  const keys = [...gRemovedFiles];
  const n = keys.length;
  if (!n) return;
  gRemovedFiles.clear();
  renderChips();
  // With traces on the chart the files go back on it too, the way the chart
  // is loaded: next to a whole cable (overview traces) a detail load is
  // refused at MAX_DETAIL_TRACES, so they come back as overview traces.
  if (gTraces.length) {
    const tasks = keys.map(key => { const [d, f] = splitFileKey(key); return { key, f, d }; });
    // Counted on the status line like any other load, and the Fibers box
    // and Dir buttons show what is coming back from the start (beginLoad).
    const ld = beginLoad(tasks);
    try {
      if (gTraces.length + tasks.length > MAX_DETAIL_TRACES) await loadOverview(tasks, ld);
      else for (const t of tasks) { await loadOne(t.key, t.f, t.d); loadStep(ld, 1); }
    } finally { endLoad(ld); }
    syncFileMarks();
    renderChips();
    if (gAutoFit) fit();
    draw();
    renderEventTable();
  }
  setReadout(`${n} removed file${n === 1 ? '' : 's'} put back in the list, the chart and the reports`);
}

// FastReporter never leaves the list with nothing selected: after a Remove
// the file that slides into the removed spot is selected, or the last file
// when the removed ones were at the bottom.  Only when the Remove took the
// whole selection; removing a file outside it leaves the selection alone.
async function selectAfterRemove(next, msg) {
  if (!next || gSelectedFiles.size) return;
  gFileAnchor = gFileFocus = next;
  if (gFilesView === 'fibers') {         // the next fibre, both of its files
    const [src, f] = splitFileKey(next);
    gFiberAnchor = gFiberFocus = spanOf(src) > 1 ? `${spanOf(src)}:${f}` : String(f);
    selectFibers([gFiberFocus]);
    return;
  }
  await selectFiles(new Set([next]));
  setReadout(`${msg} · ${fileNameOf(next)} selected`);
}

function clearAll() {
  gSelNext = null;                   // a FILES selection still queued is dropped too
  newLoadEpoch();                    // and a load still landing stops (gLoadEpoch)
  gTraces = [];
  COLORS_USED.clear();
  clearFileSelection();
  gPickKey = null;                   // nothing left to point at
  gAutoFit = true;
  gView = null;
  gMarkers = { a: null, b: null };   // drop stale markers — they're meaningless
  gDragMarker = null;                // with no trace, and left set they fed the
                                     // null-gView crash on the next mouse-move.
  document.getElementById('fiber-input').value = '';
  renderChips();
  draw();
  renderEventTable();
  setReadout('');                    // not the last load's or view's words
}

// ─── Files panel (right side, the way FastReporter lists files) ───────
// renderChips keeps its name: it is the one choke point every add, remove,
// clear and visibility change routes through, which is exactly when the
// measured mirror frame can go stale.
function renderChips() {
  refreshMirrorFrame();
  renderFilesPanel();
  syncFiberBox();
  pushViewerState();
}

// ─── The state every Viewer window shares (trace_server.viewer_state) ──
// What is on the chart, what was removed from the FILES list and the Dir
// buttons go to the server whenever they change (renderChips is the one
// choke point every add, remove and clear goes through).  A window that
// opens takes them back (bootLoad), so a trip to another tool and back finds
// the chart as it was; a window already open follows the newer state from
// another one (pollAnalysisMode), so the hub's Viewer and the pop-out keep
// each other up to date.  `gStateSig` is the last state this window sent or
// took: the same state is never sent twice, so two windows cannot echo one
// change back and forth.
function stateSig(keys, removed, addDir) {
  return JSON.stringify([[...keys].sort(), [...removed].sort(), addDir]);
}
function pushViewerState() {
  if (!gStateReady || gStateApplying || !gInfo) return;
  clearTimeout(gStatePushT);
  gStatePushT = setTimeout(async () => {
    if (gStateApplying || !gStateReady) return;
    // The traces still on their way count: a tech who leaves for another
    // tool in the middle of a cable load comes back to the whole cable, not
    // the chunks that had landed (Robert 2026-10-02).
    const keys = [...new Set([...gTraces.map(t => t.key), ...gLoadingKeys])];
    const removed = [...gRemovedFiles];
    const sig = stateSig(keys, removed, gAddDir);
    if (sig === gStateSig) return;
    const removedSig = [...removed].sort().join(',');
    gStateSig = sig;
    try {
      const r = await fetch('/api/viewer_state', { method: 'POST',
        body: JSON.stringify({ by: gClientId, keys, removed, add_dir: gAddDir }) });
      const j = await r.json();
      if (j && j.ver) gStateVer = Math.max(gStateVer, j.ver);
      // The table is the span run again without the removed files (the
      // server's run follows this state), so ask for it again now the
      // server has it: a table asked for before this landed is the old run
      // (its kept answer is keyed by the removed files the server had).
      // Only when they moved: a load or a Dir change keeps the table on
      // screen, which is built once (see serverTableKey).
      const removedMoved = removedSig !== gServerRemovedSig;
      gServerRemovedSig = removedSig;
      if (removedMoved && gTraces.length) renderEventTable();
    } catch (e) { gStateSig = ''; }    // the next change tries again
  }, 300);
}
async function fetchViewerState() {
  try { return await (await fetch('/api/viewer_state', { cache: 'no-store' })).json(); }
  catch (e) { return null; }
}
// A state made on the folders loaded now (a state from before a drop or a
// new folder belongs to the old span).
function stateFits(s) {
  if (!(s && gInfo && (s.dir_a || '') === (gInfo.dir_a || '')
        && (s.dir_b || '') === (gInfo.dir_b || ''))) return false;
  // Every source's folder too (span 2, copies), when the state says them.
  if (!s.folders) return true;
  const now = srcDirs();
  const keys = new Set([...Object.keys(s.folders), ...Object.keys(now)]);
  return [...keys].every(k => (s.folders[k] || '') === (now[k] || ''));
}
// Take a state: its removed files, its Dir and, unless `keysToo` is false,
// its traces (loading the missing ones and dropping the rest).
async function applyViewerState(s, keysToo = true) {
  if (!s) return;
  gStateVer = Math.max(gStateVer, s.ver || 0);
  if (s.by === gClientId || !stateFits(s)) return;
  gStateApplying++;
  try {
    gRemovedFiles.clear();
    (s.removed || []).forEach(k => gRemovedFiles.add(k));
    gServerRemovedSig = [...gRemovedFiles].sort().join(',');
    const want = new Set((s.keys || []).filter(k => !gRemovedFiles.has(k)));
    gStateSig = stateSig(keysToo ? [...want] : gTraces.map(t => t.key),
                         [...gRemovedFiles], s.add_dir || 'both');
    if (keysToo) {
      if (want.size) {
        // until the selection queue is empty: selectFiles returns at once
        // when a load is already running and queues this one behind it
        gStateLoad = (async () => {
          await selectFiles(want);
          while (gSelLoading) await new Promise(r => setTimeout(r, 100));
        })();
        try { await gStateLoad; } finally { gStateLoad = null; }
      } else if (gTraces.length) clearAll();
    }
    setAddDir(s.add_dir || 'both');
    renderFilesPanel();
  } finally {
    gStateApplying--;
  }
  // What the tech did while it loaded (a Put Back, a Remove) was held back
  // with the echo; send it now if the page no longer matches what it took.
  if (!gStateApplying) pushViewerState();
}

// The Fibers box says what is loaded, however it got there: a FILES-panel
// click, a removal, a report jump.  It kept the last typed list, so after
// Clear All it still read "1-240" over an empty chart.  Left alone while the
// tech is typing in it.  The Dir buttons follow too: A, B or A + B by the
// folder each trace comes from (`src`), which is what Add loads from, not
// the direction it is drawn as after a Direction change.
function syncFiberBox() {
  const box = document.getElementById('fiber-input');
  if (document.activeElement === box) return;
  // While a load runs, what it asked for counts as loaded (see beginLoad):
  // the box and the buttons say where the load is going from the start.
  const fibers = gTraces.map(t => t.fiber);
  const dirs = new Set(gTraces.map(t => t.src || t.dir));
  for (const ld of gLoadsInFlight) {
    fibers.push(...ld.fibers);
    ld.dirs.forEach(d => dirs.add(d));
  }
  // A load landing that did not say what it asked for (no beginLoad) is
  // waited for: the first chunk is A's alone, and the box read "1-144" with
  // the Dir on "A →", so a Clear All there left the next load to fetch A
  // only (audit 2026-10-01).  The load syncs both when it settles.
  if (gLoadingKeys.size && !gLoadsInFlight.size) return;
  box.value = fiberRangeText(fibers.map(realFiber));
  if (!dirs.size) return;
  setAddDir(dirs.size === 1 ? [...dirs][0] : 'both');
}

// [1,2,3,4,7,9,10] -> "1-4, 7, 9, 10": a run of three or more is a range,
// the form parseFibers reads back.
function fiberRangeText(fibers) {
  const f = [...new Set(fibers)].sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < f.length; ) {
    let j = i;
    while (j + 1 < f.length && f[j + 1] === f[j] + 1) j++;
    if (j - i >= 2) out.push(`${f[i]}-${f[j]}`);
    else for (let k = i; k <= j; k++) out.push(String(f[k]));
    i = j + 1;
  }
  return out.join(', ');
}

// Every file in both folders, A then B, unless a header click sorted them.
// The selected files are loaded and drawn; a loaded file's dot (in the trace
// colour) toggles its visibility.  Hovering a row shows the whole file name,
// which the column cuts short.
function renderFilesPanel() {
  syncFiberBoxEnabled();
  const list = document.getElementById('files-list');
  if (!list) return;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Say what the NEXT drop will do.  A drop only adds: each file goes on the
  // side its own Direction names, beside what is loaded, and another span
  // is added as a span of its own (trace_server._plan_drop).
  const sayNextDrop = () => {
    const hint = document.getElementById('files-drop-hint');
    if (!hint) return;
    const gone = emptiedList(emptiedSides());
    const any = allSrcs().some(d => gInfo && gInfo['dir_' + d] && !gone.includes(d));
    hint.textContent = any
      ? 'drop more files here: each goes on the side its Direction names, and nothing loaded is replaced'
      : 'drop .sor / .json / .trc / .olts files, a folder, or a .zip here';
  };
  syncFilesTabs();
  list.classList.toggle('meas', gFilesView === 'meas');
  document.getElementById('files-cols').style.display = gFilesView === 'meas' ? 'none' : '';
  if (gFilesView === 'meas') { renderMeasView(list, esc); return; }
  if (gFilesView === 'fibers') { renderFibersView(list, esc); sayNextDrop(); return; }
  const loaded = new Map(gTraces.map(t => [t.key, t]));
  const cols = shownFileCols();
  const wantFacts = filesNeedFacts();
  const paired = wantFacts ? pairedFileKeys() : null;
  const rows = [];
  for (const dir of allSrcs()) {
    const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
    const files = (gInfo && gInfo['files_' + dir]) || [];
    // A copy of a side (a re-shot, or a file stamped for this side under the
    // other side's name) says so beside its name.
    fibers.forEach((f, i) => {
      if (gRemovedFiles.has(`${dir}-${f}`)) return;
      const t = loaded.get(`${dir}-${f}`);
      const eff = effDir(dir, f);
      const arrow = eff === 'a' ? 'A→B' : 'B→A';
      // P/F, wavelength and date, once the file's details are read.
      const tr = wantFacts ? fileTraits(`${dir}-${f}`, paired) : null;
      const acq = tr ? (gFileFacts.get(`${dir}-${f}`) || {}).acq : null;
      const cell = {
        pf: `<span class="file-pf${tr ? (tr.pf ? ' fpf-fail' : flagsOff() ? '' : ' fpf-pass') : ''}">`
          + `${tr ? pfMark(tr.pf) : ''}</span>`,
        // A second file of a fibre can carry the first one's very name, so
        // the row says which copy it is even with the Fiber column hidden.
        name: `<span class="file-name"><bdi>${esc(files[i] || 'F' + fiberLabel(f))}`
          + `${gCopies[String(f)] && files[i] ? ` <span class="file-copy">(copy ${gCopies[String(f)][1]})</span>` : ''}</bdi></span>`,
        dir: `<span class="file-dir"${eff !== sideOf(dir) ? ' title="direction changed from the folder\'s"' : ''}>`
          + `${arrow}${eff !== sideOf(dir) ? '*' : ''}</span>`,
        fiber: `<span class="file-num">${fiberLabel(f)}</span>`,
        wl: `<span class="file-num">${tr && tr.wl ? tr.wl : ''}</span>`,
        date: `<span class="file-date"${acq ? ` title="shot ${new Date(acq * 1000).toLocaleString()}"` : ''}>`
          + `${tr && tr.day ? tr.day : ''}</span>`,
      };
      rows.push({
        order: rows.length, name: files[i] || '', eff, fiber: f, tr, acq, span: spanOf(dir),
        html: `<div class="file-row${t ? ' loaded' : ''}${t && !t.visible ? ' faded' : ''}`
          + `${gSelectedFiles.has(`${dir}-${f}`) ? ' selected' : ''}`
          + `${gFileFocus === `${dir}-${f}` ? ' focus' : ''}" `
          + `data-dir="${dir}" data-fiber="${f}" data-name="${esc(files[i] || '')}" title="${esc(files[i] || 'F' + fiberLabel(f))}">`
          + `<span class="file-vis"${t ? ` style="color:${t.color};text-shadow:0 0 1px #333" title="show / hide"` : ''}>`
          + `${t ? (t.visible ? '●' : '○') : ''}</span>`
          + cols.map(([c]) => cell[c]).join('') + '</div>',
      });
    });
  }
  if (gFileSort) rows.sort(fileRowCompare(gFileSort));
  // More than one span loaded: each span's files under its own heading,
  // sorted within it (Robert 2026-10-02: a span dropped beside another is
  // added, not swapped in).
  const spans = [...new Set(rows.map(r => r.span))].sort((x, y) => x - y);
  let html = rows.map(r => r.html).join('');
  if (spans.length > 1) {
    html = spans.map(n => {
      const si = spanInfo(n) || {};
      const label = [si.name_a, si.name_b].filter(Boolean).join(' / ');
      return `<div class="file-span-head">Span ${n}${label ? ': ' + esc(label) : ''}</div>`
        + rows.filter(r => r.span === n).map(r => r.html).join('');
    }).join('');
  }
  renderFilesHeader(cols);
  list.innerHTML = rows.length ? html
    : '<span id="chip-empty">no folders loaded</span>';
  // FastReporter's status bar: "Selected files: n/N".
  document.getElementById('files-count').textContent =
    (rows.length ? `${gSelectedFiles.size} of ${rows.length} selected` : '')
    + (gFactsNote && rows.length ? ` · ${gFactsNote}` : '');
  sayNextDrop();
  if (wantFacts && rows.length) ensureFileFacts();
}

// ─── FILES columns and sorting, as in FastReporter's Files tab ────────
// Right-click the header row for the columns, with Restore Default; click a
// header to sort by it, again to reverse.  FR has no unsorted state either;
// Restore Default puts the Viewer's own order back (A then B, by fiber).
// Ties keep that order, where FR scrambles them.  File Name always shows.
// P/F, λ and Date need every file's header and events, so they are off
// until asked for, and then read in the background (ensureFileFacts) while
// the header counts them in.
const FILE_COLS = [
  // [key, header, width, header tooltip]
  // Narrow enough that all six fit the panel's 300 px; the name gives way
  // first and says itself in full on hover.
  ['pf', 'P/F', '30px', 'each file at the gates of the table row it lands in'],
  ['name', 'File Name', 'minmax(40px, 1fr)', ''],
  ['dir', 'Dir.', '34px', ''],
  ['fiber', 'Fiber', '30px', ''],
  ['wl', 'λ (nm)', '38px', ''],
  ['date', 'Date', '64px', 'the day the trace was shot, not the file date'],
];
const FILE_COLS_DEFAULT = ['dir'];
let gFileCols = new Set(FILE_COLS_DEFAULT);   // File Name shows whatever this says
let gFileSort = null;                          // { col, desc }, or null: A then B, by fiber
try {
  const v = JSON.parse(localStorage.getItem('otdr_viewer_files_view') || 'null');
  if (v && Array.isArray(v.cols)) gFileCols = new Set(v.cols.filter(c => FILE_COLS.some(x => x[0] === c)));
  if (v && v.sort && FILE_COLS.some(x => x[0] === v.sort.col)) gFileSort = { col: v.sort.col, desc: !!v.sort.desc };
} catch (e) { /* first visit, or storage off */ }
function saveFilesView() {
  try {
    localStorage.setItem('otdr_viewer_files_view',
                         JSON.stringify({ cols: [...gFileCols], sort: gFileSort }));
  } catch (e) {}
}
function shownFileCols() {
  return FILE_COLS.filter(([c]) => c === 'name' || gFileCols.has(c));
}
const FACT_COLS = ['pf', 'wl', 'date'];
function filesNeedFacts() {
  return FACT_COLS.some(c => gFileCols.has(c)) || !!(gFileSort && FACT_COLS.includes(gFileSort.col));
}

// What a row sorts on; null for a file not read yet, which sorts last
// whichever way the column runs.
function fileSortValue(r, col) {
  switch (col) {
    case 'name': return r.name.toLowerCase();
    case 'dir': return r.eff;
    case 'fiber': return realFiber(r.fiber) + r.fiber / 1e7;   // a copy sorts under its fiber
    case 'pf': return r.tr ? (r.tr.pf ? 1 : 0) : null;
    case 'wl': return r.tr && r.tr.wl ? r.tr.wl : null;
    case 'date': return r.acq || null;
    default: return null;
  }
}
function fileRowCompare(sort) {
  return (x, y) => {
    const a = fileSortValue(x, sort.col), b = fileSortValue(y, sort.col);
    if (a == null || b == null) return ((a == null) - (b == null)) || (x.order - y.order);
    const c = typeof a === 'string' ? a.localeCompare(b, undefined, { numeric: true }) : a - b;
    return (sort.desc ? -c : c) || (x.order - y.order);
  };
}

function renderFilesHeader(cols) {
  const hd = document.getElementById('files-cols');
  if (!hd) return;
  hd.classList.remove('fibers');
  document.getElementById('files-panel').style.setProperty(
    '--files-grid', ['18px', ...cols.map(c => c[2])].join(' '));
  hd.innerHTML = '<span></span>' + cols.map(([c, label, , tip]) => {
    const on = gFileSort && gFileSort.col === c;
    return `<span data-col="${c}"${on ? ' class="sorted"' : ''}`
         + ` title="${tip ? tip + '. ' : ''}click to sort, right-click for columns">`
         + `${label}${on ? (gFileSort.desc ? ' ▼' : ' ▲') : ''}</span>`;
  }).join('');
}
document.getElementById('files-cols').addEventListener('click', (ev) => {
  const h = ev.target.closest('[data-col]');
  if (!h) return;
  const c = h.dataset.col;
  gFileSort = gFileSort && gFileSort.col === c ? { col: c, desc: !gFileSort.desc } : { col: c, desc: false };
  saveFilesView();
  renderFilesPanel();
});
document.getElementById('files-cols').addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  if (gFilesView === 'fibers') return;       // the Fibers tab's columns are fixed
  showFilesColsMenu(ev.clientX, ev.clientY);
});
// FR's column list: a tick per column that can go, then Restore Default.
function showFilesColsMenu(x, y) {
  closeSpanMenu();
  const m = document.createElement('div');
  m.id = 'span-menu';
  m.innerHTML = '<div class="span-menu-hd">Columns</div>'
    + FILE_COLS.filter(([c]) => c !== 'name').map(([c, label]) =>
