  // and 0.161 IS the report's flagged figure (team .160, ours .1605).
  //
  // Minimum and Maximum stay plain deliberately.  In the ordinary
  // bidirectional view exactly two traces are loaded, so those rows restate
  // the A and B rows two rows lower — highlighting them would put three red
  // cells on screen where one belongs, without adding any information.
  //
  // A Minimum or Maximum is ONE trace's number, and the question it always
  // raises is which fiber's.  So those cells carry the trace that holds them
  // and a click answers in all three places at once — see pickTrace below.
  // The Average is nobody's measurement, so it stays inert.
  const aggRow = (label, fn, gated) => {
    const cells = [`<td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`];
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const ls = c.ev.map(evLoss).filter(v => v != null && !isNaN(v));
      const v = ls.length ? fn(ls) : null;
      // Under "failing cells only" Minimum and Maximum print in the columns
      // whose Average fails, so the failing Average has its spread beside it.
      const colAvg = ls.length > 0 ? ls.reduce((s, x) => s + x, 0) / ls.length : null;
      const colKept = colAvg != null && keeps(colAvg);
      const aggText = txt => colKept ? txt : cellText(txt);
      // Which trace holds it.  Compared on the PRINTED figure, so the cell
      // points at the row the tech can actually read the number off; ties go
      // to the first trace, which is the one the grid lists first.
      const owner = (!gated && v != null)
        ? c.ev.findIndex(e => { const L = evLoss(e); return L != null && fmt(L) === fmt(v); })
        : -1;
      const own = owner >= 0
        ? ` class="fr-own" data-ti="${owner}" data-own-col="${i}"`
          + ` title="F${fiberLabel(traces[owner].fiber)} ${arrow(traces[owner])}: click to find it"`
        : '';
      // `isBreak` is false here — evLoss already drops End-of-Fiber events, so
      // an aggregate is never a break.
      // Reflectance down the column too, over every reading the column prints
      // (fmtR prints a 0 as "---", so a 0 is no reading here either).  Plain:
      // the reflectance verdict is per trace, never on a summary.
      const rs = c.ev.map(e => e ? e.reflection : null).filter(r => r != null && !isNaN(r) && r !== 0);
      const r = rs.length ? fn(rs) : null;
      const rOwner = (!gated && r != null && !cellFilterOn())
        ? c.ev.findIndex(e => e && e.reflection != null && fmtR(e.reflection) === fmtR(r))
        : -1;
      const rOwn = rOwner >= 0
        ? ` class="fr-own" data-ti="${rOwner}" data-own-col="${i}" data-own-refl="1"`
          + ` title="F${fiberLabel(traces[rOwner].fiber)} ${arrow(traces[rOwner])}: click to find it"`
        : '';
      cells.push((gated ? lossCell(v, false) : `<td${own}>${aggText(fmt(v))}</td>`)
               + `<td${rOwn}>${cellText(fmtR(r))}</td>`);
      if (showSec && i < cols.length - 1) {
        const ss = traces.map((_t, ti) => section(ti, i)).filter(Boolean);
        const pick = k => ss.map(s => s[k]).filter(v => v != null && !isNaN(v));
        const [pl, pa] = [pick('loss'), pick('att')];
        cells.push(`<td class="fr-sec">${cellText('---')}</td>`
                 + `<td class="fr-sec">${cellText(fmt(pl.length ? fn(pl) : null))}</td>`
                 + `<td class="fr-sec">${cellText(fmt(pa.length ? fn(pa) : null))}</td>`);
      }
    });
    if (NSTAT) cells.push(`<td class="fr-stat" colspan="${NSTAT}"></td>`);
    return `<tr class="fr-agg">${cells.join('')}</tr>`;
  };
  // FR prints the three summary rows even for a single measurement, so a
  // tech reading one fiber still sees its own min/max/average.
  const aggRows = [
    aggRow('Minimum', a => Math.min(...a), false),
    aggRow('Maximum', a => Math.max(...a), false),
    aggRow('Average', a => a.reduce((s, v) => s + v, 0) / a.length, true),
  ];

  // ── Assembly ──
  // ONE table, not a header table beside a body table: the grid's column count
  // and colspans are data-dependent, so two tables would need their widths
  // reconciled by hand and would drift the moment a span had a different
  // number of events.  Virtualising with SPACER ROWS keeps the single table,
  // so the browser goes on doing the column layout itself.
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';
  // Widest row, for the spacer cells: every column contributes loss + refl,
  // and every column BUT THE LAST also contributes the three section cells —
  // the same 5-and-then-2 the statistics name strip above counts.
  const nKept = keepCol.filter(Boolean).length;
  const NCELL = LEAD.length + nKept * 2 + (showSec ? NSEC * (cols.length - 1) : 0) + NSTAT;
  table.innerHTML =
      `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead>`
    + `<tbody></tbody>`
    + `<tfoot>${aggRows.join('')}</tfoot>`;
  const tb = table.querySelector('tbody');
  // Every row, for the Report: the body on screen is only a slice.
  if (!opts.oneDir) gTableExport = { table, headExtra: statNameRow, rows: () => shown.map(rowHtml) };
  scroller.appendChild(table);
  host.appendChild(scroller);

  // Header rows have to be measured, not assumed: the three-row header's
  // height decides where the sticky offsets sit and how tall a page is.
  const spacerRow = h =>
    `<tr class="fr-spacer" style="height:${h}px"><td colspan="${NCELL}" style="border:0;padding:0"></td></tr>`;

  let lastFirst = -1;
  // `mustK` — a row the caller is about to look up in the DOM.  The slice is
  // worked out from the scroll position and the panel's height, and on a
  // panel dragged down to a couple of rows that arithmetic can stop one short
  // of the row just scrolled to; the caller then finds nothing and the jump
  // silently does nothing.  Naming the row makes it certain.
  function paintRows(mustK) {
    const top = scroller.scrollTop;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const view = Math.max(0, scroller.clientHeight - headH);
    let first = Math.max(0, Math.floor((top - headH) / FR_ROW_H) - 4);
    const count = Math.ceil(view / FR_ROW_H) + 8;
    let last = Math.min(shown.length, first + count);
    if (mustK != null) {
      first = Math.min(first, Math.max(0, mustK - 2));
      last = Math.max(last, Math.min(shown.length, mustK + 3));
    }
    lastFirst = first;                 // the scroll handler skips a slice already painted
    const html = [statNameRow];
    if (first > 0) html.push(spacerRow(first * FR_ROW_H));
    for (let k = first; k < last; k++) html.push(rowHtml(shown[k]));
    if (last < shown.length) html.push(spacerRow((shown.length - last) * FR_ROW_H));
    tb.innerHTML = html.join('');
  }
  // Repainting on every scroll event is the whole cost of this view, so only
  // repaint when the slice actually changes.  (`gGridGoTo` relies on this too:
  // it sets scrollTop and paints in one go, and the scroll event that follows
  // must not repaint over the cell it just marked.)
  scroller.addEventListener('scroll', () => {
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const f = Math.max(0, Math.floor((scroller.scrollTop - headH) / FR_ROW_H) - 4);
    if (f !== lastFirst) { lastFirst = f; paintRows(); }
  });
  // The slice is sized to the box when painted; a box made taller (the
  // divider dragged, the window grown, the table fitted to its rows) left
  // blank space under the last painted row until a scroll (window-size
  // audit 2026-10-01).  Repaint when the box changes size.
  if (window.ResizeObserver) {
    let lastH = -1;
    new ResizeObserver(() => {
      if (scroller.clientHeight === lastH) return;
      lastH = scroller.clientHeight;
      paintRows();
    }).observe(scroller);
  }
  fitColumns(table, shown.map(rowHtml), statNameRow);   // widths from every row
  paintRows();
  // A click on the drawer's mark for a cell comes here (drawPairing).
  marks.goCell = (ti, which, col) => gridGoCell({ scroller, table, tb, paintRows,
    descs: shown.map(k => [k, traces[k].dir]),
    topExtra: () => { const n = tb.querySelector('tr.fr-statnames'); return n ? n.offsetHeight : 0; } },
    ti, which, col);
  gDrawerMarks.push(marks);
  draw();

  // Pin the three header rows.  The offsets are measured after the first paint
  // because the header's height depends on which event kinds are present; the
  // statistics strip pins itself from CSS.
  requestAnimationFrame(() => {
    const hrows = table.tHead ? [...table.tHead.rows] : [];
    let off = 0;
    for (const r of hrows) {
      for (const th of r.cells) th.style.top = off + 'px';
      off += r.offsetHeight;
    }
  });

  // The ⋯ opens the same menu a right-click on a cell does.  A header is
  // shared by every row, so each direction uses its first shown fiber that
  // has an event in this column, at that event's OWN raw km.
  const colPicks = i => {
    const col = cols[i], picks = [];
    for (const dir of ['a', 'b']) {
      const ti = shown.find(k => traces[k].dir === dir && col.ev[k]);
      if (ti != null) picks.push({ dir, km: col.ev[ti].dist_km, fiber: traces[ti].fiber, src: traces[ti].src || dir });
    }
    return picks;
  };
  table.querySelectorAll('th.fr-evhdr').forEach(th => {
    th.style.cursor = 'pointer';
    // A click on the heading ("Event 1") zooms to the event and opens its
    // span menu, as the ⋯ does (Robert 2026-10-02: the boss clicks the
    // event's name, not the dots, to get Span START, END, Reset).
    th.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const r = (ev.target.closest('.fr-evmenu') || th).getBoundingClientRect();
      zoomToKm(+th.dataset.km, 2);
      const picks = colPicks(+th.dataset.col);
      if (picks.length) showColumnMenu(r.left, r.bottom + 2, picks);
    });
  });
  wireHeaderMenu(table, colPicks);

  // A click on an event number on the trace lands here: scroll the row into
  // the window (the body is virtual, so paint it first), then the cell into
  // view sideways, and mark it for a moment.
  if (!opts.oneDir) gGridGoTo = (t, e) => {
    const ti = traces.indexOf(t);
    const k = shown.indexOf(ti);
    if (k < 0) return;                       // hidden by "flagged rows"
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const footH = pinnedFootH(table);
    const names = tb.querySelector('tr.fr-statnames');
    const namesH = names ? names.offsetHeight : 0;
    // Where the row sits in the table, and the window the pinned header and
    // footer leave between them.
    const rowTop = headH + namesH + k * FR_ROW_H;
    if (!e) {                                // a click on the trace: its row, centred
      const topPin = headH + namesH;
      const mid = Math.max(FR_ROW_H, scroller.clientHeight - topPin - footH);
      scroller.scrollTop = Math.max(0, rowTop - topPin - (mid - FR_ROW_H) / 2);
      paintRows(k);
      return;
    }
    const view = scroller.clientHeight - headH - footH;
    const winTop = scroller.scrollTop + headH, winBot = winTop + view;
    if (rowTop < winTop || rowTop + FR_ROW_H > winBot) {
      scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
    }
    paintRows(k);
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = [...tb.querySelectorAll(sel)].find(row => row.querySelector(`td[data-km="${e.dist_km}"]`));
    const td = tr && tr.querySelector(`td[data-km="${e.dist_km}"]`);
    if (!td) return;
    table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
    const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
    const leadW = tr.cells[0].offsetWidth;   // the sticky fiber column covers the left edge
    const dxL = cr.left - (sr.left + leadW) - 8;
    const dxR = cr.right - sr.right + 8;
    if (dxL < 0) scroller.scrollLeft += dxL;
    else if (dxR > 0) scroller.scrollLeft += dxR;
    td.classList.add('fr-hit');
    setTimeout(() => td.classList.add('fading'), 1500);
    setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
  };

  // A click on a Minimum or Maximum cell: that number is one trace's, so say
  // which in all three places at once -- the row is marked and CENTRED in the
  // panel (centred always, not just when it happens to be off screen: the
  // tech is looking for it, and a row that lands hard against the header is
  // the one they miss), the cell it came from is flashed, and the trace above
  // is drawn bold with the others dimmed back.  Clicking it again lets go.
  const footer = table.tFoot;
  if (footer) footer.addEventListener('click', (ev) => {
    const td = ev.target.closest('td.fr-own');
    if (!td) return;
    const ti = +td.dataset.ti, ci = +td.dataset.ownCol;
    const t = traces[ti];
    if (gPickKey === t.key) { gPickKey = null; renderEventTable(); draw(); return; }
    gPickKey = t.key;
    const k = shown.indexOf(ti);
    if (k < 0) {                       // its row is filtered out of the grid
      draw();
      setReadout(`F${fiberLabel(t.fiber)} ${arrow(t)} holds it. Its row is hidden by "Show only flagged rows"`);
      return;
    }
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const footH = pinnedFootH(table);
    const names = tb.querySelector('tr.fr-statnames');
    const namesH = names ? names.offsetHeight : 0;
    // The window the tech actually sees is what the pinned header, the pinned
    // statistics strip and the pinned footer leave between them; centre in
    // THAT, or the row lands half a strip low.
    const rowTop = headH + namesH + k * FR_ROW_H;
    const topPin = headH + namesH;
    const view = Math.max(FR_ROW_H, scroller.clientHeight - topPin - footH);
    scroller.scrollTop = Math.max(0, rowTop - topPin - (view - FR_ROW_H) / 2);
    paintRows(k);                      // the body is virtual: paint the slice first
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = tb.querySelector(sel);
    const loss = tr && tr.querySelector(`td[data-col="${ci}"]`);
    // a reflectance figure flashes the Refl. cell, which follows the loss cell
    const cell = (td.dataset.ownRefl && loss && loss.nextElementSibling) || loss;
    if (cell) {
      table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
      const sr = scroller.getBoundingClientRect(), cr = cell.getBoundingClientRect();
      const leadW = tr.cells[0].offsetWidth;      // the sticky fiber column covers the left edge
      const dxL = cr.left - (sr.left + leadW) - 8, dxR = cr.right - sr.right + 8;
      if (dxL < 0) scroller.scrollLeft += dxL;
      else if (dxR > 0) scroller.scrollLeft += dxR;
      cell.classList.add('fr-hit');
      setTimeout(() => cell.classList.add('fading'), 1500);
      setTimeout(() => cell.classList.remove('fr-hit', 'fading'), 2200);
    }
    draw();                            // bold above, the rest dimmed
    setReadout(`F${fiberLabel(t.fiber)} ${arrow(t)} holds it. Click the cell again to let go`);
  });

  // A click on a row: its trace to the front, FastReporter's current
  // measurement (pickRow); again on the same row lets go.
  tb.addEventListener('click', (ev) => {
    // Not the second click of a double-click (it would let go at once), and
    // not a mouse-up that ends selecting text to copy.
    if (ev.detail > 1 || String(window.getSelection() || '').trim()) return;
    const tr = ev.target.closest('tr[data-fiber]');
    if (!tr) return;
    pickRow([`${tr.dataset.src}-${tr.dataset.fiber}`]);
    paintRows();
  });

  // Right-click an event to make it the span's start or end, the way FR lets
  // you set one.  The row names the direction, the cell names the event, so
  // there is nothing to disambiguate — and the km recorded is the event's own,
  // which is what the store and (later) the engine both speak.
  tb.addEventListener('contextmenu', (ev) => wireCellMenu(ev, tb));
}

// ─── FastReporter mode: FR's bidirectional table, verbatim ─────────────
// In FastReporter mode the table IS FastReporter's.  For every fibre with
// both directions loaded, the rows of FR's merged bidirectional table (one
// per event pair, the silent leg synthesised, a section between each pair of
// rows) are laid out as FR3 lays out a .bdr: three rows per fibre -- A→B,
// B→A, Average -- the synthesised legs in grey, each section's loss and
// attenuation per direction and averaged.  The numbers come from the Splice
// Report engine's fr_bidi_table through /api/fr_table (it reproduces FR's
// own .bdr output row for row from the two .sor); nothing here computes a
// figure, it only prints them.  A fibre loaded in one direction only has no
// bidirectional table in FR either: it is named in the hint, and when
// nothing is paired the single-direction grid stands in.
let gFrTableSeq = 0;
function renderFrBidiGrid(traces, host, hint) {
  const { pairs, singles } = pairTraces(traces);
  if (!pairs.length) return false;
  const seq = ++gFrTableSeq;
  // The same traces' table is laid out again, not asked for again.
  const key = serverTableKey('fr', pairs);
  const kept = keptServerTable('fr', key);
  if (kept) {
    paintFrBidiGrid(pairs, singles, kept, host, hint);
    return true;
  }
  gTableBusy = true;                       // "Building the table…" until it paints
  hint.textContent = `${tableName()}: reading ${pairs.length} fiber pair${pairs.length === 1 ? '' : 's'}…`;
  askServerTable('fr', key, `/api/fr_table?${frTableQuery(pairs)}`,
                 res => !res.error)
    .then(res => {
      if (seq !== gFrTableSeq) return;
      try { paintFrBidiGrid(pairs, singles, res || {}, host, hint); } finally { tableSettled(); }
    })
    .catch(e => {
      if (seq !== gFrTableSeq) return;
      tableSettled();
      gTableKm = null; draw();             // no table: every event, as before
      hint.textContent = `${tableName()} unavailable (${(e && e.message) || 'fetch failed'})`;
    });
  return true;
}

function paintFrBidiGrid(pairs, singles, res, host, hint) {
  host.innerHTML = '';
  gGridGoTo = null;
  const tables = res.tables || {};
  const have = pairs.filter(p => Array.isArray(tables[p.tkey]) && tables[p.tkey].length);
  const missing = pairs.filter(p => !have.includes(p)).map(p => p.fiber);
  if (!have.length) {
    gTableKm = null; draw();             // no table: every event, as before
    hint.textContent = `${tableName()}: ` + (res.error
      || "no table for these fibers (both directions must be .sor files with EXFO's trace block)");
    return;
  }
  if (gAnalysisMode !== 'fr' && gSuiteFallbackWhy) {
    queueMicrotask(() => { hint.textContent += ` · no report columns: ${gSuiteFallbackWhy}`; });
  }
  // Display km is A's raw frame -- FR's MeanPosition -- measured from A's
  // declared start when the tech has set one (FR prints 0.0000 there).  The
  // declaration is per direction and span-wide, so one zero serves every
  // fibre; a row outside the declared span leaves the table, as FR's do.
  const win = ownSpanWindow(have[0].ta);
  const zeroKm = (win && win.lo != null) ? win.lo : 0;
  const inSpan = km => !win || ((win.lo == null || km >= win.lo - SPAN_SNAP_KM)
                             && (win.hi == null || km <= win.hi + SPAN_SNAP_KM));
  // Columns: FR's rows of every shown fibre, clustered by mean position the
  // way the single-direction grid clusters events (one row per fibre per
  // column; a reflective row never shares one with a splice).  With one
  // fibre loaded -- the ordinary case -- every row is its own column, in
  // FR's order.
  const items = [];
  have.forEach((p, fi) => {
    p.rows = tables[p.tkey].filter(r => inSpan(r.mean_pos_m / 1000));
    p.rows.forEach((r, k) => items.push({ km: r.mean_pos_m / 1000, ti: fi,
                                          e: { is_reflective: r.type === 3, row: r, k } }));
  });
  items.sort((a, b) => a.km - b.km);
  const cols = clusterColumns(have, items, columnTolKm(have.flatMap(p => [p.ta, p.tb])));
  // A synthesised leg has no event of its own in the file, so it marks nothing.
  tableMarkReset(have.flatMap(p => [p.ta, p.tb]));
  cols.forEach(c => c.ev.forEach((x, fi) => {
    if (!x) return;
    for (const [w, t] of [['a', have[fi].ta], ['b', have[fi].tb]]) {
      const leg = x.row[w];
      if (leg && !leg.synthetic && leg.pos_m != null) tableMark(t, Number(leg.pos_m) / 1000);
    }
  }));
  draw();                                  // painted after a fetch: the chart follows
  // The section a fibre's row carries runs to that fibre's NEXT row; it is
  // printed under column i only when the next row sits in column i + 1.
  const secOf = (fi, i) => {
    const c = cols[i].ev[fi], n = cols[i + 1] && cols[i + 1].ev[fi];
    if (!c || !n || n.k !== c.k + 1) return null;
    return c.row.section;
  };
  const fmt  = v => (v == null || isNaN(v)) ? '---' : v.toFixed(3);
  const fmtR = v => (v == null || isNaN(v)) ? '---' : v.toFixed(1);
  // FR's Type on the merged row: 3 reflective, 1 positive (a gainer), 2
  // non-reflective.  In the bidirectional table FR names the launch and end
  // rows by their type too -- "Reflective", not Launch Level / End of Fiber.
  const kind = r => r.type === 3 ? 'Reflective' : r.type === 1 ? 'Positive'
              : r.type === 2 ? 'Non-reflective' : '';
  // A column whose fibres' Average rows disagree on the type is MIXED.  FR
  // (driven 2026-09-25, ELMMIL F21-F23 at 48.06 km) then leaves the type out
  // of the header and adds a Type column to the event, printing each row's
  // own type -- a synthesised leg's is blank.  The legs alone disagreeing
  // does not count: FR keeps one header type when only the averages agree.
  const colKinds = c => [...new Set(c.ev.filter(x => x).map(x => kind(x.row)))];
  cols.forEach(c => { c.mixed = colKinds(c).length > 1; });
  const colKind = c => c.mixed ? '' : colKinds(c).join('');
  const typeCell = (c, txt) => c.mixed ? `<td class="fr-type">${cellText(txt)}</td>` : '';
  // `gate` -- the report's gate for this cell (gateFor); null never flags.
  // `warn` -- its Warning level (warnFor); null never turns yellow.
  const lossCell = (v, synthetic, attrs = '', gate = null, warn = null) => {
    const cls = [];
    if (v != null && !isNaN(v)) {
      if (!synthetic && clearsAt(v, gate)) cls.push('fr-hi');   // the REPORT's verdict
      else if (!synthetic && clearsAt(v, warn)) cls.push('fr-warn');
    }
    // a synthesised leg is not a failure
    const keep = (gFailCellsOnly && cls.includes('fr-hi'))
              || (gWarnCellsOnly && cls.includes('fr-warn'));
    if (cellFilterOn() && !keep) return `<td${attrs}></td>`;   // blank AND uncoloured
    if (synthetic) cls.push('fr-synth');
    return `<td${cls.length ? ` class="${cls.join(' ')}"` : ''}${attrs}>${fmt(v)}</td>`;
  };
  const isRefl = x => x.row.type === 3;
  // A direction's fibre length in its own frame: its furthest event.
  const eofOf = new Map();
  cols.forEach(c => c.ev.forEach((x, fi) => {
    if (!x) return;
    for (const w of ['a', 'b']) {
      const L = x.row[w];
      if (L && L.pos_m != null) {
        const k = fi + w;
        eofOf.set(k, Math.max(eofOf.get(k) || 0, L.pos_m / 1000));
      }
    }
  }));
  // The report's end-connector verdicts, each placed on the ONE reading of
  // that fibre and direction nearest the reflectance the report printed (the
  // engine reads KeyEvents, the table FR's block, so the two differ by a
  // hair).  A launch connector is a launch-level row, which the loss rules
  // never judge; the report grades its reflectance, so it is judged here.
  // Worked out again when the verdicts land after the table (refreshVerdicts).
  const endBadNow = () => {
    const bad = { a: new Set(), b: new Set() };
    gEndRefl.forEach(v => {
      const fi = have.findIndex(p => String(p.fiber) === String(v.fiber));
      const which = v.dir === 'A' ? 'a' : 'b';
      if (fi < 0) return;
      let best = null, bestD = 0.5;
      cols.forEach(c => {
        const x = c.ev[fi], leg = x && x.row[which];
        if (!leg || leg.synthetic || leg.refl == null) return;
        const d = Math.abs(leg.refl - v.refl);
        if (d <= bestD) { best = x; bestD = d; }
      });
      if (best) bad[which].add(best);
    });
    return bad;
  };
  let endBad = endBadNow();
  const legReflFails = (x, which) => {
    if (endBad[which].has(x)) return true;
    const leg = x.row[which];
    if (!legOk(leg) || !isRefl(x)) return false;
    // The report's frame: its events start at the panel, past this
    // direction's launch reel, and end before the receive reel (the other
    // direction's launch reel), so its dead zone is measured from there.  On
    // a tie panel that frame is the 31 m between the two panel connectors,
    // and both are span ends, never mid-span.
    const own = Number(which === 'a' ? gInfo.launch_a_km : gInfo.launch_b_km) || 0;
    const far = Number(which === 'a' ? gInfo.launch_b_km : gInfo.launch_a_km) || 0;
    const eof = eofOf.get(x.ti + which);
    return reflFails(leg.refl, leg.pos_m / 1000 - own,
                     eof != null ? eof - own - far : eof);
  };
  const legOk = leg => !!leg && !leg.synthetic && !(Number(leg.status || 0) & 0x08);
  // A direction's reflectance, red when it fails the report's fail value.
  const reflCell = (x, which) => {
    const leg = x.row[which];
    const bad = legReflFails(x, which);
    if (cellFilterOn() && !(gFailCellsOnly && bad)) return '<td></td>';
    const cls = [bad ? 'fr-hi' : '', leg.synthetic ? 'fr-synth' : ''].filter(Boolean).join(' ');
    return `<td${cls ? ` class="${cls}"` : ''}>${fmtR(leg.refl)}</td>`;
  };
  // A leg's own km, rounded as /api/trace rounds an event's dist_km, so a
  // click on the trace's event number finds the cell (see gGridGoTo).
  const rawKm = m => Math.round(m / 1000 * 1e4) / 1e4;

  // ── Rows: A→B, B→A, Average per fibre ──
  // Each row on its own, as FR judges it: the Average at the bidirectional
  // gates, a direction row at the single-direction gates plus reflectance
  // (FR grades reflectance per direction, never on the Average).  A launch
  // level or a synthesised leg is not a reading and is never judged.
  const cellFails = (x, which) => {
    if (which === 'avg') return clearsAt(x.row.loss, gateFor(isRefl(x), false));
    if (legReflFails(x, which)) return true;
    const leg = x.row[which];
    if (!legOk(leg) || gainerHidden(leg.loss)) return false;
    return clearsAt(leg.loss, gateFor(isRefl(x), true));
  };
  const legFails = (fi, which) => cols.some(c => c.ev[fi] && cellFails(c.ev[fi], which));
  const rowFails = have.map((_p, fi) => ['a', 'b', 'avg'].some(w => legFails(fi, w)));
  // A yellow loss: at or over its Warning, under its Fail (see warnFor).
  const cellWarns = (x, which) => {
    if (cellFails(x, which)) return false;
    if (which === 'avg') return clearsAt(x.row.loss, warnFor(isRefl(x), false));
    const leg = x.row[which];
    return legOk(leg) && !gainerHidden(leg.loss) && clearsAt(leg.loss, warnFor(isRefl(x), true));
  };
  // What the cell filters keep: failures, warnings, or both.  A splice's
  // loss is judged on the Average row alone (the boss, 2026-09-29: "we only
  // need to see if it's failing Bidi Average"), so a direction's own loss
  // never keeps a cell; reflectance is still judged per direction, as FR
  // grades it, never on the Average.  The rows' own P/F is unchanged.
  // A connector is the exception: each direction's loss is judged on its
  // own row at its fail gate (the boss, 2026-09-29: "we can't average
  // connector losses A and B, we have to see them separately"; Robert:
  // every connector, the two ends and mid-span alike).
  const cellKept = (x, which) => which === 'avg'
    ? (gFailCellsOnly && cellFails(x, which)) || (gWarnCellsOnly && cellWarns(x, which))
    : gFailCellsOnly && (isRefl(x) ? cellFails(x, which) : legReflFails(x, which));
  const legKept = (fi, which) => cols.some(c => c.ev[fi] && cellKept(c.ev[fi], which));
  // "Show failing cells only" collapses the table to what failed (the
  // boss, 2026-09-26): a fibre with no failing cell leaves, an event column
  // no fibre fails leaves, the Section columns leave (the filter empties
  // them anyway), and each fibre keeps its Average row plus only the
  // direction rows whose reflectance fails, or whose loss fails at a
  // connector.
  // Event numbers keep their full-table numbering so a column is findable.
  // "Show warning cells only" collapses the same way around the yellow cells.
  const collapse = cellFilterOn();
  const keepCol = cols.map(c => !collapse
    || have.some((_p, fi) => c.ev[fi] && ['a', 'b', 'avg'].some(w => cellKept(c.ev[fi], w))));
  // FastReporter mode's drawer marks FR's pairing: these columns, these
  // verdicts, FR's transplanted legs as hollow rings (see drawPairing).  In
  // OTDR Suite mode this table only stands in for the report's, and the
  // drawer keeps the files' own events.
  let marks = null, markCols = null;
  if (gAnalysisMode === 'fr') {
    const drawerLeg = (x, w) => {
      const leg = x.row[w];
      if (!leg || leg.pos_m == null) return null;
      return { km: rawKm(leg.pos_m), loss: leg.loss, hollow: !legOk(leg),
               fail: cellFails(x, w), warn: cellWarns(x, w) };
    };
    markCols = () => cols.map((c, i) => ({ i, title: `Event ${i + 1}`, km: c.km, cells: keepCol[i]
        ? c.ev.map((x, fi) => x && { fi, avg: x.row.loss, km: c.km,
                                     avgFail: cellFails(x, 'avg'), avgWarn: cellWarns(x, 'avg'),
                                     legs: { a: drawerLeg(x, 'a'), b: drawerLeg(x, 'b') } })
               .filter(Boolean)
        : [] }));
    marks = { mode: 'fr', have, goCell: () => {}, cols: markCols() };
  }
  const showSec = gShowSections && !collapse;

  // ── Header: three rows (group / kind+distance / units) ──
  const LEAD = [['Identifiers', 'fr-rowlab'], ['P/F', ''], ['λ (nm)', ''], ['Dir.', '']];
  let h1 = LEAD.map(([l, c]) => `<th rowspan="3" class="fr-rowlab ${c}">${l}</th>`).join('');
  let h2 = '', h3 = '';
  cols.forEach((c, i) => {
    if (!keepCol[i]) return;
    const n = c.ev.filter(x => x).length;
    const span = c.mixed ? 3 : 2;
    h1 += `<th colspan="${span}" class="fr-evhdr" data-km="${c.km}" data-col="${i}" title="zoom to ${c.km.toFixed(3)} km, span and settings">`
        + `Event ${i + 1} (${n}/${have.length})`
        + `<button class="fr-evmenu" data-col="${i}" title="span and settings">⋯</button></th>`;
    h2 += `<th colspan="${span}" class="fr-evsub" data-col="${i}">${colKind(c)}<br><span class="fr-km">${kmFt(c.km - zeroKm)}</span></th>`;
    h3 += (c.mixed ? `<th class="fr-sub" data-col="${i}">Type</th>` : '')
        + `<th class="fr-sub" data-col="${i}">Loss<br>(dB)</th><th class="fr-sub" data-col="${i}">Refl.<br>(dB)</th>`;
    if (showSec && i < cols.length - 1) {
      const lens = have.map((_p, fi) => secOf(fi, i)).filter(s => s && s.length_m != null)
                       .map(s => s.length_m / 1000);
      const len = lens.length ? lens.reduce((a, b) => a + b, 0) / lens.length : null;
      h1 += '<th colspan="2" class="fr-sechdr">Section</th>';
      h2 += `<th colspan="2" class="fr-sechdr fr-evsub"><span class="fr-km">${len != null ? fmtDist(len) : ''}</span></th>`;
      h3 += '<th class="fr-sub fr-sec">Loss<br>(dB)</th><th class="fr-sub fr-sec">Att.<br>(dB/km)</th>';
    }
  });
  const NSEC = showSec ? 2 : 0;

  const shown = have.map((_p, i) => i).filter(i => (!gFlaggedOnly || rowFails[i])
    && (!collapse || ['a', 'b', 'avg'].some(w => legKept(i, w))));
  const descs = shown.flatMap(fi => ['a', 'b', 'avg']
    .filter(w => (!collapse || w === 'avg' || legKept(fi, w))
              && (collapse || !gAvgOnly || w === 'avg')).map(w => [fi, w]));
  const rowHtml = ([fi, which]) => {
    const p = have[fi];
    const t = which === 'b' ? p.tb : p.ta;
    const fail = legFails(fi, which);
    const label = which === 'a' ? 'A→B' : which === 'b' ? 'B→A' : 'Average';
    const cells = [
      `<td class="fr-rowlab"><span style="display:inline-block;width:8px;height:8px;`
      + `border-radius:50%;background:${t.color};box-shadow:0 0 0 1px rgba(0,0,0,.35);margin-right:6px"></span>F${fiberLabel(p.fiber)}</td>`,
      // Every row carries its own verdict, as FR's do (driven 2026-09-25).
      `<td class="${pfClass(fail)}" title="${which === 'avg'
        ? `A+B average at the report's gates (${gateLabel()})`
        : "this direction at the report's single-direction, connector and reflectance gates"}`
      + `, this is OUR verdict, not FastReporter's">${pfMark(fail)}</td>`,
      `<td>${t.data.wavelength_nm || '---'}</td>`,
      `<td>${label}</td>`,
    ];
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const x = c.ev[fi];
      if (!x) {
        cells.push(typeCell(c, '') + `<td>${cellText('---')}</td><td>${cellText('---')}</td>`);
      } else if (which === 'avg') {
        // FR prints no reflectance on the Average row
        cells.push(typeCell(c, kind(x.row)) + lossCell(x.row.loss, false, ` data-col="${i}"`, gateFor(isRefl(x), false),
                                                     warnFor(isRefl(x), false))
                 + `<td>${cellText('---')}</td>`);
      } else {
        const leg = x.row[which];
        // under the cell filters a direction's loss is not judged (its
        // Average is), so it blanks like any cell the filter drops; a
        // connector's is, at its fail gate only (see cellKept)
        const judged = !cellFilterOn();
        const gated = judged || isRefl(x);
        const at = ` data-col="${i}" data-km="${rawKm(leg.pos_m)}"`;
        cells.push(typeCell(c, leg.synthetic ? '' : kind(leg))
                 + (gainerHidden(leg.loss) ? `<td${at}></td>`
                    : lossCell(leg.loss, !legOk(leg), at,
                               gated ? gateFor(isRefl(x), true) : null,
                               judged ? warnFor(isRefl(x), true) : null))
                 + reflCell(x, which));
      }
      if (showSec && i < cols.length - 1) {
        const s = secOf(fi, i);
        const v = s ? (which === 'avg' ? s : s[which]) : null;
        cells.push(`<td class="fr-sec">${cellText(v ? fmt(v.loss) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(v ? fmt(v.att_db_km) : '---')}</td>`);
      }
    });
    // The picked row is marked: a direction's row for its own trace, the
    // Average row when both of its fibre's traces are the pick.
    const pk = which === 'avg' ? samePick([p.ta.key, p.tb.key]) : gPickKey === t.key;
    const attrs = (which === 'avg' ? ` class="fr-avg${pk ? ' fr-pick' : ''}" data-avg="1" data-fiber="${p.fiber}"`
      : `${pk ? ' class="fr-pick"' : ''} data-dir="${t.dir}" data-src="${t.src || t.dir}" data-fiber="${p.fiber}"`)
      + ` data-row="${fi}-${which}"`;           // the drawer's way in (gridGoCell)
    return `<tr${attrs}>${cells.join('')}</tr>`;
  };

  // Like the Suite table's: no headline, no right-click tip and no "Suite
  // table unavailable" note; only gaps, errors and the ticked filters (Robert).
  hint.textContent = [
    missing.length ? `no FR table for F${missing.map(fiberLabel).join(', F')}` : '',
    singles.length ? `one direction only: F${[...new Set(singles.map(t => t.fiber))].map(fiberLabel).join(', F')}` : '',
    res.error || '',
    gFlaggedOnly ? 'flagged rows only' : '',
    gFailCellsOnly ? (descs.length ? 'failing cells only' : 'failing cells only: nothing fails') : '',
    gWarnCellsOnly ? (descs.length ? 'warning cells only' : 'warning cells only: no warnings') : '',
    gShowGainers ? '' : 'gainers hidden',
  ].filter(Boolean).join(' · ');

  // ── Assembly, virtualised like the single-direction grid ──
  const scroller = document.createElement('div');
  scroller.className = 'fr-scroll';
  const table = document.createElement('table');
  table.className = 'fr-table';
  const kept = cols.filter((_c, i) => keepCol[i]);
  const NCELL = LEAD.length + kept.length * 2 + kept.filter(c => c.mixed).length
              + (showSec ? NSEC * (cols.length - 1) : 0);
  // ── Minimum / Maximum / Average down the column, as FR prints them under
  // the fibres: taken over the fibres' AVERAGE rows (every fibre loaded, not
  // just the rows on screen).  The Average is judged like any Average row.
  const aggRow = (label, fn, gated) => {
    const cells = [`<td class="fr-rowlab">${label}</td><td></td><td></td><td></td>`];
    const num = v => v != null && !isNaN(v);
    cols.forEach((c, i) => {
      if (!keepCol[i]) return;
      const ls = c.ev.filter(x => x).map(x => x.row.loss).filter(num);
      const v = ls.length ? fn(ls) : null;
      // A connector column is judged at the connector gate, as its rows are.
      const refl = c.ev.some(x => x && isRefl(x));
      const g = gateFor(refl, false);
      const avg = ls.length > 0 ? ls.reduce((a, b) => a + b, 0) / ls.length : null;
      const colFails = avg != null && clearsAt(avg, g);
      const colWarns = avg != null && !colFails && clearsAt(avg, warnFor(refl, false));
      const txt = t => ((gFailCellsOnly && colFails) || (gWarnCellsOnly && colWarns)) ? t : cellText(t);
      // Reflectance from the A→B and B→A rows, as the Average row prints none;
      // measured legs only, not a transplanted (grey) one.
      const rs = c.ev.filter(x => x).flatMap(x => ['a', 'b'].map(w => x.row[w]))
        .filter(leg => leg && !leg.synthetic).map(leg => leg.refl).filter(num);
      const r = rs.length ? fn(rs) : null;
      // Minimum and Maximum name the fibre that holds them (aggOwnAttrs),
      // matched on the PRINTED figure, first fibre listed on a tie; only
      // where the cell prints a number.
      const shows = !cellFilterOn() || (gFailCellsOnly && colFails) || (gWarnCellsOnly && colWarns);
      const lossFi = (gated || v == null || !shows) ? -1
        : c.ev.findIndex(x => x && num(x.row.loss) && fmt(x.row.loss) === fmt(v));
      let reflFi = -1, reflW = 'a';
      if (!gated && r != null && !cellFilterOn()) {
        reflFi = c.ev.findIndex(x => x && ['a', 'b'].some(w => {
          const leg = x.row[w];
          if (!leg || leg.synthetic || !num(leg.refl) || fmtR(leg.refl) !== fmtR(r)) return false;
          reflW = w;
          return true;
        }));
      }
      cells.push((c.mixed ? '<td></td>' : '')
               + (gated ? lossCell(v, false, '', g, warnFor(refl, false))
                        : `<td${aggOwnAttrs(have, lossFi, 'avg', i, false)}>${txt(fmt(v))}</td>`)
               + `<td${aggOwnAttrs(have, reflFi, reflW, i, true)}>${cellText(rs.length ? fmtR(r) : '---')}</td>`);
      if (showSec && i < cols.length - 1) {
        const ss = have.map((_p, fi) => secOf(fi, i)).filter(Boolean);
        const pick = k => ss.map(x => x[k]).filter(num);
        const [pl, pa] = [pick('loss'), pick('att_db_km')];
        cells.push(`<td class="fr-sec">${cellText(pl.length ? fmt(fn(pl)) : '---')}</td>`
                 + `<td class="fr-sec">${cellText(pa.length ? fmt(fn(pa)) : '---')}</td>`);
      }
    });
    return `<tr class="fr-agg">${cells.join('')}</tr>`;
  };
  const aggRows = [
    aggRow('Minimum', a => Math.min(...a), false),
    aggRow('Maximum', a => Math.max(...a), false),
    aggRow('Average', a => a.reduce((x, y) => x + y, 0) / a.length, true),
  ];
  table.innerHTML = `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead><tbody></tbody>`
                  + `<tfoot>${aggRows.join('')}</tfoot>`;
  const tb = table.querySelector('tbody');
  gTableExport = { table, rows: () => descs.map(rowHtml) };    // every row, for the Report
  scroller.appendChild(table);
  host.appendChild(scroller);
  const spacerRow = h =>
    `<tr class="fr-spacer" style="height:${h}px"><td colspan="${NCELL}" style="border:0;padding:0"></td></tr>`;
  let lastFirst = -1;
  function paintRows() {
    const top = scroller.scrollTop;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const view = Math.max(0, scroller.clientHeight - headH);
    const first = Math.max(0, Math.floor((top - headH) / FR_ROW_H) - 4);
    const count = Math.ceil(view / FR_ROW_H) + 8;
    const last = Math.min(descs.length, first + count);
    lastFirst = first;
    const html = [];
    if (first > 0) html.push(spacerRow(first * FR_ROW_H));
    for (let k = first; k < last; k++) html.push(rowHtml(descs[k]));
    if (last < descs.length) html.push(spacerRow((descs.length - last) * FR_ROW_H));
    tb.innerHTML = html.join('');
  }
  scroller.addEventListener('scroll', () => {
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const f = Math.max(0, Math.floor((scroller.scrollTop - headH) / FR_ROW_H) - 4);
    if (f !== lastFirst) { lastFirst = f; paintRows(); }
  });
  // The slice is sized to the box when painted; a box made taller (the
  // divider dragged, the window grown, the table fitted to its rows) left
  // blank space under the last painted row until a scroll (window-size
  // audit 2026-10-01).  Repaint when the box changes size.
  if (window.ResizeObserver) {
    let lastH = -1;
    new ResizeObserver(() => {
      if (scroller.clientHeight === lastH) return;
      lastH = scroller.clientHeight;
      paintRows();
    }).observe(scroller);
  }
  fitColumns(table, descs.map(rowHtml));   // widths from every row
  paintRows();
  // A click on the drawer's mark for a cell comes here (drawPairing), and a
  // click on a fibre's name picks it on the chart.
  if (marks) {
    marks.goCell = (fi, which, col) => gridGoCell({ scroller, table, tb, descs, paintRows }, fi, which, col);
    gDrawerMarks.push(marks);
  }
  wireAggJump({ scroller, table, tb, descs, paintRows }, have);   // Minimum / Maximum -> its row
  appendOneDirGrid(singles, host);
  draw();
  requestAnimationFrame(() => {
    const hrows = table.tHead ? [...table.tHead.rows] : [];
    let off = 0;
    for (const r of hrows) {
      for (const th of r.cells) th.style.top = off + 'px';
      off += r.offsetHeight;
    }
  });
  // A header is every row's, so each direction uses its first shown fibre
  // with a measured reading in the column (FR's synthesised leg only when no
  // fibre measured one), at that leg's own raw km, as a right-click on it.
  const colPicks = i => {
    const picks = [];
    for (const w of ['a', 'b']) {
      const legOf = fi => { const x = cols[i].ev[fi]; return x && x.row[w]; };
      const fi = shown.find(k => legOf(k) && !legOf(k).synthetic) ?? shown.find(k => legOf(k));
      if (fi == null) continue;
      const t = w === 'a' ? have[fi].ta : have[fi].tb;
      picks.push({ dir: t.dir, km: rawKm(legOf(fi).pos_m), fiber: have[fi].fiber, src: t.src || t.dir });
    }
    return picks;
  };
  table.querySelectorAll('th.fr-evhdr').forEach(th => {
    th.style.cursor = 'pointer';
    // A click on the heading ("Event 1") zooms to the event and opens its
    // span menu, as the ⋯ does (Robert 2026-10-02: the boss clicks the
    // event's name, not the dots, to get Span START, END, Reset).
    th.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const r = (ev.target.closest('.fr-evmenu') || th).getBoundingClientRect();
      zoomToKm(+th.dataset.km, 2);
      const picks = colPicks(+th.dataset.col);
      if (picks.length) showColumnMenu(r.left, r.bottom + 2, picks);
    });
  });
  wireHeaderMenu(table, colPicks);
  // A click on an event number on the trace: scroll that fibre's row for the
  // trace's direction into view and mark the cell (three rows per fibre).
  gGridGoTo = (t, e) => {
    const fi = have.findIndex(p => p.ta === t || p.tb === t);
    if (fi < 0) return;
    // The row's place in what is on screen: collapsed, a fibre may carry
    // only its Average, so count rows rather than assume three per fibre.
    const w = t === have[fi].tb ? 'b' : 'a';
    let k = descs.findIndex(d => d[0] === fi && d[1] === w);
    if (k < 0) k = descs.findIndex(d => d[0] === fi);
    if (k < 0) return;
    const headH = table.tHead ? table.tHead.offsetHeight : 0;
    const rowTop = headH + k * FR_ROW_H;
    if (!e) {                                // a click on the trace: its row, centred
      // between the pinned header and the pinned Minimum/Maximum rows
      const mid = Math.max(FR_ROW_H, scroller.clientHeight - headH - pinnedFootH(table));
      scroller.scrollTop = Math.max(0, rowTop - headH - (mid - FR_ROW_H) / 2);
      paintRows();
      return;
    }
    const view = scroller.clientHeight - headH;
    const winTop = scroller.scrollTop + headH, winBot = winTop + view;
    if (rowTop < winTop || rowTop + FR_ROW_H > winBot) {
      scroller.scrollTop = Math.max(0, rowTop - headH - Math.max(0, (view - FR_ROW_H) / 2));
    }
    paintRows();
    const sel = `tr[data-dir="${t.dir}"][data-fiber="${t.fiber}"][data-src="${t.src || t.dir}"]`;
    const tr = [...tb.querySelectorAll(sel)].find(row => row.querySelector(`td[data-km="${e.dist_km}"]`));
    const td = tr && tr.querySelector(`td[data-km="${e.dist_km}"]`);
    if (!td) return;
    table.querySelectorAll('td.fr-hit').forEach(x => x.classList.remove('fr-hit', 'fading'));
    const sr = scroller.getBoundingClientRect(), cr = td.getBoundingClientRect();
    const leadW = tr.cells[0].offsetWidth;
    const dxL = cr.left - (sr.left + leadW) - 8;
    const dxR = cr.right - sr.right + 8;
    if (dxL < 0) scroller.scrollLeft += dxL;
    else if (dxR > 0) scroller.scrollLeft += dxR;
    td.classList.add('fr-hit');
    setTimeout(() => td.classList.add('fading'), 1500);
    setTimeout(() => td.classList.remove('fr-hit', 'fading'), 2200);
  };
  // A click on a row picks it (pickRow): a direction's row its trace, the
  // Average row both of its fibre's.  Again on the same row lets go.
  tb.addEventListener('click', (ev) => {
    // Not the second click of a double-click (it would let go at once), and
    // not a mouse-up that ends selecting text to copy.
    if (ev.detail > 1 || String(window.getSelection() || '').trim()) return;
    const tr = ev.target.closest('tr[data-fiber]');
    if (!tr) return;
    const p = have.find(q => String(q.fiber) === tr.dataset.fiber);
    if (!p) return;
    pickRow(tr.dataset.avg ? [p.ta.key, p.tb.key] : [`${tr.dataset.src}-${tr.dataset.fiber}`]);
    paintRows();
  });
  // Right-click any cell for the span menu, as in the other grids
  // (wireCellMenu: the Average row asks which direction).
  tb.addEventListener('contextmenu', (ev) => wireCellMenu(ev, tb));
  // End verdicts landing later move only the end marks, the P/F column and
  // the drawer's marks (see endVerdictsLanded): the rows on screen are
  // painted again, the rest stays.  A filter or the one-direction fibres'
  // table below follow the verdicts too, so those lay the panel out again.
  gTableLive = { host, scroller, refreshVerdicts: () => {
    if (cellFilterOn() || gFlaggedOnly || singles.length) return false;
    endBad = endBadNow();
    if (marks) marks.cols = markCols();
    paintRows();
    draw();
    return true;
  } };
}

// ─── Declaring the span ───────────────────────────────────────────────
function closeSpanMenu() {
  const m = document.getElementById('span-menu');
  if (m) m.remove();
}
// Both directions sit under one header column, so the ⋯ asks which one first.
// With no picks (a header over no event) it is the View items alone.
function showDirChooser(x, y, picks) {
  closeSpanMenu();
  const m = document.createElement('div');
  m.id = 'span-menu';
  m.innerHTML = (picks.length ? `<div class="span-menu-hd">Which Direction?</div>` : '')
    + picks.map((p, k) =>
        `<button data-k="${k}">${p.dir === 'a' ? 'A→B' : 'B→A'} Span and Settings…</button>`).join('')
    + viewItems();
  document.body.appendChild(m);
  m.style.left = Math.min(x, window.innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - m.offsetHeight - 8) + 'px';
  m.querySelectorAll('button').forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      if (b.dataset.unit) { closeSpanMenu(); setDistUnit(b.dataset.unit); return; }
      if (b.dataset.view) { closeSpanMenu(); toggleView(b.dataset.view); return; }
      const p = picks[+b.dataset.k];
      showSpanMenu(x, y, p.dir, p.km, p.fiber, p.src);
    };
  });
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}
// A column header's menu: the span menu for the one direction its column
// has, the chooser for two, the View items for a header over no event.
function showColumnMenu(x, y, picks) {
  if (picks.length === 1) {
    const p = picks[0];
    showSpanMenu(x, y, p.dir, p.km, p.fiber, p.src);
  } else showDirChooser(x, y, picks);
}
// Every cell of an event table opens the span menu on a right-click (Robert
// 2026-10-02: only a direction's loss cell with its own event did, about one
// cell in five; the rest gave the browser's menu).  A cell names its event
// column (data-col) or sits after the one it belongs to (Refl., Type, a
// Section).  Its own direction's event there is the pick; a gray cell, a
// blank or an Average row take each direction's event in that column for
// the fibre, so two directions ask which one first.  A cell before any
// event column (Identifiers, P/F, wavelength, direction) takes the row's
// first event.
function cellMenuPicks(tb, td) {
  const tr = td.closest('tr');
  if (!tr || tr.dataset.fiber == null) return [];
  let c = td;
  while (c && c.dataset.col == null) c = c.previousElementSibling;
  const col = c ? c.dataset.col : null;
  const fid = tr.dataset.row ? tr.dataset.row.split('-')[0] : null;
  const rows = fid != null
    ? [...tb.querySelectorAll(`tr[data-dir][data-row^="${fid}-"]`)]
    : (tr.dataset.dir ? [tr] : []);
  rows.sort((a, b) => (b === tr) - (a === tr));    // this row first
  const pickOf = row => {
    const cell = col != null ? row.querySelector(`td[data-col="${col}"][data-km]`)
                             : row.querySelector('td[data-km]');
    return cell ? { dir: row.dataset.dir, km: +cell.dataset.km,
                    fiber: row.dataset.fiber, src: row.dataset.src } : null;
  };
  const own = tr.dataset.dir ? pickOf(tr) : null;
  if (own) return [own];
  const picks = [];
  for (const row of rows) {
    const p = pickOf(row);
    if (p && !picks.some(q => q.dir === p.dir)) picks.push(p);
  }
  return picks;
}
// No event for the cell at all (a column neither direction of the fibre
// reached, a statistics row): the View items alone, never the browser's menu.
function wireCellMenu(ev, tb) {
  const td = ev.target.closest('td');
  if (!td) return;
  ev.preventDefault();
  showColumnMenu(ev.clientX, ev.clientY, cellMenuPicks(tb, td));
}
// Every header cell opens the menu on a right-click, not only the ⋯: on a
// wide table the ⋯ of the event you are reading is often scrolled out of
// sight, and the A+B tables' sub-rows (kind, distance, Loss / Refl.) are
// headers of the same column.  An event column's cells carry data-col;
// picksFor(i) names what that column's ⋯ would open.  Any other header
// (Identifiers, a Section, the Statistics) opens the View items.
function wireHeaderMenu(table, picksFor) {
  if (!table.tHead) return;
  table.tHead.addEventListener('contextmenu', (ev) => {
    const th = ev.target.closest('th');
    if (!th) return;
    ev.preventDefault();
    showColumnMenu(ev.clientX, ev.clientY, th.dataset.col != null ? picksFor(+th.dataset.col) : []);
  });
}
// The view switches, under their own heading because they change what is
// PRINTED, not what a span or a trace setting is.  "Show only flagged rows"
// used to be a checkbox in the EVENTS header strip, where nobody found it:
// the boss, on being told it existed, asked for both switches to live here.
function viewItems() {
  return `<div class="span-menu-hd">View</div>`
    + `<button data-view="rows">${gFlaggedOnly ? '✓ ' : ''}Show Only Flagged Rows</button>`
    + `<button data-view="cells">${gFailCellsOnly ? '✓ ' : ''}Show Only Failing Cells</button>`
    + `<button data-view="warncells">${gWarnCellsOnly ? '✓ ' : ''}Show Only Warning Cells</button>`
    + `<button data-view="avg">${gAvgOnly ? '✓ ' : ''}Show Averages Only</button>`
    + `<button data-view="gainers">${gShowGainers ? '✓ ' : ''}Show Gainers</button>`
    + `<div class="span-menu-hd">Distance Unit</div>`
    + Object.entries(DIST_UNITS).map(([k, u]) =>
        `<button data-unit="${k}"${k === gDistUnit ? ' class="primary"' : ''}>`
        + `${k === gDistUnit ? '✓ ' : ''}${u.name}</button>`).join('');
}
function toggleView(which) {
  if (which === 'rows') gFlaggedOnly = !gFlaggedOnly;
  else if (which === 'warncells') gWarnCellsOnly = !gWarnCellsOnly;
  else if (which === 'avg') {
    gAvgOnly = !gAvgOnly;
    try { localStorage.setItem('otdr_viewer_avg_only', gAvgOnly ? '1' : '0'); } catch (e) {}
  }
  else if (which === 'gainers') {
    gShowGainers = !gShowGainers;
    try { localStorage.setItem('otdr_viewer_gainers', gShowGainers ? '1' : '0'); } catch (e) {}
  }
  else gFailCellsOnly = !gFailCellsOnly;
  const cb = document.getElementById('set-failcells');
  if (cb) cb.checked = gFailCellsOnly;       // the menu and the box are one switch
  const wb = document.getElementById('set-warncells');
  if (wb) wb.checked = gWarnCellsOnly;
  const vb = document.getElementById('set-avg-only');
  if (vb) vb.checked = gAvgOnly;
  const gb = document.getElementById('set-gainers');
  if (gb) gb.checked = gShowGainers;
  syncViewBtn();
  renderEventTable();
  const on = [];
  if (gFlaggedOnly) on.push('flagged rows only');
  if (gFailCellsOnly) on.push('failing cells only');
  if (gWarnCellsOnly) on.push('warning cells only');
  if (gAvgOnly) on.push('averages only');
  if (!gShowGainers) on.push('gainers hidden');
  setReadout(on.length ? `showing ${on.join(', ')}` : 'showing every row and every event');
}
function showSpanMenu(x, y, dir, km, fiber, src) {
  closeSpanMenu();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  // Only the two edges that reach the picture are offered as the headline
  // actions; the other two are stored for the engine but change nothing here,
  // so putting them in front of a tech would be inviting a pointless click.
  const useful = dir === 'a' ? 'start' : 'end';
  const items = [
    ['start', `Span START of ${arrow} Here`],
    ['end',   `Span END of ${arrow} Here`],
    // Named for what it does to the picture (Robert 2026-09-26); the header
    // above already says which direction.
    ['clear', 'Reset to Full Span'],
    ['edit',  `Trace Settings (IOR, Names)…`],
  ];
  const m = document.createElement('div');
  m.id = 'span-menu';
  // Named for what it does: this sets the whole DIRECTION's span, for every
  // fiber in the folder, not a property of the row that was clicked.  The row
  // only says which event was meant, and each fiber snaps to its own.
  m.innerHTML = `<div class="span-menu-hd">${arrow} Span: All Fibers in This Folder`
    + `<br><span class="span-menu-sub">picked on F${fiberLabel(fiber)} at ${fmtDist(km)}; `
    + `each fiber uses its own event there</span></div>`
    + items.map(([e, label]) =>
        `<button data-edge="${e}"${e === useful ? ' class="primary"' : ''}>${label}</button>`).join('')
    + viewItems();
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  m.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      closeSpanMenu();
      if (b.dataset.unit) { setDistUnit(b.dataset.unit); return; }
      if (b.dataset.view) { toggleView(b.dataset.view); return; }
      if (b.dataset.edge === 'edit') showEditDialog(src || dir, fiber);
      else setSpanEdge(dir, b.dataset.edge, km, src);
