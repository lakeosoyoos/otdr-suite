        `<button data-col="${c}">${gFileCols.has(c) ? '✓ ' : ' '}${label}</button>`).join('')
    + '<button data-reset="1">Restore Default</button>';
  document.body.appendChild(m);
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - m.offsetHeight - 8)) + 'px';
  m.querySelectorAll('button[data-col]').forEach(b => {
    b.onclick = () => {
      closeSpanMenu();
      const c = b.dataset.col;
      if (gFileCols.has(c)) gFileCols.delete(c); else gFileCols.add(c);
      saveFilesView();
      renderFilesPanel();
    };
  });
  m.querySelector('button[data-reset]').onclick = () => {
    closeSpanMenu();
    gFileCols = new Set(FILE_COLS_DEFAULT);
    gFileSort = null;
    saveFilesView();
    renderFilesPanel();
  };
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}

// The P/F, λ and Date columns read every file's details once, in the
// background, a ribbon's worth per request; the header counts them in and
// the rows fill as they arrive.  A file that could not be read is not asked
// for again until its name changes.
let gFactsNote = '';
let gFactsLoading = null;
const gFactsTried = new Set();       // "<key>|<file name>" the server could not read
let gFactsRetryAt = 0;               // after a failed request, wait before asking again
function ensureFileFacts(now) {
  if (gFactsLoading) return gFactsLoading;
  if (!now && Date.now() < gFactsRetryAt) return Promise.resolve(false);
  const keys = fileRowKeys().filter(k => {
    const name = fileNameOf(k);
    const f = gFileFacts.get(k);
    return (!f || f.name !== name) && !gFactsTried.has(`${k}|${name}`);
  });
  if (!keys.length) return Promise.resolve(true);
  gFactsLoading = (async () => {
    try {
      return await loadFileFacts(keys, (done, total) => {
        gFactsNote = `reading ${done} of ${total}`;
        renderFilesPanel();
      });
    } finally {
      gFactsLoading = null;
      gFactsNote = '';
      renderFilesPanel();
    }
  })();
  return gFactsLoading;
}

// ─── Fibers: FR's Identifiers and Matched Files, one row per fibre ─────
// FastReporter's panel also lists the files by fibre (its Identifiers tree:
// click a fibre and both directions are selected) and shows what it paired
// with what (its Matched Files tab).  The Viewer's Fibers tab is both in one
// list: a row per fibre, its A→B and B→A files side by side, and whether
// the two make the pair the table's Average row needs, and if not, why:
//   A only / B only        the other direction has no file
//   both A→B / both B→A    both files are drawn as one direction (a file's
//                          own stamp or a Direction change), so no pair
//   2 A files              two files of one fibre on a side (two
//                          wavelengths), which the Viewer cannot tell apart
// Clicks work as in Files, a fibre at a time: click, Shift+click,
// Ctrl/Cmd+click and the arrow keys select the fibre's files, and a
// right-click opens the file menu on them.
let gFilesView = 'files';            // 'files' | 'fibers' | 'meas' (a dropped .olts)
let gOlts = null;                    // the .olts the Measurements tab lists (olts_load's answer)
let gOltsSort = null;                // { col, desc }
let gOltsSel = null;                 // the identifier of the row clicked
try { if (localStorage.getItem('otdr_viewer_files_tab') === 'fibers') gFilesView = 'fibers'; } catch (e) {}
let gFiberAnchor = null;             // as gFileAnchor / gFileFocus, a fibre at a time
let gFiberFocus = null;

function syncFilesTabs() {
  if (gFilesView === 'meas' && !gOlts) gFilesView = 'files';
  document.querySelectorAll('#files-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === gFilesView);
    if (b.dataset.view === 'meas') b.hidden = !gOlts;
  });
  const h = document.querySelector('#files-hd h2');
  if (h) h.textContent = { fibers: 'Fibers', meas: 'Measurements' }[gFilesView] || 'Files';
}
document.getElementById('files-tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-view]');
  if (!b || b.dataset.view === gFilesView) return;
  gFilesView = b.dataset.view;
  try { localStorage.setItem('otdr_viewer_files_tab', gFilesView); } catch (e) {}
  renderFilesPanel();
});

// Every fibre in the two folders as { fiber, a: [names], b: [names] }, in
// fibre order, removed files left out.
// One row per fiber of a span ('17', and '2:17' for span 2's fiber 17),
// every copy of each side in its column.
function fiberTable() {
  const by = new Map();
  for (const dir of ((gInfo && gInfo.srcs && gInfo.srcs.length) ? gInfo.srcs : ['a', 'b'])) {
    const fibers = (gInfo && gInfo['fibers_' + dir]) || [];
    const files = (gInfo && gInfo['files_' + dir]) || [];
    const span = dir.length > 1 ? spanOf(dir) : 1, side = dir[0];
    fibers.forEach((f, i) => {
      if (gRemovedFiles.has(`${dir}-${f}`)) return;
      const fk = span > 1 ? `${span}:${f}` : String(f);
      if (!by.has(fk)) by.set(fk, { fiber: f, span, fkey: fk, a: [], b: [], keys: { a: [], b: [] } });
      const r = by.get(fk);
      r[side].push(files[i] || `F${fiberLabel(f)}`);
      if (!r.keys[side].includes(`${dir}-${f}`)) r.keys[side].push(`${dir}-${f}`);
    });
  }
  return [...by.values()].sort((x, y) => x.span - y.span || realFiber(x.fiber) - realFiber(y.fiber)
                                         || x.fiber - y.fiber);
}
// Whether a fibre's files make a pair, and if not, why.  The Viewer pairs on
// the fibre number and the direction each file is drawn as.
function fiberPairNote(r, dirOf) {
  if (r.a.length > 1) return { ok: false, text: `${r.a.length} A files` };
  if (r.b.length > 1) return { ok: false, text: `${r.b.length} B files` };
  if (!r.a.length) return { ok: false, text: 'B only' };
  if (!r.b.length) return { ok: false, text: 'A only' };
  const srcOf = k => k.slice(0, k.indexOf('-'));          // 'a2-17' -> 'a2'
  const da = dirOf(srcOf(r.keys.a[0]), r.fiber), db = dirOf(srcOf(r.keys.b[0]), r.fiber);
  if (da === db) return { ok: false, text: da === 'a' ? 'both A→B' : 'both B→A' };
  return { ok: true, text: '✓' };
}
function fiberFileKeys(r) {
  return [...r.keys.a, ...r.keys.b];
}
// 'selected' when every file of the fibre is, 'partial' when some are.
function fiberState(r) {
  const ks = fiberFileKeys(r), n = ks.filter(k => gSelectedFiles.has(k)).length;
  return n && n === ks.length ? 'selected' : n ? 'partial' : '';
}

function renderFibersView(list, esc) {
  const rows = fiberTable();
  const loaded = new Map(gTraces.map(t => [t.key, t]));
  const hd = document.getElementById('files-cols');
  hd.classList.add('fibers');
  hd.innerHTML = '<span></span><span>Fiber</span><span>A→B</span><span>B→A</span>'
               + '<span title="whether the two files make the pair the table averages">Pair</span>';
  const WHY = { 'A only': 'no B→A file for this fiber', 'B only': 'no A→B file for this fiber' };
  list.innerHTML = rows.length ? rows.map(r => {
    const t = fiberFileKeys(r).map(k => loaded.get(k)).find(Boolean);
    const pair = fiberPairNote(r, effDir);
    const why = WHY[pair.text] || (pair.ok ? 'A→B and B→A: the table averages them'
                                           : 'these files do not make a pair');
    return `<div class="fiber-row ${fiberState(r)}${gFiberFocus === r.fkey ? ' focus' : ''}"`
      + ` data-fkey="${r.fkey}">`
      + `<span class="file-vis"${t ? ` style="color:${t.color};text-shadow:0 0 1px #333"` : ''}>${t ? '●' : ''}</span>`
      + `<span class="file-num">${r.span > 1 ? `S${r.span} ` : ''}${fiberLabel(r.fiber)}</span>`
      + `<span title="${esc(r.a.join(', '))}">${esc(r.a.join(', ') || '---')}</span>`
      + `<span title="${esc(r.b.join(', '))}">${esc(r.b.join(', ') || '---')}</span>`
      + `<span class="fib-pair${pair.ok ? '' : ' bad'}" title="${why}">${pair.text}</span></div>`;
  }).join('') : '<span id="chip-empty">no folders loaded</span>';
  const full = rows.filter(r => fiberState(r) === 'selected').length;
  document.getElementById('files-count').textContent =
    rows.length ? `${full} of ${rows.length} fiber${rows.length === 1 ? '' : 's'} selected` : '';
}

// Select these fibres' files, in place of the selection.
function selectFibers(fkeys) {
  const byKey = new Map(fiberTable().map(r => [r.fkey, r]));
  const want = new Set();
  for (const k of fkeys) {
    const r = byKey.get(String(k));
    if (r) fiberFileKeys(r).forEach(x => want.add(x));
  }
  if (want.size) selectFiles(want);
}
// ─── FILES selection, the way FastReporter does it ────────────────────
// FR3 was driven click by click (2026-09-30) and these are its rules:
//   click                   select just this file
//   click on a file that is already one of several selected
//                           just this file, as on any other row.  FR keeps
//                           the set here, but the boss (2026-10-01) wants a
//                           click on one fiber, with all of them selected,
//                           to show only that one.  A right-click there
//                           still keeps the set for the menu.
//   Shift+click             the files from the anchor to this one, in screen
//                           order, in place of the selection
//   Ctrl+click              add or remove this one file (Cmd on a Mac), but
//                           never the last one
//   Ctrl+Shift+click        the range added to the selection (Explorer's rule;
//                           FR adds the one file, which is the less useful)
//   drag from a file outside the selection    the files swept
//   right-click a file outside the selection  select it first, then the menu
//   Down / Up               move the selection a row; with Shift, the range
//   Home / End              the first / last file
// FR never has nothing selected, so none of these can empty it.  The
// selection is what is loaded and drawn, and the chart and table follow it.
let gFileAnchor = null;              // where a Shift range starts
let gFileFocus = null;               // the row the arrow keys move from

// Every row in screen order, as "<dir>-<fiber>" keys.
function fileRowKeys() {
  // The Fibers tab lists fibres, not files: its files are each fibre's A
  // then B, in fibre order, so Ctrl+A, Select Same and a Remove still see
  // every file from there.
  if (gFilesView === 'fibers') return fiberTable().flatMap(fiberFileKeys);
  // Two files of one fibre on a side (two wavelengths) share a key, and the
  // keys would stop on the second copy of it, so each key is listed once.
  return [...new Set([...document.querySelectorAll('#files-list .file-row')]
    .map(r => `${r.dataset.dir}-${r.dataset.fiber}`))];
}
function fileRowEl(key) {
  const [d, f] = splitFileKey(key);
  return document.querySelector(`#files-list .file-row[data-dir="${d}"][data-fiber="${f}"]`);
}
// A file's name from the listing, whichever tab is showing.
function fileNameOf(key) {
  const [d, f] = splitFileKey(key);
  const fibers = (gInfo && gInfo['fibers_' + d]) || [], files = (gInfo && gInfo['files_' + d]) || [];
  const i = fibers.indexOf(f);
  return (i >= 0 && files[i]) || `F${fiberLabel(f)}`;
}
const sameKeys = (a, b) => a.size === b.size && [...a].every(k => b.has(k));

// The rows from `a` to `b`, both included, whichever comes first.  A start
// that has left the list (removed, renamed) leaves just `b`.
function fileRange(keys, a, b) {
  const i = keys.indexOf(a), j = keys.indexOf(b);
  if (j < 0) return [];
  if (i < 0) return [b];
  return keys.slice(Math.min(i, j), Math.max(i, j) + 1);
}

// What a click does, worked out on plain lists so the rules read (and test)
// apart from the page.  `keys` is every row in screen order and `sel` the
// selection now.  Returns { want, anchor, focus }, where a null `want` keeps
// the selection as it is; null for a click that changes nothing at all.
function fileClickSelection(keys, sel, anchor, key, shift, ctrl) {
  if (shift && anchor) {
    const want = new Set(fileRange(keys, anchor, key));
    if (ctrl) sel.forEach(k => want.add(k));
    return { want, anchor, focus: key };
  }
  if (ctrl) {
    const want = new Set(sel);
    if (want.has(key)) {
      if (want.size === 1) return null;          // never the last one
      want.delete(key);
    } else {
      want.add(key);
    }
    return { want, anchor: key, focus: key };
  }
  return { want: new Set([key]), anchor: key, focus: key };
}

// The keys.  Down / Up move a single selection one row; Shift+Down /
// Shift+Up grow or shrink the range from the anchor; Home / End go to the
// first / last row.  From nowhere, Down starts at the top and Up at the bottom.
function fileKeySelection(keys, anchor, focus, key, shift) {
  if (!keys.length) return null;
  const last = keys.length - 1;
  let i = keys.indexOf(focus);
  if (i < 0) i = keys.indexOf(anchor);
  const j = key === 'ArrowDown' ? (i < 0 ? 0 : Math.min(last, i + 1))
          : key === 'ArrowUp'   ? (i < 0 ? last : Math.max(0, i - 1))
          : key === 'Home'      ? 0 : last;
  if (!shift) return { want: new Set([keys[j]]), anchor: keys[j], focus: keys[j] };
  const a = keys.includes(anchor) ? anchor : keys[i < 0 ? j : i];
  return { want: new Set(fileRange(keys, a, keys[j])), anchor: a, focus: keys[j] };
}

// After a Remove: the row that slides into the first removed spot, or the
// last one left when the removed rows were at the bottom; null if none is.
function fileAfterRemove(keys, removed) {
  const first = keys.findIndex(k => removed.has(k));
  const rest = keys.filter(k => !removed.has(k));
  if (first < 0 || !rest.length) return null;
  return rest[Math.min(first, rest.length - 1)];
}

// One selection load at a time.  A click, key or drag while a load is still
// running paints its rows at once and loads when that load ends, and only the
// newest one does, so holding Down does not queue a load for every row it
// passed (and a fast double-click cannot load one file twice).
let gSelLoading = false;
let gSelNext = null;                 // the newest selection still to load
async function selectFiles(want) {
  markFiles(want);
  gSelNext = want;
  if (gSelLoading) return;
  gSelLoading = true;
  try {
    while (gSelNext) {
      const w = gSelNext;
      gSelNext = null;
      try {
        await applyFileSelection(w);
      } catch (e) {                    // one bad load must not stop the next
        reportJsError((e && e.message) || String(e), e && e.stack);
      }
    }
  } finally {
    gSelLoading = false;
  }
}

// Once a load settles, the selection is exactly what is loaded: a file the
// cap cut off, or one that would not load, is not left highlighted, and a
// trace the Fibers box or a report jump loaded is selected like any other.
// A newer selection still waiting to load keeps its own marks.
function syncFileMarks() {
  prunePick();
  if (gSelNext) return;
  gSelectedFiles.clear();
  for (const t of gTraces) gSelectedFiles.add(t.key);
  syncFiberBox();
}

const filesList = document.getElementById('files-list');

// A press on a row gives the list the keys.  A plain press on a file outside
// the selection may turn into a drag, which selects the rows swept: marked as
// the pointer moves, loaded on release.  A drag from a selected file does
// nothing, as in FR.
let gFileDrag = null;                // { from, to, moved, y } while the button is down
let gFileDragClick = false;          // the click a real drag ends with is not a click
let gFileDragTimer = null;
filesList.addEventListener('mousedown', (ev) => {
  gFileDragClick = false;
  const row = ev.target.closest('.file-row');
  if (!row) return;
  filesList.focus({ preventScroll: true });
  if (ev.shiftKey) ev.preventDefault();  // no text selection
  if (ev.button !== 0 || ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.target.closest('.file-vis')) return;          // the dot shows and hides
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (gSelectedFiles.has(key)) return;
  gFileDrag = { from: key, to: key, moved: false, y: ev.clientY };
});
document.addEventListener('mousemove', (ev) => {
  if (!gFileDrag) return;
  if (!(ev.buttons & 1)) { endFileDrag(); return; }    // let go outside the page
  gFileDrag.y = ev.clientY;
  fileDragTo(ev.clientY);
  fileDragScroll();
});
document.addEventListener('mouseup', () => { if (gFileDrag) endFileDrag(); });

function fileDragTo(clientY) {
  const r = filesList.getBoundingClientRect();
  const y = Math.max(r.top + 2, Math.min(r.bottom - 2, clientY));
  const el = document.elementFromPoint(r.left + Math.min(40, r.width / 2), y);
  const row = el && el.closest ? el.closest('.file-row') : null;
  if (!row) return;
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (key === gFileDrag.to) return;
  gFileDrag.to = key;
  gFileDrag.moved = true;
  markFiles(new Set(fileRange(fileRowKeys(), gFileDrag.from, key)));
}
// Held past the top or bottom of the list, the list scrolls and the range
// follows the edge row.
function fileDragScroll() {
  const past = () => {
    const r = filesList.getBoundingClientRect();
    return !gFileDrag ? 0 : gFileDrag.y < r.top ? gFileDrag.y - r.top
         : gFileDrag.y > r.bottom ? gFileDrag.y - r.bottom : 0;
  };
  if (!past()) { clearInterval(gFileDragTimer); gFileDragTimer = null; return; }
  if (gFileDragTimer) return;
  gFileDragTimer = setInterval(() => {
    const d = past();
    if (!d) { clearInterval(gFileDragTimer); gFileDragTimer = null; return; }
    filesList.scrollTop += Math.max(-40, Math.min(40, d));
    fileDragTo(gFileDrag.y);
  }, 40);
}
function endFileDrag() {
  const d = gFileDrag;
  gFileDrag = null;
  clearInterval(gFileDragTimer);
  gFileDragTimer = null;
  if (!d || !d.moved) return;        // a plain click: the click handler has it
  gFileDragClick = true;
  gFileAnchor = d.from;
  gFileFocus = d.to;
  selectFiles(new Set(fileRange(fileRowKeys(), d.from, d.to)));
}

filesList.addEventListener('keydown', (ev) => {
  if (gFilesView !== 'files') return;            // the other tabs have their own keys
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const s = fileKeySelection(fileRowKeys(), gFileAnchor, gFileFocus, ev.key, ev.shiftKey);
  if (!s) return;
  ev.preventDefault();               // the list does not scroll on its own
  gFileAnchor = s.anchor;
  gFileFocus = s.focus;
  selectFiles(s.want);
  const el = fileRowEl(s.focus);
  if (el) el.scrollIntoView({ block: 'nearest' });
});

// On a Mac, Control+click IS the right-click, so it opens the menu; Cmd+click
// adds or removes a file there.  On Windows a Ctrl+right-click still toggles.
// A right-click on a file outside the selection selects that file first, as
// FR does, so the highlight and the menu agree on what the menu acts on.
const IS_MAC = /Mac/i.test(navigator.platform || navigator.userAgent);
document.getElementById('files-list').addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.file-row');
  if (!row) return;
  ev.preventDefault();

  selectForMenu(row);
  showFileDirMenu(ev.clientX, ev.clientY, row.dataset.dir, +row.dataset.fiber, row.dataset.name);
});
function selectForMenu(row) {
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  if (gSelectedFiles.has(key)) return;           // the menu takes the whole selection
  gFileAnchor = gFileFocus = key;

// The Fibers tab's clicks, keys and right-click (see renderFibersView).
// Here, after the Files handlers, so each finds its own rows first.
// A click on a fibre: the Files rules (fileClickSelection), a fibre at a
// time.  A fibre only partly selected counts as not selected.
filesList.addEventListener('click', (ev) => {
  const row = ev.target.closest('.fiber-row');
  if (!row) return;

  const keys = table.map(r => r.fkey);

  const s = fileClickSelection(keys, sel, gFiberAnchor, row.dataset.fkey,
                               ev.shiftKey, ev.ctrlKey || ev.metaKey);
  if (!s) return;
  gFiberAnchor = s.anchor;
  gFiberFocus = s.focus;
  if (!s.want || sameKeys(s.want, sel)) { renderFilesPanel(); return; }
  selectFibers(s.want);
});
filesList.addEventListener('keydown', (ev) => {
  if (gFilesView !== 'fibers') return;
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const keys = fiberTable().map(r => r.fkey);
  const s = fileKeySelection(keys, gFiberAnchor, gFiberFocus, ev.key, ev.shiftKey);
  if (!s) return;
  ev.preventDefault();
  gFiberAnchor = s.anchor;
  gFiberFocus = s.focus;

  if (el) el.scrollIntoView({ block: 'nearest' });
});
// A right-click on a fibre outside the selection selects it first, then the
// file menu opens on the selection, named for the fibre's first file.
filesList.addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.fiber-row');
  if (!row) return;
  ev.preventDefault();
  const r = fiberTable().find(x => x.fkey === row.dataset.fkey);
  if (!r) return;
  if (fiberState(r) !== 'selected') {
    gFiberAnchor = gFiberFocus = r.fkey;
    selectFibers([r.fkey]);
  }
  const first = r.keys.a.length ? 'a' : 'b';
  const dir = splitFileKey(r.keys[first][0])[0];
  showFileDirMenu(ev.clientX, ev.clientY, dir, r.fiber, r[first][0] || '');
});

// The (side, fiber) a files-panel key stands for: 'a-12' -> ['a', 12].
function splitFileKey(key) {
  const i = key.indexOf('-');
  return [key.slice(0, i), +key.slice(i + 1)];
}

// ─── Select Same …: FastReporter's selection tools ────────────────────
// FR's Measurements menu (driven 2026-09-30) selects every file that shares
// one property with the selection: Select Same Pass/Fail Status, Identifiers,
// Type and Date, and Multiple Option Selection, which takes any of them
// together against the right-clicked file.  Here they sit in the FILES menu,
// named for what the Viewer calls the same things:
//   Select Same Pass/Fail Status   every file with the same verdict (fileFails)
//   Select Same Fiber              FR's Identifiers: both directions of the
//                                  selected fibers (FR takes one fiber at a
//                                  time; this takes every fiber selected)
//   Select Same Wavelength         FR's Type: 1310, 1550, 1625 ...
//   Select Same Day                FR's Date: the day the trace was SHOT, in
//                                  local time, not the file's date on disk
//   Select By…                     any of the four at once, all to match
// Each REPLACES the selection, and each is greyed, as in FR, while the
// selected files differ on its property.  The whole list's wavelengths, days
// and events come from the files themselves (/api/traces?facts=1), read once
// and kept; a loaded trace already carries its own.
const gFileFacts = new Map();        // "<dir>-<fiber>" -> { name, wl, acq, events }
const SAME_NAMES = { pf: 'Pass/Fail Status', fiber: 'Fiber', wl: 'Wavelength', day: 'Day' };

// A side's files changed under the page (a new drop, a rename): what was read
// about them no longer holds.  Keyed on the fibre, so a new span with the
// same names would otherwise inherit the last one's verdicts and dates.
function forgetFileFacts(dir) {
  for (const k of [...gFileFacts.keys()]) if (k.startsWith(dir + '-')) gFileFacts.delete(k);
  for (const k of [...gFactsTried]) if (k.startsWith(dir + '-')) gFactsTried.delete(k);
}
function factsOf(data) {
  return { name: data.filename || '', wl: data.wavelength_nm || null,
           acq: data.acq_time || null, events: data.events || [] };
}
// "2026-09-13": the day a trace was shot, in the viewer's own time zone, the
// way FR shows its date.
function fileDay(acq) {
  if (!acq) return null;
  const d = new Date(acq * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
       + `-${String(d.getDate()).padStart(2, '0')}`;
}
// A file's own verdict, FR's per-measurement P/F, by the gates of the table
// row the file lands in.  A file whose fibre has its other direction too
// (`paired`) sits on an A→B or B→A row of the two-direction table: a splice
// at the single-direction gate, a connector at the one-direction connector
// gate, a reflection at the report's mid-span reflectance rule.  A file with
// no partner sits in the one-direction table, which grades every loss at the
// gate the report grades that view by (activeGateDb: the Uni report's, the
// loss box's override ...).  Neither judges the launch level or the far end
// here, and the report's own flags (a break, an end connector) need the
// report, so a file's row can still carry one this does not.
function fileFails(events, dir, paired) {
  if (flagsOff()) return false;
  if (!paired) {
    return events.some(e => e.time_of_travel !== 0 && !e.is_end && clearsGate(e.splice_loss));
  }
  const own = Number(gInfo && (dir === 'a' ? gInfo.launch_a_km : gInfo.launch_b_km)) || 0;
  const far = Number(gInfo && (dir === 'a' ? gInfo.launch_b_km : gInfo.launch_a_km)) || 0;
  const end = events.find(e => e.is_end);
  const eof = end ? end.dist_km - own - far : null;
  return events.some(e => {
    if (e.time_of_travel === 0 || e.is_end) return false;
    if (clearsAt(e.splice_loss, gateFor(!!e.is_reflective, true))) return true;
    return !!e.is_reflective && reflFails(e.reflection, e.dist_km - own, eof);
  });
}
// What Select Same compares for one row, or null for a file not read yet.
// `paired`: the files whose fibre makes a pair (pairedFileKeys), worked out
// once per pass over the list rather than once per file.
function fileTraits(key, paired) {
  const f = gFileFacts.get(key);
  if (!f) return null;
  paired = paired || pairedFileKeys();
  const [dir, fiber] = splitFileKey(key);
  return { fiber: realFiber(fiber), wl: f.wl, day: fileDay(f.acq), pf: fileFails(f.events, dir, paired.has(key)) };
}
// Every file whose fibre has both directions, drawn as opposite ones: the
// files that sit on a two-direction table's A→B or B→A row.
function pairedFileKeys() {
  const out = new Set();
  for (const r of fiberTable()) {
    if (fiberPairNote(r, effDir).ok) fiberFileKeys(r).forEach(k => out.add(k));
  }
  return out;
}
// The rows that match `ref` on every one of `kinds` ('pf', 'fiber', 'wl',
// 'day').  A row not read, or with nothing recorded for a property, never
// matches on it.
function fileSameKeys(keys, traits, ref, kinds) {
  return keys.filter(k => {
    const t = traits(k);
    return !!t && kinds.every(p => t[p] != null && t[p] === ref[p]);
  });
}
// Do the files agree on `p`?  Only the ones read so far can say; a file
// still loading does not stop the item.
function filesAgreeOn(keys, p) {
  const paired = pairedFileKeys();
  const seen = new Set(keys.map(k => fileTraits(k, paired)).filter(Boolean).map(t => t[p]));
  return seen.size <= 1 && !seen.has(null);
}

// Read what the list does not know yet, a ribbon's worth of files per
// request and one direction at a time.  Loaded traces already carry theirs.
// A row whose file name changed since (a rename, a new drop) is read again.
// `onProgress(done, total)` hears after each request.
async function loadFileFacts(keys, onProgress) {
  for (const t of gTraces) gFileFacts.set(t.key, factsOf(t.data));
  const need = keys.filter(k => {
    const f = gFileFacts.get(k);
    return !f || f.name !== fileNameOf(k);
  });
  const byDir = {};                     // every source: 'a', 'b', 'a2'
  need.forEach(k => { const [d, f] = splitFileKey(k); (byDir[d] = byDir[d] || []).push(f); });
  let done = 0, ok = true;
  for (const d of Object.keys(byDir)) {
    for (let i = 0; i < byDir[d].length; i += 144) {
      const part = byDir[d].slice(i, i + 144);
      try {
        const r = await fetchRetry(`/api/traces?dir=${d}&fibers=${part.join(',')}&maxpts=200&facts=1`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        for (const t of (j.traces || [])) gFileFacts.set(`${d}-${t.fiber}`, factsOf(t));
        // A file the server could not read is not asked for again until its
        // name changes; a request that failed outright is (see gFactsRetryAt).
        for (const f of (j.missing || [])) gFactsTried.add(`${d}-${f}|${fileNameOf(`${d}-${f}`)}`);
      } catch (e) {
        setReadout(`could not read the files' details: ${(e && e.message) || e}`);
        gFactsRetryAt = Date.now() + 10000;
        ok = false;                      // carry on: the rest may still come
      }
      done += part.length;
      if (onProgress) onProgress(done, need.length);
    }
  }
  return ok;
}

// Select Same Fiber takes the whole selection's fibers; the rest compare
// every row with the right-clicked file.
async function selectSame(kinds, refKey) {
  const keys = fileRowKeys();
  let want;
  if (kinds.length === 1 && kinds[0] === 'fiber') {
    const fibers = new Set([...gSelectedFiles, refKey].map(k => realFiber(splitFileKey(k)[1])));
    want = keys.filter(k => fibers.has(realFiber(splitFileKey(k)[1])));
  } else {
    // The read already in flight first, then whatever it did not cover: one
    // read at a time, so the columns and this never ask for the list twice.
    if (gFactsLoading) await gFactsLoading;
    await ensureFileFacts(true);
    const paired = pairedFileKeys();
    const ref = fileTraits(refKey, paired);
    if (!ref) { setReadout(`could not read ${fileNameOf(refKey)}`); return; }
    want = fileSameKeys(keys, k => fileTraits(k, paired), ref, kinds);
  }
  if (!want.length) return;
  gFileAnchor = gFileFocus = refKey;
  await selectFiles(new Set(want));
  const el = fileRowEl(refKey);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// FR's Multiple Option Selection: tick any of the four, and every file that
// matches the right-clicked one on all of them is selected.  The ticks are
// remembered, as FR remembers them.
function showSelectByDialog(refKey) {
  closeSelectByDialog();
  let ticked;
  try { ticked = JSON.parse(localStorage.getItem('otdr_viewer_select_by') || 'null'); } catch (e) { ticked = null; }
  if (!Array.isArray(ticked)) ticked = ['pf'];
  const bg = document.createElement('div'); bg.id = 'sel-dlg-bg';
  const d = document.createElement('div'); d.id = 'sel-dlg';
  d.innerHTML = `<h3>Select By</h3>`
    + `<div class="sub">Select the files that match ${fileNameOf(refKey).replace(/&/g, '&amp;').replace(/</g, '&lt;')} on every item ticked.</div>`
    + ['pf', 'fiber', 'wl', 'day'].map(p => {
        // Nothing is graded while the Settings box is down: every file would
        // "match" on Pass/Fail and the whole cable would load.
        const off = p === 'pf' && flagsOff();
        return `<label${off ? ' title="the Settings box did not load, so nothing is graded" style="opacity:.45"' : ''}>`
             + `<input type="checkbox" data-p="${p}"${ticked.includes(p) && !off ? ' checked' : ''}${off ? ' disabled' : ''}>`
             + ` ${SAME_NAMES[p]}</label>`;
      }).join('')
    + `<div class="btns"><button data-cancel="1">Cancel</button><button class="primary" data-ok="1">OK</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);
  const boxes = [...d.querySelectorAll('input[data-p]')];
  const ok = d.querySelector('button[data-ok]');
  const sync = () => { ok.disabled = !boxes.some(b => b.checked); };
  boxes.forEach(b => { b.onchange = sync; });
  sync();
  const go = () => {
    const kinds = boxes.filter(b => b.checked).map(b => b.dataset.p);
    if (!kinds.length) return;
    try { localStorage.setItem('otdr_viewer_select_by', JSON.stringify(kinds)); } catch (e) {}
    closeSelectByDialog();
    selectSame(kinds, refKey);
  };
  ok.onclick = go;
  d.querySelector('button[data-cancel]').onclick = closeSelectByDialog;
  bg.onclick = closeSelectByDialog;
  d.onkeydown = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); closeSelectByDialog(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); go(); }
  };
  (boxes.find(b => b.checked) || boxes[0]).focus();
}
function closeSelectByDialog() {
  for (const id of ['sel-dlg', 'sel-dlg-bg']) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

// The Select part of the file menu.  Each item is greyed while the selected
// files differ on its property, as FR greys it.
function selectSameMenuHtml(marks) {
  for (const t of gTraces) gFileFacts.set(t.key, factsOf(t.data));
  const item = (p, label, why) => why
    ? `<button data-same="${p}" disabled style="opacity:.45" title="${why}">${label}</button>`
    : `<button data-same="${p}">${label}</button>`;
  const differ = p => filesAgreeOn(marks, p) ? '' : `the selected files differ in ${SAME_NAMES[p].toLowerCase()}`;
  const fibers = new Set(marks.map(k => realFiber(splitFileKey(k)[1]))).size;
  return '<div class="span-menu-hd">Select</div>'
    + item('pf', 'Select Same Pass/Fail Status',
           flagsOff() ? 'the Settings box did not load, so nothing is graded' : differ('pf'))
    + `<button data-same="fiber" title="${fibers > 1 ? `both directions of the ${fibers} selected fibers`
                                                 : 'both directions of this fiber'}">Select Same Fiber</button>`
    + item('wl', 'Select Same Wavelength', differ('wl'))
    + item('day', 'Select Same Day', differ('day'))
    + `<button data-same="by">Select By…</button>`;
}

// Right-click a file > Direction > A→B / B→A, as in FastReporter.  The check
// marks the file's current direction.  Changing it re-draws the trace as that
// direction: flipped or not, and paired with the other direction's fiber.
//
// Every item acts on the MARKED files when the row under the cursor is one of
// them, and on that row alone otherwise — the rule Rename and Remove already
// followed, now the direction's too.  A folder the drop could not split (one
// set of names, no site in them) lands whole on one side, and re-labelling it
// a fiber at a time is not a job anyone would finish.
function showFileDirMenu(x, y, src, fiber, name) {
  closeSpanMenu();
  const m = document.createElement('div');
  m.id = 'span-menu';
  const k = `${src}-${fiber}`;
  const marks = gSelectedFiles.has(k) ? [...gSelectedFiles] : [k];
  const marked = marks.length > 1 ? marks.length : 0;
  // A tick means EVERY file the click would touch is already that direction;
  // a mixed set has no current direction, so neither side is ticked.
  const allAre = d => marks.every(key => effDir(...splitFileKey(key)) === d);
  // What Save would write: the marked files whose direction was changed.
  const dirty = marks.filter(key => gDirOverride[key]);
  const loaded = gTraces.some(t => t.key === k);   // (a removed file has no row to right-click)
  // Remove This File / Remove This Fiber (Robert 2026-10-01): with the whole
  // span marked, "Remove N Marked Files" was the only Remove, so one file
  // could not come off without first narrowing the chart down to it.
  const fileLabel = `F${fiberLabel(fiber)} ${effDir(src, fiber) === 'a' ? 'A→B' : 'B→A'}`;
  const fiberKeys = fileRowKeys().filter(key => splitFileKey(key)[1] === +fiber);
  m.innerHTML = `<div class="span-menu-hd">Direction${marked ? ` (${marked} Marked)` : ''}</div>`
    + [['a', 'A→B'], ['b', 'B→A']].map(([d, label]) =>
        `<button data-d="${d}">${allAre(d) ? '✓ ' : '\u2003'}${label}</button>`).join('')
    // Like FR's Save: the change above lives in memory until it is written.
    // Writes a COPY into the sibling "<folder> edited", never the original.
    + `<button data-save="1"${dirty.length ? '' : ' disabled style="opacity:.45"'}`
    + ` title="${dirty.length ? `write ${dirty.length === 1 ? 'this file' : dirty.length + ' files'}`
                                + ' as shown into a copy in the sibling &quot;edited&quot; folder'
                              : 'change the direction first'}">`
    + `Save ${dirty.length > 1 ? dirty.length + ' Directions to Edited Copies'
                               : 'Direction to Edited Copy'}…</button>`
    // Every marked file out to one folder, as the Viewer shows it: the
    // direction set above, plus any IOR / backscatter / span picked in the
    // dialog, all in ONE copy per file.  Unchanged files go out as they are.
    + `<button data-export="1" title="write ${marks.length === 1 ? 'this file' : 'the ' + marks.length + ' marked files'}`
    + ` to a folder you choose, with the direction shown here; the originals are never touched">`
    + `Export ${marks.length > 1 ? marks.length + ' Marked Traces' : 'This Trace'}…</button>`
    // Same editor the span menu offers: IOR, names, span — written to a copy.
    + `<button data-edit="1">Trace Settings (IOR, Names)…</button>`
    // Find and replace over the file NAMES, PowerRename-style.  Marked
    // files come along; the dialog says how many before anything moves.
    + `<button data-rename="1">Rename ${marked > 1 ? marked + ' Marked Files' : 'File'}…</button>`
    // Take the file out of the list, off the chart and out of the grid.
    // Says the count first: a marked range removes the whole range.
    + (marked
       ? `<button data-remove-one="1">Remove This File (${fileLabel})</button>`
         + (fiberKeys.length > 1
            ? `<button data-remove-fiber="1">Remove This Fiber (F${fiberLabel(fiber)}, Both Directions)</button>`
            : '')
         + `<button data-remove="1">Remove ${marked} Marked Files from Viewer</button>`
       : `<button data-remove="1">Remove This File (${fileLabel})</button>`)
    + (gRemovedFiles.size
       ? `<button data-putback="1">Put Back ${gRemovedFiles.size} Removed File`
         + `${gRemovedFiles.size === 1 ? '' : 's'}</button>` : '')
    + (gRenameUndo.length
       ? `<button data-undo="1">Undo Rename of ${gRenameUndo[gRenameUndo.length - 1].n} File`
         + `${gRenameUndo[gRenameUndo.length - 1].n === 1 ? '' : 's'}</button>` : '')
    // FR's Select Same tools, on the files this menu acts on.
    + selectSameMenuHtml(marks);
  document.body.appendChild(m);
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - m.offsetHeight - 8)) + 'px';
  m.querySelectorAll('button[data-d]').forEach(b => {
    b.onclick = () => { closeSpanMenu(); setFilesDirection(marks, b.dataset.d); };
  });
  m.querySelectorAll('button[data-same]').forEach(b => {
    b.onclick = () => {
      closeSpanMenu();
      if (b.dataset.same === 'by') showSelectByDialog(k);
      else selectSame([b.dataset.same], k);
    };
  });
  m.querySelector('button[data-edit]').onclick = () => { closeSpanMenu(); showEditDialog(src, fiber); };
  m.querySelector('button[data-export]').onclick = () => { closeSpanMenu(); showExportDialog(marks); };
  m.querySelector('button[data-rename]').onclick = () => { closeSpanMenu(); showRenameDialog(src, fiber, name); };
  const un = m.querySelector('button[data-undo]');
  if (un) un.onclick = () => { closeSpanMenu(); undoLastRename(); };
  const pb = m.querySelector('button[data-putback]');
  if (pb) pb.onclick = () => { closeSpanMenu(); putBackRemovedFiles(); };
  const r1 = m.querySelector('button[data-remove-one]');
  if (r1) r1.onclick = () => { closeSpanMenu(); removeOnly([k], fileLabel); };
  const rf = m.querySelector('button[data-remove-fiber]');
  if (rf) rf.onclick = () => {
    closeSpanMenu();
    removeOnly(fiberKeys, `F${fiberLabel(fiber)} (both directions)`);
  };
  const rm = m.querySelector('button[data-remove]');
  if (rm) rm.onclick = () => {
    closeSpanMenu();
    if (gSelectedFiles.has(k)) removeSelectedFiles(); else removeFile(k, fiber);
  };
  const sv = m.querySelector('button[data-save]');
  sv.onclick = () => { if (dirty.length) { closeSpanMenu(); saveFilesDirection(dirty); } };
  setTimeout(() => document.addEventListener('click', closeSpanMenu, { once: true }), 0);
}

// Write the changed direction of every file in `keys` into a COPY, the way
// FR's Save does.  One call per (side, direction): the endpoint writes one
// direction into one folder's files at a time, and a marked range can hold
// files from both sides, changed to either.
async function saveFilesDirection(keys) {
  const groups = new Map();
  for (const key of keys) {
    const [src, fiber] = splitFileKey(key);
    const dir = effDir(src, fiber);
    const g = `${src}-${dir}`;
    if (!groups.has(g)) groups.set(g, { src, dir, fibers: [] });
    groups.get(g).fibers.push(fiber);
  }
  const one = keys.length === 1 ? `F${fiberLabel(splitFileKey(keys[0])[1])}` : `${keys.length} files`;
  setReadout(`writing ${one}…`);
  const written = [], skipped = [];
  let dest = '';
  try {
    for (const { src, dir, fibers } of groups.values()) {
      const r = await fetch('/api/trace_edit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: src, fibers, new_direction: dir }),
      });
      const j = await r.json();
      if (!r.ok || j.error) { setReadout(`could not save ${one}: ${j.error || r.status}`); return; }
      written.push(...(j.written || []));
      skipped.push(...(j.skipped || []));
      if (j.dest) dest = j.dest;
    }
  } catch (e) {
    setReadout(`could not save ${one}: ${(e && e.message) || e}`);
    return;
  }
  // Say what did NOT get written as well as what did: a copy that already
  // exists is skipped one file at a time, and a count alone would hide it.
  if (!written.length) {
    setReadout(`nothing written: ${(skipped[0] || {}).reason || 'no file could be written'}`);
    return;
  }
  setReadout(`${written.length === 1 ? 'F' + fiberLabel(written[0]) : written.length + ' files'} saved`
    + ` → ${dest} (original${written.length === 1 ? '' : 's'} untouched)`
    + (skipped.length ? ` · ${skipped.length} not written: ${skipped[0].reason}` : ''));
}

// Set the direction of every file in `keys`.  The override is what the tech
// says OVER what the file and its folder say, so it is cleared only when the
// pick matches what this file would read as WITHOUT it -- clearing it against
// the folder alone put a file whose own stamp says B back to B the moment it
// was set to A, and the row and the chart then disagreed.
function setFilesDirection(keys, dir) {
  for (const key of keys) {
    const [src, fiber] = splitFileKey(key);
    if (dir === (gStoredDir[key] || src[0])) delete gDirOverride[key];
    else gDirOverride[key] = dir;
    const t = gTraces.find(x => x.key === key);
    if (t) { t.dir = effDir(src, fiber); t.color = traceColor(t); }
  }
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
  const arrow = dir === 'a' ? 'A→B' : 'B→A';
  setReadout(keys.length === 1
    ? `F${fiberLabel(splitFileKey(keys[0])[1])} set to ${arrow}`
    : `${keys.length} files set to ${arrow}`);
}
document.getElementById('files-list').addEventListener('click', (ev) => onFileClick(ev));
async function onFileClick(ev) {
  if (gFileDragClick) { gFileDragClick = false; return; }   // the end of a drag
  const row = ev.target.closest('.file-row');
  if (!row) return;
  const key = `${row.dataset.dir}-${row.dataset.fiber}`;
  const t = gTraces.find(x => x.key === key);
  if (t && ev.target.closest('.file-vis') && !ev.shiftKey && !(ev.ctrlKey || ev.metaKey)) {
    t.visible = !t.visible;
    renderChips(); draw(); renderEventTable();
    return;
  }
  const s = fileClickSelection(fileRowKeys(), gSelectedFiles, gFileAnchor, key,
                               ev.shiftKey, ev.ctrlKey || ev.metaKey);
  if (!s) return;
  gFileAnchor = s.anchor;
  gFileFocus = s.focus;
  if (!s.want || sameKeys(s.want, gSelectedFiles)) { renderFilesPanel(); return; }
  // The rows a click selects are the MARKED rows the right-click menu acts
  // on, so a shift-clicked range is what Remove removes.
  await selectFiles(s.want);
}

function markFiles(keys) {
  gSelectedFiles.clear();
  for (const k of keys) gSelectedFiles.add(k);
  renderFilesPanel();                   // paint the marks before the load
}

async function applyFileSelection(want) {
  newLoadEpoch();                     // the selection is the chart now: an older load stops
  const epoch = gLoadEpoch;
  const drop = gTraces.filter(x => !want.has(x.key)).map(x => x.key);
  gTraces = gTraces.filter(x => want.has(x.key));
  prunePick();                        // before the load draws a chunk behind it
  drop.forEach(k => COLORS_USED.delete(k));
  const have = new Set(gTraces.map(x => x.key));
  let tasks = [...want].filter(k => !have.has(k)).map(k => {
    const [d, f] = splitFileKey(k);      // 'a2-17' as well as 'a-17'
    return { key: k, f, d };
  });
  // Same two regimes as the Fibers box: a selection past MAX_DETAIL_TRACES
  // goes through the bulk overview instead of being cut off at 48, and so do
  // a few files added to a chart already past it (they were cut off
  // silently, the room left under 48 being none).
  const overview = tasks.length > MAX_DETAIL_TRACES
    || gTraces.length + tasks.length > MAX_DETAIL_TRACES;
  const MAX = overview ? MAX_OVERVIEW_FIBERS * 2 : MAX_DETAIL_TRACES;
  const room = Math.max(0, MAX - gTraces.length);
  const capped = tasks.length > room;
  tasks = tasks.slice(0, room);
  gLoadFailures = [];
  const ld = tasks.length ? beginLoad(tasks) : null;
  try {
    if (overview) {
      await loadOverview(tasks, ld);
    } else {
      for (let i = 0; i < tasks.length; i += 6) {
        const batch = tasks.slice(i, i + 6);
        await Promise.all(batch.map(x => loadOne(x.key, x.f, x.d)));
        loadStep(ld, batch.length);
        if (epoch !== gLoadEpoch) break;
      }
    }
  } finally { if (ld) endLoad(ld); }
  if (epoch !== gLoadEpoch) return;   // cleared or replaced meanwhile
  syncFileMarks();                    // what the cap cut off is not selected
  renderChips();
  if (gAutoFit || drop.length) fit();
  draw();
  await buildTable();
  setReadout(`${gTraces.length} trace${gTraces.length === 1 ? '' : 's'} loaded`
    + (overview ? ` in overview (~${OVERVIEW_PTS} pts each, spikes preserved)` : '')
    + (capped ? `, capped at ${MAX}` : '')
    + loadFailNote());
}

// ─── View math ────────────────────────────────────────────────────────
function dataBounds() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const d = t.data;
    if (!d.dist_km.length) continue;
    const xs = d.dist_km;
    const ys = d.trace_db;
    // skip pre-launch zone
    let i0 = 0;
    while (i0 < xs.length && xs[i0] < -0.2) i0++;
    // trim trailing noise floor past end-of-fiber + small margin
    let i1 = xs.length - 1;
    const endEv = (d.events || []).find(e => e.is_end);
    if (endEv) {
      const limKm = endEv.dist_km + 2.0;
      while (i1 > i0 && xs[i1] > limKm) i1--;
    }
    if (i1 <= i0) continue;
    // walk via display transforms — handles flipped B + Y offset
    for (let i = i0; i <= i1; i++) {
      const dx = dispKm(t, xs[i]);
      const dy = dispDb(t, ys[i]);
      if (dx < x0) x0 = dx;
      if (dx > x1) x1 = dx;
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(x0)) return null;
  const yPad = Math.max(0.5, (y1 - y0) * 0.08);
  const xPad = (x1 - x0) * 0.02;
  return { x0: x0 - xPad, x1: x1 + xPad, y0: y0 - yPad, y1: y1 + yPad };
}

function fit() {
  gAutoFit = true;
  gView = dataBounds();
  draw();
}

// Y-extent of the visible traces within an X (distance) window — for Fit Y.
function dataYBounds(xlo, xhi) {
  let y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const d = t.data;
    if (!d.dist_km.length) continue;
    const xs = d.dist_km, ys = d.trace_db;
    let i0 = 0;
    while (i0 < xs.length && xs[i0] < -0.2) i0++;
    let i1 = xs.length - 1;
    const endEv = (d.events || []).find(e => e.is_end);
    if (endEv) {
      const limKm = endEv.dist_km + 2.0;
      while (i1 > i0 && xs[i1] > limKm) i1--;
    }
    for (let i = i0; i <= i1; i++) {
      const dx = dispKm(t, xs[i]);
      if (dx < xlo || dx > xhi) continue;
      const dy = dispDb(t, ys[i]);
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(y0)) return null;
  const pad = Math.max(0.5, (y1 - y0) * 0.08);
  return { y0: y0 - pad, y1: y1 + pad };
}

// Fit the distance (X) axis to the data, keeping the current dB (Y) zoom.
function fitX() {
  const b = dataBounds();
  if (!b) return;
  if (!gView) { fit(); return; }
  gView = { x0: b.x0, x1: b.x1, y0: gView.y0, y1: gView.y1 };
  gAutoFit = false;
  draw();
}

// Fit the dB (Y) axis to the data in the visible distance window, keeping X.
function fitY() {
  if (!gView) { fit(); return; }
  const yb = dataYBounds(gView.x0, gView.x1);
  if (!yb) return;
  gView = { x0: gView.x0, x1: gView.x1, y0: yb.y0, y1: yb.y1 };
  gAutoFit = false;
  draw();
}

// ─── Chart geometry ───────────────────────────────────────────────────
const M = { l: 56, r: 16, t: 12, b: 36 };
function canvasDpr() { return gExportDpr || window.devicePixelRatio || 1; }
function plotRect() {
  const w = canvas.width  / canvasDpr();
  const h = canvas.height / canvasDpr();
  return { x: M.l, y: M.t, w: w - M.l - M.r, h: h - M.t - M.b };
}
function xToPx(x, r) { return r.x + (x - gView.x0) / (gView.x1 - gView.x0) * r.w; }
function yToPx(y, r) { return r.y + r.h - (y - gView.y0) / (gView.y1 - gView.y0) * r.h; }
function pxToX(px, r) { return gView.x0 + (px - r.x) / r.w * (gView.x1 - gView.x0); }
function pxToY(py, r) { return gView.y0 + (r.y + r.h - py) / r.h * (gView.y1 - gView.y0); }

// ─── Draw ─────────────────────────────────────────────────────────────
// The plot's background: white, or the very light grey of Dark (read off the
// page so the stylesheet stays the one place colours live).
function plotBg() {
  const v = getComputedStyle(document.getElementById('canvas-wrap'))
    .getPropertyValue('--plot-bg').trim();
  return v || '#ffffff';
}

function draw() {
  const w = canvas.width / canvasDpr();
  const h = canvas.height / canvasDpr();
  gBase = null;                          // kept again at the end, if a chart is drawn
  ctx.fillStyle = plotBg();
  ctx.fillRect(0, 0, w, h);

  if (gTraces.length === 0 || !gView) return;

  const r = plotRect();
  gLabelHits = [];
  if (r.w <= 0 || r.h <= 0) return;      // folded away behind the event panel
  chartLabels(r);                        // this frame's empty label pool

  // Grid + axes (their labels take their boxes in the pool first)
  drawGrid(r);

  // Clip traces to plot area
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();

  // A picked trace goes LAST so it lies over the rest, and the rest go
  // translucent so it can be followed across a screen of a hundred.
  const order = gPickKey
    ? [...gTraces].sort((a, b) => isPicked(a.key) - isPicked(b.key))
    : gTraces;
  const dim = t => { ctx.globalAlpha = (gPickKey && !isPicked(t.key)) ? 0.22 : 1; };
  for (const t of order) {
    if (!t.visible) continue;
    dim(t);
    drawTrace(t, r);
  }
  ctx.globalAlpha = 1;
  // Every event's line and number is always drawn, as before the drawer
  // marked the table (Robert 2026-10-01: "unless Display Events is selected
  // we don't show anything in our chart except the vertical lines and the
  // event numbers").  With Show Event Labels on, the mode's table marks its
  // own pairing on the traces it covers instead (see drawPairing): its
  // bands, tags and A / B values; a trace it does not cover -- a fibre
  // loaded one way, one the table left out, or every trace while the table
  // is not in -- keeps its file's own event numbers.  Show Failed Event
  // Labels keeps every trace's lines and numbers and adds the table's marks
  // on the failed events only ("with failed on we still want all the event
  // numbers").
  let covered = null;
  if (gShowEvents && gDrawerMarks.length) covered = drawPairing(gDrawerMarks, r);
  else if (gShowFailedLabels && gDrawerMarks.length) drawPairing(gDrawerMarks, r, true);
  // A picked trace's numbers take their spots before the others'.
  const numOrder = gPickKey
    ? [...order.filter(t => isPicked(t.key)), ...order.filter(t => !isPicked(t.key))]
    : order;
  for (const t of numOrder) {
    if (!t.visible || (covered && covered.has(t))) continue;
    drawEventMarkers(t, r);        // dims itself: its ticks set their own alpha
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Border
  ctx.strokeStyle = '#b0bdcc';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w, r.h);

  // A/B measurement markers (drawn above traces, below crosshair)
  drawMarkers(r);
  updateMarkerReadout();

  keepBase();
  drawOverlay(r);
}

// What only the mouse moves, over the chart: the box-zoom rectangle, the
// crosshair and the hover box.
function drawOverlay(r) {
  // Box-zoom rectangle
  if (gDragging && gDragging.kind === 'box') {
    const x0 = Math.min(gDragging.startPx, gDragging.curPx);
    const x1 = Math.max(gDragging.startPx, gDragging.curPx);
    ctx.fillStyle = 'rgba(74,158,255,0.15)';
    ctx.fillRect(x0, r.y, x1 - x0, r.h);
    ctx.strokeStyle = '#4a9eff';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(x0 + 0.5, r.y + 0.5, x1 - x0, r.h);
    ctx.setLineDash([]);
  }
  // The trace under the cursor is drawn as it was: the hover box names it
  // and nothing else changes (the boss, 2026-10-01: "we dont want the trace
  // to change when we hover over it, just give us the box").
  const hovered = hoverTrace();
  if (gMouse) drawCrosshair(r);
  if (gMouse && hovered) drawHoverBox(hovered);
  if (gMouse && !hovered) drawLabelTip();   // a label left off, over its tick
}

// ─── Mouse moves repaint only the overlay ─────────────────────────────
// draw() paints every trace: with a whole cable on screen (864 traces of
// a 432-fiber span) that is 35-50 ms, and every mouse move paid it, so hovering
// lagged (2026-10-01).  The chart as draw() leaves it, before the overlay,
// is kept here; a mouse move puts it back (a copy, well under a millisecond)
// and draws the overlay on it.  Anything that changes the chart calls draw(),
// which keeps it again; the few things a stale copy would show wrong are
// checked too (baseSig), and a mismatch falls back to draw().
function baseSig() {
  const v = gView || {};
  return [canvas.width, canvas.height, gTraces, gTraces.length,
          gTraces.filter(t => t.visible).length, v.x0, v.x1, v.y0, v.y1,
          gPickKey, gMarkers.a, gMarkers.b,
          document.documentElement.getAttribute('data-theme')];
}
function keepBase() {
  if (gExportDpr) return;              // a Report snapshot, not the screen
  if (!gBaseImg) gBaseImg = document.createElement('canvas');
  if (gBaseImg.width !== canvas.width) gBaseImg.width = canvas.width;
  if (gBaseImg.height !== canvas.height) gBaseImg.height = canvas.height;
  const c = gBaseImg.getContext('2d');
  c.clearRect(0, 0, gBaseImg.width, gBaseImg.height);
  c.drawImage(canvas, 0, 0);
  gBase = { img: gBaseImg, sig: baseSig() };
}
function drawHover() {
  const now = baseSig();
  if (!gBase || gBase.sig.length !== now.length
      || gBase.sig.some((x, i) => x !== now[i])) { draw(); return; }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(gBase.img, 0, 0);
  ctx.restore();
  drawOverlay(plotRect());
}

// ─── A/B measurement markers ──────────────────────────────────────────
function drawMarkerLine(km, r, color, label) {
  if (km == null) return;
  if (km < gView.x0 || km > gView.x1) return;
  const px = Math.round(xToPx(km, r)) + 0.5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, r.y);
  ctx.lineTo(px, r.y + r.h);
  ctx.stroke();
  // Flag at top
  ctx.fillStyle = color;
  ctx.fillRect(px, r.y, 16, 13);
  ctx.fillStyle = '#ffffff';
  ctx.font = "600 10px 'Segoe UI', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, px + 8, r.y + 7);
}

function drawMarkers(r) {
  if (!gMarkers.a && !gMarkers.b) return;
  // Shade the span between A and B
  if (gMarkers.a != null && gMarkers.b != null) {
    const xa = xToPx(gMarkers.a, r), xb = xToPx(gMarkers.b, r);
    ctx.fillStyle = 'rgba(74,158,255,0.07)';
    ctx.fillRect(Math.min(xa, xb), r.y, Math.abs(xb - xa), r.h);
  }
  drawMarkerLine(gMarkers.a, r, '#2ecc71', 'A');
  drawMarkerLine(gMarkers.b, r, '#ff6ec7', 'B');
}

// dB value of a trace at a given DISPLAY km (raw trace dB, offset removed).
function traceDbAtDispKm(t, dispKmVal) {
  const dataKm = dataKmFromDisp(t, dispKmVal);
  const xs = t.data.dist_km;
  if (dataKm < xs[0] || dataKm > xs[xs.length - 1]) return null;
  const idx = Math.min(lowerBound(xs, dataKm), t.data.trace_db.length - 1);
  const v = t.data.trace_db[idx];
  return v === undefined ? null : v;
}

// How many traces the marker box names before it counts the rest.
const MARKER_MAX_ROWS = 8;

// At most `max` of a readout's rows: the picked trace (a Min/Max cell click)
// first, then the rest in load order.  Up to `max` rows come back untouched,
// so a small load reads as it always did.
function capReadoutRows(rows, pickKey, max) {
  if (rows.length <= max) return { shown: rows, more: 0 };
  const order = rows.map((row, i) => ({ row, i })).sort((x, y) =>
    ((y.row.t.key === pickKey) - (x.row.t.key === pickKey)) || (x.i - y.i));
  return { shown: order.slice(0, max).map(o => o.row), more: rows.length - max };
}

function updateMarkerReadout() {
  const box = document.getElementById('marker-readout');
  if (!gMarkerMode && gMarkers.a == null && gMarkers.b == null) {
    box.style.display = 'none';
    if (typeof placeReadout === 'function') placeReadout();   // the status keeps clear
    return;
  }
  box.style.display = 'block';
  const a = gMarkers.a, b = gMarkers.b;
  // One distance in the chosen unit; km keeps the "km (ft)" pair.
  const dist = v => (gDistUnit === 'km'
    ? `${v.toFixed(4)} km (${Math.round(v * 3280.84).toLocaleString()} ft)`
    : fmtDist(v));
  // A and B read from the axis zero (A's first event).  The gap between them
  // is a length, so it is never shifted.
  const z = axisZeroKm();
  const at = v => (v == null ? '---' : dist(v - z));
  let html = `<div><span class="mr-a">A</span>: ${at(a)}` +
             ` &nbsp; <span class="mr-b">B</span>: ${at(b)}</div>`;

  // The trace rows, at most `maxRows` of them (see the fit below).
  let traceTable = () => '';
  if (a != null && b != null) {
    const dkm = Math.abs(b - a);
    html += `<div>Δ: <b>${dist(dkm)}</b></div>`;
    const vis = gTraces.filter(t => t.visible);
    if (vis.length) traceTable = (maxRows) => {
      let html = '';
      // 240 traces made 240 rows, down over the event table: the picked
      // trace (a Min/Max cell click) and the first few, then a count.
      const cap = capReadoutRows(vis.map(t => ({ t })), gPickKey, maxRows);
      html += '<table><thead><tr><th>Trace</th><th>dB@A</th><th>dB@B</th><th>Δ Loss</th><th>dB/km</th></tr></thead><tbody>';
      for (const { t } of cap.shown) {
        const va = traceDbAtDispKm(t, a);
        const vb = traceDbAtDispKm(t, b);
        let dloss = '---', slope = '---';
        if (va != null && vb != null) {
          // Signal descends with loss; loss over the span (upstream→downstream).
          // A mirrored B runs right to left on the chart, so its upstream end
          // is the RIGHT marker: read left to right it printed every B loss
          // negative beside A's (0.2 dB/km fibre, 10 km: A 2.000, B -2.000),
          // and the same B alone, drawn as shot, positive.
          const lo = Math.min(a, b), hi = Math.max(a, b);
          const vlo = traceDbAtDispKm(t, lo), vhi = traceDbAtDispKm(t, hi);
          const d = (vlo != null && vhi != null)
            ? (isFlipped(t) ? vhi - vlo : vlo - vhi) : null;
          if (d != null) {
            dloss = d.toFixed(3);
            slope = dkm > 1e-6 ? (d / dkm).toFixed(3) : '---';
          }
        }
        const arrow = t.dir === 'a' ? 'A→B' : 'B→A';
        html += `<tr><td><span style="color:${t.color};text-shadow:0 0 1px #333">■</span> F${fiberLabel(t.fiber)} ${arrow}${(t.src && t.src.length > 1 ? srcTag(t.src) : '')}</td>` +
                `<td>${va == null ? '---' : va.toFixed(3)}</td>` +
                `<td>${vb == null ? '---' : vb.toFixed(3)}</td>` +
                `<td>${dloss}</td><td>${slope}</td></tr>`;
      }
      if (cap.more) html += `<tr><td colspan="5" class="hint">+${cap.more} more traces</td></tr>`;
      html += '</tbody></table>';
      return html;
    };
  } else if (gMarkerMode) {
    html += `<div class="hint">click to place ${a == null ? 'A' : 'B'}</div>`;
  }
  // As many trace rows as the chart has room for (window-size audit
  // 2026-10-01): on a short chart eight rows ran past the box's bottom
  // edge, the last one cut in half, and the "+N more" line never showed.
  let rows = MARKER_MAX_ROWS;
  box.innerHTML = html + traceTable(rows);
  while (rows > 1 && box.scrollHeight > box.clientHeight + 1) {
    rows--;
    box.innerHTML = html + traceTable(rows);
  }
  if (typeof placeMarkerReadout === 'function') placeMarkerReadout(box);
  if (typeof placeReadout === 'function') placeReadout();   // the status keeps clear
}

// The readout holds the chart's top right corner, and sat over marker B
// whenever B was there (window-size audit 2026-10-01).  A marker under it
// sends it to the top left corner, unless a marker is under that one too.
function placeMarkerReadout(box) {
  box.style.left = box.style.right = '';
  const r = plotRect();
  const xs = [gMarkers.a, gMarkers.b].filter(v => v != null).map(v => xToPx(v, r));
  const w = box.offsetWidth, right = box.offsetLeft;
  const under = (x0) => xs.some(x => x >= x0 - 4 && x <= x0 + w + 4);
  if (under(right) && !under(r.x + 6)) {
    box.style.left = (r.x + 6) + 'px';
    box.style.right = 'auto';
  }
}

const X_LABEL_GAP_PX = 12;         // clear space between two distance labels
const Y_LABEL_GAP_PX = 2;          // and between two dB labels (11 px tall)
function drawGrid(r) {
  ctx.fillStyle = '#000000';
  ctx.font = "11px 'Segoe UI', sans-serif";

  // X ticks
  // Round ticks in the chosen unit, counted from the axis zero (A's first
  // event); xToPx still takes raw km.
  const z = axisZeroKm();
  const uf = distU().f;
  const xDigits = gDistUnit === 'ft' || gDistUnit === 'm' ? 0 : 2;
  const xLabel = x => fmtDist(x - z, xDigits);
  // As many labels as fit: never so many that two run together, at any width
  // (Robert 2026-10-01).  Ask for ten, and ask for fewer until the space
  // between two labels' centres clears the widest label plus a gap.
  let xTicks = [];
  for (let want = 10; want >= 1; want--) {
    xTicks = niceTicks((gView.x0 - z) * uf, (gView.x1 - z) * uf, want).map(v => v / uf + z);
    if (xTicks.length < 2) break;
    const gapPx = Math.abs(xToPx(xTicks[1], r) - xToPx(xTicks[0], r));
    const widest = Math.max(...xTicks.map(x => ctx.measureText(xLabel(x)).width));
    if (gapPx >= widest + X_LABEL_GAP_PX) break;
  }
  ctx.strokeStyle = '#e6edf4';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const x of xTicks) {
    const px = Math.round(xToPx(x, r)) + 0.5;
    ctx.moveTo(px, r.y);
    ctx.lineTo(px, r.y + r.h);
  }
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  // A plot too narrow for even two labels: a label that would touch the one
  // before it is left out, so none ever run together.  Each axis label drawn
  // takes its box in the chart's label pool first (chartLabels), so no label
  // on the chart is ever placed on one.
  const labels = chartLabels(r);
  let lastRight = -Infinity;
  for (const x of xTicks) {
    const txt = xLabel(x), w = ctx.measureText(txt).width, cx = xToPx(x, r);
    if (cx - w / 2 < lastRight + X_LABEL_GAP_PX) continue;
    ctx.fillText(txt, cx, r.y + r.h + 6);
    lastRight = cx + w / 2;
    labels.take({ x0: cx - w / 2, x1: cx + w / 2, y0: r.y + r.h + 6, y1: r.y + r.h + 6 + 11 });
  }

  // Y ticks
  const yTicks = niceTicks(gView.y0, gView.y1, 8);
  ctx.beginPath();
  for (const y of yTicks) {
    const py = Math.round(yToPx(y, r)) + 0.5;
    ctx.moveTo(r.x, py);
    ctx.lineTo(r.x + r.w, py);
  }
  ctx.stroke();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  // A plot too short for every one: a label that would touch the one below
  // it is left out, as on the distance axis.
  let lastTop = Infinity;
  for (const y of yTicks) {
    const txt = y.toFixed(1), w = ctx.measureText(txt).width, cy = yToPx(y, r);
    if (cy + 5.5 + Y_LABEL_GAP_PX > lastTop) continue;
    ctx.fillText(txt, r.x - 6, cy);
    lastTop = cy - 5.5;
    labels.take({ x0: r.x - 6 - w, x1: r.x - 6, y0: cy - 5.5, y1: cy + 5.5 });
  }

  // Axis labels.  The y title is centred on the plot and was cut off at
  // the canvas edges on a short chart (window-size audit 2026-10-01: under
  // ~200 px, 800 x 600 and the hub's narrow frames); the longest wording
  // that fits is drawn.
  ctx.save();
  ctx.translate(14, r.y + r.h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000000';
  const yRoom = 2 * Math.min(r.y + r.h / 2, canvas.clientHeight - (r.y + r.h / 2)) - 4;
  const yTitle = ['signal (dB, descending = loss)', 'signal (dB)', 'dB']
    .find(t => ctx.measureText(t).width <= yRoom) || 'dB';
  ctx.fillText(yTitle, 0, 0);
  ctx.restore();
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.fillText('distance (' + distU().label + ')', r.x + r.w / 2, r.y + r.h + 22);
}

function niceTicks(lo, hi, n) {
  const span = hi - lo;
  if (span <= 0) return [lo];
  const step0 = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  let step;
  if (norm < 1.5) step = 1 * mag;
  else if (norm < 3) step = 2 * mag;
  else if (norm < 7) step = 5 * mag;
  else step = 10 * mag;
  const start = Math.ceil(lo / step) * step;
  const out = [];
  for (let v = start; v <= hi + step*1e-6; v += step) out.push(v);
  return out;
}

function drawTrace(t, r, bold = false) {
  const xs = t.data.dist_km, ys = t.data.trace_db;
  const n = xs.length;
  if (n === 0) return;
  ctx.strokeStyle = t.color;
  const lw = (bold || isPicked(t.key)) ? 2.6 : 1.2;   // picked: bold
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Visible-window data range — invert for flipped (B-stacked) traces
  let dataLo, dataHi;
  if (isFlipped(t)) {
    // Same inversion dataKmFromDisp does — routed through it so the slice
    // can never drift out of step with the transform that draws the points.
    dataLo = dataKmFromDisp(t, gView.x1);
    dataHi = dataKmFromDisp(t, gView.x0);
  } else {
    dataLo = gView.x0;
    dataHi = gView.x1;
  }
  let i0 = lowerBound(xs, dataLo);
  let i1 = upperBound(xs, dataHi);
  i0 = Math.max(0, i0 - 1);
  i1 = Math.min(n - 1, i1 + 1);

  // Decimate when zoomed out: at most 2 samples per pixel
  const samplesPerPx = Math.max(1, (i1 - i0) / r.w);
  const stride = Math.max(1, Math.floor(samplesPerPx / 2));

  ctx.beginPath();
  let started = false;
  for (let i = i0; i <= i1; i += stride) {
    const px = xToPx(dispKm(t, xs[i]), r);
    const py = yToPx(dispDb(t, ys[i]), r);
    if (!started) { ctx.moveTo(px, py); started = true; }
    else ctx.lineTo(px, py);
  }
  if ((i1 - i0) % stride !== 0) {
    ctx.lineTo(xToPx(dispKm(t, xs[i1]), r), yToPx(dispDb(t, ys[i1]), r));
  }
  const edge = LIGHT_EDGE[t.color];
  if (edge) {
    ctx.strokeStyle = edge;
    ctx.lineWidth = lw + 1.8;
    ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = lw;
  }
  ctx.stroke();
}

function lowerBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] < v) lo = mid + 1; else hi = mid;
  }
  return lo;
}
function upperBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] <= v) lo = mid + 1; else hi = mid;
  }
  return lo;
}

// The chart marks the table's columns and nothing else (Robert 2026-09-30:
// "closures only in both modes").  Each grid records, per trace, the raw km
// of every event it printed -- the closures and the two ends in OTDR Suite
// mode, FastReporter's rows in FR mode -- keyed the way `data-km` is, so a
// marker and its cell are the same reading.  A trace's other stored events
// (the per-file KeyEvents a whole cable of them turned into thousands of
// numbers) are not drawn.  A table being re-read keeps the last one's marks
// until it paints -- the FastReporter table of a whole cable takes a while,
// and every setting change re-reads it.  A trace no table has taken yet (or
// none can be built for) draws every event, as before, rather than none.
function tableKmKey(km) { return Math.round(Number(km) * 1e4); }
function tableMarkReset(traces) {
  gTableKm = new Map();
  for (const t of traces) gTableKm.set(t, new Set());
}
function tableMark(t, km) {
  if (!t || km == null || !Number.isFinite(Number(km))) return;
  let s = gTableKm.get(t);
  if (!s) gTableKm.set(t, s = new Set());
  s.add(tableKmKey(km));
}
function inTable(t, e) {
  const s = gTableKm && gTableKm.get(t);
  return !s || s.has(tableKmKey(e.dist_km));
}

// ─── Labels on the chart never run together ───────────────────────────
// Every label the chart prints takes its box from one pool per frame, in
// this order: the axis labels (drawGrid), the drawer's tags, the drawer's
// values ("A 0.175"), then the files' own event numbers (a picked trace's
// first).  A label goes at the first of its candidate spots that lies inside
// the plot and keeps GAP (2 px) from every box already taken; with
// no such spot it is left off, its tick stays, and its hit record keeps the
// text (hiddenText, hiddenColor) for the hover tip (drawLabelTip).  The pool
// belongs to the frame's gLabelHits: draw() makes a new array each frame,
// so the first call of a frame starts an empty pool.  Boxes are kept in
// x buckets so a whole cable's numbers stay cheap to redraw.
function chartLabels(r) {
  const cur = chartLabels.frame;
  if (cur && cur.hits === gLabelHits) return cur;
  const GAP = 2, B = 32, cols = new Map();
  const free = b => {
    for (let k = Math.floor((b.x0 - GAP) / B), k1 = Math.floor((b.x1 + GAP) / B); k <= k1; k++) {
      const list = cols.get(k);
      if (list && list.some(o => b.x0 < o.x1 + GAP && b.x1 + GAP > o.x0
                              && b.y0 < o.y1 + GAP && b.y1 + GAP > o.y0)) return false;
    }
    return true;
  };
  const take = b => {
    for (let k = Math.floor(b.x0 / B), k1 = Math.floor(b.x1 / B); k <= k1; k++) {
      if (!cols.has(k)) cols.set(k, []);
      cols.get(k).push(b);
    }
  };
  const clearOf = b => b.x0 >= r.x && b.x1 <= r.x + r.w && b.y0 >= r.y && b.y1 <= r.y + r.h
    && free(b);
  // The first clear spot of `spots` ({box, ...}, in order of preference) is
  // taken and returned; none clear: null.
  const place = spots => {
    for (const s of spots) if (clearOf(s.box)) { take(s.box); return s; }
    return null;
  };
  return (chartLabels.frame = { hits: gLabelHits, free, take, clearOf, place });
}

// An event number's candidate spots round its tick at (px, py): above it
// (where it always sat), below it, then the corners above and below on the
// right and the left; then the same six one line further out.
const EVENT_NUM_H = 10;            // the numbers' 10 px font
function eventNumberSpots(px, py, tw) {
  const out = [];
  for (const off of [0, EVENT_NUM_H + 2]) {
    for (const [align, up] of [['center', true], ['center', false], ['left', true],
                               ['right', true], ['left', false], ['right', false]]) {
      const tx = align === 'left' ? px + 3 : align === 'right' ? px - 3 : px;
      const ty = up ? py - 11 - off : py + 11 + off;
      const x0 = align === 'left' ? tx : align === 'right' ? tx - tw : tx - tw / 2;
      const y0 = up ? ty - EVENT_NUM_H : ty;
      out.push({ align, base: up ? 'bottom' : 'top', tx, ty,
                 box: { x0, x1: x0 + tw, y0, y1: y0 + EVENT_NUM_H } });
    }
  }
  return out;
}

// The text of a label left off for want of room, in a small box beside the
// cursor while it is over that label's tick.  The tick's click still goes to
// its cell.
function drawLabelTip() {
  if (gMarkerMode || gDragging) return;
  const h = labelHit(gMouse.px, gMouse.py);
  if (!h || !h.hiddenText) return;
  ctx.font = "600 11px 'Segoe UI', sans-serif";
  const PAD = 5, BH = 18, OFF = 12;
  const bw = ctx.measureText(h.hiddenText).width + PAD * 2;
  const cw = canvas.width / canvasDpr();
  let bx = gMouse.px + OFF, by = gMouse.py - OFF - BH;
  if (bx + bw > cw - 2) bx = gMouse.px - OFF - bw;
  bx = Math.max(2, bx); by = Math.max(2, by);
  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  ctx.fillRect(bx, by, bw, BH);
  ctx.strokeStyle = '#93a6ba';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, BH - 1);
  ctx.fillStyle = h.hiddenColor || '#1d2733';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(h.hiddenText, bx + PAD, by + BH / 2 + 0.5);
}

function drawEventMarkers(t, r) {
  const evs = t.data.events || [];
  // Marker labels carry the same numbers as the table's columns: counted from
  // the declared span start when there is one.  An event outside the span
  // keeps its tick, dimmed and unnumbered, so the reel is still visible.
  const nums = spanEventNumbers(t);
  // A picked trace dims everything else, its markers and numbers included —
  // they set their own alpha below, so the dimming has to be folded in here
  // rather than left to the caller.  The tick width is stated rather than
  // inherited, so a bold trace drawn just before does not fatten it.
  const dimA = (gPickKey && !isPicked(t.key)) ? 0.22 : 1;
  ctx.lineWidth = 1.2;
  ctx.font = "10px 'Segoe UI', sans-serif";
  // The numbers are click targets: each one's box is kept for the mouse
  // handlers, which take the tech to that event's cell in the table below.
  const LABEL_PAD = 3;
  const labels = chartLabels(r);
  for (const e of evs) {
    const dx = dispKm(t, e.dist_km);
    if (dx < gView.x0 || dx > gView.x1) continue;
    const px = xToPx(dx, r);
    const dataIdx = lowerBound(t.data.dist_km, e.dist_km);
    const rawY = t.data.trace_db[Math.min(dataIdx, t.data.trace_db.length - 1)] ?? 0;
    const py = yToPx(dispDb(t, rawY), r);
    const n = nums.get(e);
    // In the span, only what the table printed (see tableMark).  Outside it
    // the dim unnumbered tick stays: it is how the tech puts the span start
    // back on the port or the reel.
    if (n != null && !inTable(t, e)) continue;
    ctx.strokeStyle = e.is_reflective ? '#b8860b' : t.color;
    ctx.globalAlpha = (n == null ? 0.35 : 0.55) * dimA;
    ctx.beginPath();
    ctx.moveTo(px, py - 10);
    ctx.lineTo(px, py + 10);
    ctx.stroke();
    ctx.globalAlpha = dimA;
    if (n == null) {
      // Outside the declared span the event keeps its tick but loses its
      // number.  The tick is still a target, so the tech can right-click the
      // port or reel event and put the span start back on it.
      gLabelHits.push({ x0: px - 4, x1: px + 4, y0: py - 10, y1: py + 10, t, e });
      continue;
    }
    // The number takes the first clear spot round its tick (above it, where
    // it always sat, when there is room).  None clear: it is left off and
    // the tick keeps it for the hover tip.
    const txt = String(n);
    const tw = ctx.measureText(String(n)).width;
    const color = LIGHT_EDGE[t.color] || t.color;
    const spot = labels.place(eventNumberSpots(px, py, tw));
    if (!spot) {
      gLabelHits.push({ x0: px - 4, x1: px + 4, y0: py - 10, y1: py + 10, t, e,
                        hiddenText: txt, hiddenColor: color });
      continue;
    }
    ctx.fillStyle = color;
    ctx.textAlign = spot.align;
    ctx.textBaseline = spot.base;
    ctx.fillText(txt, spot.tx, spot.ty);
    const b = spot.box;
    gLabelHits.push({ x0: b.x0 - LABEL_PAD, x1: b.x1 + LABEL_PAD,
                      y0: b.y0 - LABEL_PAD, y1: b.y1 + LABEL_PAD, t, e });
  }
  ctx.globalAlpha = 1;
}
// ─── The drawer follows the analysis mode ─────────────────────────────
// Robert, 2026-09-30: "we need to have suite and FR mode in Viewer for drawer
// and event panel".  The event panel prints one mode's table; the drawer
// marks the SAME table's pairing on the traces, so a splice that OTDR Suite
// reads as one event and FastReporter splits in two looks that way above the
// panel too.  Per column of the panel: a tick on each direction's reading the
// table used, a band joining the A and B readings of the same event, and a
// tag with the column's name and Average, colored by the panel's own verdict
// on that cell (red fail, yellow warning, blue otherwise).  A leg the table
// filled in itself -- the Splice Report's gray leg, FastReporter's
// transplanted one -- is a hollow gray ring, never a tick: it is not a
// reading.  The panel's tables build `gDrawerMarks` from the cells they
// print (nothing here judges a number), and it is empty while the mode's
// table is not in: the drawer then draws each file's own events, as before.
//
// One direction is not a fallback (Robert, 2026-09-30: "it has to work for
// one direction OR bidi, equally").  An A-only or B-only load gets the
// single-direction table, and a fibre loaded one way among paired ones gets
// its own single-direction table under the A+B one; either way the drawer
// marks that table's columns with its verdicts, a tick and a tag per event.
//
// Many fibres.  A tag per fibre per column is unreadable past a handful (a
// ribbon is 12 tags stacked on every splice) and a label per leg is worse,
// so past DRAWER_DETAIL_MAX fibres each column gets ONE tag -- its worst
// Average and how many fibres fail -- and one band over where its fibres'
// readings sit.  The ticks stay (unlabeled) while they can still be told
// apart; past DRAWER_TICK_MAX fibres only the fibres whose Average fails
// there keep theirs -- the ones the tag counts, what the tech is hunting --
// which also keeps a whole cable cheap to redraw.  A picked
// trace (click its row) gets the full per-fibre marks on top of the summary.
//
// Show Failed Event Labels marks only what fails (Robert 2026-10-01: "Show
// Event Labels is all and Failed is only failed"; "with failed on we still
// want all the event numbers").  Every event keeps its file's line and
// number (see draw); the drawer adds its band, ticks, values and tag on the
// failed cells only, and a column none of whose fibres fails gets nothing.
const DRAWER_DETAIL_MAX = 3;       // fibres drawn in full, labels and all
const DRAWER_TICK_MAX = 24;        // fibres whose every leg keeps a tick
const DRAWER_LANES = 3;            // rows of tags before a tag shortens
const DRAWER_COLOR = { fail: '#e74c3c', warn: '#ffeb00', pass: '#2f6fb3', gray: '#8a97a6' };
let gDrawerMarks = [];             // [{mode, single, have, cols, goCell}], one per table shown

// Whether a cell fails, for Show Failed Event Labels: its Average fails (a
// one-direction table's own loss).  One direction over the gate on its own
// does not count: on a cable nearly every splice has a fibre like that, so
// every event would keep its label.  The tags' FAIL counts the same way.
function drawerCellFailed(cell) {
  return !!cell.avgFail;
}

// One column's summary over its fibres' cells: how many, how many fail or
// warn on the Average, the worst Average and which fibre holds it (a failing
// fibre before a passing one, then the highest loss).
function drawerColumnSummary(col) {
  const out = { n: 0, nFail: 0, nWarn: 0, worst: null, worstFi: -1 };
  let rank = -1;
  for (const cell of col.cells) {
    out.n++;
    if (cell.avgFail) out.nFail++;
