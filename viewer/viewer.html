}

// The rule as the inputs read it.  Throws on a regex the tech is still
// typing, which the caller turns into the red line under the list.
function renameRule() {
  const d = document.getElementById('rn-dlg');
  const find = d.querySelector('#rn-find').value;
  const rep = d.querySelector('#rn-rep').value;
  const useRe = d.querySelector('#rn-regex').checked;
  let flags = d.querySelector('#rn-all').checked ? 'g' : '';
  if (!d.querySelector('#rn-case').checked) flags += 'i';
  return {
    find,
    re: find ? new RegExp(useRe ? find : find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags) : null,
    // With the regex box off, "$" is the tech's own character, not a group
    // reference: String.replace would otherwise eat "$1" out of a literal.
    rep: useRe ? rep : rep.replace(/\$/g, '$$$$'),
    part: d.querySelector('input[name=rn-part]:checked').value,
    // Text added to every name in scope, after any find and replace: at the
    // very start, or at the end of the name just before the extension.
    add: d.querySelector('#rn-add').value,
    at: d.querySelector('input[name=rn-at]:checked').value,
  };
}

// The part of the name the rule reads: whole name, stem, or extension
// (null when "extension only" and the name has none).
function renamePart(name, part) {
  const dot = name.lastIndexOf('.');
  if (part === 'name') return dot > 0 ? name.slice(0, dot) : name;
  if (part === 'ext') return dot > 0 ? name.slice(dot + 1) : null;
  return name;
}

// Does the Search box find anything in this name?  Decided on its own, not
// by "the new name differs": replacing ABC with ABC still matches ABC.
function renameMatches(name, rule) {
  if (!rule.re) return true;
  const s = renamePart(name, rule.part);
  if (s == null) return false;
  rule.re.lastIndex = 0;                 // a 'g' regex remembers where it stopped
  const hit = rule.re.test(s);
  rule.re.lastIndex = 0;
  return hit;
}

function renameNewName(name, rule) {
  let out = name;
  if (rule.re) {
    const dot = name.lastIndexOf('.');
    const hasExt = dot > 0;
    const stem = hasExt ? name.slice(0, dot) : name;
    const ext = hasExt ? name.slice(dot + 1) : '';
    if (rule.part === 'name') out = stem.replace(rule.re, rule.rep) + (hasExt ? '.' + ext : '');
    else if (rule.part === 'ext') out = hasExt ? stem + '.' + ext.replace(rule.re, rule.rep) : name;
    else out = name.replace(rule.re, rule.rep);
  }
  return renameAddText(out, rule.add, rule.at);
}

// "Add text": at the start of the name, or at the end of the name just in
// front of the extension (MyFile.sor + "_B" -> MyFile_B.sor).
function renameAddText(name, add, at) {
  if (!add) return name;
  if (at === 'start') return add + name;
  const dot = name.lastIndexOf('.');
  return dot > 0 ? name.slice(0, dot) + add + name.slice(dot) : name + add;
}

// Recompute every row: the new name, then why it could not be used.
function renamePreview() {
  const d = document.getElementById('rn-dlg');
  if (!d) return;
  const err = d.querySelector('#rn-err');
  const go = d.querySelector('#rn-go');
  let rule;
  try {
    rule = renameRule();
  } catch (e) {
    // Half a regex, mid-keystroke.  The list below still shows the names the
    // LAST good rule produced, and those are not what would be written, so
    // it is greyed out until the rule parses again — the preview is the
    // contract, and a preview that is not live must not look live.
    err.textContent = 'that is not a valid regular expression yet: ' + ((e && e.message) || e);
    d.querySelector('#rn-list').classList.add('rn-stale');
    go.disabled = true;
    return;
  }
  d.querySelector('#rn-list').classList.remove('rn-stale');
  err.textContent = '';
  // Every name on disk in each direction, the removed ones included: a file
  // taken out of the FILES list is still sitting in the folder and its name
  // is still taken.  (Only the files list_fibers returns are known here; a
  // stray report or cache is invisible to the preview, and the server's own
  // collision check catches it and says so in the result.)
  const onDisk = {};
  for (const dir of allSrcs()) {
    onDisk[dir] = new Set(((gInfo && gInfo['files_' + dir]) || [])
      .map(n => String(n).toLowerCase()));
  }
  // Per source, made as a row of it comes up ('a', 'b', 'a2').
  const perSrc = (m, make) => d => (m[d] = m[d] || make());
  const moving = {}, claimed = {};
  const movingOf = perSrc(moving, () => new Set()), claimedOf = perSrc(claimed, () => new Map());
  const onDiskOf = perSrc(onDisk, () => new Set());
  for (const r of gRenameRows) {
    r.matched = renameMatches(r.name, rule);
    r.newName = r.matched ? renameNewName(r.name, rule) : r.name;
    if (r.cb.checked && r.newName !== r.name) movingOf(r.dir).add(r.name.toLowerCase());
  }
  let nGo = 0, nBad = 0, nSame = 0, nRenum = 0, nShown = 0;
  for (const r of gRenameRows) {
    r.el.classList.remove('rn-same', 'rn-bad', 'rn-warn', 'rn-nomatch');
    r.problem = null;
    let note = '';
    // Search typed and this name does not contain it: off the list, and
    // never renamed (its newName is its own name).
    if (!r.matched) { r.el.classList.add('rn-nomatch'); continue; }
    nShown++;
    if (!r.cb.checked || r.newName === r.name) {
      r.el.classList.add('rn-same');
      r.out.textContent = r.cb.checked ? 'no change' : 'not ticked';
      r.out.title = '';
      nSame++;
      continue;
    }
    const key = r.newName.toLowerCase();
    r.problem = nameProblem(r.newName);
    if (!r.problem && claimedOf(r.dir).has(key)) {
      r.problem = 'two files would be named ' + r.newName;
    } else if (!r.problem && onDiskOf(r.dir).has(key) && !movingOf(r.dir).has(key)) {
      r.problem = r.newName + ' is already in that folder';
    }
    if (r.problem) {
      r.el.classList.add('rn-bad');
      nBad++;
    } else {
      claimedOf(r.dir).set(key, r);
      const was = fiberNumOf(r.name), now = fiberNumOf(r.newName);
      if (was !== now) {
        // The number the whole suite keys fibers on is moving.  Not refused
        // — renumbering a cable is a real job — but never silent.
        r.el.classList.add('rn-warn');
        note = now == null ? '  ⚠ no fiber number in this name'
                           : `  ⚠ fiber ${was == null ? '?' : was} → ${now}`;
        nRenum++;
      }
      nGo++;
    }
    r.out.textContent = r.newName + (r.problem ? '  ⚠ ' + r.problem : note);
    r.out.title = r.out.textContent;
  }
  const none = d.querySelector('#rn-none');
  if (none) {
    none.hidden = nShown > 0;
    none.textContent = `no file names match "${rule.find}"`;
  }
  const bits = [`${nGo} file${nGo === 1 ? '' : 's'} will be renamed`];
  if (rule.re) bits.push(`${nShown} of ${gRenameRows.length} match`);
  if (nSame) bits.push(`${nSame} unchanged`);
  if (nRenum) bits.push(`${nRenum} change the fiber number`);
  if (nBad) bits.push(`${nBad} cannot be renamed and will be left alone`);
  d.querySelector('#rn-count').textContent = bits.join(' · ');
  go.textContent = nGo ? `Rename ${nGo} file${nGo === 1 ? '' : 's'}` : 'Rename';
  go.disabled = !nGo;
}

async function submitRename() {
  const d = document.getElementById('rn-dlg');
  const byDir = {};
  let renumbered = false;
  for (const r of gRenameRows) {
    if (!r.cb.checked || r.problem || r.newName === r.name) continue;
    (byDir[r.dir] = byDir[r.dir] || []).push({ from: r.name, to: r.newName });
    if (fiberNumOf(r.name) !== fiberNumOf(r.newName)) renumbered = true;
  }
  const batches = Object.keys(byDir).map(dir => ({ dir, pairs: byDir[dir] }));
  if (!batches.length) { d.querySelector('#rn-err').textContent = 'nothing to rename'; return; }
  d.querySelector('#rn-go').disabled = true;
  d.querySelector('#rn-cancel').disabled = true;
  const res = await applyRenameBatches(batches, renumbered);
  if (res.error) {
    d.querySelector('#rn-err').textContent = res.error;
    d.querySelector('#rn-go').disabled = false;
    d.querySelector('#rn-cancel').disabled = false;
    return;
  }
  if (res.undo.length) gRenameUndo.push({ n: res.renamed, batches: res.undo });
  showRenameResult(res);
}

// The one place that talks to /api/rename, for both the rename and its undo.
// `batches` is [{dir, pairs:[{from,to}]}]; the reply's `renamed` list is what
// actually moved, so the inverse of THAT is what Undo replays — never the
// inverse of what was asked for.
async function applyRenameBatches(batches, renumbered) {
  const out = { renamed: 0, skipped: [], folders: [], undo: [], dirs: [], error: null };
  for (const b of batches) {
    let j;
    try {
      const send = () => fetch('/api/rename', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: b.dir, pairs: b.pairs }),
      });
      let r = await send();
      j = await r.json();
      // Dropped files are the Viewer's copies: ask once where the originals
      // are, so the job folder is what gets renamed, then send it again.
      if (j.needs_originals) {
        const why = await locateOriginals(b.dir);
        if (why) { out.error = why; break; }
        r = await send();
        j = await r.json();
      }
      if (!r.ok || j.error) { out.error = j.error || ('server said ' + r.status); break; }
    } catch (e) {
      out.error = (e && e.message) || String(e);
      break;
    }
    const done = j.renamed || [];
    out.renamed += done.length;
    out.skipped.push(...(j.skipped || []));
    if (j.folder) out.folders.push(j.folder);
    if (done.length) {
      out.dirs.push(b.dir);
      out.undo.push({ dir: b.dir, pairs: done.map(p => ({ from: p.to, to: p.from })) });
    }
  }
  if (out.renamed) await afterRename(out.dirs, renumbered);
  return out;
}

// Ask the server to open the folder picker for where a dropped side came
// from.  Returns null when that folder is accepted, else what to tell the tech.
async function locateOriginals(dir) {
  const side = dir.toUpperCase();
  // The server looks for the folder first and opens the picker only when it
  // cannot tell (none found, or two copies).
  setReadout(`these ${side} files were dropped in: looking for the folder they came from`);
  let j;
  try {
    const r = await fetch('/api/locate_originals', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir }),
    });
    j = await r.json();
  } catch (e) {
    return (e && e.message) || String(e);
  }
  if (j.error) return j.error;
  if (j.cancelled) return `Nothing renamed. These ${side} files were dropped in, so the Viewer only has copies; `
    + 'pick the folder they came from to rename the real files.';
  if (!j.ok) {
    const bits = [];
    if (j.n_missing) bits.push(`${j.n_missing} of the dropped files are not in it (${j.missing.slice(0, 3).join(', ')}${j.n_missing > 3 ? ', …' : ''})`);
    if (j.n_different) bits.push(`${j.n_different} have the same name but are different traces (${j.different.slice(0, 3).join(', ')}${j.n_different > 3 ? ', …' : ''})`);
    return `Nothing renamed. ${j.folder} is not where these ${side} files came from: ${bits.join('; ')}.`;
  }
  if (j.found) setReadout(`renaming the ${side} files in ${j.folder}`);
  return null;
}

// The folder on disk has moved under the page: re-read the listing, and drop
// whatever in this session was keyed on a fiber number the rename changed.
// A rename that only touched the text around the number (a prefix, a
// wavelength suffix) leaves every fiber where it was, so the loaded traces
// still name the same glass and are kept.
async function afterRename(dirs, renumbered) {
  gSelectedFiles.clear();
  gFileAnchor = gFileFocus = null;
  dirs.forEach(forgetFileFacts);
  if (renumbered) {
    for (const dir of dirs) {
      for (const key of [...gRemovedFiles]) if (key.startsWith(dir + '-')) gRemovedFiles.delete(key);
      for (const key of Object.keys(gDirOverride)) if (key.startsWith(dir + '-')) delete gDirOverride[key];
      for (const key of Object.keys(gStoredDir)) if (key.startsWith(dir + '-')) delete gStoredDir[key];
      for (const t of gTraces.filter(t => t.src === dir)) COLORS_USED.delete(t.key);
      gTraces = gTraces.filter(t => t.src !== dir);
    }
  }
  await loadInfo();
  // Anything still loaded whose fiber has left the listing goes too.
  const live = new Set();
  for (const dir of allSrcs()) {
    for (const f of (gInfo && gInfo['fibers_' + dir]) || []) live.add(`${dir}-${f}`);
  }
  for (const t of gTraces.filter(t => !live.has(t.key))) COLORS_USED.delete(t.key);
  gTraces = gTraces.filter(t => live.has(t.key));
  syncFileMarks();                   // what is still loaded is still selected
  renderChips();
  if (gAutoFit) fit();
  draw();
  renderEventTable();
}

// Say what happened IN the dialog and leave it open, the same rule the edit
// dialog follows: a line in the readout naming a folder is how the boss lost
// a file once already.  Undo is right here, next to the count it undoes.
function showRenameResult(res) {
  const d = document.getElementById('rn-dlg');
  if (!d) return;
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const lines = [`<b>Renamed ${res.renamed} file${res.renamed === 1 ? '' : 's'}</b>`
    + (res.folders.length ? ` in:<br><code>${res.folders.map(esc).join('</code><br><code>')}</code>` : '')];
  if (res.skipped.length) {
    const why = {};
    for (const s of res.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    lines.push(`<b>Left alone ${res.skipped.length}:</b> `
      + Object.entries(why).map(([r, c]) => esc(c > 1 ? `${c} × ${r}` : r)).join('; '));
  }
  if (!res.renamed) lines.push('Nothing was renamed.');
  setReadout(`renamed ${res.renamed} file${res.renamed === 1 ? '' : 's'}`
    + (res.skipped.length ? `, left ${res.skipped.length} alone` : ''));
  d.innerHTML = `<h3>Rename Done</h3><div class="note" style="font-size:11px;line-height:1.5">`
    + lines.map(l => `<div style="margin:6px 0">${l}</div>`).join('') + `</div>`
    + `<div class="btns">`
    + (res.renamed ? `<button class="spacer" id="rn-undo">Undo This Rename</button>` : '')
    + `<button class="primary" id="rn-done">Done</button></div>`;
  d.querySelector('#rn-done').onclick = closeRenameDialog;
  const u = d.querySelector('#rn-undo');
  if (u) u.onclick = () => { closeRenameDialog(); undoLastRename(); };
}

// Undo replays the last batch backwards.  It goes through the same route and
// the same rules, so a name that was taken again in the meantime is refused
// and said out loud rather than written over.
async function undoLastRename() {
  const last = gRenameUndo.pop();
  if (!last) { setReadout('nothing to undo'); return; }
  setReadout(`putting ${last.n} file name${last.n === 1 ? '' : 's'} back…`);
  const renumbered = last.batches.some(b =>
    b.pairs.some(p => fiberNumOf(p.from) !== fiberNumOf(p.to)));
  const res = await applyRenameBatches(last.batches, renumbered);
  if (res.error) {
    gRenameUndo.push(last);                 // it did not happen; keep the undo
    setReadout('could not undo the rename: ' + res.error);
    return;
  }
  if (res.skipped.length) {
    const why = {};
    for (const s of res.skipped) why[s.reason] = (why[s.reason] || 0) + 1;
    setReadout(`put ${res.renamed} name${res.renamed === 1 ? '' : 's'} back; `
      + `${res.skipped.length} could not go back: `
      + Object.entries(why).map(([r, c]) => c > 1 ? `${c} × ${r}` : r).join('; '));
  } else {
    setReadout(`put ${res.renamed} file name${res.renamed === 1 ? '' : 's'} back`);
  }
}

// ─── Summary Report: the event panel, then a page per fibre, as a PDF or an Excel workbook
// Robert, 2026-09-28: "create a report that shows the traces and the event
// panel from viewer ... an option to do it in pdf or excel sheet"; named the
// Summary Report, and made from the Viewer only ("we will only be generating
// report from viewer").  Robert, 2026-09-30: "get rid of the page that has
// all the traces shown at once ... start with the full event panel that has
// all traces and then move right into the fiber by fiber".  So there is no
// chart of every trace: each fibre's page has its own chart.
//
// What is on screen is what is saved.  The event table is the one the panel
// is showing -- the app's mode, its filters, its red and yellow -- but EVERY
// row of it: the panel is virtual, so the DOM only holds the rows on screen,
// and each grid registers `gTableExport` with its full row list.  A cell's
// colours are read off the page's own CSS, so the report cannot disagree
// with the panel.  The server lays it out and writes the file: Downloads by
// default, like everything the suite saves, and never over an existing file.

// 'rgb(r, g, b)' / 'rgba(r, g, b, a)' → '#rrggbb', a translucent colour laid
// on white as the page shows it; null for transparent or unparsable.
function cssHex(c) {
  const m = String(c || '').match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+%?))?\s*\)/);
  if (!m) return null;
  const a = m[4] == null ? 1 : (m[4].endsWith('%') ? parseFloat(m[4]) / 100 : +m[4]);
  if (!(a > 0)) return null;
  const ch = v => Math.round(+v * a + 255 * (1 - a)).toString(16).padStart(2, '0');
  return '#' + ch(m[1]) + ch(m[2]) + ch(m[3]);
}
// Any CSS colour (a trace's '#1f77b4', a name) → '#rrggbb', via the browser.
function colorHex(c) {
  if (!c) return null;
  const h = cssHex(c);
  if (h) return h;
  const el = document.createElement('span');
  el.style.display = 'none';
  el.style.color = c;
  document.body.appendChild(el);
  const out = cssHex(getComputedStyle(el).color);
  el.remove();
  return out;
}

// A cell's text as the panel prints it: line breaks kept, the ⋯ menu left out.
function reportCellText(td) {
  const c = td.cloneNode(true);
  c.querySelectorAll('button').forEach(b => b.remove());
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  return c.textContent.replace(/[ \t ]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
}

// Each distinct look (section, row class, cell tag, cell class) is resolved
// once, on a hidden probe table carrying the panel's own class, so the report
// takes the colours the stylesheet gives the panel -- never a second copy.
function reportStyleProbe() {
  const table = document.createElement('table');
  table.className = 'fr-table';
  table.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden';
  const secs = {};
  for (const s of ['thead', 'tbody', 'tfoot']) table.appendChild(secs[s] = document.createElement(s));
  document.body.appendChild(table);
  const cache = new Map(), styles = [], seen = new Map();
  const add = st => {
    const k = JSON.stringify(st);
    if (!seen.has(k)) { seen.set(k, styles.length); styles.push(st); }
    return seen.get(k);
  };
  return {
    styles, add,
    ix(section, trCls, tag, tdCls) {
      const key = `${section}|${trCls}|${tag}|${tdCls}`;
      if (cache.has(key)) return cache.get(key);
      const tr = document.createElement('tr');
      tr.className = trCls;
      const td = document.createElement(tag.toLowerCase() === 'th' ? 'th' : 'td');
      td.className = tdCls;
      td.textContent = '0';
      tr.appendChild(td);
      secs[section].appendChild(tr);
      const cs = getComputedStyle(td);
      const al = cs.textAlign;
      const i = add({
        bg: cssHex(cs.backgroundColor), fg: cssHex(cs.color) || '#1f2d3d',
        b: (parseInt(cs.fontWeight, 10) || 400) >= 600,
        al: (al === 'left' || al === 'start') ? 'l' : al === 'right' ? 'r' : 'c',
      });
      tr.remove();
      cache.set(key, i);
      return i;
    },
    done() { table.remove(); },
  };
}

// The event table the panel is showing, every row of it, as plain cells.
function reportEventTable(probe) {
  const ex = gTableExport;
  if (!ex || !ex.table || !ex.table.isConnected) return null;
  const live = ex.table;
  const tpl = document.createElement('template');
  tpl.innerHTML = `<table><thead>${live.tHead ? live.tHead.innerHTML : ''}${ex.headExtra || ''}</thead>`
                + `<tbody>${ex.rows().join('')}</tbody>`
                + `<tfoot>${live.tFoot ? live.tFoot.innerHTML : ''}</tfoot></table>`;
  const t = tpl.content.querySelector('table');
  const part = (sec, el) => !el ? [] : [...el.rows]
    .filter(tr => !tr.classList.contains('fr-spacer'))
    .map(tr => [...tr.cells].map(td => {
      const cell = { t: reportCellText(td), s: probe.ix(sec, tr.className, td.tagName, td.className) };
      if (td.colSpan > 1) cell.cs = td.colSpan;
      if (td.rowSpan > 1) cell.rs = td.rowSpan;
      const dot = td.querySelector('span[style*="border-radius"]');
      const dc = dot && colorHex(dot.style.backgroundColor);
      if (dc) cell.dot = dc;
      // A verdict keeps the report's words for it; how-to tooltips stay behind.
      if (td.title && /\bfr-(hi|warn|brk)\b/.test(td.className)) cell.tip = td.title;
      return cell;
    }));
  // The identifier columns: the header cells that run the header's full
  // height.  They repeat on every page of a table too wide for one.
  let lead = 0;
  const nHead = live.tHead ? live.tHead.rows.length : 0;
  const h0 = nHead ? live.tHead.rows[0] : null;
  if (h0) for (const th of h0.cells) { if (th.rowSpan < nHead) break; lead += th.colSpan; }
  return {
    title: 'Event Table', lead, leafRow: nHead - 1,
    // the panel's hint, less its how-to-click advice
    note: document.getElementById('event-hint').textContent.replace(/;\s*click[^)]*\)/gi, ')')
      .split(' · ').filter(p => !/click/i.test(p)).join(' · '),
    head: part('thead', t.tHead), body: part('tbody', t.tBodies[0]), foot: part('tfoot', t.tFoot),
  };
}

// The A/B marker readout, when both markers are down.
function reportMarkerTable(H, B, C) {
  const box = document.getElementById('marker-readout');
  const tb = box && box.style.display !== 'none' ? box.querySelector('table') : null;
  if (!tb || !tb.tHead || !tb.tBodies[0]) return null;
  const head = [[...tb.tHead.rows[0].cells].map(th => ({ t: th.textContent.trim(), s: H }))];
  const body = [...tb.tBodies[0].rows].map(tr => [...tr.cells].map((td, i) => {
    const cell = { t: td.textContent.replace('■', '').trim(), s: i === 0 ? B : C };
    const sw = i === 0 ? td.querySelector('span') : null;
    const c = sw && colorHex(sw.style.color);
    if (c) cell.dot = c;
    return cell;
  }));
  const lines = [...box.children].filter(el => el.tagName === 'DIV')
    .map(el => el.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean);
  return { title: 'A/B Markers', note: lines.join(' · '), lead: 1, head, body, foot: [] };
}

// The chart as draw() paints it, at print size, no crosshair.  `fn` draws
// and snapshots as often as it likes (snapChart), awaiting between if it
// must; the view, the picked trace, every trace's visibility and the canvas
// itself are put back ONCE at the end, whatever fn did.  `fit` re-sizes the
// canvas for print before each snapshot, since a window resize in an await
// would put it back to screen size.
async function withPrintCanvas(w, h, scale, fn) {
  const keep = { view: gView, mouse: gMouse, drag: gDragging, pick: gPickKey,
                 hover: gHoverKey, vis: gTraces.map(t => t.visible) };
  const fit = () => {
    gExportDpr = scale;
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  };
  try {
    return await fn(fit);
  } finally {
    gExportDpr = 0;
    gView = keep.view;
    gMouse = keep.mouse;
    gDragging = keep.drag;
    gPickKey = keep.pick;
    gHoverKey = keep.hover;
    gTraces.forEach((t, i) => { t.visible = keep.vis[i]; });
    resizeCanvas();
  }
}
function snapChart(fit, view) {
  fit();
  gView = view;
  gMouse = null;
  gDragging = null;
  gHoverKey = null;                   // no hover bold on paper
  draw();
}

// One chart per fibre, FastReporter's way: that fibre's traces alone, fitted
// to the whole span.  Each goes to the server as it is drawn (a whole cable
// is a thousand of them, far past one request); map fibre -> 'ref:<name>'.
const REPORT_FIBRE_W = 1000, REPORT_FIBRE_H = 360;     // CSS px, drawn at 1.5x
function reportFibreCharts(fibres, token, progress) {
  return withPrintCanvas(REPORT_FIBRE_W, REPORT_FIBRE_H, 1.5, async (fit) => {
    const vis = gTraces.map(t => t.visible);
    const out = new Map();
    for (let k = 0; k < fibres.length; k++) {
      const f = fibres[k];
      if (progress) progress(k, fibres.length);
      gPickKey = null;                        // no dimming on a page of its own
      gTraces.forEach((t, i) => { t.visible = vis[i] && t.fiber === f; });
      const b = dataBounds();
      if (!b) continue;
      snapChart(fit, b);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      if (!blob) continue;
      const name = `fibre-${f}`;
      const r = await fetch(`/api/report_image?token=${encodeURIComponent(token)}&name=${name}`,
                            { method: 'POST', body: blob });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || `a fiber chart did not reach the server (${r.status})`);
      }
      out.set(f, 'ref:' + name);
    }
    return out;
  });
}

// ─── A page per fibre: its rows of the combined table, turned on their side
// FastReporter's per-fibre report lists events DOWN the page.  The rows here
// are the combined table's own cells for that fibre -- same numbers, same red
// and yellow -- read column by column: one line per event (or section), and
// per direction its Loss / Refl. / Att.  Nothing is recomputed.

// HTML-style rows (colspan / rowspan) laid on a grid: the server's _report_grid.
function reportLayout(rows) {
  const taken = new Set(), anchors = [];
  let ncols = 0;
  rows.forEach((row, r) => {
    let c = 0;
    for (const cell of row) {
      while (taken.has(r + ',' + c)) c++;
      const rs = cell.rs || 1, cs = cell.cs || 1;
      for (let dr = 0; dr < rs; dr++) for (let dc = 0; dc < cs; dc++) taken.add((r + dr) + ',' + (c + dc));
      anchors.push({ r, c, rs, cs, cell });
      c += cs;
      ncols = Math.max(ncols, c);
    }
  });
  return { anchors, ncols };
}
// A leaf header ("Loss\n(dB)", "Refl.\n(dB)", "Att.\n(dB/km)", "Length\n(km)",
// "Type") -> its kind; the statistics' Min / Max / Avg are not an event's.
const REPORT_KINDS = [['type', 'Type'], ['length', 'Length\n(km)'], ['loss', 'Loss\n(dB)'],
                      ['refl', 'Refl.\n(dB)'], ['att', 'Att.\n(dB/km)']];
function reportKind(t) {
  const w = String(t || '').split(/[\s.]/)[0].toLowerCase();
  return REPORT_KINDS.some(([k]) => k === w) ? w : null;
}
const reportBlank = t => !t || /^-+$/.test(String(t).trim());

// Map fibre -> {pf, table} from the combined snapshot `ev`.
function reportFibreTables(ev, S) {
  const out = new Map();
  if (!ev || !ev.head.length) return out;
  const rows = [...ev.head, ...ev.body];
  const { anchors, ncols } = reportLayout(rows);
  const cover = rows.map(() => new Array(ncols).fill(null));
  for (const a of anchors) {
    for (let dr = 0; dr < a.rs; dr++) for (let dc = 0; dc < a.cs; dc++) {
      if (cover[a.r + dr]) cover[a.r + dr][a.c + dc] = a;
    }
  }
  const nh = ev.head.length, lead = ev.lead, leafRow = ev.leafRow;
  if (!(lead >= 2) || !(leafRow >= 1) || leafRow >= nh) return out;
  // The column groups: an event, a section, a mixed column's Type.
  const groups = [];
  for (let c = lead; c < ncols;) {
    const a = cover[0][c];
    if (!a) { c++; continue; }
    const cols = [];
    for (let k = a.c; k < a.c + a.cs; k++) {
      const leaf = cover[leafRow][k];
      const kind = leaf && leaf.r === leafRow ? reportKind(leaf.cell.t) : null;
      if (kind) cols.push({ c: k, kind });
    }
    const sub = cover[1][a.c];
    if (cols.length) {
      groups.push({ title: String(a.cell.t).replace(/\s*\(\d+\/\d+\)\s*$/, ''),
                    where: sub && sub !== a ? sub.cell.t : '', cols });
    }
    c = a.c + a.cs;
  }
  // A fibre's rows, by its label ("F72") and direction ("A→B", "B→A", "Average").
  const byFibre = new Map();
  for (let r = nh; r < rows.length; r++) {
    const lab = cover[r][0], dir = cover[r][lead - 1];
    const m = lab && /^F(\d+)(?: \(copy (\d+)\))?/.exec(lab.cell.t);
    if (!m || !dir || !dir.cell.t) continue;
    const f = +m[1] + (m[2] ? COPY_BASE * (m[2] - 1) : 0);   // fiberLabel, read back
    if (!byFibre.has(f)) byFibre.set(f, []);
    byFibre.get(f).push({ dir: dir.cell.t, r, pf: cover[r][1] ? cover[r][1].cell : null });
  }
  // A mixed column's per-direction Type folds into the one Type column, and
  // a section's per-trace Length into Location (the header's length is the
  // first trace's, not this fibre's).
  const kinds = REPORT_KINDS.map(([k]) => k)
    .filter(k => k !== 'type' && k !== 'length' && groups.some(g => g.cols.some(x => x.kind === k)));
  const cellAt = (g, k, d) => {
    const x = g.cols.find(y => y.kind === k);
    const a = x && cover[d.r][x.c];
    return a && a.r === d.r ? a.cell : null;
  };
  for (const [f, dirs] of byFibre) {
    const defs = dirs.flatMap(d => kinds.map(k => ({ d, k })));
    const body = [];
    let n = 0;
    for (const g of groups) {
      const vals = defs.map(({ d, k }) => {
        const c = cellAt(g, k, d);
        if (!c) return { t: '', s: S.C };
        const v = { t: c.t, s: c.s };
        if (c.tip) v.tip = c.tip;
        return v;
      });
      if (vals.every(v => reportBlank(v.t))) continue;     // nothing of this fibre's here
      // FastReporter's columns: the kind in Type, the place in Location, one
      // line a row; a section is "Section" in Type with no event name.
      const lines = String(g.where || '').split('\n');
      const section = /^section$/i.test(g.title);
      let type = section ? 'Section' : (lines.length > 1 ? lines[0] : '');
      if (!type) {
        // A column whose kind differs by fibre names it per row.  One type
        // an event, as FastReporter's fibre page prints it: the Average's
        // (the bidirectional event), else the directions', named if they differ.
        const per = dirs.map(d => [d.dir, (cellAt(g, 'type', d) || {}).t]).filter(([, t]) => !reportBlank(t));
        const avgT = per.find(([dd]) => /average/i.test(dd));
        const kindsSeen = [...new Set(per.map(([, t]) => t))];
        type = avgT ? avgT[1] : kindsSeen.length === 1 ? kindsSeen[0]
             : per.map(([dd, t]) => `${dd} ${t}`).join(' / ');
      }
      const own = dirs.map(d => (cellAt(g, 'length', d) || {}).t).find(t => !reportBlank(t));
      const loc = own ? `${own} km` : lines.length > 1 ? lines.slice(1).join(' ') : lines[0];
      // FastReporter numbers a fibre's events 1..n; the combined table's
      // numbers are the whole load's columns.  A named column keeps its name.
      const name = section ? '' : (/^Event \d+$/.test(g.title) ? `Event ${++n}` : g.title);
      body.push([{ t: name, s: S.B }, { t: type, s: S.B }, { t: loc, s: S.C }, ...vals]);
    }
    const LEAD = 3;
    const keep = defs.map((_d, i) => body.some(row => !reportBlank(row[i + LEAD].t)));
    const kept = defs.filter((_d, i) => keep[i]);
    const typed = body.some(row => row[1].t);             // the OTDR Suite table names no kind
    const head0 = [{ t: 'Event', s: S.H, rs: 2 }, ...(typed ? [{ t: 'Type', s: S.H, rs: 2 }] : []),
                   { t: 'Location / length', s: S.H, rs: 2 }];
    for (const d of dirs) {
      const n = kept.filter(x => x.d === d).length;
      if (n) head0.push({ t: d.dir, s: S.H, cs: n });
    }
    const head1 = kept.map(({ k }) => ({ t: REPORT_KINDS.find(([kk]) => kk === k)[1], s: S.H }));
    const avg = dirs.find(d => /average/i.test(d.dir)) || dirs[0];
    out.set(f, {
      pf: avg && avg.pf ? avg.pf.t : '',
      table: { title: 'Events', lead: typed ? LEAD : LEAD - 1, head: [head0, head1],
               body: body.map(row => [row[0], ...(typed ? [row[1]] : []), row[2],
                                      ...row.slice(LEAD).filter((_v, i) => keep[i])]),
               foot: [] },
    });
  }
  return out;
}

// 64, 65, 66, 70 → "64-66, 70"
function fiberRanges(nums) {
  const s = [...new Set(nums)].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length;) {
    let j = i;
    while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(j > i ? `${s[i]}-${s[j]}` : `${s[i]}`);
    i = j + 1;
  }
  return out.join(', ');
}
// A job's name is its folder's, but a folder called just "A" or "B" (a span
// folder split in two) says nothing on a report: name its parent instead.
function folderLabel(side) {
  if (!gInfo) return '';
  const name = gInfo[`dir_${side}_name`];
  if (!name || name === '(none)') return '';
  // A dropped side is served under what was dropped (trace_server.drop_name):
  // its staging folder's parent is a temp name, never a job.
  if (gInfo[`dir_${side}_dropped`] || !/^[ab]$/i.test(name)) return name;
  const parts = String(gInfo[`dir_${side}`] || '').split(/[\/\\]+/).filter(Boolean);
  return parts.length > 1 ? parts[parts.length - 2] : name;
}
// The job a report names: the folders of the span on screen (span 1's A and
// B, or another span's own).
function reportJob() {
  const vis = gTraces.filter(t => t.visible);
  const span = (vis.length && vis[0].span) || 1;
  const a = span > 1 ? 'a' + span : 'a', b = span > 1 ? 'b' + span : 'b';
  return [...new Set([folderLabel(a), folderLabel(b)].filter(Boolean))].join(' / ');
}
function reportDefaultName(vis) {
  const fibers = [...new Set(vis.map(t => realFiber(t.fiber)))].sort((a, b) => a - b);
  const f = fibers.length === 1 ? `F${fibers[0]}`
          : (fibers[fibers.length - 1] - fibers[0] === fibers.length - 1)
            ? `F${fibers[0]}-F${fibers[fibers.length - 1]}` : `${fibers.length} fibers`;
  const d = new Date(), p = v => String(v).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}`;
  const job = reportJob();
  return `Summary Report ${job ? job.replace(/ \/ /g, ' ') + ' ' : ''}${f} ${stamp}`;
}

async function reportPayload(opt, token, progress) {
  const vis = gTraces.filter(t => t.visible);
  const probe = reportStyleProbe();
  try {
    const sorted = [...vis].sort((a, b) => realFiber(a.fiber) - realFiber(b.fiber) || a.fiber - b.fiber
                                         || a.dir.localeCompare(b.dir));
    const arrow = t => (t.dir === 'a' ? 'A→B' : 'B→A') + (t.src && t.src.length > 1 ? srcTag(t.src) : '');
    // Viewer FEC: the mode and the gates the FEC table was graded at, not
    // the analysis mode's or the Viewer boxes' usual meaning.
    const meta = [['Mode', gFecMode ? 'FEC' : gAnalysisMode === 'fr' ? 'FastReporter' : PRODUCT_NAME]];
    // Each source on the report: 'A folder', 'B folder', and another span's
    // under its own name ('S2 A folder').
    for (const src of allSrcs()) {
      if (vis.some(t => t.src === src) && folderLabel(src)) meta.push([`${srcLabel(src)} folder`, folderLabel(src)]);
    }
    const nf = new Set(vis.map(t => realFiber(t.fiber))).size;
    meta.push(['Fibers', `${fiberRanges(vis.map(t => realFiber(t.fiber)))} (${nf} fiber${nf === 1 ? '' : 's'})`]);
    const fg = gFecMode ? fecGatesShown() : null;
    if (gFecMode) {
      const src = w => gFecOverride[w] != null ? 'overridden in this window' : 'customer profile';
      meta.push(['FEC loss gate', fg ? `fails ${fg.FEC_LOSS_STRICT ? '>' : '≥'} ${Number(fg.FEC_LOSS_GATE).toFixed(3)} dB, `
        + `connector + events within ${Number(fg.FEC_COMBINE_M).toFixed(0)} m (${src('loss')})` : 'not loaded']);
      meta.push(['FEC reflectance gate', fg ? `fails > ${Number(fg.FEC_REFL_GATE).toFixed(1)} dB (${src('refl')})` : 'not loaded']);
    } else {
      meta.push(['Loss gate', gateLabel()]);
      const lo = document.getElementById('set-refl-lo').value, hi = document.getElementById('set-refl-hi').value;
      meta.push(['Reflectance band', `${lo} to ${hi} dB`]);
    }
    const views = [gFlaggedOnly && 'flagged rows only', gFailCellsOnly && 'failing cells only',
                   gWarnCellsOnly && 'warning cells only', !gShowSections && 'sections off',
                   gAvgOnly && 'averages only'].filter(Boolean);
    if (views.length) meta.push(['Table shows', views.join(', ')]);
    if (!gShowGainers) meta.push(['Gainers', 'hidden: single-direction readings with a negative loss are left blank and not judged']);
    const decl = spanDeclOf((vis.length && vis[0].span) || 1);   // the span on screen
    for (const dir of ['a', 'b']) {
      const s = decl && decl[dir];
      if (s && (s.start_km != null || s.end_km != null)) {
        meta.push([`Span ${dir === 'a' ? 'A→B' : 'B→A'}`,
          [s.start_km != null ? `start ${kmFt(s.start_km)}` : '', s.end_km != null ? `end ${kmFt(s.end_km)}` : '']
            .filter(Boolean).join(', ')]);
      }
    }
    if (frameWarn()) meta.push(['Note', frameWarn()]);

    const H = probe.add({ bg: '#e4edf7', fg: '#1f2d3d', b: true, al: 'c' });
    const B = probe.add({ bg: null, fg: '#1f2d3d', b: false, al: 'l' });
    const C = probe.add({ bg: null, fg: '#1f2d3d', b: false, al: 'c' });
    // The report opens on the event table, then the trace list (Robert,
    // 2026-10-01: "we can keep that table"), then the fibre pages.
    const tables = [];
    const ev = reportEventTable(probe);
    tables.push(ev || { title: 'Event Table', note: 'The event table had not finished loading.',
                        lead: 0, head: [], body: [], foot: [] });
    const mk = reportMarkerTable(H, B, C);
    if (mk) tables.push(mk);
    tables.push({
      title: 'Traces', note: '', lead: 1,
      head: [['Trace', 'File', 'λ (nm)', 'Pulse (ns)', 'IOR', 'End', 'Events'].map(t => ({ t, s: H }))],
      body: sorted.map(t => {
        const d = t.data || {};
        const end = (d.events || []).find(e => e.is_end);
        return [
          { t: `F${fiberLabel(t.fiber)} ${arrow(t)}`, s: B, dot: colorHex(t.color) },
          { t: d.filename || '', s: B },
          { t: d.wavelength_nm ? String(d.wavelength_nm) : '---', s: C },
          { t: d.pulse_ns ? String(d.pulse_ns) : '---', s: C },
          { t: d.ior ? d.ior.toFixed(5) : '---', s: C },
          { t: end ? kmFt(end.dist_km) : '---', s: C },
          { t: String((d.events || []).length), s: C },
        ];
      }),
      foot: [],
    });
    // A page per fibre, after the event table.  With a row or cell filter
    // on, only the fibres the table still shows; otherwise every fibre drawn.
    const fibres = [];
    if (opt.perFibre) {
      const byTable = reportFibreTables(ev, { H, B, C });
      let list = [...new Set(sorted.map(t => t.fiber))];
      if (ev && (gFlaggedOnly || cellFilterOn())) list = list.filter(f => byTable.has(f));
      const charts = await reportFibreCharts(list, token, progress);
      const one = (ts, fn) => [...new Set(ts.map(fn).filter(v => v != null && v !== ''))].join(' / ');
      for (const f of list) {
        const ts = sorted.filter(t => t.fiber === f);
        const tab = byTable.get(f);
        const meta = ts.map(t => [`${arrow(t)} file`, (t.data && t.data.filename) || '']);
        meta.push(['Wavelength', one(ts, t => t.data.wavelength_nm ? `${t.data.wavelength_nm} nm` : null)]);
        meta.push(['Pulse', one(ts, t => t.data.pulse_ns ? `${t.data.pulse_ns} ns` : null)]);
        meta.push(['IOR', one(ts, t => t.data.ior ? t.data.ior.toFixed(5) : null)]);
        for (const t of ts) {
          const end = (t.data.events || []).find(e => e.is_end);
          if (end) meta.push([`Fiber end ${arrow(t)}`, kmFt(end.dist_km)]);
        }
        if (tab && tab.pf) meta.push(['P/F', tab.pf]);
        fibres.push({
          title: `F${fiberLabel(f)}`, meta: meta.filter(([, v]) => v),
          png: charts.get(f) || '',
          key: ts.map(t => ({ label: `F${fiberLabel(t.fiber)} ${arrow(t)}`, color: colorHex(t.color) })),
          table: tab ? tab.table : null,
          note: tab ? '' : 'This fiber has no rows in the event table on screen.',
        });
      }
    }
    const job = reportJob();
    return {
      format: opt.fmt, dest: opt.dest, name: opt.name, fibres, token,
      title: 'Summary Report' + (job ? `: ${job}` : ''),
      subtitle: `Generated ${new Date().toLocaleString()}`,
      footer: `${PRODUCT_NAME} Summary Report${job ? ' · ' + job : ''}`,
      meta, styles: probe.styles, tables,
    };
  } finally {
    probe.done();
  }
}

function closeReportDialog() {
  for (const id of ['report-dlg', 'report-dlg-bg']) {
    const e = document.getElementById(id);
    if (e) e.remove();
  }
}
// Which click on Summary Report is the latest.  The dialog is built after
// an await (the Save To default), so a double-click got past the close
// above twice and stacked two dialogs; Cancel shut only the top one (audit
// 2026-10-01).  Only the latest click builds one.
let gReportDlgSeq = 0;
async function showReportDialog() {
  const seq = ++gReportDlgSeq;
  closeReportDialog();
  const vis = gTraces.filter(t => t.visible);
  // A warning, not a plain note: the readout shows no plain notes, so this
  // click used to do nothing at all that the tech could see.
  if (!vis.length) {
    setReadout('', { warn: gLoadingKeys.size
      ? 'the traces are still loading: Summary Report opens once they are on the chart'
      : 'load a trace first: the Summary Report is the event table on screen' });
    return;
  }
  // The report is the event table on screen, and traces of more than one
  // span have none (MULTI_SPAN_NOTE): no report of them either.
  if (new Set(vis.map(t => t.span || 1)).size > 1) {
    setReadout('', { fail: MULTI_SPAN_NOTE });
    return;
  }
  let dest = '';
  try { dest = (await (await fetch('/api/report_defaults')).json()).dest || ''; } catch (e) {}
  if (seq !== gReportDlgSeq) return;    // a later click builds the dialog
  closeReportDialog();
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const nFib = new Set(vis.map(t => realFiber(t.fiber))).size;
  const bg = document.createElement('div'); bg.id = 'report-dlg-bg';
  const d = document.createElement('div'); d.id = 'report-dlg';
  d.innerHTML = `<h3>Summary Report</h3>`
    + `<div class="sub">The event table as it is on screen, every row of it.</div>`
    + `<div class="scope"><label><input type="radio" name="rpt-fmt" value="pdf" checked> PDF</label>`
    + `<label><input type="radio" name="rpt-fmt" value="xlsx"> Excel</label></div>`
    + `<div class="scope"><label title="After the event table, one page per fiber, as FastReporter prints them (${nFib} fiber${nFib === 1 ? '' : 's'} loaded)">`
    + `<input type="checkbox" id="rpt-fibres" checked> Add Per Fiber Summary Pages</label></div>`
    + `<div class="row"><label>File Name</label><input type="text" id="rpt-name" value="${esc(reportDefaultName(vis))}"></div>`
    + `<div class="row"><label>Save To</label><input type="text" id="rpt-dest" value="${esc(dest)}">`
    + `<button type="button" id="rpt-browse" title="choose the folder the report is saved to">Browse…</button></div>`
    + (gTableExport ? '' : `<div class="note">The event table is still loading. Wait for it, or the report goes out without it.</div>`)
    + `<div class="err" id="rpt-err"></div>`
    + `<div class="btns"><button id="rpt-cancel">Cancel</button><button class="primary" id="rpt-save">Save Report</button></div>`;
  document.body.appendChild(bg);
  document.body.appendChild(d);
  bg.onclick = closeReportDialog;
  d.querySelector('#rpt-cancel').onclick = closeReportDialog;
  d.querySelector('#rpt-save').onclick = submitReport;
  d.querySelector('#rpt-browse').onclick = async () => {
    const err = d.querySelector('#rpt-err');
    err.textContent = 'choose a folder in the dialog that just opened…';
    try {
      const r = await fetch('/api/pick_folder', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Save the report to' }),
      });
      const j = await r.json();
      if (!r.ok || j.error) { err.textContent = j.error || ('server said ' + r.status); return; }
      if (!j.available) { err.textContent = 'no folder picker on this machine. Type the full path instead'; return; }
      if (j.path) d.querySelector('#rpt-dest').value = j.path;
      err.textContent = '';
    } catch (e) {
      err.textContent = (e && e.message) || String(e);
    }
  };

async function submitReport() {

  const cancel = d.querySelector('#rpt-cancel');
  // Held open while it builds: a click on the backdrop must not close it

    if (bg) bg.onclick = on ? null : closeReportDialog;
  };
  const say = msg => { err.style.color = 'var(--text-sec)'; err.textContent = msg; };  // progress, not an error
  const fail = msg => { err.style.color = ''; err.textContent = msg; busy(false); };
  busy(true);

  await new Promise(r => setTimeout(r, 30));          // let the message paint
  let token = '';

      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || ('server said ' + r.status));
      token = j.token;
    } catch (e) {
      fail('could not start the Summary Report: ' + ((e && e.message) || e));
      return;
    }
  }
  let payload;
  try {
    payload = await reportPayload(opt, token, (k, n) => say(`drawing the fiber pages: ${k + 1} of ${n}…`));
  } catch (e) {
    fail('could not read the chart or the table: ' + ((e && e.message) || e));
    return;
  }
  say(`writing the ${opt.fmt === 'pdf' ? 'PDF' : 'workbook'}…`
      + (payload.fibres.length > 100 ? ' (a whole cable takes a minute or two)' : ''));
  let j;

    const r = await fetch('/api/report', {

    });

  } catch (e) {
    fail((e && e.message) || String(e));
    return;
  }

  // the edited copies nobody could find (see submitEdit).
  if (bg) bg.onclick = closeReportDialog;
  setReadout(`Summary Report saved to ${j.path}`);
  const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  d.innerHTML = `<h3>Summary Report Saved</h3>`
    + `<div class="note" style="font-size:12px;line-height:1.5"><b>${opt.fmt === 'pdf' ? 'PDF' : 'Excel workbook'}</b> saved to:<br><code>${esc(j.path)}</code></div>`
    + `<div class="err" id="rpt-err"></div>`
    + `<div class="btns"><button id="rpt-reveal">Show in Folder</button><button id="rpt-open">Open</button>`
    + `<button class="primary" id="rpt-done">Done</button></div>`;
  const open = async (reveal) => {
    const e2 = d.querySelector('#rpt-err');

        method: 'POST', headers: { 'Content-Type': 'application/json' },

async function handleOltsDrop(files) {

      const r = await fetch('/api/olts_load?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });

// ─── The Measurements tab ──────────────────────────────────────────
// The boss, 2026-10-02, pointing at FastReporter's Measurements panel: "we
// need to see those losses in that measurements column in our tool and sort
// by them ... sort high to low in each column".  A row per fiber of the
// dropped .olts: P/F, identifier, type, direction, then per wavelength the
// A->B and B->A loss, their average and the two ORLs, each unit's reference
// power (FR's FasTesT table), the length and when.
// A click on a heading sorts by it, highest first (A to Z for words); a
// second click turns it over; a right-click names the two.  Blank values
// stay at the bottom either way.

function oltsCols(info) {
  const cols = [{ k: 'pf', t: 'P/F', kind: 'pf' }, { k: 'id', t: 'Identifiers', kind: 'text' },
                { k: 'type', t: 'Type', kind: 'text' }, { k: 'dir', t: 'Direction', kind: 'text' }];
  for (const wl of (info.wavelengths || [])) {
    for (const [k, t] of [['loss_ab', 'A->B Loss'], ['loss_ba', 'B->A Loss'],
                          ['loss_avg', 'Average Loss'], ['orl_a', 'ORL A'], ['orl_b', 'ORL B']]) {
      cols.push({ k: `${k}@${wl}`, t: `${wl} ${t}`, kind: 'num', nd: 2, unit: ' dB' });
    }
  }
  // FastReporter's FasTesT table: each unit's reference power, in dBm.
  for (const wl of (info.wavelengths || [])) {
    cols.push({ k: `ref_ab@${wl}`, t: `${wl} Ref. A->B`, kind: 'num', nd: 2, unit: ' dBm' });
    cols.push({ k: `ref_ba@${wl}`, t: `${wl} Ref. B->A`, kind: 'num', nd: 2, unit: ' dBm' });
  }
  cols.push({ k: 'length_km', t: 'Length', kind: 'num', nd: 3, unit: ' km' });
  cols.push({ k: 'when_ts', t: 'Test Date/Time', kind: 'num', text: 'when' });
  return cols;
}
function oltsValue(r, k) {
  const at = k.indexOf('@');
  if (at < 0) return r[k];
  const w = (r.wl || {})[k.slice(at + 1)];
  return w ? w[k.slice(0, at)] : null;
}
function oltsSortRows(rows, cols, sort) {
  const col = sort && cols.find(c => c.k === sort.col);
  if (!col) return rows.slice();
  const key = r => col.kind === 'pf' ? ({ fail: 1, pass: 0 }[r.pf] ?? null) : oltsValue(r, col.k);
  return rows.map((r, i) => [r, i, key(r)]).sort((x, y) => {
    const a = x[2], b = y[2];
    const na = a == null || a === '', nb = b == null || b === '';
    if (na || nb) return na === nb ? x[1] - y[1] : na ? 1 : -1;
    let c = typeof a === 'number' && typeof b === 'number' ? a - b
          : String(a).localeCompare(String(b), undefined, { numeric: true });
    if (sort.desc) c = -c;
    return c || x[1] - y[1];
  }).map(x => x[0]);
}
function oltsCell(c, r, graded, esc) {
  if (c.kind === 'pf') {
    return `<td class="olts-pf ${r.pf ? 'olts-' + r.pf : ''}">${r.pf === 'fail' ? '✗' : r.pf === 'pass' ? '✓' : ''}</td>`;
  }
  if (c.text) return `<td>${esc(r[c.text] || '')}</td>`;
  const v = oltsValue(r, c.k);
  if (c.kind !== 'num') return `<td>${esc(v == null ? '' : v)}</td>`;
  let cls = 'num';
  const at = c.k.indexOf('@'), base = at < 0 ? c.k : c.k.slice(0, at);
  if (graded && v != null && (base === 'orl_a' || base === 'orl_b')) {
    const w = (r.wl || {})[c.k.slice(at + 1)] || {};
    cls += w[base + '_fail'] ? ' olts-fail' : ' olts-pass';
  }

}

// A report link's km as a chart position.  The Splice Report hands it in A's
// raw frame (app.py's `_vkm` adds launch_a_km), the Unidirectional report in
// the raw frame of the direction it ran on.  The chart is A's frame whenever
// an A trace is loaded, B mirrored onto it; with no A trace B is drawn as it
// was shot.  A Splice Report link to a fibre whose A file is missing loaded
// only B and zoomed to the A-frame km on B's own axis -- the far end of the
// span on a long cable.
function linkDispKm(km, src, dir, fiber) {
  if (gFecMode) return km;         // nothing is mirrored: a link's km is the trace's own
  const traceOf = d => gTraces.find(x => x.dir === d && x.data && String(x.fiber) === String(fiber))
                    || gTraces.find(x => x.dir === d && x.data);
  if (src === 'uni' && (dir === 'a' || dir === 'b')) {
    const t = traceOf(dir);
    return t ? dispKm(t, km) : km;
  }
  if (gTraces.some(x => x.dir === 'a')) return km;
  const b = traceOf('b');
  return b ? mirrorOriginKm(b) - km : km;   // the metre B's own frame has there
}

// Zoom the chart to ±half km around a chart position (A's frame while an A
// trace is loaded), refitting Y to the window.
function zoomToKm(aKm, half = 2) {
  if (!gView) return;
  const x0 = Math.max(0, aKm - half), x1 = aKm + half;
  let y0 = Infinity, y1 = -Infinity;
  for (const t of gTraces) {
    if (!t.visible) continue;
    const xs = t.data.dist_km, ys = t.data.trace_db;
    for (let i = 0; i < xs.length; i += 2) {
      const dx = dispKm(t, xs[i]);
      if (dx < x0 || dx > x1) continue;
      const dy = dispDb(t, ys[i]);
      if (dy < y0) y0 = dy;
      if (dy > y1) y1 = dy;
    }
  }
  if (!isFinite(y0)) { y0 = gView.y0; y1 = gView.y1; }
  const pad = Math.max(0.5, (y1 - y0) * 0.1);
  gView = { x0, x1, y0: y0 - pad, y1: y1 + pad };
  gAutoFit = false;
  draw();
}

// ─── Zoom / pan ───────────────────────────────────────────────────────
function zoomAt(px, factor) {
  if (!gView) return;
  const r = plotRect();
  const xData = pxToX(px, r);
  const span = gView.x1 - gView.x0;
  const newSpan = Math.max(0.001, span * factor);
  const t = (xData - gView.x0) / span;
  gView = {
    ...gView,
    x0: xData - t * newSpan,
    x1: xData + (1 - t) * newSpan,
  };
  gAutoFit = false;
  draw();
}

function zoomYAt(py, factor) {
  if (!gView) return;
  const r = plotRect();
  const yData = pxToY(py, r);
  const span = gView.y1 - gView.y0;
  const newSpan = Math.max(0.001, span * factor);
  const t = (yData - gView.y0) / span;
  gView = {
    ...gView,
    y0: yData - t * newSpan,
    y1: yData + (1 - t) * newSpan,
  };
  gAutoFit = false;
  draw();
}

canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const factor = Math.pow(1.15, ev.deltaY > 0 ? 1 : -1);
  if (ev.shiftKey) zoomYAt(ev.offsetY, factor);
  else zoomAt(ev.offsetX, factor);
}, { passive: false });

function markerHit(px, r) {
  // Return 'a'/'b' if px is within grab radius of a placed marker, else null.
  if (!gView) return null;   // no trace loaded yet → xToPx() reads gView.x0 on
                             // null and throws (error issue #5: mouse-move in
                             // marker mode after Clear All / before a load).
  for (const m of ['a', 'b']) {
    if (gMarkers[m] == null) continue;
    if (Math.abs(xToPx(gMarkers[m], r) - px) <= MARKER_HIT_PX) return m;
  }
  return null;
}

canvas.addEventListener('mousedown', (ev) => {
  if (!gView) return;
  const r = plotRect();
  if (ev.shiftKey) {
    gDragging = { kind: 'box', startPx: ev.offsetX, curPx: ev.offsetX };
    return;
  }
  // An event number is a link to its row in the table: pressing on one
  // does not start a pan.  A right press is the span menu's alone: on
  // Windows its mouse-up comes before the menu, and as a click it picked
  // (or let go of) the fiber and jumped the table under the menu.
  if (!gMarkerMode) {
    const lh = labelHit(ev.offsetX, ev.offsetY);
    if (lh) {
      if (ev.button === 0) gLabelClick = { hit: lh, x: ev.offsetX, y: ev.offsetY };
      return;
    }
  }
  // A press on a trace is a click (go to its row) or the start of a pan;
  // the mouse-up decides which, so the pan below starts either way.  A
  // press on the empty chart is the same, with no trace: a click there lets
  // go of the picked fiber (the boss, 2026-10-01: a picked fiber's labels
  // cover most of its line, so clicking the line again often hit a label).
  gTraceClick = null;
  if (!gMarkerMode && ev.button === 0) {
    const th = traceHits(ev.offsetX, ev.offsetY, r);
    gTraceClick = { t: th.length ? th[0].t : null, x: ev.offsetX, y: ev.offsetY, autoFit: gAutoFit };
  }
  if (gMarkerMode) {
    const hit = markerHit(ev.offsetX, r);
    if (hit) { gDragMarker = hit; return; }          // grab an existing marker
    const km = pxToX(ev.offsetX, r);
    if (gMarkers.a == null)      gMarkers.a = km;     // place A, then B
    else if (gMarkers.b == null) gMarkers.b = km;
    else {                                           // both set → move nearer one
      const nearer = Math.abs(km - gMarkers.a) <= Math.abs(km - gMarkers.b) ? 'a' : 'b';
      gMarkers[nearer] = km;
      gDragMarker = nearer;
    }
    draw();
    return;
  }
  gDragging = {
    kind: 'pan',
    startX: ev.offsetX, startY: ev.offsetY,
    vx0: gView.x0, vx1: gView.x1, vy0: gView.y0, vy1: gView.y1,
  };
});

canvas.addEventListener('mousemove', (ev) => {
  gMouse = { px: ev.offsetX, py: ev.offsetY };
  if (gDragMarker) {                                 // dragging a placed marker
    const r = plotRect();
    gMarkers[gDragMarker] = pxToX(ev.offsetX, r);
    draw();
    return;
  }
  // Cursor hint when hovering a grabbable marker
  if (gMarkerMode && !gDragging) {
    canvas.style.cursor = markerHit(ev.offsetX, plotRect()) ? 'ew-resize' : 'crosshair';
  }
  // The trace under the cursor, for the hover box: the nearest one, none
  // while dragging, and none over an event number (a link of its own).
  const overLabel = !gMarkerMode && labelHit(ev.offsetX, ev.offsetY);
  const near = (gDragging || gLabelClick || overLabel) ? []
    : traceHits(ev.offsetX, ev.offsetY, plotRect());
  gHoverKey = near.length ? near[0].t.key : null;
  if (!gMarkerMode && !gDragging && !gLabelClick) {
    // Over an event number the crosshair becomes the arrow: "this is a link";
    // over a trace, the hand: a click goes to its row.
    canvas.style.cursor = overLabel ? 'default' : gHoverKey != null ? 'pointer' : 'crosshair';
  }
  if (gDragging) {
    const r = plotRect();
    if (gDragging.kind === 'pan') {
      const dxData = (ev.offsetX - gDragging.startX) / r.w * (gDragging.vx1 - gDragging.vx0);
      const dyData = (ev.offsetY - gDragging.startY) / r.h * (gDragging.vy1 - gDragging.vy0);
      gView = {
        x0: gDragging.vx0 - dxData, x1: gDragging.vx1 - dxData,
        y0: gDragging.vy0 + dyData, y1: gDragging.vy1 + dyData,
      };
      gAutoFit = false;
    } else if (gDragging.kind === 'box') {
      gDragging.curPx = ev.offsetX;
    }
  }
  // A pan moves the chart; anything else only moves the overlay.
  if (gDragging && gDragging.kind === 'pan') draw();
  else drawHover();
});

window.addEventListener('mouseup', (ev) => {
  if (gLabelClick) {
    const c = gLabelClick; gLabelClick = null;
    const still = ev.target === canvas
      && Math.abs(ev.offsetX - c.x) <= 3 && Math.abs(ev.offsetY - c.y) <= 3;
    if (!still) return;
    // A mark or event number on a trace picks that trace too (bold, the rest
    // faint), as a click on the line does (Robert 2026-10-01: a click there
    // found the cell but left the fiber unselected).  On the picked trace it
    // lets go, as the line and the row do: a picked fiber's marks cover most
    // of its line, so this is where a second click lands (#503).
    const pt = c.hit.pick || c.hit.t;
    if (pt) gPickKey = isPicked(pt.key) ? null : pt.key;
    // The drawer's marks name their own cell; a file's event number is found
    // by its km in the table on screen.
    if (c.hit.go) c.hit.go();
    else if (gGridGoTo) gGridGoTo(c.hit.t, c.hit.e);
    draw();
    return;
  }
  if (gTraceClick) {
    const c = gTraceClick; gTraceClick = null;
    const still = ev.target === canvas
      && Math.abs(ev.offsetX - c.x) <= 3 && Math.abs(ev.offsetY - c.y) <= 3;
    if (still) {
      // A click, not a pan: put back the pixel or two the press dragged.
      if (gDragging && gDragging.kind === 'pan') {
        const d = gDragging;
        gView = { x0: d.vx0, x1: d.vx1, y0: d.vy0, y1: d.vy1 };
        gAutoFit = c.autoFit;
      }
      gDragging = null;
      // The second click of a double-click (a Fit) leaves the pick alone,
      // or it would let go of what the first click picked.
      if (ev.detail > 1) draw();
      else if (c.t) goToTrace(c.t);
      else { gPickKey = null; draw(); }
      return;
    }
  }
  if (gDragMarker) { gDragMarker = null; draw(); return; }
  if (!gDragging) return;
  if (gDragging.kind === 'box') {
    const r = plotRect();
    const x0p = Math.min(gDragging.startPx, gDragging.curPx);
    const x1p = Math.max(gDragging.startPx, gDragging.curPx);
    if (x1p - x0p > 4) {
      gView = { ...gView, x0: pxToX(x0p, r), x1: pxToX(x1p, r) };
      gAutoFit = false;
    }
  }
  gDragging = null;
  draw();
});

canvas.addEventListener('dblclick', () => { if (!gMarkerMode) fit(); });
// Right-click an event number to make that event the span's start or end:
// the same menu a right-click on the grid cell opens, fed the same way (the
// trace names the direction, the event its own raw km).  A drawer mark or
// tag names its own picks (`menu`); a tag or filled-in leg over both
// directions asks which one first, as a header's ⋯ does.  On the line of a
// trace between its events the menu is that trace's nearest event's (Robert
// 2026-10-02: "whether I click on the body of a trace between events or on
// the event itself"); the menu's heading names the event it picked.
canvas.addEventListener('contextmenu', (ev) => {
  const lh = labelHit(ev.offsetX, ev.offsetY);
  let picks = lh ? lh.menu || (lh.t && lh.e
    ? [{ dir: lh.t.dir, km: lh.e.dist_km, fiber: lh.t.fiber, src: lh.t.src || lh.t.dir }] : []) : [];
  if (!lh) {
    const r = plotRect();
    const th = traceHits(ev.offsetX, ev.offsetY, r);
    const t = th.length ? th[0].t : null;
    const e = t && nearestEvent(t, pxToX(ev.offsetX, r));
    if (e) picks = [{ dir: t.dir, km: e.dist_km, fiber: t.fiber, src: t.src || t.dir }];
  }
  if (!picks.length) return;
  ev.preventDefault();
  gLabelClick = null;
  const p = picks[0];
  if (picks.length === 1) showSpanMenu(ev.clientX, ev.clientY, p.dir, p.km, p.fiber, p.src);
  else showDirChooser(ev.clientX, ev.clientY, picks);
});

// Keyboard: + / - to zoom, f fit, m toggle markers, Esc clear markers
window.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT') return;
  // A dialog is modal: the chart's keys, and Ctrl+A marking the FILES list
  // behind it, are not what the tech is aiming at while one is open.
  // The Summary Report's too: M turned the A/B markers on behind it (audit
  // 2026-10-01).
  if (document.getElementById('rn-dlg') || document.getElementById('edit-dlg')
      || document.getElementById('sel-dlg') || document.getElementById('report-dlg')) return;
  // Escape shuts a right-click menu the way it shuts the two gear menus,
  // and only the menu: the markers stay.
  if (ev.key === 'Escape' && document.getElementById('span-menu')) { closeSpanMenu(); return; }
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'a' || ev.key === 'A')) {
    ev.preventDefault();
    selectAllFiles();
    return;
  }
  const r = plotRect();

});

// ─── Pinned Min/Max/Average needs room ────────────────────────────────
// See .foot-free in the stylesheet.  Checked whenever the table box changes
// size or the table is redrawn, at most once a frame.
const FOOT_PIN_MIN_ROWS = 3, FOOT_PIN_ROW_PX = 22;
(function () {
  const host = document.getElementById('event-tbody-wrap');
  let queued = false;
  function check() {
    queued = false;
    for (const sc of host.querySelectorAll('.fr-scroll')) {
      const t = sc.querySelector('table.fr-table');
      const foot = t && t.tFoot;
      if (!foot) { sc.classList.remove('foot-free'); continue; }
      const room = sc.clientHeight - (t.tHead ? t.tHead.offsetHeight : 0) - foot.offsetHeight;
      sc.classList.toggle('foot-free', room < FOOT_PIN_MIN_ROWS * FOOT_PIN_ROW_PX);
    }
  }
  function queue() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(check);
  }
  if (window.ResizeObserver) new ResizeObserver(queue).observe(host);
  new MutationObserver(queue).observe(host, { childList: true, subtree: true });
})();

// Deep-link boot:
//   ?fiber=64&km=29.2866&dir=both    Splice Report grid → jump to one splice.
//   ?fibers=410,418&dir=a            Duplicate Check pair → overlay BOTH fibers
//                                    (comma-separated) in one direction + Fit.
// Falls back to the default fiber.
// Apply a jump target (fiber/km/dir, or a comma list of fibers).  Shared by
// the URL deep-link boot AND the live pop-out path (postMessage from a report
// window), so a report cell click re-plots THIS already-open window in place —
// no reload, no reopen.
// `t.replace` — clear the plot before loading.  The live pop-out path sets it
// so each report cell click SHOWS THAT FIBER instead of stacking traces (ten
// clicks used to leave ten traces + chips on the canvas).  A tech who wants to
// compare fibers shift-clicks the cell, which sends replace:false and keeps
// the additive behavior.  The URL boot path never sets it — a fresh page is
// already empty, so its behavior is unchanged.
async function applyTarget(t) {
  if (!gInfo || !t) return;
  // 'sr' | 'uni' — which report sent us here.  Decides the gate the
  // verdict column judges by, so the Viewer cannot contradict the grid.
  if (t.src) {
    gSourceReport = (t.src === 'uni') ? 'uni' : 'sr';
    gUniSide = (t.src === 'uni' && (t.dir === 'a' || t.dir === 'b')) ? t.dir : null;
    syncGateUI();
    renderBackButton();
  }
  const fibers = t.fibers;
  if (fibers && /^\d+(\s*,\s*\d+)*$/.test(String(fibers))) {
    const plan = planOrSay(parseFibers(String(fibers)), t.dir || 'a');
    if (!plan || sayRemovedTarget(plan)) return;
    if (t.replace) clearAll();
    document.getElementById('fiber-input').value = String(fibers);
    setAddDir(t.dir || 'a');
    await addFibers();               // loads every listed fiber, then Fits
    return;
  }
  const fiber = t.fiber;
  if (fiber != null && /^\d+$/.test(String(fiber))) {
    const plan = planOrSay([+fiber], t.dir || 'both');
    if (!plan || sayRemovedTarget(plan)) return;
    if (t.replace) clearAll();
    document.getElementById('fiber-input').value = String(fiber);
    setAddDir(t.dir || 'both');
    gTableGoKm = null;               // not the last link's column
    await addFibers();
    const km = parseFloat(t.km);
    if (!isNaN(km)) {
      // FEC links point at a panel connector on a 5 km shot: zoom in close.
      zoomToKm(linkDispKm(km, t.src, t.dir || 'both', fiber), gFecMode ? 0.3 : 2.5);
      // The table goes to the same event: its column, now or when the
      // table paints (a table from the server lands after this).
      gTableGoKm = { km: linkDispKm(km, t.src, t.dir || 'both', fiber), fiber: +fiber };
      if (!gTableBusy) tableGoKm();
    }
    return;
  }
  await autoloadDefault();
}

// ─── The URL's deep link is applied once ──────────────────────────────
// ?fiber= / ?fibers= in the page URL is what the report cell that OPENED this
// window asked for.  Once it has put a trace on the canvas, or a later cell
// click has sent a jump, it is spent, and bootLoad declines from then on.
//
// The focus listener used to re-apply it on any focus with an empty canvas,
// and a plain cell click empties the canvas on purpose.  The hub does
// vw.focus() then postMessage (app.py): the jump runs applyTarget, clearAll(),
// and the new fiber is still loading when the focus retry comes back from
// /api/list, sees no traces and loads the URL's fiber again.  Clicking F3 left
// F3 AND the F20 the window was opened on.
//
// The retry itself stays for what it is for: a page that has never shown
// anything (server not up yet at boot, or folders seeded after boot) still
// loads its link on the next focus, because nothing has spent it.
let gDeepLinkDone = false;

async function bootLoad() {
  if (!gInfo || gDeepLinkDone) return;
  const p = new URLSearchParams(location.search);
  // The chart as the tech left it (see viewer_state): its removed files
  // always, its traces unless a report cell sent this window to a fiber.
  const linked = !!(p.get('fibers') || p.get('fiber'));
  try {
    const st = await fetchViewerState();
    if (stateFits(st)) await applyViewerState(st, !linked);
    else if (st) gStateVer = Math.max(gStateVer, st.ver || 0);
  } finally {
    gStateReady = true;
    pushViewerState();                 // anything done while it loaded
  }
  if (!gTraces.length || linked)
    await applyTarget({ fibers: p.get('fibers'), fiber: p.get('fiber'),
                        km: p.get('km'), dir: p.get('dir'), src: p.get('src') });
  if (gTraces.length) gDeepLinkDone = true;
}

// ─── One boot pass at a time ──────────────────────────────────────────
// bootLoad() has TWO entry points — the boot IIFE at the bottom of this file
// and the window 'focus' listener above — and nothing stopped them running at
// the same time.  The focus listener is not hypothetical: the hub's pop-out
// calls vw.focus() on the viewer window (app.py), and a window manager raising
// a freshly opened viewer fires it too, so it lands squarely inside boot's
// first fetch.
//
// Both passes then reach addFibers(), which PLANS synchronously and COMMITS
// after its awaits: it decides which keys are missing with
// `gTraces.some(t => t.key === key)` up front, then fetches, then pushes.  A
// second pass that starts while the first is still fetching therefore sees an
// empty gTraces, plans the very same keys, and pushes them again — the dedupe
// cannot see a pass that has not committed yet.  Measured on a slow first-visit
// folder: gTraces came back ["b-64","a-64","b-64","a-64"], the readout said
// "4 traces loaded", every trace was drawn twice, the event list counted every
// event twice (40 events / 16 flagged instead of 20 / 8), and — because the
// FastReporter grid only renders for <= 2 traces — the FR layout was replaced
// by the flat list entirely.
//
// So the two passes must not both run.  A second caller JOINS the pass already
// in flight instead of starting its own.  The handle is cleared when the pass
// settles, which keeps the retry the focus listener exists for: folders seeded
// after boot still get a fresh pass, because by then nothing is in flight.
let gBootInFlight = null;          // the one boot pass, while it is running
function bootLoadOnce() {
  if (gBootInFlight) return gBootInFlight;      // already booting — join it
  gBootInFlight = (async () => {
    try { await bootLoad(); }
    finally { gBootInFlight = null; }
  })();
  return gBootInFlight;
}

// Live pop-out update: a report window (Splice Report / FR / Uni) postMessages
// {type:'otdr-jump', fiber, km, dir} on every cell click → we re-plot in place.
// Loopback-only (the hub + this viewer are both localhost); ignore anything
// else.  Guarded so a message before gInfo is loaded can't throw.
window.addEventListener('message', function (ev) {
  try {
    if (!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(ev.origin)) return;
    const d = ev.data;
    // A file dragged over the hub page around this frame (its sidebar, the
    // settings box above): the hub refuses the drop there, and the panel
    // shows where to take it, as a drag over the rest of this page does.
    if (d && d.type === 'otdr-drag') { showDropSign('hint'); return; }
    if (!d || d.type !== 'otdr-jump') return;
    // This jump is newer than the page URL, so the URL's link is spent (see
    // gDeepLinkDone).  Set here, before anything awaits, so no focus retry
    // can run in between and load the old fiber beside this one.
    gDeepLinkDone = true;
    // Same overlap, second door.  The hub does `vw.focus(); vw.postMessage(…)`
    // back to back (app.py), so on a viewer that is still booting the focus
    // starts a boot pass and this jump would plan against the same uncommitted
    // gTraces.  Wait for the pass in flight — there usually is none, and then
    // this is a bare microtask — so applyTarget's replace/clear acts on a
    // settled gTraces instead of interleaving with it.
    // A jump that beats the first /api/list reads it itself: applyTarget does
    // nothing without gInfo, and bootLoad will not load the URL's fiber in
    // its place any more, so a dropped jump would leave the window blank.
    Promise.resolve(gBootInFlight)
      .catch(() => {})                 // a failed boot must not eat the jump
      .then(() => gInfo || loadInfo())
      .then(() => applyTarget(d))
      .catch(e => reportJsError((e && e.message) || String(e), e && e.stack));
  } catch (e) { /* never let a stray message break the viewer */ }
});

(async function boot() {
  // Size + paint the canvas FIRST, before any network call.  A cold (frozen)
  // launch can have the trace server still binding when this page loads; if the
  // very first /api/list rejected we used to skip resizeCanvas() entirely and the
  // canvas was never given a pixel size — a permanently blank Viewer.  Sizing up
  // front guarantees the empty chart frame paints no matter what the server does.
  resizeCanvas();
  // Retry loadInfo() through the cold-start window (up to ~6 s) so a single early
  // fetch failure can't leave the page stuck.  loadInfo() returns false only when
  // the fetch itself failed; true (folders present OR the empty-folder prompt)
  // ends the loop.
  wireEventSettings();
  let ok = await loadInfo();
  for (let i = 0; i < 12 && ok === false; i++) {
    await new Promise(r => setTimeout(r, 500));
    resizeCanvas();
    ok = await loadInfo();
  }
  try { await bootLoadOnce(); } catch (e) {
    // A boot-path crash must be VISIBLE (readout) and REPORTED (Slack) —
    // this catch used to swallow everything, which also suppressed the
    // unhandledrejection reporter.
    reportJsError((e && e.message) || String(e), e && e.stack);
    setReadout('viewer failed to auto-load: ' + (e && e.message || e));
  }
  draw();
})();
</script>
