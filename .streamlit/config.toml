# The hub starts in Dark (Robert, 2026-10-01), so the server does too and the
# first page is not painted Light and switched after.  Must equal app.py's
# THEME_STREAMLIT['dark'] (test_theme_light_dark.py checks).  The Theme
# switch sets Light at run time.
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0c0a09"
secondaryBackgroundColor = "#1c1917"
textColor = "#fafaf9"
borderColor = "#292524"
dataframeBorderColor = "#292524"
dataframeHeaderBackgroundColor = "#1c1917"
# Windows' own font (Robert, 2026-09-24): Segoe UI, as Windows, Outlook and
# Excel use.  Nothing ships with the app; elsewhere it falls back to sans-serif.
font = "Segoe UI, sans-serif"

[browser]
gatherUsageStats = false

[client]
# OTDR App: only what the app itself adds; no Deploy button and no
# three-dot developer menu (Robert, 2026-09-27).  The regular Suite uses
# "viewer" (2026-09-29); the App keeps "minimal".
toolbarMode = "minimal"
