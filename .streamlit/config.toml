# Light theme for the OTDR Suite hub — matches the viewer's FastReporter-style
# light palette so the Streamlit chrome (sidebar, pages, pairs table) isn't dark.
[theme]
base = "light"
primaryColor = "#2c5b8a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3f8"
# Black lettering (2026-09-22): the grey-blue read badly on the hub's
# white pages.  Every Streamlit-drawn word follows this.
textColor = "#000000"

[browser]
gatherUsageStats = false
