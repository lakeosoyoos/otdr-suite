# Light theme for the OTDR Suite hub — matches the viewer's FastReporter-style
# light palette so the Streamlit chrome (sidebar, pages, pairs table) isn't dark.
[theme]
base = "light"
primaryColor = "#2c5b8a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3f8"
# Black lettering (2026-09-22): the grey-blue read badly on the hub's
# white pages.  Every Streamlit-drawn word follows this.
textColor = "#000000"
# Windows' own font (Robert, 2026-09-24): Segoe UI, as Windows, Outlook and
# Excel use.  Nothing ships with the app; elsewhere it falls back to sans-serif.
font = "Segoe UI, sans-serif"

[browser]
gatherUsageStats = false

[client]
# OTDR Suite App: only what the app itself adds; no Deploy button and no
# three-dot developer menu (Robert, 2026-09-27).  The regular Suite uses
# "viewer" (2026-09-29); the App keeps "minimal".
toolbarMode = "minimal"
